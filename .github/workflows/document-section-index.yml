name: Document Section Index Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/core/files/documentSectionIndex.js'
      - 'backend/scripts/regressionDocumentSectionIndex.test.js'
      - '.github/workflows/document-section-index.yml'
  push:
    branches: [main]
    paths:
      - 'backend/core/files/documentSectionIndex.js'
      - 'backend/scripts/regressionDocumentSectionIndex.test.js'
      - '.github/workflows/document-section-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-section-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chapter and scan-limit semantics
        run: node --test backend/scripts/regressionDocumentSectionIndex.test.js
