name: CALIBRI v192 seal independent full-answer grader before new QA
on:
  pull_request:
    paths:
      - 'research/calibri/v192/**'
      - 'research/calibri/test_v192_frozen_grader.py'
      - '.github/workflows/calibri-pro-max-v192.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze_versioned_whole_answer_grader_no_inference:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: research/calibri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate adverse false-positive cases, actual owner subject and opposite pairs
        run: python -m unittest test_v192_frozen_grader -v
      - name: Seal deterministic original answer grader before any NEW model generation
        run: python -m v192.seal results/v192
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-v192-frozen-whole-answer-grader-hashes-no-model-tests
          path: results/v192/
          if-no-files-found: error
          retention-days: 60
