name: NRA2 3.0 S0 unified causal area and layer8 shadow ABI
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-nra2-s3ck-ru-ud-grammar-contract-offline-20261115
permissions:
  contents: read
concurrency:
  group: nra3-s0-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  nra3_s0_offline_structure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s0-grammar-semantics-relations-shadow-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only pinned CPU-only torch for structural tests
        run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests — no real model, no EVAL, no Jessica
        run: python -m unittest -v research.nra3_s0.test_neural_area
