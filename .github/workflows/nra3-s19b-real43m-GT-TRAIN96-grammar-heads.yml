name: NRA3 S19b real frozen Calibri43M GT TRAIN96 grammar CPU
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s19-grammar-eventgraph-20261116
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s19b-true43m-grammar-only
  cancel-in-progress: true
jobs:
  real_CPU_96_TRAIN_compact_grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '319016'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen CPU grammar dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Compile and unit test without evaluation datasets
        run: |
          python -m compileall -q research/nra3_s19
          python -m unittest -v research.nra3_s18.test_ru96_train_source research.nra3_s19.test_event_graph_contracts research.nra3_s19.test_s19b_compact_grammar
      - name: Download genuine original Calibri43M GT S18b CPU TRAIN96
        uses: actions/download-artifact@v4
        with:
          name: nra3-s18b-TRUE43M-616J7-new96-TRAIN-postGT-layer8-goldfree-FP16
          run-id: 43910479658
          github-token: ${{ github.token }}
          path: inputs/nra3_s18b
      - name: Train fixed grouped TRAIN-only grammar on real frozen 43M hidden
        run: |
          python -m research.nra3_s19.s19b_train96_true43m_grammar \
            --s18b-hidden inputs/nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors \
            --s18b-report inputs/nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json \
            --out results/nra3_s19b
      - name: Audit no activation and paid physical model
        run: |
          python -c "import json,pathlib; a=json.loads(pathlib.Path('results/nra3_s19b/NRA3_S19B_TRUE43M_TRAIN96_GROUPED12_GRAMMAR_FP16_REPORT.json').read_text()); assert len(a['fixed_12fold_TRAIN_internal_results'])==12; assert a['output_gate']==0 and not a['candidate_accepted'] and not a['activation_allowed']; assert a['no_independent_EVAL32_or_EVAL128_or_prior_spent_EVAL_loaded']"
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s19b-TRUE43M-GT-96TRAIN-grouped12-physical-FP16-grammar-no-EVAL
          path: results/nra3_s19b/
          if-no-files-found: error
          retention-days: 30
