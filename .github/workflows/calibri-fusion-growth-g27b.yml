name: Calibri Fusion Growth G27b internal residual training
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g27-internal-residual-20261127]
permissions:
  contents: read
  actions: read
jobs:
  g27b:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g27b-internal-residual-training-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        layer: [6, 12]
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only 176270db8ff9cf3876b0e195f2301ceab8b7f2e8 HEAD >/tmp/g27scope
          test "$(wc -l </tmp/g27scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g27b_internal_residual_training.py' -e '.github/workflows/calibri-fusion-growth-g27b.yml' /tmp/g27scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g05-134m-G0
          run-id: 45823877120
          path: inputs/g05
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - name: Matched native residual training
        run: python research/calibri2/fusion_growth/g27b_internal_residual_training.py --g05 inputs/g05 --f08 inputs/f08 --out results/g27b --layer ${{ matrix.layer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-fusion-growth-g27b-L${{ matrix.layer }}
          path: results/g27b/
          retention-days: 30
          if-no-files-found: error
