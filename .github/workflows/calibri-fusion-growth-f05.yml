name: Calibri Fusion Growth F05 contrastive core training
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f04-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f05:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f05-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scope check
        run: |
          git diff --name-only a763971d43ce7441b6792ab514919ec2997788a6 HEAD >/tmp/f05scope
          test "$(wc -l </tmp/f05scope)" -eq 3
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f05_contrastive_core.py' -e '.github/workflows/calibri-fusion-growth-f05.yml' -e 'research/calibri2/fusion_growth/README.md' /tmp/f05scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f03-rate-trained-core-G0
          run-id: 45669309826
          path: inputs/f03
          github-token: ${{ github.token }}
      - name: Train 85 paid codebooks with positive and negative discrimination
        run: python research/calibri2/fusion_growth/f05_contrastive_core.py --root inputs/f03 --out results/f05
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f05-contrastive-core-G0
          path: results/f05/
          retention-days: 30
          if-no-files-found: error
