name: CALIBRI S198 real 46M NRA one CPU gradient and FP16 candidate
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-s197-46m-nra-real-616-j7-20261113]
permissions:
  contents: read
  actions: read
concurrency:
  group: calibri2-s198-nra-real-gradient-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  s198_actual_cpu_nra_train:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s198-nra-one-real-cpu-train-j7-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '198013'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual 616 physical parent and no MAIN or LIVE writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/43369205584 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/43345267876 --jq .conclusion)" = "success"
      - name: Install original CPU compressed-model dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Real TRAIN cohort structural contract before using weights
        run: |
          python -m compileall -q research/calibri2/s195_neuro_area research/calibri2/s196 research/calibri2/s197 research/calibri2/s198
          python -m unittest -v calibri2.s195_neuro_area.test_representation_area calibri2.s198.test_one_step_real_nra
      - name: Download physically successful and immutable S197 46M+NRA
        uses: actions/download-artifact@v4
        with:
          name: calibri-s197-real46M-plus-NRA-616-CPU-J7-physical-le07-research-only
          path: inputs/s197
          run-id: 43369205584
          github-token: ${{ github.token }}
      - name: Download original S93 compressed 36M core plus Green Tunnel
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          path: inputs/s93
          run-id: 42681768394
          github-token: ${{ github.token }}
      - name: Actual original 46M CPU neural region one TRAIN gradient, FP16 physical reload
        run: |
          python - <<'PY'
          import platform,torch
          assert platform.machine()=='x86_64' and not torch.cuda.is_available()
          print('S198_ACTUAL_NATIVE_CPU_GRADIENT_NO_CUDA_NO_MOCK',flush=True)
          PY
          python research/calibri2/s198/one_step_real_nra.py \
            inputs/s197/S197_S142_DERIVED_46M_PLUS_NRA_ALL_FP16.safetensors.zlib \
            inputs/s197/S197_REAL_46M_NRA_616_CPU_J7.json \
            inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            results/s198
      - name: Verify true gradient before any claim of improved language
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/s198/S198_ONE_CPU_NRA_TRAIN_REPORT.json')
          a=json.loads(p.read_text())
          assert a['actual_CPU_train_steps']==1
          assert a['actual_CPU_teacher_forcing_grad_nonzero'] is True
          assert a['train_NRA_Fp16_changed_elements']['neuro_representation_area.decoder.weight']>0
          assert a['all_legacy_non_NRA_tensors_byte_identical'] is True
          assert a['independent_postupdate_real_CPU_J7_616_REQUIRED'] is True
          assert a['model_accepted'] is False
          print('S198_TRUE_CPU_NRA_FP16_CANDIDATE_ONLY_NOT_YET_J7_AUDITED',flush=True)
          PY
      - name: Preserve actual changed neural weights and all-original-weight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s198-genuine-NRA-CPU-one-step-physical-46M-unaccepted
          path: results/s198/
          retention-days: 90
          if-no-files-found: warn
