name: CALIBRI2 S24 noun binding and guarded physical 36M Green Tunnel
on:
  push:
    branches: ['research/calibri2-s24-noun-binding-green-tunnel-36m-20261108']
    paths:
      - 'research/calibri2/s24/**'
      - '.github/workflows/calibri2-s24-noun-binding-36m.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  S24_same_color_opposite_noun_640_training_and_new_96_frozen_qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '2124'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile frozen code and confirm 8 new word combinations excluded from all S24 TRAIN
        run: |
          python -m compileall -q research/calibri2/s24
          python - <<'PY'
          from calibri2.s24.independent_binding_qa import unseen,cases
          from calibri2.s24.noun_guarded_training import allowed_combos
          assert len(unseen())==8
          assert not (set(unseen()) & set(allowed_combos()))
          assert len(cases())==144
          print('S24_NEW_NOUN_QA_96_PLUS48_FIXED_AND_DISJOINT_FROM_TRAIN')
          PY
      - name: Restore exact original S20 physically sealed paid 36M model (not QA-selected)
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s20-36M-960-GREEN-TUNNEL-TWOWORD-PAID-PHYSICAL
          path: inputs/s20
          run-id: 42463712915
          github-token: ${{ github.token }}
      - name: Evaluate S20 on the precommitted NEW 96 unseen noun-binding questions and 48 easy controls
        run: |
          python research/calibri2/s24/independent_binding_qa.py inputs/s20/CALIBRI2_S20_36M_960_MULTIWORD_PROTECTED_PAID.cb59 results/s24/initial_qa --label S20_ORIGINAL_BEFORE_S24_NEW_NOUN_QA
      - name: Preserve complete S20 baseline responses BEFORE S24 changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s24-FROZEN-S20-BEFORE-96-NOUN-48-CTRL-16OPEN
          path: results/s24/initial_qa/
          retention-days: 45
      - name: One 640-step real physically paid S24 two-guard noun-contrastive Green Tunnel TRAIN
        run: |
          python research/calibri2/s24/noun_guarded_training.py inputs/s20/CALIBRI2_S20_36M_960_MULTIWORD_PROTECTED_PAID.cb59 results/s24/train
      - name: Preserve physically paid 36M model, all real TRAIN probes and all rejected/accepted updates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s24-36M-NOUN-BINDING-640-GREEN-TUNNEL-PHYSICAL
          path: results/s24/train/
          retention-days: 45
          compression-level: 0
      - name: Evaluate ONE SEALED S24 checkpoint on identical frozen 96 noun tests and 48 controls
        run: |
          python research/calibri2/s24/independent_binding_qa.py results/s24/train/CALIBRI2_S24_36M_NOUN_GUARDED_640_PAID.cb59 results/s24/final_qa --label S24_FINAL_FROZEN_NEW_NOUN_QA_NO_CHECKPOINT_SELECTION
      - name: Preserve all good/bad 144 full real greedy answers and 16 open quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s24-FROZEN-S24-FINAL-96-NOUN-48-CTRL-16OPEN
          path: results/s24/final_qa/
          retention-days: 45
      - name: Paired native C CPU 36M compact-only speed of S24 relative to same-architecture S20
        run: |
          python research/calibri2/s24/native_speed.py inputs/s20/CALIBRI2_S20_36M_960_MULTIWORD_PROTECTED_PAID.cb59 results/s24/train/CALIBRI2_S24_36M_NOUN_GUARDED_640_PAID.cb59 results/s24/train/ACTUAL_CALIBRI2_S24_REAL_GUARDED_NOUN_TRAIN.json results/s24/native
      - name: Preserve CPU native packed C 90-percent speed regression check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s24-36M-NATIVE-C-CPU-SPEED
          path: results/s24/native/
          retention-days: 45
