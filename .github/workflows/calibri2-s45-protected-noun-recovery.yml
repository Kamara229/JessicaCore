name: CALIBRI S45 paid 36M noun recovery with protected correct colors
on:
  push:
    branches:
      - research/calibri2-s45-protected-noun-greedy-recovery-20261108
    paths:
      - 'research/calibri2/s45/**'
      - '.github/workflows/calibri2-s45-protected-noun-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  S45_paid_noun_after_protected_first_color:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '4545'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile S45 isolated experiment
        run: |
          python -m compileall -q research/calibri2/s45/
      - name: Load exact physical 36M CB59 S44 trained model (no QA)
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s44-real-physical-CB59-only-if-accepted
          path: inputs/s44
          run-id: 42501510940
          github-token: ${{ github.token }}
      - name: Train real FP16 paid nouns preserving all correct color first tokens and old seven
        run: |
          python research/calibri2/s45/protected_real_noun_after_color.py \
            inputs/s44/CALIBRI2_S44_PAID_FIRST_COLOR_REPAIR.cb59 \
            results/s45
      - name: Preserve actual S45 TRAIN-only diagnostics, including rejection reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s45-actual-physical-noun-TRAIN-only-JSON
          path: results/s45/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve CB59 physical 0.6908 bpp only if paid weight changes are accepted
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: results/s45/*.cb59
          if-no-files-found: warn
          retention-days: 60
