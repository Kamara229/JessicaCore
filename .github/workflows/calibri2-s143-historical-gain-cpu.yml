name: CALIBRI S143 historical TRAIN J7 gain report CPU-only contracts
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s142-dual-cone-adam-20261111
permissions:
  contents: read
jobs:
  s143_cpu_reporting_regressions_no_training:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s143-historical-gain-report-audit-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: S143 fail-closed CPU synthetic tests and static integration; NO GPU/QA
        run: |
          python -m compileall -q research/calibri2/s143 research/calibri2/s142
          python -m unittest -v calibri2.s143.test_gain_reporting
