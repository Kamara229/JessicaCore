name: NRA2 S3BW FOURTH untouched128 once-only real original CPU S3BA vs new S3BT no retune
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-nra2-s3bv-fourth128-true43m-cpu-only-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: nra2-s3bw-once-only-fourth128-original43m-zero-gate
  cancel-in-progress: false
jobs:
  s3bw_one_time_FOURTH_s3bu128_new_joint_semantic_roles:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3bw-once-only-fourth128-s3ba-vs-s3bt-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact research-only CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5' 'transformers==4.46.3' 'tokenizers==0.20.3' 'huggingface-hub>=0.26,<1' 'jinja2==3.1.6'
      - name: Require FOURTH untouched128 data and TRUE original43M CPU and new 2560 TRAIN head physically frozen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for r in 43649584951 43650092316 43650522935 43590032315 43446925758 43640363396 43644153544 43648038071; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$r" --jq .conclusion)" = success
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43649584951" --jq .head_branch)" = research/calibri2-nra2-s3bu-fourth-independent128-prereg-20261115
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43650092316" --jq .head_branch)" = research/calibri2-nra2-s3bt-joint-meaning-replay-train2560-20261115
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43650522935" --jq .head_branch)" = research/calibri2-nra2-s3bv-fourth128-true43m-cpu-only-20261115
          python - <<'PY'
          import torch,platform
          assert platform.machine()=="x86_64" and not torch.cuda.is_available()
          print("S3BW_FOURTH_FROZEN_CPU128_ONCE_ONLY_NO_TRAIN")
          PY
      - name: Load SEALED fourth S3BU completely unseen128 protocol SHA
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bu-fourth-independent128-prereg-only-no-cpu
          run-id: '43649584951'
          github-token: ${{ github.token }}
          path: inputs/s3bu
      - name: Load genuinely frozen original43M CPU FOURTH untouched128 S3BV and original 616 J7
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bv-fourth-independent128-original43M-tokens320-J7-no-score
          run-id: '43650522935'
          github-token: ${{ github.token }}
          path: inputs/s3bv
      - name: Load original S3BA FP16 baseline
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3ba-role1536-replay1024-structural512-dev128-fp16-zero-gate
          run-id: '43590032315'
          github-token: ${{ github.token }}
          path: inputs/s3ba
      - name: Lock new S3BT physically verified TRAIN-only 2560 FP16 role head
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bt-semantic-directional-train2560-safe-fp16-zero-gate
          run-id: '43650092316'
          github-token: ${{ github.token }}
          path: inputs/s3bt
      - name: Lock independent frozen NRA2 original parameters
        uses: actions/download-artifact@v4
        with:
          name: nra2-standalone-relational-cpu-research-only
          run-id: '43446925758'
          github-token: ${{ github.token }}
          path: inputs/nra2
      - name: Validate one-time research code and independent fixed exact McNemar math without blind scoring
        run: |
          python -m compileall -q research/nra2_bridge/stage3bw_fourth_once_only_s3ba_vs_joint_s3bt.py
          python -m unittest -v research.nra2_bridge.test_stage3bh_mcnemar
      - name: S3BW ONCE ONLY evaluate frozen S3BA against safe S3BT on exactly 128 fresh CPU+gold graph questions
        run: |
          python -m research.nra2_bridge.stage3bw_fourth_once_only_s3ba_vs_joint_s3bt \
            inputs/s3bv inputs/s3bu inputs/s3ba inputs/s3bt inputs/nra2 \
            results/nra2_stage3bw_fourth128_once_only
      - name: Verify independent new 128 report no model promotion or test tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/nra2_stage3bw_fourth128_once_only/NRA2_S3BW_FOURTH_ONCE_ONLY128_S3BA_VS_S3BT_NO_RETUNE.json").read_text())
          assert r["stage"]=="NRA2_S3BW_FOURTH_ONCE_ONLY_S3BU128_S3BA_VS_JOINT_S3BT"
          assert r["S3BV_run"]==43650522935 and r["S3BU_prereg_successful_run"]==43649584951
          assert r["S3BU_prereg_commitment_sha256"]=="117fcd79776c6d163b572f8d04b81743429d8c72e74cd072b6a5bedbb38c7f7e"
          assert r["S3BA_fp16_sha256"]=="4fedf391ee02b1d1c45c82c3690d212ba9a43e9d0da32446f5d32ac6c379bb09"
          assert r["S3BT_fp16_sha256"]=="a700b59d8f759d816fa151c1d21d340fe1f26772ee91e9788f6fe98a123c4262"
          assert r["one_time_independent_EVAL128"]==128
          assert r["original_616_S194_J7_preserved_in_S3BV"]
          assert r["prior_S3AQ_old_independent_EVAL128_consumed"]
          assert r["prior_S3BJ_second_independent_EVAL128_consumed"]
          assert r["prior_S3BO_third_independent_EVAL128_consumed"]
          assert r["S3BM_42869_new_pairwise_params"]
          assert r["fourth_unseen_16_topologies_and_8_new_grammars"]
          assert r["metrics"]["all"]["n"]==128
          assert r["metrics"]["source_first"]["n"]==64 and r["metrics"]["destination_first"]["n"]==64
          assert len(r["question_level"])==128
          assert r["no_training_or_calibration_or_threshold_tuning"]
          assert r["independent_EVAL_is_now_consumed"] and r["no_winner_accepted_based_on_this_EVAL"]
          assert not r["candidate_accepted"] and r["output_gate"]==0.
          assert not r["full_EOS_tested"] and not r["physical_all_in_bpp_tested"] and not r["paired_CPU_speed_tested"]
          print("S3BW_FOURTH128_ONE_TIME_SEMANTIC_MODEL_COMPARE_ZERO_GATE",r["metrics"]["all"])
          PY
      - name: Archive one-time independent new128 role+reachability scores, forbid reuse for future training
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nra2-stage3bw-fourth128-once-only-s3ba-vs-new-joint-s3bt
          path: results/nra2_stage3bw_fourth128_once_only/
          retention-days: 90
          if-no-files-found: error
