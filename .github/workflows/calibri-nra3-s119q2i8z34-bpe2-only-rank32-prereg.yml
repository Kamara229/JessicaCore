name: Calibri S119q2i8z34 native second BPE ONLY gated rank32, 84 legal TRAIN new14 DEV prereg
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z33-physical-onpolicy-vs-teacher-gap-spent14-20261123
permissions:
  contents: read
jobs:
  source-only-targetblind-native-BPE2-rank32-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z34-prereg-native-second-token-only-gated-ranker-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native49152 CPU tensor torch only no model weights
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Python compile and strict second-native-only targetblind source and gradient train checks
        run: |
          python -m py_compile research/calibri_nra3/s119q2i8z34_fresh14dev_BPE2_only_source.py research/calibri_nra3/s119q2i8z34_position2_only_owncontext_top64_train.py research/calibri_nra3/test_s119q2i8z34_secondBPE_only_rank32_source.py
          python -m unittest -v research.calibri_nra3.test_s119q2i8z34_secondBPE_only_rank32_source
      - name: Exactly three Z34 research-only and one CI file fail closed
        run: |
          set -euo pipefail
          base="origin/research/calibri2-s119q2i8z33-physical-onpolicy-vs-teacher-gap-spent14-20261123"
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git diff --name-only "${base}" HEAD >/tmp/z34scope
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z34_fresh14dev_BPE2_only_source.py' -e 'research/calibri_nra3/s119q2i8z34_position2_only_owncontext_top64_train.py' -e 'research/calibri_nra3/test_s119q2i8z34_secondBPE_only_rank32_source.py' -e '.github/workflows/calibri-nra3-s119q2i8z34-bpe2-only-rank32-prereg.yml' /tmp/z34scope; then
            echo 'No original S142 weights, GT/NRA3, spent data or LIVE modifications' >&2
            exit 1
          fi
          test $(wc -l < /tmp/z34scope) -eq 4
