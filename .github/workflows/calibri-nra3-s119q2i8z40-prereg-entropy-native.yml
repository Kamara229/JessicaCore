name: Calibri Z40 prereg legal84 NEW14 BPE2-4 entropy guard (no original 43M)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z39-readonly-BPE2-diversity-thirdtoken-audit-20261124
permissions:
  contents: read
jobs:
  source-only-legal84-14fresh-entropy-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z40-prereg-multiposition-entropy-nativeBPE-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU torch for structural tensor-only tests (no source43M)
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Test source-only and contrastive entropy, never download models
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z40_source_model_entropy_contract
      - name: Prereg exact 84 TRAIN / first 14 DEV before any physical model test
        run: |
          python - <<'PY'
          import json
          from research.calibri_nra3.s119q2i8z40_new14dev_multiposition_entropy_prereg import verify
          result=verify()
          print("Z40_IMMUTABLE_SRC_SHA_PREDEV "+json.dumps(result,sort_keys=True))
          assert len(result["TRAIN_SHA256"])==64 and len(result["DEV_SHA256"])==64
          assert not result["candidate_accepted"] and result["output_gate"]==0
          PY
      - name: Enforce only three additive source/test/CI files from previous research base
        run: |
          set -euo pipefail
          base=origin/research/calibri2-s119q2i8z39-readonly-BPE2-diversity-thirdtoken-audit-20261124
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git diff --name-only "${base}" HEAD >/tmp/z40files
          if grep -Fvx \
            -e 'research/calibri_nra3/s119q2i8z40_new14dev_multiposition_entropy_prereg.py' \
            -e 'research/calibri_nra3/s119q2i8z40_causal_BPE234_entropy_guard.py' \
            -e 'research/calibri_nra3/test_s119q2i8z40_source_model_entropy_contract.py' \
            -e '.github/workflows/calibri-nra3-s119q2i8z40-prereg-entropy-native.yml' /tmp/z40files; then
              echo 'Forbidden original S142/GT12/Core/production mutation' >&2
              exit 1
          fi
          test "$(wc -l </tmp/z40files)" -eq 4
