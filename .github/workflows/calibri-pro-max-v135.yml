name: CALIBRI v135 nondeployable FP32 input-head component oracle
on:
  pull_request:
    paths:
      - 'research/calibri/v135/**'
      - 'research/calibri/test_v135_oracle.py'
      - '.github/workflows/calibri-pro-max-v135.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  component_oracle:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - name: Regression-check oracle isolation, restore, fixed corpus and no-go claims
        run: python -m unittest test_v135_oracle -v
      - name: Contrast real CB59 with FP32 teacher embedding and head as ORACLE only
        run: python -m v135.run "$HOST" results/v135
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v135-fp32-component-oracle-nondeployable
          path: results/v135/
          if-no-files-found: warn
          retention-days: 30
