name: CALIBRI S67 protected +1 TRAIN full native answer with fully paid CPU sidecar
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-s66-train-delta-line-search-20261109
permissions:
  contents: read
  actions: read
jobs:
  guarded_half_delta_paid_native_cpu:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s67-guarded-half-delta-candidate-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check isolated S67
        run: python -m compileall -q research/calibri2/s67
      - name: Pin CPU-only identical deterministic Torch engine
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Original S45 frozen CB59 source
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Original S56 immutable Green Tunnel ranks 2 and 12
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Paid S61 original exact lossless source
        uses: actions/download-artifact@v4
        with:
          name: calibri-s61-real-physical-entropy-and-cold-cpu
          path: inputs/s61
          run-id: 42528473858
          github-token: ${{ github.token }}
      - name: Paid S64 rank128 initial zero-output-expanded Green Tunnel
        uses: actions/download-artifact@v4
        with:
          name: calibri-s64-paid-rank128-green-tunnel-not-trained
          path: inputs/s64
          run-id: 42530687528
          github-token: ${{ github.token }}
      - name: Rejected S65 CPU TRAIN step16 checkpoint for fractional delta
        uses: actions/download-artifact@v4
        with:
          name: calibri-s65-guarded-rank116-TRAIN-real-probes-and-resume
          path: inputs/s65
          run-id: 42531290650
          github-token: ${{ github.token }}
      - name: Measure actual full native TRAIN answers CPU and physical bpp
        run: |
          python research/calibri2/s67/guarded_half_delta_train_candidate.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s64/S64_RANK128_GREEN_TUNNEL_INIT.safetensors \
            inputs/s61/S61_SOURCE_EXACT_ZLIB_CB59.s61 \
            inputs/s64/S64_PAID_MANIFEST.json \
            inputs/s65/S65_STEP_016_TRAIN_RESUME.pt \
            results/s67
      - name: Retain immutable real CPU metrics, or negative findings, no QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s67-fully-paid-new-safe-half-delta-research-only
          path: results/s67/
          if-no-files-found: warn
          retention-days: 90
