name: CALIBRI v162 robust original paid block0 fifth independent 32-window two-domain test
on:
  pull_request:
    paths:
      - 'research/calibri/v162/**'
      - 'research/calibri/test_v162_original_block0_robustness.py'
      - '.github/workflows/calibri-pro-max-v162.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_native_original_block0_source_robustness:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153
      REPORT: inputs/v161/v161_original_block0_source_operator_valid.json
      ORIGINAL_SOURCE_SEAL: inputs/v161/v161_source_only_layer0_frozen_before_VALID.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed original CPU model and frozen source dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - name: Test strict complete source SHA, disjoint 32-window corpus, and one-window-outlier FAIL
        run: python -m unittest test_v162_original_block0_robustness -v
      - name: Evaluate unchanged physically paid block0 on fifth fresh WikiText/News source
        run: python -m v162.run "$SOURCE" "$REPORT" "$ORIGINAL_SOURCE_SEAL" results/v162
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v162-genuine-fully-paid-block0-32window-robustness
          path: results/v162/
          if-no-files-found: warn
          retention-days: 30
