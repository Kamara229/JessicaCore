name: CALIBRI S31 guarded 36M FP32 old TRAIN skills
on:
  push:
    branches: ['research/calibri2-s31-guarded-fp32-replay-20261108']
    paths:
      - 'research/calibri2/s31/**'
      - '.github/workflows/calibri2-s31-guarded-fp32-train.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  S31_guarded_matched_FP32_learning:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '3030'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: 'Static checks - no QA in S31 training, exact old answer identity guard'
        run: |
          python -m compileall -q research/calibri2/s31/
          python -m unittest -v calibri2.s31.test_guarded_dense_fp32_train
      - name: Restore immutable 36M S26 physical source (not heldout QA)
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s26-36M-NOUN-TRANSFER-1280-GREEN-TUNNEL-PHYSICAL
          path: inputs/s26
          run-id: 42470473505
          github-token: ${{ github.token }}
      - name: S31 true FP32 TRAIN updates with old skill strict complete-EOS rollback
        run: |
          python research/calibri2/s31/guarded_dense_fp32_train.py \
            inputs/s26/CALIBRI2_S26_36M_NOUN_TRANSFER_1280_PAID.cb59 \
            results/s31/
      - name: Preserve unaltered positive and negative TRAIN results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s31-MATCHED-36M-DENSE-FP32-OLD-SKILL-GUARDED-TRAIN
          path: results/s31/
          retention-days: 90
