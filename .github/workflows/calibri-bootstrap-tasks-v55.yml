name: CALIBRI v55 - deterministic INT6 precision allocation and speed
on:
  pull_request:
    paths:
      - 'research/calibri/tensor_cap_v51.py'
      - 'research/calibri/bootstrap_tasks_experiment_v55.py'
      - 'research/calibri/real_tasks_v55.py'
      - 'research/calibri/bootstrap_gate_v55.py'
      - 'research/calibri/compare_bootstrap_tasks_v55.py'
      - 'research/calibri/SESSION_55.md'
      - '.github/workflows/calibri-bootstrap-tasks-v55.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-trained-pythia-INT6-precision:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU source
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned pretrained model dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Compile code and run deterministic precision allocator smoke
        run: |
          python -m py_compile research/calibri/tensor_cap_v51.py research/calibri/bootstrap_gate_v55.py research/calibri/real_tasks_v55.py research/calibri/bootstrap_tasks_experiment_v55.py research/calibri/compare_bootstrap_tasks_v55.py
          python research/calibri/tensor_cap_v51.py
          python research/calibri/bootstrap_gate_v55.py
          python research/calibri/real_tasks_v55.py
      - name: Measure frozen trained full INT6 SSE row allocations and blind PPL/warm speed
        run: python research/calibri/bootstrap_tasks_experiment_v55.py --output results/calibri_v55.json
      - name: Preserve every physical pretrained file, corrections, positive and negative tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v55-${{ matrix.os }}
          path: |
            results/calibri_v55.json
            results/CALIBRI_v55_complete_INT6_pre.cb46
            results/CALIBRI_v55_sse_cap_24pct.cr47
            results/CALIBRI_v55_sse_cap_06pct.cr47
            results/CALIBRI_v55_sse_cap_12pct.cr47
          retention-days: 14
          if-no-files-found: ignore
  independent-crosshost-bitwise-and-quality-verifier:
    needs: real-trained-pythia-INT6-precision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v55-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Verify crosshost physically identical source AND correction SHA, PPL, true full model warm SLA
        run: |
          python research/calibri/compare_bootstrap_tasks_v55.py \
            --a results/runs/calibri-v55-ubuntu-22.04/calibri_v55.json \
            --b results/runs/calibri-v55-ubuntu-24.04/calibri_v55.json \
            --output results/calibri_v49_crosshost.json
      - name: Preserve final independent verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v55-crosshost-verdict
          path: results/calibri_v49_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
