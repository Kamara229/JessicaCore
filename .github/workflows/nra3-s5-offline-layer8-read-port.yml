name: NRA2 3.0 S5 offline read-port and Russian TRAIN-only SHA guard
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-nra3-s4-ru-ud-train-causal-alignment-20261115
permissions:
  contents: read
concurrency:
  group: nra3-s5-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  s5_offline_readonly_hook:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s5-real43m-layer8-ru-train12-shadow-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU source-contract dependencies only
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5'
      - name: Validate signed original TRAIN12 and actual hook ABI / syntax
        run: |
          python -m compileall -q research/nra3_s5
          python -m unittest -v research.nra3_s5.test_frozen_layer8_read_port
