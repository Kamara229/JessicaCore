name: CALIBRI S59 CPU-portable paid-dictionary quality candidate
'on':
  pull_request:
    types: [synchronize]
    branches:
      - research/calibri2-s58-frozen-first-paired-noun-replay-20261108
    paths:
      - 'research/calibri2/s59/**'
      - '.github/workflows/calibri2-s59-portable-train.yml'
permissions:
  contents: read
  actions: read
jobs:
  cpu_quantized_corpus_and_replay:
    if: false # Original S59 CPU training already submitted once; do not relaunch on later PR commits.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify CPU/GPU method without model dependencies
        run: |
          python -m compileall -q research/calibri2/s59
          python - <<'PY'
          from pathlib import Path
          p=Path("research/calibri2/s59/paid_dictionary_and_green_tunnel_cpu_gpu.py")
          s=p.read_text()
          assert "replace_discrete" in s and "torch.cuda.is_available()" in s
          assert "no_S29_S26_S53_S55_S57_used" in s
          assert "S59_TRAIN_ONLY_COMPLETE_REPORT.json" in s
          print("S59_SAME_TRAINING_CODE_CPU_GPU_AND_PHYSICAL_CONSTRAINTS_PRESENT")
          PY
      - name: Install pinned CPU toolchain for no-GPU continuation
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Retrieve immutable physical packed S45 host
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Retrieve immutable physically paid S56 dual adapters
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Retrieve immutable S56 exact paid manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-first-token-paid-TRAIN-and-physical-report-JSON
          path: inputs/s56_report
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Run first 8 reproducible global codebook and Green Tunnel training steps on CPU
        run: |
          python research/calibri2/s59/paid_dictionary_and_green_tunnel_cpu_gpu.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s56_report/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL_MANIFEST.json \
            results/s59 --device cpu --steps 8 --checkpoint-every 4 --context 48 --windows 128
      - name: Preserve real physical and CPU resumability artifacts even on TRAIN gate rejection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-s59-cpu-training-checkpoint-and-train-report
          path: results/s59/
          if-no-files-found: warn
          retention-days: 90
