name: CALIBRI v0.23 - real routed Switch MoE pretrained experts
on:
  pull_request:
    paths:
      - 'research/calibri/routed_moe_v23.py'
      - '.github/workflows/calibri-routed-moe-v23.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-switch-moerouting-bf16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
      HF_HUB_ETAG_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research-only packed INT5 one-row CPU reader
        run: gcc -O3 -std=c11 -Wall -Wextra -Werror -shared -fPIC -o research/calibri/libpacked5_v23.so research/calibri/packed5_v19.c research/calibri/packed5_rowcache_v20.c
      - name: Install pinned torch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned transformers, routing/data, safetensors, accelerate, tokenizer
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Actual pretrained BF16 Switch-base-8 router, eight expert pairs and model logits
        run: python research/calibri/routed_moe_v23.py --library research/calibri/libpacked5_v23.so --output results/calibri_v23_real_routed_moe.json --train-tokens 256 --val-tokens 256 --source-len 64 --decoder-len 32 --geo-experts 2 --max-expert-tokens 64
      - name: Upload metrics ONLY (never model checkpoint or tokenized data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v23-real-routed-expert-metrics
          path: results/calibri_v23_real_routed_moe.json
          if-no-files-found: ignore
          retention-days: 14
