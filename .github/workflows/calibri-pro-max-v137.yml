name: CALIBRI v137 original-source 5-bit vector dictionary pilot
on:
  pull_request:
    paths:
      - 'research/calibri/v137/**'
      - 'research/calibri/test_v137_source_dictionary.py'
      - '.github/workflows/calibri-pro-max-v137.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  weight_dictionary_pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - name: Unit-test dictionary geometry, deterministic source holdout and bit cap
        run: python -m unittest test_v137_source_dictionary -v
      - name: Compare actual pretrained embedding row errors at exactly CB59 5bits/8
        run: python -m v137.run "$HOST" results/v137
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v137-frozen-source-weight-dictionary-pilot
          path: results/v137/
          if-no-files-found: warn
          retention-days: 30
