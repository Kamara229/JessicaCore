name: Create Jessica Signing Key v2

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:

      - name: Generate password
        id: password
        run: |
          PASSWORD=$(openssl rand -hex 32)
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore jessica-release.keystore \
            -alias jessica \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "${{ steps.password.outputs.password }}" \
            -keypass "${{ steps.password.outputs.password }}" \
            -dname "CN=Jessica Core, O=Jessica Core"

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore jessica-release.keystore \
            -storepass "${{ steps.password.outputs.password }}"

      - name: Encode keystore
        run: |
          base64 -w 0 jessica-release.keystore > keystore-base64.txt

      - name: Create signing info
        run: |
          echo "KEYSTORE_ALIAS=jessica" > signing-info.txt
          echo "KEYSTORE_PASSWORD=${{ steps.password.outputs.password }}" >> signing-info.txt
          echo "KEY_PASSWORD=${{ steps.password.outputs.password }}" >> signing-info.txt

      - name: Upload signing files
        uses: actions/upload-artifact@v4
        with:
          name: Jessica-Signing-Key-v2
          path: |
            keystore-base64.txt
            signing-info.txt
          retention-days: 1
