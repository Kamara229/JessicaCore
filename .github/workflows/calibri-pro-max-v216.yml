name: CALIBRI v216 true physical 0.7bpp one-bit tied vocabulary source
on:
  push:
    branches:
      - 'research/calibri-pro-max-v216-paid-onebit-embedding-residual'
    paths:
      - 'research/calibri/v216/**'
      - '.github/workflows/calibri-pro-max-v216.yml'
  pull_request:
    paths:
      - 'research/calibri/v216/**'
      - '.github/workflows/calibri-pro-max-v216.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v216_representational_recovery_not_another_output_bias:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pretrained 135M and native packed CB59 runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile native CPU 1-bit index residual and Python preflight
        run: |
          mkdir -p build/v216
          gcc -O3 -std=c11 -fPIC -shared -o build/v216/libcalibri_onebit_v216.so research/calibri/v216/onebit_kernel.c
          python -m compileall -q research/calibri/v216
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v206-original-135m-first-divergence-48step-native-QA
          path: inputs/v206
          run-id: 42255701945
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v193-actual-original-135M-vs-360M-frozen-grader-new-96QA
          path: inputs/v193
          run-id: 42095901870
          github-token: ${{ github.token }}
      - name: Encode one real bit per tied 8D vector with FP16 per-16-row direction; seal physical <=0.7 bpp BEFORE native QA
        run: |
          python research/calibri/v216/run.py inputs/v206/CALIBRI_v206_guarded_48step_135M.cb59 inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153 inputs/v193/v193_original_FP32_135M_vs_360M_new_96QA_complete.json build/v216/libcalibri_onebit_v216.so results/v216
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v216-native-C-onebit-tied-vocabulary-0p700-realQA
          path: results/v216/
          if-no-files-found: warn
          retention-days: 45
          compression-level: 0
