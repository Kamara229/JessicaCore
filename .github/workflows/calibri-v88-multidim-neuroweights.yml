name: CALIBRI v88 - original 135M physically paid 4D neuro-weights

on:
  pull_request:
    paths:
      - 'research/calibri/v88/**'
      - 'research/calibri/multidim_neuroweights_v88.py'
      - 'research/calibri/test_v88_multidim_neuroweights.py'
      - 'research/calibri/SESSION_88.md'
      - '.github/workflows/calibri-v88-multidim-neuroweights.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  genuine_original_135m_four_dimensional_paid_tensor:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pinned original trained CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify facade syntax, tensor geometry and byte-true source budget
        run: |
          python -m compileall -q research/calibri/v88 research/calibri/multidim_neuroweights_v88.py research/calibri/test_v88_multidim_neuroweights.py
          python -m unittest discover -s research/calibri -p test_v88_multidim_neuroweights.py -v
      - name: Download original trained immutable packed CB59 and frozen CB85
        run: |
          mkdir -p input/v85 results/v88
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          gh run download 41578432949 --repo "$GITHUB_REPOSITORY" --name calibri-v85-full-native-conditional-source-physical-TRAIN-VALID --dir input/v85
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s input/v85/v85_RESEARCH_only_conditional_native_source.cb85
      - name: Learn and physically package NEW genuine 4D full native model source
        run: |
          python research/calibri/multidim_neuroweights_v88.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --frozen-cb85 input/v85/v85_RESEARCH_only_conditional_native_source.cb85 --output results/v88
          test -s results/v88/v88_original_pretrained_multidim_physical_KL_NLL_speed.json
          test -s results/v88/v88_gated_original_TRAIN_VALID_4D.cb88
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v88-genuine-trained-four-dimensional-physical-neuroweights
          path: |
            results/v88/v88_original_pretrained_multidim_physical_KL_NLL_speed.json
            results/v88/v88_exploratory_original_TRAIN_SELECTED_4D.cb88
            results/v88/v88_gated_original_TRAIN_VALID_4D.cb88
          retention-days: 7
          if-no-files-found: ignore
