name: NRA2 S3AG small query-role TRAIN512 rehearsal S3O graph frozen CPU
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra2-s3af-train256-real-cpu-j7-20261114
permissions:
  contents: read
  actions: read
concurrency:
  group: nra2-s3ag-512-train-frozen-graph-only
  cancel-in-progress: false
jobs:
  s3ag_512_train_query_roles_only_frozen_s3o_graph_and_original_616_j7:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3ag-role512-train-frozen-graph-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU tools and literal original SmolLM tokenizer
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5' 'transformers==4.46.3' 'tokenizers==0.20.3' 'huggingface-hub>=0.26,<1' 'jinja2==3.1.6'
      - name: Pin S3AF true 43M CPU original 616 J7 and S3Z frozen query-role parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 43522555326 43522663612 43530401603 43530742301 43532157094 43537386173 43537851706; do
            test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/"$run" --jq .conclusion)" = success
          done
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43530742301 --jq .head_branch)" = research/calibri2-nra2-s3y-reversal-train128-real-cpu-20261114
          python - <<'PY'
          import platform,torch
          assert platform.machine()=="x86_64" and not torch.cuda.is_available()
          print("S3AG_GENUINE_CPU_ONLY_QUERY_ROLE_TRAINING_ISOLATED",flush=True)
          PY
      - name: Import original TRAIN128 plus exploratory DEV64 full native CPU tokens and J7
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3n-real43M-192pairedgraph-tokens320-616J7
          path: inputs/nra2_stage3n
          run-id: '43522555326'
          github-token: ${{ github.token }}
      - name: Import S3Y truly frozen 43M CPU new TRAIN128 reversal grammar physical FP16 and J7
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3y-real43M-s3x-reversaltrain128-tokens320-616J7
          path: inputs/nra2_stage3y
          run-id: '43530742301'
          github-token: ${{ github.token }}
      - name: Import precommitted S3X new TRAIN-only grammar SHA and no-score audit
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3x-reversal-train128-grammar-prereg-no-score
          path: inputs/nra2_stage3x
          run-id: '43530401603'
          github-token: ${{ github.token }}
      - name: Import original physically frozen S3O learned roles baseline and graph adapter
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3o-real43M-semantic-queryroles-train128-dev64-zero-gate-fp16
          path: inputs/nra2_stage3o
          run-id: '43522663612'
          github-token: ${{ github.token }}
      - name: Import S3Z physically frozen role-reversal 256 TRAIN head, graph must remain unchanged
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3z-role-reversal256-frozen-graph-train-fp16-zero-gate
          path: inputs/nra2_stage3z
          run-id: '43532157094'
          github-token: ${{ github.token }}
      - name: Import successful S3AF native 43M CPU TRAIN256 FP16, original 616 J7 unchanged
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3af-real43M-s3ae-train256-only-tokens320-616J7
          path: inputs/nra2_stage3af
          run-id: '43537851706'
          github-token: ${{ github.token }}
      - name: Validate precommitted novel grammar and original S3O query architecture
        run: |
          python -m unittest -v research.nra2_bridge.test_stage3ae_train256_future_eval128_prereg research.nra2_bridge.test_stage3x_reversal_train_prereg research.nra2_bridge.test_stage3o_neural_query_roles
          python -m compileall -q research/nra2_bridge/stage3ag_train512_frozen_graph_role_only.py
      - name: Train small S3Z query-role head on TRAIN512 only, commit FP16 with frozen S3O graph
        run: |
          python -m research.nra2_bridge.stage3ag_train512_frozen_graph_role_only \
            inputs/nra2_stage3n inputs/nra2_stage3y inputs/nra2_stage3x \
            inputs/nra2_stage3o inputs/nra2_stage3z inputs/nra2_stage3af \
            results/nra2_stage3ag
      - name: Fail closed on TRAIN512 boundary, S3O graph drift, original 616 J7 or future EVAL128 leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/nra2_stage3ag/NRA2_S3AG_TRAIN512_ROLE_HEAD_AUDIT.json").read_text())
          assert r["stage"]=="NRA2_S3AG_TRAIN512_FROZEN_S3O_GRAPH_S3Z_ROLE_ONLY"
          assert r["S3AF_real_cpu_successful_run"]==43537851706
          assert r["S3Z_parent_training_successful_run"]==43532157094
          assert r["S3AE_preregistered_commitment_sha256"]=="0ccbb2b19b3feb93b79f5dcbc892f2e414a564b6e4d83e52997098346e4f480f"
          assert r["new_S3AE_cpu_token_fp16_unchanged_sha256"]=="995c657496f6131daab04735ba8ec673aff4b91c18d1a92721f1179c8e94bc3e"
          assert r["S3O_original_fp16_unchanged_sha256"]=="40a8903d5419cd8641b5d01e75e429e10b449304b3ba140d2245bf7f8a9d00b6"
          assert r["S3Z_parent_fp16_unchanged_sha256"]=="60a7121b8270f647909776b58dc21b07c6cb885fd6ebeb6cb3158b23221f6e9f"
          assert r["original_graph_physical_fp16_bitwise_equal"] and r["physical_fp16_reload_equal"]
          assert r["full_S194_original_616_J7_digest_preserved_in_S3N_S3Y_S3AF"]
          assert r["train_count"]==512 and r["new_S3AE_TRAIN_count"]==256
          assert r["rehearsal_S3M_TRAIN_count"]==128 and r["rehearsal_S3X_TRAIN_count"]==128
          assert r["original_S3M_DEV64_not_scored_or_trained"]
          assert r["future_independent_S3AE_EVAL128_never_prefilled_scored_or_trained"]
          assert r["only_query_role_head_trained"] and r["original_graph_and_independent_NRA_frozen"]
          assert r["train_loss_after"]<r["train_loss_before"]
          assert r["candidate_accepted"] is False and r["output_gate"]==0.0
          assert not r["full_original_CPU_J7_candidate_gain_tested"]
          print("S3AG_FROZEN_GRAPH_ROLE512_TRAIN_FP16_616J7_FUTURE_EVAL128_SEALED",flush=True)
          PY
      - name: Archive nonaccepted role512 TRAIN-only physically committed FP16
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nra2-stage3ag-role512-train-frozen-s3o-graph-fp16-zero-gate
          path: results/nra2_stage3ag/
          retention-days: 90
          if-no-files-found: error
