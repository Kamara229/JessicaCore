name: CALIBRI v0.37 - all 12 MLPs exact-byte interlayer allocation and sealed AG News PPL
on:
  pull_request:
    paths:
      - 'research/calibri/interlayer_alloc_v37.py'
      - 'research/calibri/compare_interlayer_v37.py'
      - 'research/calibri/SESSION_37.md'
      - '.github/workflows/calibri-interlayer-v37.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pretrained-Pythia-global-bit-allocation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch 2.5.1 CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned real Pythia and AG News datasets
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Measure REAL 12 pretrained MLPs, TRAIN-only global bits, sealed AG test PPL
        run: |
          python research/calibri/interlayer_alloc_v37.py \
            --output results/calibri_v37_global_layer_bits.json \
            --train-tokens 256 --dev-tokens 1024 --ag-tokens 2048 --context 128
      - name: Publish physically serialized MLP bundles and independent evidence, not full source model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v37-${{ matrix.os }}
          path: |
            results/calibri_v37_global_layer_bits.json
            results/local_3p5bpw_baseline.bin
            results/local_3p5bpw_calibrated.bin
            results/global_train_greedy_uncalibrated.bin
            results/global_train_greedy_calibrated.bin
            results/INT4_overbudget_reference.bin
          retention-days: 14
          if-no-files-found: ignore
  compare-real-independent-hosts:
    needs: pretrained-Pythia-global-bit-allocation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v37-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Compare exact physical source SHAs, all matrix row-bit budgets and both PPL corpora
        run: |
          python research/calibri/compare_interlayer_v37.py \
            --a results/runs/calibri-v37-ubuntu-22.04/calibri_v37_global_layer_bits.json \
            --b results/runs/calibri-v37-ubuntu-24.04/calibri_v37_global_layer_bits.json \
            --output results/calibri_v37_crosshost.json
      - name: Preserve numerical negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v37-crosshost-evidence
          path: results/calibri_v37_crosshost.json
          if-no-files-found: ignore
          retention-days: 14
