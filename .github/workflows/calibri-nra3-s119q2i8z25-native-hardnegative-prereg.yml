name: Calibri S119q2i8z25 prereg 84 past TRAIN14 brand new DEV candidate-hardnegative anchored native64
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z24-physical-frozenfuture-calibration-28dev-20261123
permissions:
  contents: read
jobs:
  source-only-84TRAIN14DEV-hardnegative-contrastive-prereg:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z25-prereg-84train14dev-native-hardnegative-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure CPU tensor operators, no pretrained weights loaded
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Python static compilation all source and TRAIN-only candidate rank16 synthetic regression
        run: |
          python -m py_compile research/calibri_nra3/s119q2i8z25_84historicaltrain_new14dev_hardnegative_source.py research/calibri_nra3/s119q2i8z25_native64_anchored_hardnegative_rank16.py research/calibri_nra3/test_s119q2i8z25_native64_anchored_hardnegative.py
          python -m unittest -v research.calibri_nra3.test_s119q2i8z25_native64_anchored_hardnegative
      - name: Reject edits of pretrained, LIVE, protected or prior research data
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/z25only
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z25_84historicaltrain_new14dev_hardnegative_source.py' -e 'research/calibri_nra3/s119q2i8z25_native64_anchored_hardnegative_rank16.py' -e 'research/calibri_nra3/test_s119q2i8z25_native64_anchored_hardnegative.py' -e '.github/workflows/calibri-nra3-s119q2i8z25-native-hardnegative-prereg.yml' /tmp/z25only; then
            echo 'Original or protected model modifications forbidden' >&2
            exit 1
          fi
          test $(wc -l < /tmp/z25only) -eq 4
