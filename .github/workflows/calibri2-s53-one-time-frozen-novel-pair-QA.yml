name: CALIBRI S53 one-time novel paired QA for frozen accepted S52
on:
  push:
    branches:
      - research/calibri2-s53-novel-pair-generalization-audit-20261108
    paths:
      - 'research/calibri2/s53/**'
      - '.github/workflows/calibri2-s53-one-time-frozen-novel-pair-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read_only_new96_competing_noun_frozen_QA:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU inference requirements
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile frozen S53 read-only QA source; no train or original held-out QA
        run: python -m compileall -q research/calibri2/s53
      - name: Download immutable S45 physically complete compressed source
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Download immutable S47 trained paid Green Tunnel controller
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s47-active-green-tunnel-paid-under-0p7-if-accepted
          path: inputs/s47
          run-id: 42505575247
          github-token: ${{ github.token }}
      - name: Download immutable S52 accepted paid Green Tunnel controller
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s52-active-paired-green-tunnel-if-accepted
          path: inputs/s52
          run-id: 42514912967
          github-token: ${{ github.token }}
      - name: Download immutable S52 real all-inclusive physical manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s52-real-paid-pair-TRAIN-report-JSON
          path: inputs/s52_report
          run-id: 42514912967
          github-token: ${{ github.token }}
      - name: Score S45 S47 S52 frozen full+EOS on 96 fresh natural paired prompts
        run: |
          python research/calibri2/s53/frozen_s52_unseen_paired_generalization.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s47/S47_ACTIVE_GREEN_TUNNEL_SIDECAR.safetensors \
            inputs/s52/S52_ACTIVE_GREEN_TUNNEL_RANK12.safetensors \
            inputs/s52_report/S52_ACTIVE_GREEN_TUNNEL_MANIFEST.json \
            results/s53
      - name: Upload read-only exact-token new QA evidence, even if negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s53-unseen-novel96-READONLY-full-answer-QA
          path: results/s53/*.json
          if-no-files-found: warn
          retention-days: 90
