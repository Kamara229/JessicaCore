name: CALIBRI v96 frozen real-answer and coherent-generation forensic audit

on:
  pull_request:
    paths:
      - 'research/calibri/v96/**'
      - 'research/calibri/calibri_generation_quality_v96.py'
      - 'research/calibri/test_v96_generation_quality.py'
      - 'research/calibri/SESSION_96_REAL_GENERATION_QUALITY_AUDIT.md'
      - '.github/workflows/calibri-v96-generation-canaries.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen_generation_and_actual_correctness_canaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original frozen trained model and CPU-only tools
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Test answer grading strict pairing and synthetic canary correctness
        run: |
          python -m compileall -q research/calibri/v96 research/calibri/calibri_generation_quality_v96.py research/calibri/test_v96_generation_quality.py
          python research/calibri/test_v96_generation_quality.py -v
      - name: Retrieve immutable original complete native archives and locked baseline
        run: |
          mkdir -p input/v92 results/v96
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          gh run download 41729012091 --repo "$GITHUB_REPOSITORY" --name calibri-v92-research-automatic-TRAIN-only-full-block-rewrite --dir input/v92
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s input/v92/v92_rewritten_single_block_RESEARCH_ONLY.cb59
          test -s input/v92/v92_research_quality_doctor_report.json
      - name: Run FP32 and two frozen native packed sources on actual real-answer and full-language canaries
        run: |
          python research/calibri/calibri_generation_quality_v96.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --v92 input/v92/v92_rewritten_single_block_RESEARCH_ONLY.cb59 --v92-report input/v92/v92_research_quality_doctor_report.json --locked-baseline research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v96
          test -s results/v96/v96_FP32_CB59_v92_genuine_answer_and_generation_diagnosis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v96-FP32-versus-native-actual-answers-and-full-text
          path: results/v96/v96_FP32_CB59_v92_genuine_answer_and_generation_diagnosis.json
          retention-days: 7
          if-no-files-found: ignore
