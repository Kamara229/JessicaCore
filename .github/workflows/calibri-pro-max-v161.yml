name: CALIBRI v161 physically paid original first decoder block 5plus1 bit
on:
  pull_request:
    paths:
      - 'research/calibri/v161/**'
      - 'research/calibri/test_v161_original_layer0_paid.py'
      - '.github/workflows/calibri-pro-max-v161.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test_original_source_first_layer_physical_repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/paid/CALIBRI_v140_paid_tied_embedding_6bit.cb140
      DIAGNOSTIC: inputs/v159/v159_teacher_vs_0p67bpp_full_30block_hidden_drift.json
      ACTUAL_V160: inputs/v160/v160_tied_embedding_head_causal_source.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference and packed source dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v140-native-paid-tied-6bit-full-model
          path: inputs/paid
          run-id: 41898410897
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v159-real-original-30layer-activation-drift-map
          path: inputs/v159
          run-id: 41917353381
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v160-real-6bit-tied-input-vs-head-hidden-drift-new-valid
          path: inputs/v160
          run-id: 41919065068
          github-token: ${{ github.token }}
      - name: Verify physical original source scope, prior negative evidence and unpaid oracle isolation
        run: python -m unittest test_v161_original_layer0_paid -v
      - name: Re-encode first source block 7 trained operators then open NEW source TRAIN VALID
        run: python -m v161.run "$SOURCE" "$DIAGNOSTIC" "$ACTUAL_V160" results/v161
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: results/v161/
          if-no-files-found: warn
          retention-days: 30
