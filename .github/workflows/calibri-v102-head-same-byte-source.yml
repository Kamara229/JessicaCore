name: CALIBRI v102 physically paid same-byte tied whole head recoding

on:
  pull_request:
    paths:
      - 'research/calibri/v102/**'
      - 'research/calibri/calibri_tied_head_recode_v102.py'
      - 'research/calibri/test_v102_recode_guard.py'
      - 'research/calibri/SESSION_102_SAME_BYTE_TIED_HEAD_RECODING.md'
      - '.github/workflows/calibri-v102-head-same-byte-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original_frozen_CB59_vs_new_same_byte_whole_head:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original public pretrained CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Compile and unit test same-byte source integrity and tied aliases
        run: |
          python -m compileall -q research/calibri/v102 research/calibri/calibri_tied_head_recode_v102.py research/calibri/test_v102_recode_guard.py
          python research/calibri/test_v102_recode_guard.py -v
      - name: Download only immutable original CB59 source, never official TEST
        run: |
          mkdir -p input results/v102
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Rewrite only original tied head as new same-byte codebook and test native generation
        run: |
          python research/calibri/calibri_tied_head_recode_v102.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --locked research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v102
          test -s results/v102/CALIBRI_v102_reencoded_whole_original_TIED_HEAD.cb59
          test -s results/v102/v102_head_refit_same_byte_source_actual_text_speed_and_quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v102-separate-whole-tied-head-same-byte-candidate-and-audit
          path: |
            results/v102/CALIBRI_v102_reencoded_whole_original_TIED_HEAD.cb59
            results/v102/v102_head_refit_same_byte_source_actual_text_speed_and_quality.json
          retention-days: 7
          if-no-files-found: ignore
