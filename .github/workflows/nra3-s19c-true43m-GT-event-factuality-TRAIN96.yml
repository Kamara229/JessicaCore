name: NRA3 S19c true43M GT TRAIN96 learned event factuality grammar adapter
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s19b-true43m-grammar-head-20261116
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s19c-true43m-event-factuality-only
  cancel-in-progress: true
jobs:
  real43M_GT_grammar_event_truth_train_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '319103'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check previous original Calibri43M and grammar-only true CPU research runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43910479658 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43934877964 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43934877964 --jq .head_sha)" = 3e407f6d65e541bee8fce640595ee5c317b66841
          echo ORIGINAL43M_GT_AND_S19B_PROVENANCE_FROZEN
      - name: Install CPU-only exact physical FP16 and source dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Run source-only grammar and event-factuality tests without EVAL
        run: |
          python -m compileall -q research/nra3_s19
          python -m unittest -v research.nra3_s18.test_ru96_train_source research.nra3_s19.test_event_graph_contracts research.nra3_s19.test_s19b_compact_grammar research.nra3_s19.test_s19c_event_scope
      - name: Download ONLY original 43M+GT true CPU hidden320 TRAIN96
        uses: actions/download-artifact@v4
        with:
          name: nra3-s18b-TRUE43M-616J7-new96-TRAIN-postGT-layer8-goldfree-FP16
          run-id: 43910479658
          github-token: ${{ github.token }}
          path: inputs/nra3_s18b
      - name: Download full 6528-FP16 S19b grammar original TRAIN96 physical weights
        uses: actions/download-artifact@v4
        with:
          name: nra3-s19b-TRUE43M-GT-96TRAIN-grouped12-physical-FP16-grammar-no-EVAL
          run-id: 43934877964
          github-token: ${{ github.token }}
          path: inputs/nra3_s19b
      - name: Explicitly check only original TRAIN96 physical features and prior pretrained grammar
        run: |
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          from research.nra3_s18.real43m_train96_physical_source import checked_real_train96
          from research.nra3_s19.paid_grammar_parser import load_paid_fp16_bytes,trainable_parameter_count
          root=Path("inputs")
          rows,m=checked_real_train96(
            root/"nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors",
            root/"nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json")
          assert len(rows)==96 and m["all_616_native_CPU_generated_token_digests_unchanged"]
          p=root/"nra3_s19b/NRA3_S19B_TRUE43M_GT_TRAIN96_WORD_GRAMMAR_ONLY_FP16.safetensors"
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="7341becd1693fa0de09d1bce8252e2f5f7a00ae96c255664112277b024bc3915"
          assert trainable_parameter_count(load_paid_fp16_bytes(raw))==6528
          source=Path("research/nra3_s19/s19c_train96_real43m_event_factuality.py").read_text()
          mods=[n.module or "" for n in ast.walk(ast.parse(source)) if isinstance(n,ast.ImportFrom)]
          assert not any(s in name for name in mods for s in ("s18c6","s18c7","nra3_s17","nra3_s15","nra3_s12"))
          assert not any((root/x).exists() for x in ("nra3_s18c6","nra3_s18c7","s3ci","EVAL128"))
          print("ORIGINAL43M_GT_616_J7_GRAMMAR_S19B_SHA_AND_TRAIN_ONLY_CHECKED")
          PY
      - name: Train semantic event truth on original true43M real CPU grammar with 12 strict grouped TRAIN-only folds
        run: |
          python -m research.nra3_s19.s19c_train96_real43m_event_factuality \
            --s18b-hidden inputs/nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors \
            --s18b-report inputs/nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json \
            --s19b-full-grammar inputs/nra3_s19b/NRA3_S19B_TRUE43M_GT_TRAIN96_WORD_GRAMMAR_ONLY_FP16.safetensors \
            --out results/nra3_s19c
      - name: Audit complete physically billed FP16 semantic head and no production gate
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from research.nra3_s19.s19c_paid_event_factuality import PaidEventFactuality,HEAD_PARAMETERS
          root=Path("results/nra3_s19c")
          m=json.loads((root/"NRA3_S19C_REAL43M_GT_TRAIN96_GROUPED12_EVENT_SHADOW_REPORT.json").read_text())
          assert len(m["TRAIN_internal_folds"])==12
          assert m["parent_grammar_s19b_success_CI_run"]==43934877964
          assert m["physically_paid_grammar_parameters"]==6528
          assert m["physically_paid_event_head_parameters"]==HEAD_PARAMETERS==68
          assert m["total_physical_fp16_parameters"]==6596
          assert m["all_grammar_model_predictions_gold_blind"]
          assert m["S19_condition_or_coreference_event_labels_NOT_yet_learned"]
          assert m["NO_independent_or_spent_EVAL32_EVAL128_S17c_S15c_S12c_used"]
          assert m["new_candidate_616_active_J7_EOS_NOT_CERTIFIED"]
          assert m["inclusive_bpp_le07_NOT_CERTIFIED"]
          assert m["whole_CPU_speed_ge90pct_CB59_NOT_CERTIFIED"]
          assert m["strict_online_word_causality_NOT_PROVEN"]
          assert m["NRA2_Calibri_LIVE_output_gate"]==0 and m["candidate_accepted"] is False
          assert m["activation_allowed"] is False and m["LIVE_Render_Supabase_Jessica_APK_unchanged"]
          physical=(root/m["combined_fp16_filename"]).read_bytes()
          assert hashlib.sha256(physical).hexdigest()==m["combined_fp16_final_sha256"]
          a=PaidEventFactuality.from_physical(physical)
          assert a.output_gate==0 and a.candidate_accepted is False
          for axis in ("TRAIN_internal_lexical_aggregate","TRAIN_internal_syntax_aggregate"):
            z=m[axis]
            assert z["all_raw_words"]==600 and z["event_gold_count"]==108
            assert 0<=z["joint_predicate_factuality_micro_F1"]<=1
          print("TRUE43M_S19C_EVENT_LEX",m["TRAIN_internal_lexical_aggregate"])
          print("TRUE43M_S19C_EVENT_SYNTAX",m["TRAIN_internal_syntax_aggregate"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s19c-TRUE43M-GT-grammar6596FP16-event-factuality-TRAIN96-no-EVAL
          path: results/nra3_s19c/
          if-no-files-found: error
          retention-days: 30
