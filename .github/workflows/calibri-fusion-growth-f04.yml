name: Calibri Fusion Growth F04 GPU paid core discrete learning
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f03-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f04:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f04-20261125'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONPATH: .:research:research/calibri
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scope check
        run: |
          git diff --name-only 76f7b828432326c9f02673742c3d71d3a53b6f42 HEAD >/tmp/f04scope
          test "$(wc -l </tmp/f04scope | tr -d ' ')" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f04_gpu_discrete_core.py' -e '.github/workflows/calibri-fusion-growth-f04.yml' /tmp/f04scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Apple GPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          run-id: 45668506574
          path: inputs/f01
          github-token: ${{ github.token }}
      - name: Real MPS 85 codebooks and gradient-guided K16 indices
        run: python research/calibri2/fusion_growth/f04_gpu_discrete_core.py --root inputs/f01 --out results/f04
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f04-mps-discrete-core-G0
          path: results/f04/
          retention-days: 30
          if-no-files-found: error
