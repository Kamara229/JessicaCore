name: CALIBRI v186 balanced opposing behavior 5bit source native QA
on:
  pull_request:
    paths:
      - 'research/calibri/v186/**'
      - 'research/calibri/test_v186_balanced_behavior.py'
      - '.github/workflows/calibri-pro-max-v186.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual_pretrained_balanced_paired_training_native_QA:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pretrained SmolLM2 scientific CPU and public tokenizer
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - name: Ensure balanced contradictory TRAIN and heldout VALID are distinct
        run: python -m unittest test_v186_balanced_behavior -v
      - name: Actually train 96 paired steps, seal physical native source, compare heldout behavior and real QA
        run: python -m v186.run "$SOURCE" results/v186
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v186-paid-balanced-code-swaps-native-QA
          path: results/v186/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
