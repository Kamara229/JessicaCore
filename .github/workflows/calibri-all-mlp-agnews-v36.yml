name: CALIBRI v0.36 - ALL 12 Pythia MLP physical 3.5bpw and first AG News test PPL
on:
  pull_request:
    paths:
      - 'research/calibri/all_mlp_agnews_v36.py'
      - 'research/calibri/compare_all_mlp_v36.py'
      - 'research/calibri/SESSION_36.md'
      - '.github/workflows/calibri-all-mlp-agnews-v36.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-Pythia-12-MLP-physical-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch 2.5.1 CPU only
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned pretrained Pythia, WikiText and new AG News corpus dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Real pretrained all-12 physical bundles, WikiText DEV and AG News NEW TEST PPL
        run: |
          python research/calibri/all_mlp_agnews_v36.py \
            --output results/calibri_v36_all12_agnews.json \
            --train-tokens 256 --eval-tokens 1024 --context 128
      - name: Preserve actual 12-module MLP bundles and JSON metrics, never full model or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v36-${{ matrix.os }}
          path: |
            results/calibri_v36_all12_agnews.json
            results/uncalibrated_3p5bpw_all12.bin
            results/calibrated_3p5bpw_all12.bin
            results/INT4_above_budget_all12.bin
          retention-days: 14
          if-no-files-found: ignore
  compare-two-independent-CPUs:
    needs: real-Pythia-12-MLP-physical-pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v36-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Verify original model/token matrices, true bundle SHA, ≤3.5bpw and quality
        run: |
          python research/calibri/compare_all_mlp_v36.py \
            --first results/runs/calibri-v36-ubuntu-22.04/calibri_v36_all12_agnews.json \
            --second results/runs/calibri-v36-ubuntu-24.04/calibri_v36_all12_agnews.json \
            --output results/calibri_v36_crosshost.json
      - name: Keep all negative and positive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v36-12-MLP-crosshost-evidence
          path: results/calibri_v36_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
