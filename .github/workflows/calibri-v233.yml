name: CALIBRI v233 FP32 vs v228 red/no counterfactual diagnostic
on:
  push:
    branches: ['research/calibri-v233-red-no-counterfactual-diagnostic']
    paths: ['research/calibri/v233/**', '.github/workflows/calibri-v233.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read_only_red_no_diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 230
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Check syntax
        run: python -m compileall -q research/calibri/v233
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v228-TRAIN-paid-211-recovery-full-answer-gate
          path: inputs/v228
          run-id: 42336914724
          github-token: ${{ github.token }}
      - name: Frozen paired red/no counterfactual
        run: python research/calibri/v233/run.py inputs/v228/CALIBRI_v228_TRAIN_ACCEPTED_fullanswer_paid_211.cb59 results/v233
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v233-FP32-v228-red-no-inversion-direct-answers
          path: results/v233/
          if-no-files-found: warn
          retention-days: 60
