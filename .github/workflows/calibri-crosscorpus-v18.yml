name: CALIBRI v0.18 - previously unseen corpus with frozen geometry candidates
on:
  pull_request:
    paths:
      - 'research/calibri/geometric_v18.py'
      - '.github/workflows/calibri-crosscorpus-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-domain-quality-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Pinned dataset/numerical environment
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Previously unseen TinyStories evaluation, no selection
        run: python research/calibri/geometric_v18.py --output results/calibri_v18_new_corpus.json --tokens 8192 --context 128
      - name: Upload results only, without pretrained weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v18-new-corpus-results
          path: results/calibri_v18_new_corpus.json
          if-no-files-found: ignore
          retention-days: 14
