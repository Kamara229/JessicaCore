name: NRA2 S3CI SIXTH one-time independent128 frozen S3BA S3BN S3CF CPU roles and reachability
'on':
  pull_request:
    # S3CH CPU+gold FP16 physical SHA must be pinned BEFORE first evaluation.
    # PR creation never triggers scoring: only later SHA-lock synchronize.
    types: [synchronize]
    branches:
      - research/calibri2-nra2-s3ch-sixth128-real43m-cpu-no-score-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: nra2-s3ci-once-only-sixth128-original43m-zero-gate
  cancel-in-progress: false
jobs:
  s3ci_one_time_SIXTH_s3cg128_new_joint_semantic_roles:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3ci-sixth128-once-only-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact research-only CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5' 'transformers==4.46.3' 'tokenizers==0.20.3' 'huggingface-hub>=0.26,<1' 'jinja2==3.1.6'
      - name: Require sixth SHA-sealed prereg, genuine CPU no-score S3CH and S3CF frozen before any independent score
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for r in 43678694884 43678041407 43679105427 43677179638 43645412996 43590032315 43446925758 43640363396 43644153544 43648038071 43651233135; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$r" --jq .conclusion)" = success
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43678694884" --jq .head_branch)" = research/calibri2-nra2-s3cg-sixth-untouched128-prereg-20261115
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43678041407" --jq .head_branch)" = research/calibri2-nra2-s3cf-order-balanced-real-cpu-train2240-20261115
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43679105427" --jq .head_branch)" = research/calibri2-nra2-s3ch-sixth128-real43m-cpu-no-score-20261115
          python - <<'PY'
          import torch,platform
          assert platform.machine()=="x86_64" and not torch.cuda.is_available()
          print("S3CI_SIXTH_FROZEN_CPU128_ONCE_ONLY_NO_TRAIN")
          PY
      - name: Load SEALED sixth S3CG completely unseen128 protocol SHA
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3cg-sixth-unseen128-prereg-graph-grammar-no-model
          run-id: '43678694884'
          github-token: ${{ github.token }}
          path: inputs/s3cg
      - name: Load genuinely frozen original43M CPU SIXTH untouched128 S3CH and original 616 J7
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3ch-sixth-independent128-original43M-tokens320-J7-no-score
          run-id: '43679105427'
          github-token: ${{ github.token }}
          path: inputs/s3ch
      - name: Load original S3BA FP16 baseline
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3ba-role1536-replay1024-structural512-dev128-fp16-zero-gate
          run-id: '43590032315'
          github-token: ${{ github.token }}
          path: inputs/s3ba
      - name: Lock pre-S3BR S3BN physically SHA-verified TRAIN2048 FP16 pair-role parent
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bn-joint-semantic-pair-train2048-fp16-zero-gate
          run-id: '43645412996'
          github-token: ${{ github.token }}
          path: inputs/s3bn
      - name: Lock new S3CF physically verified TRAIN-only 2240 FP16 role head
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bz-fit192-replay2240-safe-fp16-zero-gate
          run-id: '43678041407'
          github-token: ${{ github.token }}
          path: inputs/s3cf
      - name: Lock independent frozen NRA2 original parameters
        uses: actions/download-artifact@v4
        with:
          name: nra2-standalone-relational-cpu-research-only
          run-id: '43446925758'
          github-token: ${{ github.token }}
          path: inputs/nra2
      - name: Validate one-time research code and independent fixed exact McNemar math without blind scoring
        run: |
          python -m compileall -q research/nra2_bridge/stage3ci_sixth_once_only_s3ba_s3bn_s3cf.py
          python -m unittest -v research.nra2_bridge.test_stage3bh_mcnemar
      - name: S3CI ONCE ONLY evaluate frozen S3BA S3BN S3CF on 128 sixth independent questions
        run: |
          python -m research.nra2_bridge.stage3ci_sixth_once_only_s3ba_s3bn_s3cf \
            inputs/s3ch inputs/s3cg inputs/s3ba inputs/s3bn inputs/s3cf inputs/nra2 \
            results/nra2_stage3ci_sixth128_once_only
      - name: Verify independent new 128 report no model promotion or test tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/nra2_stage3ci_sixth128_once_only/NRA2_S3CI_SIXTH_ONCE_ONLY128_S3BA_S3BN_S3CF_NO_RETUNE.json").read_text())
          assert r["stage"]=="NRA2_S3CI_SIXTH_ONCE_ONLY_S3CG128_S3BA_VS_S3BN_VS_JOINT_S3CF"
          assert r["S3CH_run"]==43679105427 and r["S3CG_prereg_successful_run"]==43678694884
          assert r["S3CH_original_CPU_token_fp16_sha256"]=="bc64149a9fca305cadd07a23eb4c7522e1da522c85ba5dc6c584270178265542"
          assert r["S3CH_gold_fp16_sha256"]=="b6d230241536fc0e3ba2d49230a958399810b45060b3d2ff6b43b68dedc53591"
          assert r["graph_weights_bitwise_equal"] and r["graph_logits_bitwise_equal"]
          assert r["S3CG_prereg_commitment_sha256"]=="59209ccf9a2ceaa358e1e867b1e3a6395c962b89eff2b5e038901f73c2a61776"
          assert r["S3BA_fp16_sha256"]=="4fedf391ee02b1d1c45c82c3690d212ba9a43e9d0da32446f5d32ac6c379bb09"
          assert r["S3BN_fp16_sha256"]=="ea8a81665370cba22c4e8bc75fbe82314089244d4b32278ee62c2c30d88ae811"
          assert r["S3CF_fp16_sha256"]=="3c0cb51ea9cdffba89666c043223044805e6d52397daa0ae6ca473f845efc312"
          assert r["one_time_independent_EVAL128"]==128
          assert r["original_616_S194_J7_preserved_in_S3CH"]
          assert r["prior_S3AQ_old_independent_EVAL128_consumed"]
          assert r["prior_S3BJ_second_independent_EVAL128_consumed"]
          assert r["prior_S3BO_third_independent_EVAL128_consumed"]
          assert r["prior_S3BU_fourth_independent_EVAL128_consumed"]
          assert r["prior_S3CD_fifth_independent_EVAL128_consumed"]
          assert r["S3BM_42869_new_pairwise_params"]
          assert r["S3CF_96_directional_paraphrases_TRAIN_only"]
          assert r["sixth_unseen_16_topologies_and_8_new_grammars"]
          assert r["metrics"]["all"]["n"]==128
          assert set(r["metrics"]["all"]["paired_both_roles"])=={"S3BA_vs_S3BN","S3BA_vs_S3CF","S3BN_vs_S3CF"}
          assert r["metrics"]["source_first"]["n"]==64 and r["metrics"]["destination_first"]["n"]==64
          assert len(r["question_level"])==128
          assert r["no_training_or_calibration_or_threshold_tuning"]
          assert r["independent_EVAL_is_now_consumed"] and r["sixth_independent_EVAL_consumed_only_once"] and r["no_winner_accepted_based_on_this_EVAL"]
          assert not r["candidate_accepted"] and r["output_gate"]==0.
          assert not r["full_EOS_tested"] and not r["physical_all_in_bpp_tested"] and not r["paired_CPU_speed_tested"]
          print("S3CI_SIXTH128_ONE_TIME_SEMANTIC_MODEL_COMPARE_ZERO_GATE",r["metrics"]["all"])
          PY
      - name: Archive one-time independent new128 role+reachability scores, forbid reuse for future training
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nra2-stage3ci-sixth128-once-only-s3ba-s3bn-s3cf
          path: results/nra2_stage3ci_sixth128_once_only/
          retention-days: 90
          if-no-files-found: error
