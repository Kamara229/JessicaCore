name: Calibri Fusion Growth F06 integrated compressed core recovery
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f05-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f06:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f06-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scope check
        run: |
          git diff --name-only cdd4267a991d63e02e35d873a0cf758d2007e1d7 HEAD >/tmp/f06scope
          test "$(wc -l </tmp/f06scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f06_integrated_recovery.py' -e '.github/workflows/calibri-fusion-growth-f06.yml' /tmp/f06scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          run-id: 45668506574
          path: inputs/f01
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f03-rate-trained-core-G0
          run-id: 45669309826
          path: inputs/f03
          github-token: ${{ github.token }}
      - name: Attach original regions and jointly train paid core and learned mechanisms
        run: python research/calibri2/fusion_growth/f06_integrated_recovery.py --f01 inputs/f01 --f03 inputs/f03 --out results/f06
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f06-integrated-recovery-G0
          path: results/f06/
          retention-days: 30
          if-no-files-found: error
