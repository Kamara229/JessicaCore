name: Calibri NRA3 S99 REAL original12 Taiga TRAIN-b morphology-pretrain then UD roles GATE0
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s98-real12-TaigaB256-morphology-sourceonly-20261119
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s99-REAL12-morphology-neural-TRAINb-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original12_Calibri_frozen_morphology_then_role_28887_child:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s99-morphology-pretrain-real12-UDtrainB-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      PYTHONPATH: .:research
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '991119'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch only for 28887 new neural child TRAIN
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5'
      - name: Compile and test source-only strict original BPE alignment morph targets and fixed train schedule
        run: |
          set -euo pipefail
          python -m compileall -q research/calibri_nra3/s99_nativeBPE_UD_morphology_labels_AFTER_frozen_original.py research/calibri_nra3/s99_offline_morphology_native_BPE_TRAIN_loss.py research/calibri_nra3/s99_REAL12_Taiga_B_morph_pretrain_then_role_28887_ONLY.py
          python -m unittest -v research.calibri_nra3.test_s97_morphology_in_calibri_and_trainB_contracts research.calibri_nra3.test_s99_source_SHA_then_offline_native_BPE_morphology research.calibri_nra3.test_s99_FIXED_morph_pretrain_vs_role_only_original12
      - name: Demand true S98 original CB59 GT all12 after 616 protected and precommitted disjoint UD Taiga TRAIN-b
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 44572723983 44569179069 44566200888; do
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${id} --jq .conclusion)" = success
          done
          echo NRA3_S99_S98_FROZEN_SOURCE_SHA_FIRST_NO_OLD_S96_DEV_S79_S86_TEST
      - name: Download ORIGINAL S98 all12 source-only 255 training rows and 28887 IN-Calibri initial child weights
        uses: actions/download-artifact@v4
        with:
          name: calibri-nra3-s98-true43MGT-TaigaTRAINb256-MORPH-sourceonly-all12-28887-neural-after616
          run-id: 44572723983
          github-token: ${{ github.token }}
          path: inputs/s98_original12_SOURCE_ONLY
      - name: Verify S98 true original model source physical SHA and original616 before opening ANY morphology gold
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from safetensors.torch import load_file
          d=Path('inputs/s98_original12_SOURCE_ONLY')
          p=d/'NRA3_S98_TAIGA_TRAINB256_REAL12_ORIGINAL_H320_NO_UD_GOLD.safetensors'
          w=d/'NRA3_S98_IN_CALIBRI_UNTRAINED_MORPH_28887_FP16.safetensors'
          r=json.loads((d/'NRA3_S98_REAL43MGT_TAIGA_TRAINB256_ALL12_SOURCEONLY_PROVENANCE.json').read_text())
          assert r['stage']=='CALIBRI_NRA3_S98_REAL43MGT_ALL12_TAIGA_TRAINB256_MORPH_SOURCE_ONLY_AFTER616'
          assert r['S97_TAIGA_TRAIN_B_PINNED_SOURCE256_SHA256']=='437b6d62564e4cda6c58975910ccc98221c3e81938bda22429418f16700b1dad'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['ALL12_CPU_SAFETENSORS_SHA256']=='2076cbbfc7bd9786af801004ac61bfe541ef3e58ff0cbeab604856b784411637'
          assert hashlib.sha256(w.read_bytes()).hexdigest()==r['IN_CALIBRI_28887_MORPH_FP16_WEIGHTS_SHA256']=='05b657b2f9e7bf4fc647e798bcbf7d2c01de3eeebd35d4fdd567b8d54306bb4d'
          assert r['n_pinned_source_only_rows']==256 and r['n_accepted_source_only_BPE_rows']==255
          assert r['n_genuine_original_native_BPE_tokens']==30358
          assert r['old_616_J7_physically_replayed_BEFORE_NRA3_hooks']
          assert r['original_S5_H8_port_exactly_matches_all12_H8_for_all_accepted']
          assert r['NRA3_morph_neural_28887_weights_REGISTERED_INSIDE_actual_Calibri_model']
          assert r['source_only_no_Taiga_TRAIN_B_UD_morph_or_role_GOLD_loaded_during_CPU']
          assert r['old_S79_S86_and_S96_internal_dev_NEVER_reused']
          assert not r['candidate_accepted'] and r['output_gate']==0
          src=load_file(str(p))
          assert src['original_Calibri43M_GT_ALL12_native_H320_FP16_READONLY'].shape[:2]==(255,12)
          assert sum(v.numel() for v in load_file(str(w)).values())==28887
          print('NRA3_S99_TRUE_ORIGINAL12_SOURCE_SHA_VERIFIED_BEFORE_UD_GOLD',flush=True)
          PY
      - name: Download S97 separately precommitted UD Taiga TRAIN-b ALL-word morphology and role TRAIN-only teacher GOLD
        uses: actions/download-artifact@v4
        with:
          name: calibri-nra3-s97-REAL-UD-Taiga-TRAINb256-new-MORPH-source-and-separate-GOLD-CC-BY-SA-RESEARCH-only
          run-id: 44569179069
          github-token: ${{ github.token }}
          path: inputs/s97_OFFLINE_TaigaB_UD_gold_AFTER_source_SHA
      - name: Physical 10 morphology-only plus 24 joint morphology and UD roles epochs TRAIN ONLY original12 source, 28887 new neural weights, old base immutable
        run: |
          set -euo pipefail
          python -m research.calibri_nra3.s99_REAL12_Taiga_B_morph_pretrain_then_role_28887_ONLY \
            --s98-source inputs/s98_original12_SOURCE_ONLY/NRA3_S98_TAIGA_TRAINB256_REAL12_ORIGINAL_H320_NO_UD_GOLD.safetensors \
            --s98-report inputs/s98_original12_SOURCE_ONLY/NRA3_S98_REAL43MGT_TAIGA_TRAINB256_ALL12_SOURCEONLY_PROVENANCE.json \
            --s98-child inputs/s98_original12_SOURCE_ONLY/NRA3_S98_IN_CALIBRI_UNTRAINED_MORPH_28887_FP16.safetensors \
            --s97-dir inputs/s97_OFFLINE_TaigaB_UD_gold_AFTER_source_SHA \
            --out results/calibri_nra3_s99_REAL12_TaigaB_morph_28887
      - name: Verify trained 28887 in-Calibri child physical FP16 source-only 616 immutable; internal dev is NOT independent accuracy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,math
          from safetensors.torch import load_file
          d=Path('results/calibri_nra3_s99_REAL12_TaigaB_morph_28887')
          p=d/'NRA3_S99_TAIGA_B_IN_CALIBRI_TRAINED_MORPH_RELATION_28887_FP16.safetensors'
          r=json.loads((d/'NRA3_S99_REAL12_MORPH_PRETRAIN_AND_GRAMMATICAL_INTERNAL_DIAGNOSTICS.json').read_text())
          assert r['stage']=='CALIBRI_NRA3_S99_NEW_TAIGA_TRAIN_B_REAL12_MORPH_PRETRAIN_THEN_UD_ROLE_28887_FP16'
          assert r['S98_original_true12_source_SHA']=='2076cbbfc7bd9786af801004ac61bfe541ef3e58ff0cbeab604856b784411637'
          assert r['S98_original_untrained_morph_28887_child_SHA']=='05b657b2f9e7bf4fc647e798bcbf7d2c01de3eeebd35d4fdd567b8d54306bb4d'
          assert r['S99_new_trained_morph_28887_child_SHA']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert r['new_neural_in_Calibri_trainable_parameters']==28887
          assert r['new_nominal_FP16_weight_bytes']==57774
          for k in ('new_in_calibri_neural_UPOS_Case_Number_Voice_heads','eight_old_NRA2_neural_mini_areas_preserved','learned_router_all_original12_Calibri_layers','only_NEW_child_neural_weights_trained_BASE_Calibri_GT_frozen','original_Calibri_616_J7_frozen_precheck','gold_loaded_ONLY_after_S98_true_original12_physical_SHA_verified','license_CC_BY_SA_attribution_review_no_commercial_use','S96_old_same_Taiga_train_a_internal_dev_SPENT_not_reused','S79_S86_old_firstreads_SPENT_not_reused','Taiga_original_upstream_dev_test_NEVER_loaded','fixed_stage_schedule_no_hparam_or_checkpoint_tuning','metrics_NOT_independent_factuality_or_user_event_QA_test','protected_active_candidate_616_NOT_validated','all_in_bpp_cpu_online_causal_NOT_certified'):
            assert r[k],k
          assert r['train_config_FIXED']['morphology_epochs']==10
          assert r['train_config_FIXED']['morph_and_role_joint_epochs']==24
          assert r['output_gate']==0 and not r['candidate_accepted'] and not r['activation_allowed']
          tensor=load_file(str(p))
          assert sum(v.numel() for v in tensor.values())==28887
          assert all(k.startswith('model.nra3_neural_weights.') for k in tensor)
          assert any('morph_upos' in k for k in tensor) and any('mini_areas' in k for k in tensor)
          for kind in ('S98_random_untrained_same_Taiga_B_INTERNAL_DIAG','S99_trained_same_Taiga_B_INTERNAL_DIAG','S99_trained_Taiga_B_TRAIN_ONLY'):
            m=r[kind]
            for f in m['per_original_BPE_UD_morph_tag_accuracy'].values():
              assert f['support']>=0
              if f['accuracy'] is not None:
                assert math.isfinite(f['accuracy']) and 0<=f['accuracy']<=1
          print('S99_TRAIN_RESULT_NONINDEPENDENT',r['S99_trained_same_Taiga_B_INTERNAL_DIAG'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-nra3-s99-true12-TaigaTRAINb-morph10-roles24-INmodel28887-FP16-GATE0-RESEARCH
          path: results/calibri_nra3_s99_REAL12_TaigaB_morph_28887/
          retention-days: 30
          if-no-files-found: error
