name: CALIBRI S61 CPU native free-answer parity after lossless entropy decode
'on':
  pull_request:
    types: [synchronize]
    branches:
      - research/calibri2-s60-geometry-audit-20261109
    paths:
      - 'research/calibri2/s61/**'
      - '.github/workflows/calibri2-s61-cpu-native-parity.yml'
permissions:
  contents: read
  actions: read
jobs:
  cpu_full_answer_and_sample_speed:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s61-physical-entropy-cpu-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only PyTorch and tokenizer for actual S56 native free-answer test
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Fetch sealed S45 source exactly
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Fetch S56 original trained Green Tunnel
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Fetch actual accepted S61 physically compressed output from previous run
        uses: actions/download-artifact@v4
        with:
          name: calibri-s61-real-physical-entropy-and-cold-cpu
          path: inputs/s61
          run-id: 42528473858
          github-token: ${{ github.token }}
      - name: Compare REAL autoregressive S56 physical model outputs and CPU timing
        run: |
          python research/calibri2/s61/cpu_native_greedy_parity.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s61/S61_SOURCE_EXACT_ZLIB_CB59.s61 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            results/s61/S61_REAL_GREEDY_CPU_PARITY.json
      - name: Preserve actual full token parity, CPU speed even when negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s61-actual-model-CPU-greedy-and-speed
          path: results/s61/
          if-no-files-found: warn
          retention-days: 90
