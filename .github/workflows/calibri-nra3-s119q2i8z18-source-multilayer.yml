name: Calibri S119q2i8z18 precommit new 28TRAIN14DEV with physical h320 L3 L7 L11 fixed mix contract
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z17-physical-lowrank64-rerank-vs-greedy-20261123
permissions:
  contents: read
jobs:
  prereg-source-and-selected-layer-contract-no-physical43m:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z18-new28train14dev-multilayer-source-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only tensor operations; no model and no credentials
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify locked new RU author data plus no-grad original layer captures
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z18_source_and_multilayer_contract
      - name: Fail closed exactly four new research files and no LIVE
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/z18scope
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z18_fresh28train14dev_multilayer_source.py' -e 'research/calibri_nra3/s119q2i8z18_multilayer_h320_contract.py' -e 'research/calibri_nra3/test_s119q2i8z18_source_and_multilayer_contract.py' -e '.github/workflows/calibri-nra3-s119q2i8z18-source-multilayer.yml' /tmp/z18scope; then
            echo "Protected original or LIVE file scope forbidden" >&2
            exit 1
          fi
          test $(wc -l < /tmp/z18scope) -eq 4
