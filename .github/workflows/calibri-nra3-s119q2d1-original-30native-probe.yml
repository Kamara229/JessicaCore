name: Calibri S119q2d1 physical FROZEN ORIGINAL 43M GT 30 matched native probes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2d-deeper-joint-multitoken-train-20261122
permissions:
  contents: read
  actions: read
jobs:
  compare-same-30-source-only-native-prompts-to-actual-original:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2d1-frozen-original-source-baseline-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '119134'
    steps:
      - name: Checkout research-only source baseline without deploy credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original exact S142 CPU package versions
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: No GOLD previous original onepass safety and source baseline tests
        run: |
          python -m unittest -v \
            research.calibri_nra3.test_s119a_hard_four_goals \
            research.calibri_nra3.test_s119q2a_train_source_manifest \
            research.calibri_nra3.test_s119q2c1_counterfactual_native \
            research.calibri_nra3.test_s119q2d_deeper_joint_native_answer_training \
            research.calibri_nra3.test_s119q2d1_original_sameprobe_baseline
      - name: Original S93 compressed Core12 and GreenTunnel research only
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          run-id: 42681768394
          path: inputs/s93
          github-token: ${{ github.token }}
      - name: Original S142 43M+GT FP16 trained core
        uses: actions/download-artifact@v4
        with:
          name: calibri-s142-one-j7-43m-dual-cone-456-128-no-QA
          run-id: 43078895081
          path: inputs/s142
          github-token: ${{ github.token }}
      - name: Only previously authored q2a SHA-bound TRAIN/CAL source
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2a-authored-72train-18calib-provenance-only-gate0
          run-id: 44954979903
          path: inputs/s119q2a
          github-token: ${{ github.token }}
      - name: The ACTUAL complete previous q2d 96x4 trained contextual/local A-B report
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2d-deeper-joint-native-96train-4epochs-original43m-GT-gate0
          run-id: 45014239436
          path: inputs/s119q2d
          github-token: ${{ github.token }}
      - name: Fail closed on any protected GOLD, historical EVAL, or missing A-B physical proofs
        run: |
          set -euo pipefail
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors
          test -f inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors
          test -f inputs/s119q2a/S119Q2A_MANIFEST.json
          test -f inputs/s119q2a/S119Q2A_TRAIN.jsonl
          test -f inputs/s119q2a/S119Q2A_CALIBRATION.jsonl
          test -f inputs/s119q2d/S119Q2D_DEEPER_REAL43M_GT_96TRAIN4EPOCH_NATIVE_POSITION_ABLATION.json
          test -f inputs/s119q2d/S119Q2D_DEEPER_CONTEXTUAL_NATIVE_96TRAIN4EPOCH_GATE0_FP16.safetensors
          test -f inputs/s119q2d/S119Q2D_DEEPER_LOCAL_NATIVE_96TRAIN4EPOCH_GATE0_FP16.safetensors
          if find inputs -type f | grep -Ei 'S116|S117|S118|SynTagRusB|GOLD_LABEL|_UD_GOLD|EVAL128|DEV|APK'; then
            echo "Protected GOLD or spent evaluation must not be loaded" && exit 1
          fi
      - name: Physically score SAME 30 native BPE prompts via untouched original Core12 GT
        run: |
          python -m research.calibri_nra3.s119q2d1_real_original_sameprobe_baseline \
            --s93 inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            --side inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            --s142 inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors \
            --q2a-dir inputs/s119q2a \
            --q2d-dir inputs/s119q2d \
            --out results/s119q2d1_real_original_source_baseline
      - name: Report original vs trained A-B without changing weights, no deployment
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q2d1-frozen-original-30native-source-match-gate0
          path: results/s119q2d1_real_original_source_baseline/
          retention-days: 30
          if-no-files-found: error
