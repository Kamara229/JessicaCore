name: CALIBRI v131 EOS collapse root-cause (frozen native core)
on:
  pull_request:
    paths:
      - 'research/calibri/v131/**'
      - 'research/calibri/test_v131_probe.py'
      - '.github/workflows/calibri-pro-max-v131.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native_head_forensics:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
      GREEN: inputs/green/GreenTunnel_shared_10MB_6gates.safetensors
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v122-frozen-10mb-shared-gate-policy-real-135m
          path: inputs/green
          run-id: 41828640085
          github-token: ${{ github.token }}
      - name: Check strict token rank and protocol before inspecting model
        run: python -m unittest test_v131_probe -v
      - name: Inspect first-token EOS, head bias and host-specific Green gates
        run: python -m v131.run "$HOST" "$GREEN" results/v131
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v131-frozen-eos-head-ablation
          path: results/v131/
          if-no-files-found: warn
          retention-days: 30
