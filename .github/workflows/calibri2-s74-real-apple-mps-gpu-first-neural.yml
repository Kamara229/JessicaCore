name: CALIBRI S74 REAL Apple MPS GPU gradients old skills protected
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-s73-neural-first-token-new-train-20261109
permissions:
  contents: read
  actions: read
jobs:
  s74_mps_real_gpu_gradients_cpu_greedy_guard:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s74-real-mps-gpu-training-20261109'
    runs-on: macos-15
    timeout-minutes: 100
    env:
      PYTHONPATH: research:research/calibri
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '730073'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Verify research-only source and deny ALL previous QA imports
        run: |
          python -m compileall -q research/calibri2/s74
          if grep -E '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72)' research/calibri2/s74/*.py; then exit 1; fi
      - name: Install ARM64 PyTorch with Metal GPU backend
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: HARD REQUIRE real physical Apple Metal GPU and tensor backprop
        run: |
          python - <<'PY'
          import json,platform,torch
          if platform.machine()!='arm64' or not torch.backends.mps.is_available():
              raise SystemExit('NO REAL ARM64 MPS GPU: refuse CPU fallback')
          q=torch.randn((320,320),device='mps',requires_grad=True)
          value=(q@q.T).square().mean()
          value.backward()
          torch.mps.synchronize()
          if q.grad is None or q.grad.device.type!='mps':
              raise SystemExit('GPU backward not executed')
          print(json.dumps({'event':'S74_REAL_GPU_MPS_BACKPROP_CONFIRMED',
              'platform':platform.platform(),'device':'mps','torch':torch.__version__,
              'torch_mps_available':True,'grad_device':q.grad.device.type}),flush=True)
          PY
      - name: Download original immutable physically compressed 36M model
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Download original fully paid physical compressed envelope
        uses: actions/download-artifact@v4
        with:
          name: calibri-s61-real-physical-entropy-and-cold-cpu
          path: inputs/s61
          run-id: 42528473858
          github-token: ${{ github.token }}
      - name: Download bitwise frozen S67 rank128 baseline
        uses: actions/download-artifact@v4
        with:
          name: calibri-s67-fully-paid-new-safe-half-delta-research-only
          path: inputs/s67
          run-id: 42532945010
          github-token: ${{ github.token }}
      - name: Download bitwise frozen S71 neural context mixer and physical manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri-s71-conditional-neural-tunnel-train-only-outcomes
          path: inputs/s71
          run-id: 42536011124
          github-token: ${{ github.token }}
      - name: REAL MPS GPU train 10561 parameters with frozen 36M and FULL CPU answer safeguards
        run: |
          python research/calibri2/s74/real_apple_mps_gpu_first_token_training.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s67/S67_HALF_DELTA_RANK128_CANDIDATE_ONLY.safetensors \
            inputs/s71/S71_CONTEXT_NEURAL_PAID_CANDIDATE_ONLY.safetensors \
            inputs/s71/S71_ALL_BYTES_PAID_NEURAL_GATE_MANIFEST.json \
            inputs/s61/S61_SOURCE_EXACT_ZLIB_CB59.s61 \
            results/s74
      - name: Archive real GPU gradient and TRAIN-only CPU full-answer checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s74-real-MPS-GPU-gradients-and-CPU-full-skill-TRAIN-guards
          path: results/s74/
          if-no-files-found: warn
          retention-days: 90
