name: CALIBRI S159 parallel shared-span slot decoder contracts (research only)
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s158-targeted-retention-mps-j7-20261112
permissions:
  contents: read
  actions: read
concurrency:
  group: calibri2-s159-parallel-slot-binding-contracts
  cancel-in-progress: false
jobs:
  s159_cpu_parallel_slot_contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s159-parallel-slot-binding-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen S142 and rejected S158 prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43078895081 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43232585090 --jq .conclusion)" = success
          echo "Original S142 immutable. S158 physical skill was rejected and rolled back."
      - name: Install minimal CPU-only PyTorch
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify vectorized slots, binding, gradients and safe original fallback
        run: |
          python -m compileall -q research/calibri2/s159
          python -m unittest -v calibri2.s159.test_parallel_slot_binding
          python - <<'PY'
          from pathlib import Path
          import json
          report={
            "stage":"S159_PARALLEL_SLOT_SOURCE_SPAN_UNIT_CONTRACTS",
            "source_S142_run_id":43078895081,
            "rejected_S158_run_id":43232585090,
            "real_S142_456_128_J7_run":False,
            "new_training_run":False,
            "measured_model_gain":None,
            "measured_paired_CPU_ratio":None,
            "model_accepted":False,
            "QA_TEST_used":False,
            "production_or_LIVE_modified":False,
            "guarded_decoder_default_enabled":False,
            "claim":"Module-only proof of concept; real S142/Green Tunnel integration requires separate physical J7.",
          }
          Path("S159_PARALLEL_SLOT_CONTRACTS.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Preserve research-only contract report
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s159-parallel-slot-contracts-no-training-no-QA
          path: S159_PARALLEL_SLOT_CONTRACTS.json
          if-no-files-found: error
