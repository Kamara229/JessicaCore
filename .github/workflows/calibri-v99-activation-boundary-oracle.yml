name: CALIBRI v99 unpaid FP32 hidden-boundary oracle diagnostic on immutable CB59

on:
  pull_request:
    paths:
      - 'research/calibri/v99/**'
      - 'research/calibri/calibri_activation_rescue_v99.py'
      - 'research/calibri/test_v99_patch_guard.py'
      - 'research/calibri/SESSION_99_TEMPORARY_ORACLE_BOUNDARY_CAUSALITY.md'
      - '.github/workflows/calibri-v99-activation-boundary-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  read_only_original_hidden_causal_patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public pretrained CPU-only research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Unit check never mutate original native trained weights or leave hooks
        run: |
          python -m compileall -q research/calibri/v99 research/calibri/calibri_activation_rescue_v99.py research/calibri/test_v99_patch_guard.py
          python research/calibri/test_v99_patch_guard.py -v
      - name: Verify immutable historically archived CB59 weight source
        run: |
          mkdir -p input results/v99
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Run purely diagnostic exact reference activation transplants and real text
        run: |
          python research/calibri/calibri_activation_rescue_v99.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --locked research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v99
          test -s results/v99/v99_FP32_hidden_boundary_oracles_vs_CB59_actual_greedy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v99-frozen-native-exact-activation-boundary-rescue-diagnosis
          path: results/v99/v99_FP32_hidden_boundary_oracles_vs_CB59_actual_greedy.json
          retention-days: 7
          if-no-files-found: ignore
