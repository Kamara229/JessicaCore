name: Calibri Fusion Growth F18 frozen retention attribution
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f17-packed-cpu-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f18:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f18-retention-attribution-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only 104b8eabdd566daaf8f3c7a9e0f8d8db2a93e53a HEAD >/tmp/f18scope
          test "$(wc -l </tmp/f18scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f18_retention_attribution.py' -e '.github/workflows/calibri-fusion-growth-f18.yml' /tmp/f18scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          run-id: 45668506574
          path: inputs/f01
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f06-integrated-recovery-G0
          run-id: 45670574673
          path: inputs/f06
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f13-profile-rebase-G0
          run-id: 45674636032
          path: inputs/f13
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f15-legacy-J7-G0
          run-id: 45675368249
          path: inputs/f15
          github-token: ${{ github.token }}
      - name: Frozen rate and GT ablations on verified historical baseline
        run: python research/calibri2/fusion_growth/f18_retention_attribution.py --f01 inputs/f01 --f06 inputs/f06 --f08 inputs/f08 --f13 inputs/f13 --f15 inputs/f15 --out results/f18
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f18-retention-attribution-G0
          path: results/f18/
          retention-days: 30
          if-no-files-found: error
