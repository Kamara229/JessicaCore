name: Calibri Z87 GPT shared short-word training curriculum native preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z86-GPT-balanced-physical-20261124
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z87-GPT-short-word-curriculum-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict three-file scope
        run: |
          set -euo pipefail
          git diff --name-only 2d5ee9a93d2f8c24af062315e2c58fe73c3a1ee5 HEAD >/tmp/z87scope
          test "$(wc -l </tmp/z87scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z87_short_word_curriculum.py' -e 'research/calibri_nra3/test_s119q2i8z87_short_word_curriculum.py' -e '.github/workflows/calibri-nra3-s119q2i8z87-short-word.yml' /tmp/z87scope; then exit 1; fi
      - name: Install CPU tokenizer dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify exact TRAIN source, shared targets and original native bytes
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z87_short_word_curriculum
          python -m research.calibri_nra3.s119q2i8z87_short_word_curriculum
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q2i8z87-GPT-short-word-native-preflight-G0
          path: results/z87/
          if-no-files-found: error
