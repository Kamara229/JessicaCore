name: Calibri S119h unified R pre-core and T post-core identity / gradients
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119g-unified-core-gt-nra3-action-planning-area-20261121
permissions:
  contents: read
  actions: read
jobs:
  research-mathematical-r-core-t-with-full-nra-and-planner:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s119h-precore-representation-postcore-transformation-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Checkout isolated research-only head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU research libraries
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5'
      - name: Hard four goals + existing joint contracts + new real R-T placement mock
        run: |
          python -m unittest -v \
            research.calibri_nra3.test_s119a_hard_four_goals \
            research.calibri_nra3.test_s119f_unified_core_gt_reasoning_joint \
            research.calibri_nra3.test_s119g_unified_planning_internal_action_neural_area \
            research.calibri_nra3.test_s119h_precore_representation_postcore_transformation
      - name: Download genuine previous 116777 unified S119g physical FP16 model
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119g-unified-original12-core-nra3-NPA1-recurrent-internal-actions-TRAIN-A-NOGOLD-GATE0
          run-id: 44881304043
          path: inputs/s119g
          github-token: ${{ github.token }}
      - name: Verify source-only model artifact paths and reject independent GOLD
        run: |
          set -euo pipefail
          test -f inputs/s119g/CALIBRI_S119G_CORE_NRA3_NPA1_UNIFIED_TRAINONLY_FP16_SHADOW.safetensors
          test -f inputs/s119g/CALIBRI_S119G_TRAIN_A_REAL12_NEW_NPA1_SINGLE_JOINT_LOSS_NO_GOLD.json
          test "$(find inputs/s119g -type f | wc -l)" -eq 2
          if find inputs -type f | grep -Ei 'S116|S117|S118|GOLD_LABEL|_UD_GOLD|SynTagRusB|EVAL128'; then
            echo 'GOLD or spent eval forbidden' && exit 1
          fi
      - name: Train SYNTHETIC R-core-T+NRA+NPA joint gradient, original 53751 immutable
        run: |
          python -m research.calibri_nra3.s119h_precore_representation_postcore_transformation \
            --prior inputs/s119g/CALIBRI_S119G_CORE_NRA3_NPA1_UNIFIED_TRAINONLY_FP16_SHADOW.safetensors \
            --prior-report inputs/s119g/CALIBRI_S119G_TRAIN_A_REAL12_NEW_NPA1_SINGLE_JOINT_LOSS_NO_GOLD.json \
            --out results/S119h_R_core_T_research
      - name: Archive FULL model child with both areas not accepted, no deployment
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s119h-R-before-core-T-after-core-fourmathslots-NPA1-fullNRA3-synthetic-gradient-only-gate0-NOGOLD
          path: results/S119h_R_core_T_research/
          if-no-files-found: error
          retention-days: 30
