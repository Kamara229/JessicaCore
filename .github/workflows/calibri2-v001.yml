name: CALIBRI 2.0 v001 real from-scratch 135M paid-codebook source
on:
  push:
    branches:
      - 'research/calibri2-v001-from-scratch-135m-paid-weights'
    paths:
      - 'research/calibri2/**'
      - '.github/workflows/calibri2-v001.yml'
  pull_request:
    branches:
      - 'research/calibri-v231-heldout-fp32-v228-five-task-answer-benchmark'
    types: [opened, synchronize, reopened]
    paths:
      - 'research/calibri2/**'
      - '.github/workflows/calibri2-v001.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  new_random_135m_model_0_7bpp_packed_and_train_smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 230
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU packages without pretrained model weights
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Source syntax before random source construction
        run: |
          python -m compileall -q research/calibri2/v001
      - name: Independently construct real random 135M CB59 archive then train 211 paid dictionaries on TRAIN only
        run: |
          python research/calibri2/v001/run.py results/calibri2/v001 --steps 4
      - name: Upload physically packed random and trained archive and literal diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-v001-FROM-SCRATCH-135M-real-physical-initial-and-trained
          path: results/calibri2/v001/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
