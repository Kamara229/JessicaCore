name: CALIBRI S56 physically paid FIRST token Green Tunnel <=0.7bpp
on:
  push:
    branches:
      - research/calibri2-s56-first-token-paid-green-tunnel-20261108
    paths:
      - 'research/calibri2/s56/**'
      - '.github/workflows/calibri2-s56-paid-first-token-protected.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  s56_train_only_paid_first_token_green_tunnel:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile S56 only, no original sealed/previously inspected QA
        run: python -m compileall -q research/calibri2/s56
      - name: Download exact immutable S45 physically packed neural core
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Download exact S54 accepted paid rank12 neural controller
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s54-paid-controller-if-accepted
          path: inputs/s54
          run-id: 42516715008
          github-token: ${{ github.token }}
      - name: Download exact S54 accepted physical manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s54-distinct-TRAIN-64-full-answers-protection-JSON
          path: inputs/s54_report
          run-id: 42516715008
          github-token: ${{ github.token }}
      - name: Train physically paid first-token rank2 gate on original/new TRAIN only
        run: |
          python research/calibri2/s56/paid_first_token_rank2_while_preserving_s54.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s54/S54_ACTIVE_GREEN_TUNNEL_RANK12.safetensors \
            inputs/s54_report/S54_ALL_INCLUSIVE_PHYSICAL_MANIFEST.json \
            results/s56
      - name: Preserve actual training evidence regardless of acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s56-first-token-paid-TRAIN-and-physical-report-JSON
          path: results/s56/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Export controller ONLY if accepted and reloaded with CPU guard
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: results/s56/*.safetensors
          if-no-files-found: warn
          retention-days: 60
