name: CALIBRI S59 CPU continuity: physical S58 guarded training
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-s59-gpu-cpu-portable-20261109
permissions:
  contents: read
  actions: read
jobs:
  s58_cpu_protected_resume_without_gpu:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s59-cpu-continuation-once-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only toolchain without GPU assumptions
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Syntax check recovered S58 research only
        run: python -m compileall -q research/calibri2/s58
      - name: Load real physically compressed S45 weights
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Load accepted S56 paid Green Tunnel
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Load sealed S56 physical manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-first-token-paid-TRAIN-and-physical-report-JSON
          path: inputs/s56_report
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Re-run physically guarded S58 TRAIN-only research with CPU, never Kaggle
        run: |
          python research/calibri2/s58/frozen_first_replay_protected_paired_noun.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s56_report/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL_MANIFEST.json \
            results/s58_cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-s59-cpu-continuation-s58-actual-report
          path: results/s58_cpu/*.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: calibri-s59-cpu-continuation-paid-controller-if-accepted
          path: results/s58_cpu/*.safetensors
          if-no-files-found: ignore
          retention-days: 60
