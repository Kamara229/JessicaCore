name: CALIBRI2 S26 freeze unseen noun transfer QA BEFORE training
on:
  push:
    branches: ['research/calibri2-s26-precommitted-transfer-qa-20261108']
    paths:
      - 'research/calibri2/s26/**'
      - '.github/workflows/calibri2-s26-precommit-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze_fresh_96_and_48_controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      PYTHONPATH: research
      PYTHONHASHSEED: '2126'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and validate 8 reserved heldout combinations, disjoint TRAIN
        run: |
          python -m compileall -q research/calibri2/s26
          python - <<'PY'
          from calibri2.s26.spec import allowed_combos, RESERVED, EXTRA_NOUNS
          from calibri2.s26.frozen_new_qa import main_rows, cases, manifest, OPEN_QUESTIONS
          assert len(allowed_combos())==56
          assert not (set(RESERVED) & set(allowed_combos()))
          assert len(RESERVED)==8 and len(EXTRA_NOUNS)==4
          assert len(main_rows())==96 and len(cases())==144
          assert len(OPEN_QUESTIONS)==16
          assert manifest()['frozen_before_S26_training_or_checkpoint_selection']
          print('S26_IMMUTABLE_FRESH_96_QA_48_CONTROLS_16_OPEN_DISJOINT_BEFORE_TRAIN')
          PY
      - name: Write immutable manifest and QA suite SHA
        run: python -m calibri2.s26.frozen_new_qa
      - name: Preserve full frozen QA and all eight reserved combinations
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s26-FROZEN-NEW-96-NOUN-COMPOSITIONS-48-CONTROLS-16OPEN
          path: results/s26/frozen/
          retention-days: 90
