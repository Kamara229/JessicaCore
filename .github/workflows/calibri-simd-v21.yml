name: CALIBRI v0.21 - hardware-specific AVX2 packed5 fused dot
on:
  pull_request:
    paths:
      - 'research/calibri/packed5_avx2_v21.c'
      - 'research/calibri/avx2_v21.py'
      - '.github/workflows/calibri-simd-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avx2-packed-cpu-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile portable + AVX2 dynamic-dispatch CPU references
        run: gcc -O3 -std=c11 -Wall -Wextra -Werror -shared -fPIC -o research/calibri/libpacked5_v21.so research/calibri/packed5_v19.c research/calibri/packed5_rowcache_v20.c research/calibri/packed5_avx2_v21.c
      - name: Install pinned torch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned data/numerical dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Actual trained weights, AVX2 ISA check and latency/numerical controls
        run: python research/calibri/avx2_v21.py --library research/calibri/libpacked5_v21.so --output results/calibri_v21_avx2.json --reps 20
      - name: Save JSON only, never compiled executable or weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v21-avx2-controls
          path: results/calibri_v21_avx2.json
          if-no-files-found: ignore
          retention-days: 14
