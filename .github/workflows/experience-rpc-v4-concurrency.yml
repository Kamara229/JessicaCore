name: Experience RPC v4 Independent-Client Concurrency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/regressionExperienceRpcV4Concurrent.test.js'
      - 'backend/scripts/fixtures/experienceRpcV4RaceCalls.js'
      - 'backend/scripts/fixtures/experienceRpcV4RaceRows.js'
      - 'backend/experience/storage/skillModules/experienceModulePacker.js'
      - '.github/workflows/experience-rpc-v4-concurrency.yml'
permissions:
  contents: read
  statuses: write
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Require private Supabase integration credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Supabase integration secrets are missing; concurrency NOT verified."
            exit 1
          fi
      - name: Run real two-client RPC integration
        id: race_integration
        run: node --test backend/scripts/regressionExperienceRpcV4Concurrent.test.js
      - name: Publish check result as commit status for connected GitHub verifier
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.race_integration.outcome }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          description="RPC v4 two-client integration not confirmed"
          if [ "$TEST_OUTCOME" = "success" ]; then
            state=success
            description="RPC v4 two-client integration passed"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$state" \
            -f context="jessica/rpc-v4-two-client" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
