name: Experience RPC v4 Independent-Client Concurrency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/regressionExperienceRpcV4Concurrent.test.js'
      - 'backend/scripts/fixtures/experienceRpcV4RaceCalls.js'
      - 'backend/scripts/fixtures/experienceRpcV4RaceRows.js'
      - 'backend/experience/storage/skillModules/experienceModulePacker.js'
      - '.github/workflows/experience-rpc-v4-concurrency.yml'
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Require private Supabase integration credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Supabase integration secrets are missing; concurrency NOT verified."
            exit 1
          fi
      - run: node --test backend/scripts/regressionExperienceRpcV4Concurrent.test.js
