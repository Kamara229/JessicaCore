name: CALIBRI v121 Green Tunnel causal gate sensitivity on actual packed 135M
on:
  pull_request:
    paths:
      - 'research/calibri/v121/**'
      - 'research/calibri/test_v121_gates.py'
      - '.github/workflows/calibri-v121-gate-control.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paid-gate-intervention:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Ensure gate's mathematical effect is exact
        run: python -m unittest test_v121_gates -v
      - name: Load immutable real 135M candidate, without training or stealing TEST
        uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: results/v119-source
          run-id: 41822331451
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run 4 preregistered gate programs on real model and measure actual answer changes
        run: python -m v121.experiment results/v119-source/CALIBRI_v119_joint_native_135M.cb118 results/v121
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-v121-gate-sensitivity-real-135m
          path: results/v121/v121_gate_real.json
          retention-days: 30
          if-no-files-found: error
