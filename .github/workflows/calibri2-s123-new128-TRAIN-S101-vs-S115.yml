name: CALIBRI S123 actual S101 vs S115 cross attribute owner binding S122 TRAIN only CPU
'on':
  push:
    branches:
      - research/calibri2-s123-cross-binding-train-diagnostic-20261111
permissions:
  contents: read
  actions: read
concurrency:
  group: calibri-s123-original-physical-new-TRAIN-only
  cancel-in-progress: true
jobs:
  s101_vs_s115_rejected_on_new_training_only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '1230123'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Hard gate original S122 new 128 TRAIN tokenizer validation and S115 physical 456
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/42900014855 --jq .conclusion)" = "success"
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/42886730329 --jq .conclusion)" = "success"
      - name: Install original S101 immutable CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Validate S123 source is TRAIN-only and no inspected QA imports
        run: |
          set -euo pipefail
          python -m compileall -q research/calibri2/s123 research/calibri2/s122
          if grep -RE '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72|s79|s85|s96|s100|s118)' research/calibri2/s123/*.py research/calibri2/s122/*.py; then exit 1; fi
      - name: Original S99 physical source report
        uses: actions/download-artifact@v4
        with:
          name: calibri-s99-unaccepted-full456-physical-neural-noun-copy-CPU
          path: inputs/s99
          run-id: 42705657584
          github-token: ${{ github.token }}
      - name: Original S101 exact KV cache CPU reference
        uses: actions/download-artifact@v4
        with:
          name: calibri-s101-unaccepted-456-full-EOS-KV-cache-CPU-parity-and-speed
          path: inputs/s101
          run-id: 42710297657
          github-token: ${{ github.token }}
      - name: Frozen rejected S115 physical prefill only research artifact
        uses: actions/download-artifact@v4
        with:
          name: calibri-s115-unaccepted-S112-KV-phase-5-masks-real-456-CPU
          path: inputs/s115
          run-id: 42886730329
          github-token: ${{ github.token }}
      - name: S122 AUTHORISED new 128 TRAIN ONLY curriculum aggregate digest
        uses: actions/download-artifact@v4
        with:
          name: calibri-s122-precommitted-64-pair-128-question-original-TRAIN-augmentation-only
          path: inputs/s122
          run-id: 42900014855
          github-token: ${{ github.token }}
      - name: Original S98 neural second token numeric copy selector
        uses: actions/download-artifact@v4
        with:
          name: calibri-s98-unaccepted-MPS-neural-second-token-owner-copy-feasibility
          path: inputs/s98
          run-id: 42704076897
          github-token: ${{ github.token }}
      - name: Original S95 frozen question only neural 3 profile router
        uses: actions/download-artifact@v4
        with:
          name: calibri-s95-unaccepted-prompt-only-router-456-strict-CPU
          path: inputs/s95
          run-id: 42698707784
          github-token: ${{ github.token }}
      - name: Original S94 exact three profile compressed core and Green Tunnel bank
        uses: actions/download-artifact@v4
        with:
          name: calibri-s94-unaccepted-lossless-three-profile-bank-456-TRAIN-feasibility
          path: inputs/s94
          run-id: 42697267843
          github-token: ${{ github.token }}
      - name: Original compressed S93 CB61 and 2 donor Green Tunnel blocks
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          path: inputs/s93
          run-id: 42681768394
          github-token: ${{ github.token }}
      - name: Original S87 original 456 authorized TRAIN profile
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-456-native-source-PyTorch-CPU-TRAIN-protected-audit
          path: inputs/s87_full
          run-id: 42659248083
          github-token: ${{ github.token }}
      - name: Original S91 completed 456 authorized TRAIN profile
        uses: actions/download-artifact@v4
        with:
          name: calibri-s91-full-456-strict-EOS-quality-no-forgetting-and-CPU
          path: inputs/s91_full
          run-id: 42674413574
          github-token: ${{ github.token }}
      - name: Original S93 completed 456 authorized TRAIN profile
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-full-456-strict-union-no-forgetting-and-CPU
          path: inputs/s93_full
          run-id: 42681768394
          github-token: ${{ github.token }}
      - name: Actual original S101 full456 then S122 new128 TRAIN diagnostics S101 versus S115
        run: |
          python research/calibri2/s123/real_s101_s115_s122_train_diagnostic_cpu.py \
            inputs/s98/S98_MPS_TRAINED_NUMERIC_OWNER_COPY_FP16.safetensors \
            inputs/s98/S98_MPS_NEURAL_COPY_FEASIBILITY_REPORT.json \
            inputs/s95/S95_PROMPT_ONLY_HASHED_NEURAL_ROUTER_FP16.safetensors \
            inputs/s95/S95_PROMPT_ROUTER_STRICT_TRAIN_AUDIT.json \
            inputs/s94/S94_ALTERNATE_EXACT_CORE_TUNNEL_BANK.bin \
            inputs/s94/S94_PROFILE_BANK_FEASIBILITY_REPORT.json \
            inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            inputs/s99/S99_ALL456_NEW_NEURAL_COPY_PHYSICAL_TRAIN_AUDIT.json \
            inputs/s101/S101_KV_CACHE_EXACT_S99_456_TRAIN_CPU_GUARD.json \
            inputs/s115/S115_REJECTED_S112_TEMPORAL_GREEN_TUNNEL_REPORT.json \
            inputs/s115/S115_UNACCEPTED_prefill_only_S93_SIDECAR.safetensors \
            inputs/s115/S115_UNACCEPTED_prefill_only_RUNTIME_CONFIG.json \
            inputs/s122/S122_TRAIN_ONLY_CROSS_BINDING_CURRICULUM_REPORT.json \
            inputs/s87_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s91_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s93_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            results/s123
      - name: Preserve aggregate original TRAIN diagnostics never claim new QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s123-actual-S101-vs-S115-new-S122-128-TRAIN-diagnostic
          path: results/s123/
          retention-days: 90
          if-no-files-found: warn
