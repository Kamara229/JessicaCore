name: Calibri Z92 transfer source-only fail-closed preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z91-GPT-matched-context-curriculum-20261124
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z92-GPT-word-transfer-gate-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict four-file scope
        run: |
          set -euo pipefail
          git diff --name-only 3768e63b58bdb507f4d45e2234fed15d99ad1c92 HEAD >/tmp/z92scope
          test "$(wc -l </tmp/z92scope)" -eq 4
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z92_transfer_guard.py' -e 'research/calibri_nra3/s119q2i8z92_physical_word_transfer.py' -e 'research/calibri_nra3/test_s119q2i8z92_transfer_guard.py' -e '.github/workflows/calibri-nra3-s119q2i8z92-transfer-preflight.yml' /tmp/z92scope; then exit 1; fi
      - name: Install CPU imports
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Check source and missing-pins rejection ONLY, no DEV scoring
        run: |
          python -m py_compile research/calibri_nra3/s119q2i8z92_physical_word_transfer.py research/calibri_nra3/s119q2i8z92_transfer_guard.py
          python -m unittest -v research.calibri_nra3.test_s119q2i8z92_transfer_guard
