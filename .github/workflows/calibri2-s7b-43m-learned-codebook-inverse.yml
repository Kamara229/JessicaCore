name: CALIBRI S7B 43M trained codebook inverse of FP32 weights with exact GT12
'on':
  push:
    branches:
      - 'research/calibri2-s7b-43m-preserve-learned-codebooks-20261117'
    paths:
      - 'research/calibri2/s7b_43m_learned_dictionary/**'
      - '.github/workflows/calibri2-s7b-43m-learned-codebook-inverse.yml'
  workflow_dispatch:
concurrency:
  group: calibri2-S7B-working43M-trained-dictionary-inverse
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  real_working43m_FP32_to_original_trained_5bit_inverse:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '43071217'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact original FP32 S142 and CB61/G-T CPU stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Static and original 43.26M growth original GT contracts
        run: |
          python -m compileall -q research/calibri2/s7b_43m_learned_dictionary
          python -m unittest calibri2.s132.test_growth_schedule calibri2.s142.test_dual_cone_adam -v
      - name: Original immutable 43.26M working S142 physical FP16 learned checkpoint
        uses: actions/download-artifact@v4
        with:
          name: calibri-s142-one-j7-43m-dual-cone-456-128-no-QA
          run-id: 43078895081
          path: input/s142
          github-token: ${{ github.token }}
      - name: Actual original S93 trained 12x320 36.38M base CB61 and existing real GT
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          run-id: 42681768394
          path: input/s93
          github-token: ${{ github.token }}
      - name: Original physically validated S94 three-profile bank
        uses: actions/download-artifact@v4
        with:
          name: calibri-s94-unaccepted-lossless-three-profile-bank-456-TRAIN-feasibility
          run-id: 42697267843
          path: input/s94
          github-token: ${{ github.token }}
      - name: Original physically trained S95 prompt router
        uses: actions/download-artifact@v4
        with:
          name: calibri-s95-unaccepted-prompt-only-router-456-strict-CPU
          run-id: 42698707784
          path: input/s95
          github-token: ${{ github.token }}
      - name: Original physically trained S98 context second-token copier
        uses: actions/download-artifact@v4
        with:
          name: calibri-s98-unaccepted-MPS-neural-second-token-owner-copy-feasibility
          run-id: 42704076897
          path: input/s98
          github-token: ${{ github.token }}
      - name: Physically reconstruct new CB61 via original 43M learned 5bit codebooks FROM FP32 mirror, zero archived indices used
        run: |
          python research/calibri2/s7b_43m_learned_dictionary/learned_codebook_inverse.py \
            input/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            input/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            input/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors \
            input/s94/S94_ALTERNATE_EXACT_CORE_TUNNEL_BANK.bin \
            input/s94/S94_PROFILE_BANK_FEASIBILITY_REPORT.json \
            input/s95/S95_PROMPT_ONLY_HASHED_NEURAL_ROUTER_FP16.safetensors \
            input/s95/S95_PROMPT_ROUTER_STRICT_TRAIN_AUDIT.json \
            input/s98/S98_MPS_TRAINED_NUMERIC_OWNER_COPY_FP16.safetensors \
            input/s98/S98_MPS_NEURAL_COPY_FEASIBILITY_REPORT.json \
            results/S7B_original_S142_43M_learned_codebook_inverse/
      - name: Preserve real recompressed 12layer model and complete logit/hidden/token comparison including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-S7B-working43M-FP32-learned-codebook-inverse-GT12
          path: results/S7B_original_S142_43M_learned_codebook_inverse/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
