name: CALIBRI 2.0 S0 physically paid small-first architecture and native whole-model smoke
on:
  push:
    branches:
      - 'research/calibri2-s0-small-first-paid-architecture'
    paths:
      - 'research/calibri2/s0/bootstrap.py'
      - '.github/workflows/calibri2-s0-bootstrap.yml'
      - 'research/calibri2/s0/diagnose_collapse.py'
      - 'research/calibri2/s0/one_pair_learnability.py'
      - 'research/calibri2/s1/color_replay.py'
      - 'research/calibri2/s2/benchmark_1024.py'
      - 'research/calibri2/s2/capacity_ladder.py'
  pull_request:
    branches:
      - 'research/calibri2-v001-from-scratch-135m-paid-weights'
    types: [opened, synchronize, reopened]
    paths:
      - 'research/calibri2/s0/bootstrap.py'
      - '.github/workflows/calibri2-s0-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  create_random_tiny_valid_physical_source:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Python packages
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile S0 source, no pretrained model weights
        run: python -m compileall -q research/calibri2/s0/bootstrap.py
      - name: Build the smallest authentic <=0.7bpp source by physical rate only, native C whole model
        run: python research/calibri2/s0/bootstrap.py results/calibri2/s0/bootstrap
      - name: Upload physical model and frozen architectural details
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s0-random-small-physically-paid-native-bootstrap
          path: results/calibri2/s0/bootstrap/
          retention-days: 45
          compression-level: 0
          if-no-files-found: warn
      - name: Download frozen initial 22M source
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s0-random-small-physically-paid-native-bootstrap
          path: inputs/s0random
          run-id: 42366228524
          github-token: ${{ github.token }}
      - name: Download the original finished 64-step compact TRAIN checkpoints
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s0-22M-64step-paid-TRAIN-source-and-real-answers
          path: inputs/s0trained
          run-id: 42366424415
          github-token: ${{ github.token }}
      - name: Compare gold-token rank and opposing-pair logits at 0 16 32 48 64 on frozen TRAIN only
        run: python research/calibri2/s0/diagnose_collapse.py inputs/s0random/CALIBRI2_S0_RANDOM_INITIAL.cb59 inputs/s0trained results/calibri2/s0/diagnosis
      - name: Preserve full five-checkpoint logit trajectory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s0-5-snapshot-16-TRAIN-logit-collapse
          path: results/calibri2/s0/diagnosis/
          if-no-files-found: warn
          retention-days: 45
      - name: Compare one frozen contradictory TRAIN pair with paid centroids-only vs centroids-and-5bit from same random source
        run: python research/calibri2/s0/one_pair_learnability.py inputs/s0random/CALIBRI2_S0_RANDOM_INITIAL.cb59 results/calibri2/s0/one_pair
      - name: Preserve real 64-step paired microfit diagnostics and paid physical archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s0-one-TRAIN-pair-64step-5bit-vs-centroids-only
          path: results/calibri2/s0/one_pair/
          if-no-files-found: warn
          retention-days: 45
          compression-level: 0
      - name: Download frozen S0 128-step physically trained Yes-No model
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s0-one-TRAIN-pair-64step-5bit-vs-centroids-only
          path: inputs/s0learned
          run-id: 42368307719
          github-token: ${{ github.token }}
      - name: Diagnose whether red-blue training forgets Yes-No without TRAIN rehearsal
        run: python research/calibri2/s1/color_replay.py inputs/s0learned/CALIBRI2_S0_centroids_and_5bit_128steps.cb59 results/calibri2/s1/color_replay
      - name: Preserve both S1 physically paid models and exact TRAIN responses before and after reload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s1-one-color-pair-replay-vs-forgetting-128-steps
          path: results/calibri2/s1/color_replay/
          if-no-files-found: warn
          retention-days: 45
          compression-level: 0
      - name: Download S1 successfully rehearsed compact model (4 of 4 TRAIN answers)
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s1-one-color-pair-replay-vs-forgetting-128-steps
          path: inputs/s1replay
          run-id: 42369747578
          github-token: ${{ github.token }}
      - name: Compile and execute frozen 960 heldout objective + 64 freeform large QA test
        run: |
          python -m compileall -q research/calibri2/s2/benchmark_1024.py
          python research/calibri2/s2/benchmark_1024.py inputs/s1replay/CALIBRI2_S1_balanced_rehearsal_128paid_steps.cb59 results/calibri2/s2/large-test --label S1_22M_4TRAIN
      - name: Upload actual 1024 large-test responses and scored heldout outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s2-960-HELDOUT-plus-64-open-text-real-answers
          path: results/calibri2/s2/large-test/
          retention-days: 45
          if-no-files-found: warn
          compression-level: 9
      - name: Compile and run predeclared 22M 4-to-8-to-24 TRAIN pair capacity ladder
        run: |
          python -m compileall -q research/calibri2/s2/capacity_ladder.py
          python research/calibri2/s2/capacity_ladder.py inputs/s1replay/CALIBRI2_S1_balanced_rehearsal_128paid_steps.cb59 results/calibri2/s2/capacity
      - name: Upload physical learned S2 22M checkpoints, TRAIN answers, and full learning curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s2-22M-1920-train-step-4-8-24-pair-capacity-ladder
          path: results/calibri2/s2/capacity/
          retention-days: 45
          if-no-files-found: warn
          compression-level: 0
      - name: Run same frozen independent 960 QA plus 64 freeform after S2 training
        run: |
          python research/calibri2/s2/benchmark_1024.py results/calibri2/s2/capacity/CALIBRI2_S2_24pairs_48answers_22M_paid.cb59 results/calibri2/s2/large-test-after --label S2_22M_48TRAIN
      - name: Upload real S2 heldout QA and actual open-ended responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s2-after-1920steps-960-HELDOUT-plus-64-open-text
          path: results/calibri2/s2/large-test-after/
          retention-days: 45
          if-no-files-found: warn
          compression-level: 9
