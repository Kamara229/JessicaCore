name: CALIBRI v0.19 - true packed INT5 residual CPU operator
on:
  pull_request:
    paths:
      - 'research/calibri/packed5_v19.c'
      - 'research/calibri/packed_native_v19.py'
      - '.github/workflows/calibri-packed-v19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-packed-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile native C bit-packed INT5 matvec (CPU x86 research only)
        run: gcc -O3 -std=c11 -Wall -Wextra -Werror -shared -fPIC -o research/calibri/libpacked5_v19.so research/calibri/packed5_v19.c
      - name: Install pinned CPU Torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned model/data packages
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Validate direct packed 5-bit C + TT on real weights, CPU latency
        run: python research/calibri/packed_native_v19.py --library research/calibri/libpacked5_v19.so --output results/calibri_v19_packed_native.json --eval-tokens 1024
      - name: Upload metrics only (never compiled binary or model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v19-packed-native-results
          path: results/calibri_v19_packed_native.json
          if-no-files-found: ignore
          retention-days: 14
