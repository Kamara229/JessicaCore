name: NRA2 S3J real tokenizer-only entity span alignment preflight
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra2-s3i-factors-64train-20261114
permissions:
  contents: read
concurrency:
  group: nra2-s3j-real-tokenizer-offsets-preflight
  cancel-in-progress: false
jobs:
  s3j_true_frozen_tokenizer_entity_binding_preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3j-explicit-entity-binding-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: .:research:research/calibri
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed mention masks and exact S3G prompt digest without graph labels
        run: |
          python -m unittest -v research.nra2_bridge.test_stage3g_factorized_graph_controls research.nra2_bridge.test_stage3j_token_entity_alignment
      - name: Install tokenizer only, never download 43M model weights
        run: |
          python -m pip install 'transformers==4.46.3' 'tokenizers==0.20.3' 'huggingface-hub>=0.26,<1' 'jinja2==3.1.6'
      - name: Validate ALL 128 prompts on authentic pinned original frozen S160 tokenizer, no labels
        run: |
          python - <<'PY'
          import ast,json
          from pathlib import Path
          from transformers import AutoTokenizer
          from research.nra2_bridge.stage3g_factorized_graph_controls import build_rows
          from research.nra2_bridge.stage3j_token_entity_alignment import validate_without_gold
          source=ast.parse(Path("research/calibri/binary_geometry_v64.py").read_text())
          constants={}
          for stmt in source.body:
              if isinstance(stmt,ast.Assign) and len(stmt.targets)==1 and isinstance(stmt.targets[0],ast.Name):
                  if stmt.targets[0].id in {"MODEL","MODEL_SHA"}:
                      constants[stmt.targets[0].id]=ast.literal_eval(stmt.value)
          assert set(constants)=={"MODEL","MODEL_SHA"}
          assert constants["MODEL"]=="HuggingFaceTB/SmolLM2-135M-Instruct"
          assert constants["MODEL_SHA"]=="12fd25f77366fa6b3b4b768ec3050bf629380bac"
          tok=AutoTokenizer.from_pretrained(constants["MODEL"],revision=constants["MODEL_SHA"],use_fast=True)
          assert tok.is_fast, "S3J requires exact fast-tokenizer offsets; never guess"
          rows=build_rows()
          aligned=validate_without_gold(tok,[r.question for r in rows])
          assert len(aligned)==128
          assert all(a["prompt_sha256"]==r.prompt_sha256 for a,r in zip(aligned,rows))
          assert all(2<=len(a["node_identities_present"])<=6 for a in aligned)
          assert all(0<sum(any(y) for y in a["mention_mask"])<=a["tokens"] for a in aligned)
          assert all(set(a)=={"prompt_sha256","input_ids","mention_mask","mentions","tokens","node_identities_present"} for a in aligned)
          print("S3J_REAL_TOKENIZER_128_PROMPTS_OFFSET_BINDING_NO_LABELS_SUCCESS",
                json.dumps({"token_lengths":[min(a["tokens"] for a in aligned),max(a["tokens"] for a in aligned)],
                            "total_mentions":sum(len(a["mentions"]) for a in aligned),
                            "model_weights_downloaded":False,
                            "graph_gold_used":False,
                            "live_or_model_changed":False}))
          PY
