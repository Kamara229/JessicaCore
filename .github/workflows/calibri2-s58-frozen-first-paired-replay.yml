name: CALIBRI S58 frozen FIRST paid Green Tunnel, paired noun EOS replay
on:
  push:
    branches:
      - research/calibri2-s58-frozen-first-paired-noun-replay-20261108
    paths:
      - 'research/calibri2/s58/**'
      - '.github/workflows/calibri2-s58-frozen-first-paired-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  s58_paid_later_train_preserve_all_69_and_old7:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU inference and training libraries
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Syntax check S58 separate research only
        run: python -m compileall -q research/calibri2/s58
      - name: Download exact S45 frozen compressed source
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Download accepted S56 paid dual FIRST and later neural controller
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Download sealed S56 actual all-inclusive physical manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-first-token-paid-TRAIN-and-physical-report-JSON
          path: inputs/s56_report
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Train only already-paid later neural adapter using 64 plus 64 explicit TRAIN labels
        run: |
          python research/calibri2/s58/frozen_first_replay_protected_paired_noun.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s56_report/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL_MANIFEST.json \
            results/s58
      - name: Preserve authentic TRAIN logs and physical manifest whether or not promoted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s58-frozen-first-paired-noun-TRAIN-report
          path: results/s58/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve improved complete paid dual weights only if all S56 guards pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s58-paid-dual-controller-if-accepted
          path: results/s58/*.safetensors
          if-no-files-found: warn
          retention-days: 60
