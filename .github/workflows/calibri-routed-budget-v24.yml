name: CALIBRI v0.24 - train-routed quality-budget allocation on real Switch MoE
on:
  pull_request:
    paths:
      - 'research/calibri/moe_allocation_v24.py'
      - '.github/workflows/calibri-routed-budget-v24.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-moe-portfolio-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
      HF_HUB_ETAG_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned pretrained MoE and dataset libraries
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Exact allocation selftest incl fail-closed rare gate
        run: python research/calibri/moe_allocation_v24.py --smoke
      - name: True Google Switch MoE all 8 expert pairs and two separate corpora
        run: python research/calibri/moe_allocation_v24.py --output results/calibri_v24_real_moe_allocation.json --tokens 256 --encoder-len 64 --decoder-len 32
      - name: Upload research-only JSON (no weights / no personal data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v24-mixed-moe-portfolio-metrics
          path: results/calibri_v24_real_moe_allocation.json
          if-no-files-found: ignore
          retention-days: 14
