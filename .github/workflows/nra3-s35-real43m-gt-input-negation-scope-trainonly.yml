name: NRA3 S35 genuine43M+GT label-blind local НЕ+dative REJECTED decoding scope eightfold
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s34-anti-collapse-train-positive-headonly-20261118
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s35-43m-scope-decoder-no-gold-eightfold
  cancel-in-progress: true
jobs:
  actual_original43m_train_side_joint_role_rejected_margin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '320256'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require original frozen43M+GT 616 J7, sealed S22c raw/gold, original S26 and canonical S30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44189114971 44189739539 44191302703 44192186916 44196720655 44200775382 44201326575 44202675198 44203704916 44204827220 44207183539 44208569216; do
            test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$run" --jq .conclusion)" = success
          done
          echo S32_GENUINE_ORIGINAL43M_GT_TRAIN256_MODEL_SHA_PROVENANCE_LOCKED
      - name: Install CPU PyTorch and original paid FP16 physical libraries
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Test TRAIN-only joint loss directions, hard negatives, no gold forward, no independent EVAL
        run: |
          python -m compileall -q research/nra3_s20
          python -m unittest -v research.nra3_s20.test_s31_joint_rejected_role_margin_contract research.nra3_s20.test_s32_precision_margin_trainonly research.nra3_s20.test_s33_headonly_preserve_relation_contract research.nra3_s20.test_s34_trainonly_teacher_margin_anticollapse research.nra3_s20.test_s35_local_neg_dative_trainonly
      - name: Download only genuine S22c original43M GT raw338 features and separately SHA-sealed synthetic TRAIN256 gold
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22c-TRUE43M-GT-256-TRAIN-raw338-and-gold-separated-40fold
          run-id: 44191302703
          github-token: ${{ github.token }}
          path: inputs/s22c
      - name: Download SHA-pinned frozen original S19d 9332 FP16 grammar/context
        uses: actions/download-artifact@v4
        with:
          name: nra3-s19d-TRUE43M-GT-9332paidFP16-context-event-TRAIN96-internalCV-no-EVAL
          run-id: 44128707585
          github-token: ${{ github.token }}
          path: inputs/s19d
      - name: Download original real S22d 12381 FP16 archive solely for SHA integrity
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22d-REAL43M-GT-256TRAIN-40fold-12381FP16-5heads-noEVAL
          run-id: 44192186916
          github-token: ${{ github.token }}
          path: inputs/s22d
      - name: Download original real S26 12384 FP16 archive and original completed 40fold metrics
        uses: actions/download-artifact@v4
        with:
          name: nra3-s26-REAL43M-GT-TRAIN256-40fold-12384FP16-event-inversion-ablation-noEVAL
          run-id: 44196720655
          github-token: ${{ github.token }}
          path: inputs/s26
      - name: Download physically completed S31 8fold diagnostic (baseline, never train it)
        uses: actions/download-artifact@v4
        with:
          name: nra3-s31-real43M-GT-8fixed-TRAINonly-rare-role-rejection-12384FP16-noEVAL
          run-id: 44203704916
          github-token: ${{ github.token }}
          path: inputs/s31
      - name: Read sealed S32 original real43M+GT eight synthetic TRAIN development folds
        uses: actions/download-artifact@v4
        with:
          name: nra3-s32-real43M-GT-8fold-calibrated-precision-rejection-12384FP16-noEVAL
          run-id: 44204827220
          github-token: ${{ github.token }}
          path: inputs/s32
      - name: Read sealed original S33 TRAIN-only eightfold report (prior development comparison)
        uses: actions/download-artifact@v4
        with:
          name: nra3-s33-original43M-GT-8fold-S31-exact-relation-headonly-precision-12384FP16-noEVAL
          run-id: 44207183539
          github-token: ${{ github.token }}
          path: inputs/s33
      - name: Read frozen S34 completed eightfold TRAIN report for cross-run comparison only
        uses: actions/download-artifact@v4
        with:
          name: nra3-s34-original43M-GT-8fold-headonly-rare-rejected-teacher-anti-collapse-noEVAL
          run-id: 44208569216
          github-token: ${{ github.token }}
          path: inputs/s34
      - name: Refit physical original43M S34 TRAIN 8fold then apply input-only НЕ+dative decoder to held synthetic TRAIN predictions
        run: |
          python -m research.nra3_s20.s35_real43m_local_negation_scope_trainonly \
            --features inputs/s22c/S22C_REAL43M_GT_NEW256_RAWONLY_WORD338.safetensors \
            --gold inputs/s22c/S22C_256_SYNTHETIC_EVENT_GRAPH_TARGETS_TRAIN_ONLY.safetensors \
            --manifest inputs/s22c/S22C_REAL43M_GT_NEW256_RAWONLY_AND_TRAIN_GOLD_SEPARATE_REPORT.json \
            --s19d-parent inputs/s19d/NRA3_S19D_TRUE43M_GT_CONTEXT_SCOPE_GRAMMAR_AND_EVENT_TRAINONLY_FP16.n3s19d \
            --s22d-model inputs/s22d/NRA3_S22D_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12381_FP16.n3s22d \
            --s26-model inputs/s26/NRA3_S26_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12384_FP16.n3s26 \
            --baseline-s34-report inputs/s34/NRA3_S34_REAL43M_GT_TRAIN256_8FOLD_RECALL_PRESERVE_PRECISION_ABLATION.json \
            --out results/nra3_s35
      - name: Strict TRAIN-only source SHA, no model changes, per-fold same-run role/relation invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/nra3_s35/NRA3_S35_GENUINE43M_GT_TRAIN256_LOCAL_NEGATION_DECODE_ABLATION.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m["stage"]=="NRA3_S35_GENUINE_ORIGINAL43M_GT_LOCAL_NE_DATIVE_DECODE_FPFN_TRAINONLY"
          assert m["original_real43M_GT_CPU_train256_graph_SHA"]=="8963e2e8758b1c6a6fbd28eb597a77be1a454d732d0ecac93df6f5a753f6a361"
          assert m["original_S34_completed_run"]==44208569216
          assert m["actual_original_S22d_archived_canonical_FP16_SHA"]=="35102946886b9f35d86f57f791b6ab6001b813e4f79397cff8e4d25c04e7a538"
          assert m["actual_original_S26_archived_canonical_FP16_SHA"]=="02d4403ffbce01632d54d66349a01c3f10b81650d26d9540bb86f495cac62807"
          assert m["rule_only_token_local_NE_and_DATIVE_not_pattern_id"]
          assert m["underlying_original_12384_FP16_paid_parameters_unchanged"]
          assert m["output_is_decoder_diagnostic_NOT_new_model_or_adopted_candidate"]
          assert m["all_32_synthetic_TRAIN_positive_recipient_target_cues_present"]
          assert m["eight_previously_inspected_synthetic_TRAIN_development_folds_only"]==[32,33,34,35,36,15,24,30]
          assert len(m["all_8_fold_details"])==8
          assert all(x["model_forward_received_only_raw338_valid"]
              and x["gold_never_entered_local_scope_decoder"]
              and x["physical_candidate_weight_sha_identical_before_after_decoder"]
              and x["paid_43M_GT_frozen_and_relation_logits_unchanged"]
              and x["held_source_side_synthetic_TRAIN_rows"]==8
              and x["trained_source_side_rows"]==248
              for x in m["all_8_fold_details"])
          for x in m["all_8_fold_details"]:
              for name in ("event","coreference","event_relation"):
                  assert x["S34_fresh_held_5heads"][name]==x["S35_scope_held_5heads"][name]
          assert m["no_hyperparameter_or_checkpoint_selection_from_held_source"]
          assert m["not_generalized_language_negation_scope"]
          assert m["no_independent_eval32_128_or_old_616J7_replay"]
          assert m["no_active_43M_GT_NRA2_LIVE_Render_Supabase_Jessica_APK_changes"]
          assert m["output_gate"]==0 and not m["candidate_accepted"] and not m["activation_allowed"]
          print("S35_REAL43M_GT_INPUT_SCOPE_ONLY_TRAIN_GROUPED8_PROVENANCE_VERIFIED",
            json.dumps({"before":m["matched_synthetic_rare_four_fold_S34_fresh"],
              "after":m["matched_synthetic_rare_four_fold_S35_scope"],
              "FP26_28_before":m["target_26_28_S34_false_positives"],
              "FP26_28_after":m["target_26_28_S35_false_positives"]},
              sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s35-43M-GT-raw338-ne-dative-scope-8fold-TRAIN-only-noEVAL
          path: results/nra3_s35/
          if-no-files-found: error
          retention-days: 30
