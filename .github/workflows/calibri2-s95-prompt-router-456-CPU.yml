name: CALIBRI S95 prompt-only paid neural profile router, actual 456 CPU
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-s94-compact-multiprofile-green-tunnel-bank-20261109
permissions:
  contents: read
  actions: read
jobs:
  s95_syntax_safety:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s95-prompt-only-neural-profile-router-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check S95 source, no sealed QA or LIVE
        run: |
          python3 -m compileall -q research/calibri2/s95/
          if grep -E '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72|s79|s85)' research/calibri2/s95/*.py; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/calibri2/s95/train_and_audit_router.py').read_text()
          for key in ('prompt_only_vector','fourfold_HELD_OUT_TRAIN_not_QA','actual_physical_456_cpu','candidate_accepted','physical_bpp_conservative'): assert key in s
          print('S95_TRAIN_ONLY_PROMPT_ROUTING_SOURCE_SANITY',flush=True)
          PY
  s95_actual_physical_full456_CPU:
    needs: s95_syntax_safety
    if: needs.s95_syntax_safety.result == 'success'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '950095'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install frozen physical CPU stack
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: S94 lossless green tunnel alternative bank, fixed provenance
        uses: actions/download-artifact@v4
        with:
          name: calibri-s94-unaccepted-lossless-three-profile-bank-456-TRAIN-feasibility
          path: inputs/s94
          run-id: 42697267843
          github-token: ${{ github.token }}
      - name: S93 actual MPS-trained model immutable
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          path: inputs/s93
          run-id: 42681768394
          github-token: ${{ github.token }}
      - name: S87 original all456 physical CPU audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-456-native-source-PyTorch-CPU-TRAIN-protected-audit
          path: inputs/s87_full
          run-id: 42659248083
          github-token: ${{ github.token }}
      - name: S91 all456 independent physical CPU audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s91-full-456-strict-EOS-quality-no-forgetting-and-CPU
          path: inputs/s91_full
          run-id: 42674413574
          github-token: ${{ github.token }}
      - name: S93 all456 independent physical CPU audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-full-456-strict-union-no-forgetting-and-CPU
          path: inputs/s93_full
          run-id: 42681768394
          github-token: ${{ github.token }}
      - name: Train prompt-only FP16 neural router, 4fold holdout and full 456 actual CPU
        run: |
          python research/calibri2/s95/train_and_audit_router.py \
            inputs/s94/S94_ALTERNATE_EXACT_CORE_TUNNEL_BANK.bin \
            inputs/s94/S94_PROFILE_BANK_FEASIBILITY_REPORT.json \
            inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            inputs/s87_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s91_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s93_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            results/s95
      - name: Preserve S95 hard negative audit and numeric router even on strict rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s95-unaccepted-prompt-only-router-456-strict-CPU
          path: results/s95/
          retention-days: 90
          if-no-files-found: warn
