name: NRA3 S18c1 true43M GT original native43 CB59 S11 and 96 TRAIN 300 directed rank8 FP16 physical only
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s18c0-new96-physical-feature-groupedcv-contract-20261116
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s18c1-physical-new96-nativeC-300-gold-only
  cancel-in-progress: false
jobs:
  original43M_GT_nativeC_paid2309_new96_train300:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s18c1-real43m-new96-train300-directed-rank8-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONHASHSEED: '318001'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require immutable physical 43M CPU TRAIN96, old 43 CB59 and S11 original, no previously consumed EVAL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43910479658 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43910479658 --jq .head_sha)" = 8626bb64175ed38778709363cfd902d80a5df21e
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43912620815 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43912620815 --jq .head_sha)" = 3ffd1c1163a05933b0dd296acd8eec1a0b1bb17c
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43731085988 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43734571081 --jq .conclusion)" = success
          echo ORIGINAL_REAL43M_GT_CPU_96_AND_ORIGINAL_NATIVE_CB59_S11_SHA_LOCKED
      - name: Install exact CPU native 43-C and rank8 paid FP16 dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'tokenizers==0.20.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Test original S16 direction+gradient and new96 source, POS/UD and fingerprint guard
        run: |
          python -m compileall -q research/nra3_s18 research/nra3_s16
          python -m unittest -v research.nra3_s16.test_directed_valence_source research.nra3_s16.test_real43m_train72_directed_pairs research.nra3_s18.test_ru96_train_source research.nra3_s18.test_locked_original43m_new96_alignment
      - name: Download ONLY original CPU Calibri43M GT S18b real 96 TRAIN hidden320+tokenizer offsets
        uses: actions/download-artifact@v4
        with:
          name: nra3-s18b-TRUE43M-616J7-new96-TRAIN-postGT-layer8-goldfree-FP16
          run-id: 43910479658
          github-token: ${{ github.token }}
          path: inputs/nra3_s18b
      - name: Download original 43 matrix CB59 physically packed source, unchanged
        uses: actions/download-artifact@v4
        with:
          name: nra3-s8-adaptive-calibrated-3way-physical-CB59-S61-realRU12-trainonly
          run-id: 43731085988
          github-token: ${{ github.token }}
          path: inputs/nra3_s8
      - name: Download exactly original 39-FP16 S11 native 3way selector, unchanged
        uses: actions/download-artifact@v4
        with:
          name: nra3-s11-real43M-ru72-39param-FP16-paid-router-native-C-trainonly
          run-id: 43734571081
          github-token: ${{ github.token }}
          path: inputs/nra3_s11
      - name: Authenticate all true original hidden, 43 C, S11, source96, and no spent EVAL before optimizer
        run: |
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          from direct_codebook_v59 import CB59
          from research.nra3_s18.real43m_train96_physical_source import checked_real_train96,grouped_train96_split_contract
          from research.nra3_s11.paid_router import PaidThreeWayRouter
          from research.nra3_s16.paid_directed_valence import PARAMETERS,PHYSICAL_BYTES
          from research.nra3_s13.real43m_train72_readouts import S8B_43_CB59_SHA,S11_39_FP16_SHA
          root=Path("inputs")
          train,record=checked_real_train96(
              root/"nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors",
              root/"nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json")
          assert len(train)==96 and record["original_456_full_EOS"]==456 and record["original_new128_full_EOS"]==128
          original=(root/"nra3_s8/NRA3_S8_CALIBRATED_PARALLEL_RELATION_RU_TRAIN12_PAID_CB59.cb59").read_bytes()
          router=(root/"nra3_s11/NRA3_S11_TINY_PAID_RUSSIAN_TRAIN72_CAUSAL_3WAY_SELECTOR_FP16.n3r11").read_bytes()
          assert len(original)==653798 and hashlib.sha256(original).hexdigest()==S8B_43_CB59_SHA
          assert len(CB59(original).handles)==43 and CB59(original).meta["original_unique_parameter_count"]==6106154
          assert len(router)==123 and hashlib.sha256(router).hexdigest()==S11_39_FP16_SHA
          assert PaidThreeWayRouter.from_physical(router).physical_bytes()==router
          assert PARAMETERS==2309 and PHYSICAL_BYTES==4665
          assert len(grouped_train96_split_contract())==12
          source=Path("research/nra3_s18/s18c1_original43m_train96_nativeC_rank8.py").read_text()
          imported=[n.module or "" for n in ast.walk(ast.parse(source)) if isinstance(n,ast.ImportFrom)]
          assert not any("nra3_s17" in m or "nra3_s15" in m or "nra3_s12" in m for m in imported)
          assert not any((root/p).exists() for p in ("nra3_s17","nra3_s15","nra3_s15c","nra3_s12","nra3_s12c","s3ci","nra3_s10"))
          print("S18C1_ORIGINAL_TRUE43M_GT_NEW96_NO_ORACLE_GOLD_NATIVE43_CB59_S11_ALL_SHA_VERIFIED")
          PY
      - name: Genuine native CPU original 43 packed C on all 96 real hidden320; train ONLY 2309 paid FP16 on 300 directed gold
        run: |
          python -m research.nra3_s18.s18c1_original43m_train96_nativeC_rank8 \
            --s18b-hidden inputs/nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors \
            --s18b-report inputs/nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json \
            --s8-cb59 inputs/nra3_s8/NRA3_S8_CALIBRATED_PARALLEL_RELATION_RU_TRAIN12_PAID_CB59.cb59 \
            --s11-router inputs/nra3_s11/NRA3_S11_TINY_PAID_RUSSIAN_TRAIN72_CAUSAL_3WAY_SELECTOR_FP16.n3r11 \
            --out results/nra3_s18c1
      - name: Verify physical FP16 ABI final SHA and TRAIN-only 3288 two-way candidates/300 gold, no promotion
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from research.nra3_s16.paid_directed_valence import PaidDirectedValence,PARAMETERS,PHYSICAL_BYTES
          root=Path("results/nra3_s18c1")
          r=json.loads((root/"NRA3_S18C1_96_TRAIN_NATIVE_C_PAID_RANK8_REPORT.json").read_text())
          assert r["stage"]=="NRA3_S18C1_ORIGINAL43M_GT_NATIVE43_S11_NEW96_TRAIN300_PAID_RANK8"
          assert r["S18c1_training_rows_NEW96_only"]==96 and r["S18c1_all_bidirectional_wordpair_candidates"]==3288
          assert r["S18c1_positive_gold_roles"]==300
          assert r["S18c1_gold_role_distribution"]=={"AGENT":96,"PATIENT":96,"RECIPIENT":96,"SOURCE":12}
          assert r["S18c1_real_original_native_C_on_96_hidden320"]
          assert len(r["S18c1_original_native_C_per_sentence_relation_SHA256"])==96
          assert r["S18c1_no_oracle_gold_or_POS_filter_in_candidates"]
          assert r["S18c1_no_label_entered_frozen_Calibri_or_native_C_or_S11"]
          assert r["S18c1_fixed_train_optimizer_steps"]==200 and r["S18c1_fixed_snapshot_schedule"]==[0,50,100,150,200]
          assert r["S18c1_grouped_CV_accuracy_not_tested"] and r["S18c1_no_independent_eval_scored"]
          assert r["S18c1_original_S95_full_sentence_scope_causes_strict_online_causality_unproven"]
          assert r["S18c1_2309_rank8_FP16_physically_paid"] and r["S18c1_rank8_paid_parameters"]==PARAMETERS==2309
          assert r["S18c1_2309_rank8_FP16_bytes"]==PHYSICAL_BYTES==4665
          assert r["candidate_accepted"] is False and r["activation_allowed"] is False and r["S18c1_output_gate"]==0
          assert r["S18c1_full_all_in_GT_NRA_bpp_le07_certified"] is False
          assert r["S18c1_CPU_speed_ge90pct_CB59_certified"] is False
          assert r["S18c1_candidate_active_616_J7_EOS_measured"] is False
          p=root/r["S18c1_model_file"]
          b=p.read_bytes()
          assert len(b)==4665 and hashlib.sha256(b).hexdigest()==r["S18c1_model_sha256"]
          assert PaidDirectedValence.from_physical(b).physical_bytes()==b
          assert 0<=r["S18c1_FINAL_ONLY_TRAIN_F1"]<=1
          print("S18C1_TRUE43M_GT_NATIVE43_S11_96_TRAIN300_PAID_FP16_NOT_GENERALIZATION",r["S18c1_FINAL_ONLY_TRAIN_F1"],r["S18c1_model_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s18c1-TRUE43M-GT-native43-S11-new96-TRAIN300-2309FP16-rank8-no-EVAL
          path: results/nra3_s18c1/
          retention-days: 30
          if-no-files-found: error
