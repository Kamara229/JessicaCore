name: CALIBRI v46 - physically complete INT6 checkpoint and 20-percent warm inference SLA
on:
  pull_request:
    paths:
      - 'research/calibri/full_checkpoint_v46.py'
      - 'research/calibri/practical_int6_v46.py'
      - 'research/calibri/compare_practical_int6_v46.py'
      - 'research/calibri/SESSION_46.md'
      - '.github/workflows/calibri-practical-int6-v46.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pretrained-full-model-int6-and-warm-autoregression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned model and scientific dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Compile research scripts and smoke-test physical full-model schema
        run: |
          python -m py_compile research/calibri/full_checkpoint_v46.py research/calibri/practical_int6_v46.py research/calibri/compare_practical_int6_v46.py
          python research/calibri/full_checkpoint_v46.py
      - name: Quantize all trained Pythia matrices and measure real full-model PPL and warm autoregressive latency
        run: |
          python research/calibri/practical_int6_v46.py --output results/calibri_v46.json
      - name: Preserve complete physical full-model INT6 archive, sidecar and honest measured SLA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v46-${{ matrix.os }}
          path: |
            results/calibri_v46.json
            results/CALIBRI_v46_all_weights_raw.cb46
            results/CALIBRI_v46_all_weights_pre.cb46
            results/CALIBRI_v46_int6_post_affine.c45c
          retention-days: 14
          if-no-files-found: ignore
  independent-real-physical-and-speed-verifier:
    needs: real-pretrained-full-model-int6-and-warm-autoregression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v46-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Validate physical source and cross-host true 5-percent quality and 20-percent latency SLA
        run: |
          python research/calibri/compare_practical_int6_v46.py \
            --a results/runs/calibri-v46-ubuntu-22.04/calibri_v46.json \
            --b results/runs/calibri-v46-ubuntu-24.04/calibri_v46.json \
            --output results/calibri_v46_crosshost.json
      - name: Retain honest pass and negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v46-crosshost-verdict
          path: results/calibri_v46_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
