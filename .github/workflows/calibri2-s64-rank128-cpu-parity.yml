name: CALIBRI S64 rank128 physical gate real CPU speed and 16 full answers
'on':
  pull_request:
    branches:
      - research/calibri2-s63-native-c-fed-cpu-parity-20261109
    paths:
      - .github/workflows/calibri2-s64-rank128-cpu-parity.yml
permissions:
  contents: read
  actions: read
jobs:
  CPU_only_rank128_vs_rank12:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s64-paid-rank-expand-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU inference toolchain, no GPU
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Fetch S45 immutable original compressed CB59
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Fetch S56 immutable rank12 Green Tunnel baseline
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Fetch physical rank128 candidate, sealed full paid manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri-s64-paid-rank128-green-tunnel-not-trained
          path: inputs/s64
          run-id: 42530687528
          github-token: ${{ github.token }}
      - name: Check exact native free-answer and measured CPU speed relative to rank12
        run: |
          python research/calibri2/s64/cpu_rank128_frozen_greedy_parity.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s64/S64_RANK128_GREEN_TUNNEL_INIT.safetensors \
            inputs/s64/S64_PAID_MANIFEST.json \
            results/s64/rank128_init_CPU_native_greedy_report.json
      - name: Preserve measured negatives and all timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s64-rank128-frozen-TRAIN-CPU-inference
          path: results/s64/*.json
          if-no-files-found: warn
          retention-days: 90
