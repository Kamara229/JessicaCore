name: Calibri Fusion Growth G34 alphabet joint continuation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g33-recognition-retention-20261127]
permissions:
  contents: read
  actions: read
jobs:
  g34:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g34-letter-joint-20261127'
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arm: [joint, head]
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only 756241af7effccfcf36f869f7ab03ee38b44cb61 HEAD >/tmp/g34scope
          test "$(wc -l </tmp/g34scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g34_letter_joint.py' -e '.github/workflows/calibri-fusion-growth-g34.yml' /tmp/g34scope
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Pinned ARM64 MPS dependencies
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3' 'Jinja2==3.1.6' 'wordfreq==3.1.1'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g05-134m-G0
          run-id: 45823877120
          path: inputs/g05
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g29-control
          run-id: 45976431344
          path: inputs/g29
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g32-control
          run-id: 46009334029
          path: inputs/g32
          github-token: ${{ github.token }}
      - name: Joint alphabet continuation
        run: python research/calibri2/fusion_growth/g34_letter_joint.py --g05 inputs/g05 --f08 inputs/f08 --g29 inputs/g29 --g32 inputs/g32 --out results/g34 --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-fusion-growth-g34-${{ matrix.arm }}
          path: results/g34/
          retention-days: 30
          if-no-files-found: error
