name: CALIBRI v98 frozen full-layer residual drift and logit collapse diagnostics

on:
  pull_request:
    paths:
      - 'research/calibri/v98/**'
      - 'research/calibri/calibri_layer_drift_v98.py'
      - 'research/calibri/test_v98_residual_drift.py'
      - 'research/calibri/SESSION_98_DISTRIBUTED_QUALITY_FAULTS.md'
      - '.github/workflows/calibri-v98-layer-residual-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen_CB59_all_layer_hidden_residuals:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public pretrained CPU-only research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Run stateless layerwise drift metrics, capture cleanup and compilation tests
        run: |
          python -m compileall -q research/calibri/v98 research/calibri/calibri_layer_drift_v98.py research/calibri/test_v98_residual_drift.py
          python research/calibri/test_v98_residual_drift.py -v
      - name: Retrieve original source archive from pinned historical GitHub Actions only
        run: |
          mkdir -p input results/v98
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Diagnose true native hidden error accumulation and next-token collapse
        run: |
          python research/calibri/calibri_layer_drift_v98.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --locked research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v98
          test -s results/v98/v98_frozen_layer_residual_and_logits_forced_vs_generated.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v98-frozen-layer-residual-logit-and-generation-diagnosis
          path: results/v98/v98_frozen_layer_residual_and_logits_forced_vs_generated.json
          retention-days: 7
          if-no-files-found: ignore
