name: Calibri Fusion Growth G33 recognition and historical retention
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g32-word-foundation-mps-20261127]
permissions:
  contents: read
  actions: read
jobs:
  g33:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g33-recognition-retention-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arm: [original, f10, g05, control, repair]
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only d652dcce90e24d9352d58bfa6a5ed3a7fd034ab4 HEAD >/tmp/g33scope
          test "$(wc -l </tmp/g33scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g33_recognition_retention.py' -e '.github/workflows/calibri-fusion-growth-g33.yml' /tmp/g33scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3' 'Jinja2==3.1.6' 'wordfreq==3.1.1'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g32-control
          run-id: 46009334029
          path: inputs/lex
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.arm == 'original'
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          run-id: 45668506574
          path: inputs/f01
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.arm == 'f10'
        with:
          name: calibri-fusion-growth-f10-own-error-joint-G0
          run-id: 45673224891
          path: inputs/f10
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.arm != 'original' && matrix.arm != 'f10'
        with:
          name: calibri-fusion-growth-g05-134m-G0
          run-id: 45823877120
          path: inputs/g05
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.arm == 'control' || matrix.arm == 'repair'
        with:
          name: calibri-fusion-growth-g29-${{ matrix.arm }}
          run-id: 45976431344
          path: inputs/g29
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: matrix.arm == 'control' || matrix.arm == 'repair'
        with:
          name: calibri-fusion-growth-g32-${{ matrix.arm }}
          run-id: 46009334029
          path: inputs/g32
          github-token: ${{ github.token }}
      - name: Native CPU recognition and generation audit
        run: python research/calibri2/fusion_growth/g33_recognition_retention.py --f01 inputs/f01 --f10 inputs/f10 --g05 inputs/g05 --f08 inputs/f08 --g29 inputs/g29 --g32 inputs/g32 --lex inputs/lex --out results/g33 --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-fusion-growth-g33-${{ matrix.arm }}
          path: results/g33/
          retention-days: 30
          if-no-files-found: error
