name: NRA3 S30 real43M+GT canonical FP16 verified original archived models + reproducible fold33 roles
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s29-archived-model-canonical-fp16-fingerprints-20261118
permissions:
  contents: read
  actions: read
jobs:
  real_original43m_fold33_canonical_fp16_role_reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '320256'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original 43M GT plus S29 numeric FP16 canonical SHA and full artifact integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44189114971 44189739539 44191302703 44192186916 44193628871 44194898261 44196090812 44196720655 44200775382 44201326575; do
            test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$run" --jq .conclusion)" = success
          done
          echo S30_REAL_FOLD33_MODEL_AND_SOURCE_CI_PINNED
      - name: Install original FP16 CPU-only physical reproducibility dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Source-only code/provenance tests, NEVER model predictions from fakes
        run: |
          python -m compileall -q research/nra3_s20
          python -m unittest -v research.nra3_s20.test_s25_rejected_preposed_raw_cue_contract research.nra3_s20.test_s26_event_grounded_inversion research.nra3_s20.test_s30_canonical_real43m_fold33_contract
      - name: Frozen original43M GT source raw338 physically separate from TRAIN gold
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22c-TRUE43M-GT-256-TRAIN-raw338-and-gold-separated-40fold
          run-id: 44191302703
          github-token: ${{ github.token }}
          path: inputs/s22c
      - name: Original frozen S19d grammar/context actual 9332 FP16
        uses: actions/download-artifact@v4
        with:
          name: nra3-s19d-TRUE43M-GT-9332paidFP16-context-event-TRAIN96-internalCV-no-EVAL
          run-id: 44128707585
          github-token: ${{ github.token }}
          path: inputs/s19d
      - name: Original S22d actual trained paid FP16 and independent 40-fold source audit
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22d-REAL43M-GT-256TRAIN-40fold-12381FP16-5heads-noEVAL
          run-id: 44192186916
          github-token: ${{ github.token }}
          path: inputs/s22d
      - name: S26 actual trained 12384 FP16 and same 40 matched source folds
        uses: actions/download-artifact@v4
        with:
          name: nra3-s26-REAL43M-GT-TRAIN256-40fold-12384FP16-event-inversion-ablation-noEVAL
          run-id: 44196720655
          github-token: ${{ github.token }}
          path: inputs/s26
      - name: Verify S29 true 43M original archived numeric SHA and same-runner canonical identical refits, inspect only held TRAIN8
        run: |
          python -m research.nra3_s20.s30_reproducible_canonical43m_fp16_fold33 \
            --features inputs/s22c/S22C_REAL43M_GT_NEW256_RAWONLY_WORD338.safetensors \
            --gold inputs/s22c/S22C_256_SYNTHETIC_EVENT_GRAPH_TARGETS_TRAIN_ONLY.safetensors \
            --manifest inputs/s22c/S22C_REAL43M_GT_NEW256_RAWONLY_AND_TRAIN_GOLD_SEPARATE_REPORT.json \
            --parent inputs/s19d/NRA3_S19D_TRUE43M_GT_CONTEXT_SCOPE_GRAMMAR_AND_EVENT_TRAINONLY_FP16.n3s19d \
            --baseline-model inputs/s22d/NRA3_S22D_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12381_FP16.n3s22d \
            --baseline-report inputs/s22d/NRA3_S22D_REAL43M_GT_TRAIN256_GROUPED40_DIAGNOSTICS.json \
            --trial-model inputs/s26/NRA3_S26_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12384_FP16.n3s26 \
            --trial-report inputs/s26/NRA3_S26_REAL43M_GT_TRAIN256_GROUPED40_MATCHED_DIAGNOSTICS.json \
            --out results/nra3_s30
      - name: Verify historical full model physical SHA, mark refit mismatch and preserve strict no-EVAL provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/nra3_s30/NRA3_S30_REAL43M_GT_CANONICAL_PAID_FP16_FOLD33_INVERSION_DIAGNOSTICS.json")
          x=json.loads(p.read_text())
          assert x["stage"]=="NRA3_S30_CANONICAL_FP16_REPRODUCIBLE_REAL43M_GT_TRAIN_INTERNAL_FOLD33_PAIRS"
          assert len(x["per_example_error_evidence"])==8
          assert len(x["S26_3_trained_FP16_event_scoped_head_weights"])==3
          assert x["original_S26_full_FP16_SHA256"]=="4819c8b0dfc402bddf036f16e04f85486c51a9a6600af63374cf40a1f6c00951"
          assert x["archived_fold33_baseline_REJECTED_TP"]==0
          assert x["archived_fold33_trial_REJECTED_TP"]==0
          assert x["fresh_refit_NOT_equivalent_to_historical_exact_fold"]
          assert x["fresh_refit_one_CPU_thread_to_probe_concurrent_reduction_drift"]
          assert x["fresh_repeat_numerical_S22d_FP16_equal"]
          assert x["fresh_repeat_numerical_S26_FP16_equal"]
          assert x["actual_archived_S22d_numeric_canonical_FP16_SHA256"]=="35102946886b9f35d86f57f791b6ab6001b813e4f79397cff8e4d25c04e7a538"
          assert x["actual_archived_S26_numeric_canonical_FP16_SHA256"]=="02d4403ffbce01632d54d66349a01c3f10b81650d26d9540bb86f495cac62807"
          assert x["no_frozen_original43M_GT_weight_update"]
          assert x["all_8_held_rejected_rows_untouched_in_train_loss"]
          assert x["held_8_TRAIN_only_roles_predicted_RECIPIENT_baseline"]>=0
          assert x["held_8_TRAIN_only_roles_predicted_RECIPIENT_trial"]>=0
          assert x["held_8_TRAIN_only_trial_REJECTED_probability_range"][0]<=x["held_8_TRAIN_only_trial_REJECTED_probability_range"][1]
          assert len(x["archived_fold33_S22d_SHA"])==64
          assert len(x["archived_fold33_S26_SHA"])==64
          assert len(x["fresh_refit_real_fold33_S22d_physical_sha256"])==64
          assert len(x["fresh_refit_real_fold33_S26_physical_sha256"])==64
          assert isinstance(x["same_runner_same_seed_S22d_sha_reproduced"],bool)
          assert isinstance(x["same_runner_same_seed_S26_sha_reproduced"],bool)
          print("S30_REPRODUCIBILITY_ANNOTATION",{
              "historical_sha_equal":[x["fresh_fold33_matches_historical_S22d_SHA"],x["fresh_fold33_matches_historical_S26_SHA"]],
              "same_host_repeat_equal":[x["same_runner_same_seed_S22d_sha_reproduced"],x["same_runner_same_seed_S26_sha_reproduced"]],
              "fresh_TP":[x["preposed_polarity_TP_baseline"],x["preposed_polarity_TP_trial"]],
          },flush=True)
          assert x["held_gold_never_passed_to_neural_forward"]
          assert x["independent_EVAL_not_opened_or_replayed"]
          assert x["no_production_edits"] and x["output_gate"]==0
          assert not x["candidate_accepted"] and not x["activation_allowed"]
          print("S30_REAL_CPU_43M_GT_FRESH_REFIT_PROVENANCE_SHA_VERIFIED_NOT_HISTORIC_REPLAY",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s30-REAL43M-GT-S22d-S26-canonical-paid-fp16-repro-fold33-TRAIN-only
          path: results/nra3_s30/
          if-no-files-found: error
          retention-days: 30
