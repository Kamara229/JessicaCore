name: Calibri Fusion Growth F09 native head storage reserve
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f08-budget-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f09:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f09-head-budget-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only 41b5fd70a0998db0c1405fe3658df5e0432b31fb HEAD >/tmp/f09scope
          test "$(wc -l </tmp/f09scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f09_head_rate_codec.py' -e '.github/workflows/calibri-fusion-growth-f09.yml' /tmp/f09scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f03-rate-trained-core-G0
          run-id: 45669309826
          path: inputs/f03
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - name: Physically pack and restore existing head at Q8 and Q4
        run: python research/calibri2/fusion_growth/f09_head_rate_codec.py --f03 inputs/f03 --f08 inputs/f08 --out results/f09
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f09-head-reserve-G0
          path: results/f09/
          retention-days: 30
          if-no-files-found: error
