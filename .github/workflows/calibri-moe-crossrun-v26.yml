name: CALIBRI v0.26 - cross-run Switch MoE replay reproducibility
on:
  pull_request:
    paths:
      - 'research/calibri/crossrun_compare_v26.py'
      - 'research/calibri/moe_replay_v25.py'
      - '.github/workflows/calibri-moe-crossrun-v26.yml'
      - 'research/calibri/SESSION_26.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-pretrained-replays:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install exact pinned pretrained/data/accelerate environment
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Repeat exact pretrained BF16 evaluation independently
        run: python research/calibri/moe_replay_v25.py --output results/calibri_v25_moe_replay.json --tokens 128 --encoder-len 64 --decoder-len 32 --repeats 3
      - name: Archive metrics and hashes only, not pretrained weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v26-${{ matrix.os }}
          path: results/calibri_v25_moe_replay.json
          retention-days: 14
          if-no-files-found: ignore
  cross-run-gate:
    needs: independent-pretrained-replays
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v26-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Require cross-run exact source, logits and router agreement
        run: |
          python research/calibri/crossrun_compare_v26.py \
            --first results/runs/calibri-v26-ubuntu-22.04/calibri_v25_moe_replay.json \
            --second results/runs/calibri-v26-ubuntu-24.04/calibri_v25_moe_replay.json \
            --output results/calibri_v26_crossrun_verdict.json
      - name: Preserve negative result rather than suppress mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v26-crossrun-verdict
          path: results/calibri_v26_crossrun_verdict.json
          retention-days: 14
          if-no-files-found: ignore
