name: Calibri Z60 GPT native pair objective tokenizer-only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z59-GPT-compositional-curriculum-20261124
permissions:
  contents: read
jobs:
  prereg:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z60-GPT-pair-native-objective-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict three-file additive scope
        run: |
          set -euo pipefail
          git diff --name-only origin/research/calibri2-s119q2i8z59-GPT-compositional-curriculum-20261124 HEAD >/tmp/z60scope
          test "$(wc -l </tmp/z60scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z60_native_pair_objective.py' -e 'research/calibri_nra3/test_s119q2i8z60_native_pair_objective.py' -e '.github/workflows/calibri-nra3-s119q2i8z60-native-pair-objective.yml' /tmp/z60scope; then exit 1; fi
      - name: Install CPU source and tokenizer dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify loss gradients and frozen native token plan
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z60_native_pair_objective
          python -m research.calibri_nra3.s119q2i8z60_native_pair_objective
