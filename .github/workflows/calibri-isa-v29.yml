name: CALIBRI v0.29 - oneDNN AVX2 requested cap cross-CPU diagnostic
on:
  pull_request:
    paths:
      - 'research/calibri/isa_cap_v29.py'
      - 'research/calibri/compare_isa_v29.py'
      - '.github/workflows/calibri-isa-v29.yml'
      - 'research/calibri/SESSION_29.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-cpu-isa-factor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned public pretrained model and validation corpus dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Pretrained BF16 with unrestricted default oneDNN dispatch (fresh process)
        shell: bash
        run: |
          mkdir -p results
          env -u DNNL_MAX_CPU_ISA -u ONEDNN_MAX_CPU_ISA \
            ONEDNN_VERBOSE=1 python research/calibri/isa_cap_v29.py \
            --cap DEFAULT --output results/default.json --tokens 128 --encoder-len 64 --decoder-len 32
      - name: Same CPU and BF16 weights with max oneDNN AVX2 (new process)
        shell: bash
        run: |
          DNNL_MAX_CPU_ISA=AVX2 ONEDNN_MAX_CPU_ISA=AVX2 ONEDNN_VERBOSE=1 \
            python research/calibri/isa_cap_v29.py \
            --cap AVX2 --output results/avx2.json --tokens 128 --encoder-len 64 --decoder-len 32
      - name: Preserve JSON numerical evidence without weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v29-${{ matrix.os }}
          path: |
            results/default.json
            results/avx2.json
          if-no-files-found: ignore
          retention-days: 14
  paired-host-and-crosshost-evidence:
    needs: independent-cpu-isa-factor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy-only comparator
        run: python -m pip install 'numpy==1.26.4'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v29-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Compare A/B within identical CPU and compare both hosts only if hardware differs
        shell: bash
        run: |
          python research/calibri/compare_isa_v29.py \
            --a-default results/runs/calibri-v29-ubuntu-22.04/default.json \
            --a-cap results/runs/calibri-v29-ubuntu-22.04/avx2.json \
            --b-default results/runs/calibri-v29-ubuntu-24.04/default.json \
            --b-cap results/runs/calibri-v29-ubuntu-24.04/avx2.json \
            --output results/calibri_v29_verdict.json
      - name: Preserve positive, negative and inconclusive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v29-isa-verdict
          path: results/calibri_v29_verdict.json
          if-no-files-found: ignore
          retention-days: 14
