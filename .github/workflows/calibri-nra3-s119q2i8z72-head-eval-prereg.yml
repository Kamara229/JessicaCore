name: Calibri Z72 fresh28 head-only evaluation source prereg
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z70-GPT-cached-native-head-eight-epochs-20261124
permissions:
  contents: read
jobs:
  prereg:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z72-GPT-head-fresh28-eval-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict additive source scope
        run: |
          set -euo pipefail
          git diff --name-only fca63dae986f6b3fc4fd9ffd77622d66de9238fa HEAD >/tmp/z72scope
          test "$(wc -l </tmp/z72scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z72_head_eval_prereg.py' -e 'research/calibri_nra3/test_s119q2i8z72_head_eval_prereg.py' -e '.github/workflows/calibri-nra3-s119q2i8z72-head-eval-prereg.yml' /tmp/z72scope; then exit 1; fi
      - name: Install source import dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'transformers==4.46.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3'
      - name: Check manifest and fail-closed checkpoint policy, no model
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z72_head_eval_prereg
          python -m research.calibri_nra3.s119q2i8z72_head_eval_prereg
