name: CALIBRI independent 135M S3 genuine 48-step joint Green Tunnel + core distillation
'on':
  push:
    branches:
      - 'research/calibri2-135m-s3-actual-joint-distillation-gt-20261117'
    paths:
      - 'research/calibri2/independent_135m/s3/**'
      - '.github/workflows/calibri2-135m-s3-actual-joint-distillation.yml'
  workflow_dispatch:
concurrency:
  group: calibri2-original-trained135m-S3-real-joint-GT
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  actual_teacher_distillation_into_211_paid_CB59_and_rank24_rank32_GT:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '13531117'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original trained FP32 and CB59 differentiable CPU stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Audit no-NRA GT full-depth and CB59 prerequisite contracts
        run: |
          python -m compileall -q research/calibri2/independent_135m/s3
          python -m unittest calibri2.independent_135m.arch_no_nra.test_architecture -v
          python -m unittest test_v197_green_tunnel_generic_parity test_v185_discrete_index -v
      - name: Obtain verified original pretrained FP32 to physical CB59 S0, NO S1 duplicate
        uses: actions/download-artifact@v4
        with:
          name: calibri2-original-pretrained-135M-full-architecture-NO-NRA-vs-FP32
          run-id: 43946485860
          path: inputs/physical
          github-token: ${{ github.token }}
      - name: Actually train 211 paid codebooks + five local GT rank24 and all 30 recurrent GT rank32
        run: |
          python research/calibri2/independent_135m/s3/train_joint_teacher.py \
            inputs/physical/CALIBRI2_135M_SOURCE_CB59.cb59 \
            results/calibri2/135m_S3/actual_research_training
      - name: Preserve all THREE physically paid candidate neural+core checkpoints, real generations and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-135M-S3-real-48step-full211-joint-GT-rank24-rank32
          path: results/calibri2/135m_S3/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
