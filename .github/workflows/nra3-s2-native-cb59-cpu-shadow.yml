name: NRA2 3.0 S2 native packed CB59 C CPU and GT shadow parity
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-nra3-s1-cb59-gt-shadow-20261115
permissions:
  contents: read
concurrency:
  group: nra3-s2-native-cb59-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cpu_native_nra3:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s2-native-cb59-cpu-gt-zero-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only Calibri CB59 test dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'tokenizers==0.20.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Real C packed K32V8 code and complete NRA3 vs reconstructed source CPU
        run: python -m unittest -v research.nra3_s2.test_native_cpu
      - name: No activation / inherited regression of S0 and S1 physical-source controls
        run: python -m unittest -v research.nra3_s0.test_neural_area research.nra3_s1.test_compression_green_tunnel
