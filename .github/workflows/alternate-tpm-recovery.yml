name: Alternate Model TPM Recovery
on:
  pull_request:
    paths:
      - 'backend/ai/alternateShortQuotaRetry.js'
      - 'backend/ai/dailyQuotaModelFallback.js'
      - 'backend/scripts/regressionAlternateShortQuotaRetry.test.js'
      - '.github/workflows/alternate-tpm-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'backend/ai/alternateShortQuotaRetry.js'
      - 'backend/ai/dailyQuotaModelFallback.js'
      - 'backend/scripts/regressionAlternateShortQuotaRetry.test.js'
      - '.github/workflows/alternate-tpm-recovery.yml'
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - run: node --test backend/scripts/regressionModelDailyQuotaFallback.test.js backend/scripts/regressionAlternateShortQuotaRetry.test.js
