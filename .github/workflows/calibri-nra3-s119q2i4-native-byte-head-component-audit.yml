name: Calibri S119q2i4 REAL43M native byte155/dot30 head bias-vs-lowrank 144 forwards
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i3-joint-GT12-NRA3-NPA1-head-20261122
permissions:
  contents: read
  actions: read
jobs:
  real-original-43m-native-byte-head-bias-lowrank-attribution:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i4-native-byte-collapse-head-attribution-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '119143'
    steps:
      - name: Checkout exact draft RESEARCH PR SHA never deploy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original 43M GT12 CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: All original 243 native safety contracts plus 18 new byte155/dot30 LM readout masks
        run: |
          python -m unittest -v \
            research.calibri_nra3.test_s119a_hard_four_goals \
            research.calibri_nra3.test_s119m_real43m_gt_interlayer_onpath_joint \
            research.calibri_nra3.test_s119n_real43m_onpath_autoregressive_sixprompts \
            research.calibri_nra3.test_s119o_onpath_nochange_margin_audit \
            research.calibri_nra3.test_s119p_real43m_onpath_component_ablation \
            research.calibri_nra3.test_s119q1_real43m_onepass_causal_early \
            research.calibri_nra3.test_s119q2a_train_source_manifest \
            research.calibri_nra3.test_s119q2b_real43m_onepass_native_train \
            research.calibri_nra3.test_s119q2c1_counterfactual_native \
            research.calibri_nra3.test_s119q2d_deeper_joint_native_answer_training \
            research.calibri_nra3.test_s119q2d1_original_sameprobe_baseline \
            research.calibri_nra3.test_s119q2e_causal_early_view_diagnostic \
            research.calibri_nra3.test_s119q2f_learned_causal_projection \
            research.calibri_nra3.test_s119q2f1_physical_projector_onoff \
            research.calibri_nra3.test_s119q2g_own_token_generation \
            research.calibri_nra3.test_s119q2h_native_language_logits \
            research.calibri_nra3.test_s119q2i1_ru_fullanswer_joint \
            research.calibri_nra3.test_s119q2i2_gt12_recurrence_connectivity \
            research.calibri_nra3.test_s119q2i3_full_joint_gt_nra3_npa1 \
            research.calibri_nra3.test_s119q2i4_native_byte_head_component_forensics
      - name: Original S93 immutable compact Core12 43M and GreenTunnel donors
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          run-id: 42681768394
          path: inputs/s93
          github-token: ${{ github.token }}
      - name: Original physically pretrained S142 43M plus zero-gate GT12
        uses: actions/download-artifact@v4
        with:
          name: calibri-s142-one-j7-43m-dual-cone-456-128-no-QA
          run-id: 43078895081
          path: inputs/s142
          github-token: ${{ github.token }}
      - name: Genuine q2d original neural Core NRA3 NPA1 trained FP16 parent
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2d-deeper-joint-native-96train-4epochs-original43m-GT-gate0
          run-id: 45014239436
          path: inputs/s119q2d
          github-token: ${{ github.token }}
      - name: Genuine q2f learned 6-layer causal projector joint FP16 parent
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2f-real43m-learned-causal-rank8-projector-96TRAIN2EPOCH-gate0
          run-id: 45016558435
          path: inputs/s119q2f
          github-token: ${{ github.token }}
      - name: PREVIOUS truly learned q2i1 complete Russian native+BPE+EOS FP16 child
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2i1-real43m-Russian-fullanswer-nativeEOS-joint-train-DEV-gate0
          run-id: 45021955235
          path: inputs/s119q2i1
          github-token: ${{ github.token }}
      - name: Download real S119q2i3 previously trained full joint original43M GT12 recurrent/local physical A-B
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2i3-original43m-joint-gt12-core-nra3-npa1-nativehead-3rounds-12TRAIN-12oldDEV-gate0
          run-id: 45025930494
          path: inputs/s119q2i3
          github-token: ${{ github.token }}
      - name: Deny any sealed GOLD or historical evaluation / production files
        run: |
          set -euo pipefail
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors
          test -f inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors
          test -f inputs/s119q2d/S119Q2D_DEEPER_REAL43M_GT_96TRAIN4EPOCH_NATIVE_POSITION_ABLATION.json
          test -f inputs/s119q2d/S119Q2D_DEEPER_CONTEXTUAL_NATIVE_96TRAIN4EPOCH_GATE0_FP16.safetensors
          test -f inputs/s119q2d/S119Q2D_DEEPER_LOCAL_NATIVE_96TRAIN4EPOCH_GATE0_FP16.safetensors
          test -f inputs/s119q2f/S119Q2F_LEARNED_CAUSAL_PROJECTOR_NATIVE_JOINT_A_B_REPORT.json
          test -f inputs/s119q2f/S119Q2F_CONTEXTUAL_CAUSAL_PROJECTOR_FP16_UNACCEPTED.safetensors
          test -f inputs/s119q2f/S119Q2F_LOCAL_MATCHED_CAUSAL_PROJECTOR_FP16_UNACCEPTED.safetensors
          test -f inputs/s119q2i1/S119Q2I1_REAL43M_RU_NATIVE_EOS_TRAIN_FREE_DEV_REPORT.json
          test -f inputs/s119q2i1/S119Q2I1_CONTEXTUAL_CORE_NRA3_NPA1_HEAD_FP16_G0.safetensors
          test -f inputs/s119q2i1/S119Q2I1_TOKEN_LOCAL_CORE_NRA3_NPA1_HEAD_FP16_G0.safetensors
          test -f inputs/s119q2i3/S119Q2I3_GT12_NRA3_NPA1_NATIVEHEAD_3ROUNDS_OLDDEV_REPORT.json
          test -f inputs/s119q2i3/S119Q2I3_RECURRENT_GT12_CORE_NRA3_NPA1_NATIVE_HEAD_FP16_G0.safetensors
          test -f inputs/s119q2i3/S119Q2I3_LOCAL_GT12_CORE_NRA3_NPA1_NATIVE_HEAD_FP16_G0.safetensors
          test -f inputs/s119q2i3/S119Q2I3_RECURRENT_GT12_12GATES_FP16_G0.safetensors
          test -f inputs/s119q2i3/S119Q2I3_LOCAL_GT12_12GATES_FP16_G0.safetensors
          if find inputs -type f | grep -Ei 'S116|S117|S118|SynTagRusB|GOLD_LABEL|_UD_GOLD|EVAL128|DEV_PROMPTS|APK'; then
            echo "Protected GOLD/spent evaluation and production inputs forbidden" && exit 1
          fi
      - name: PHYSICALLY TEST 144 original S142 native heads on SAME children with four readout bias/lowrank masks; NO learning
        run: |
          python -m research.calibri_nra3.s119q2i4_native_byte_head_component_forensics \
            --s93 inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            --side inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            --s142 inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors \
            --q2d-dir inputs/s119q2d \
            --q2f-dir inputs/s119q2f \
            --q2i1-dir inputs/s119q2i1 \
            --q2i3-dir inputs/s119q2i3 \
            --out results/s119q2i4_native_byte_readout_attribution
      - name: Save ONLY byte155/dot30 read-only original native 49k-head numerical causal attribution
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q2i4-original43m-GT12-144native-byte155-dot30-bias-lowrank-gate0
          path: results/s119q2i4_native_byte_readout_attribution/
          retention-days: 30
          if-no-files-found: error
