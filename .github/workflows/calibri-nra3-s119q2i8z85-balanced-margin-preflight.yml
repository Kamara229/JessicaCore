name: Calibri Z85 state-balanced byte and early EOS margin preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z84-GPT-early-readout-probe-20261124
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z85-GPT-balanced-state-margin-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict three-file scope
        run: |
          set -euo pipefail
          git diff --name-only 0db92226d961d450ff4908cd734653ed404e73f8 HEAD >/tmp/z85scope
          test "$(wc -l </tmp/z85scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z85_balanced_margin.py' -e 'research/calibri_nra3/test_s119q2i8z85_balanced_margin.py' -e '.github/workflows/calibri-nra3-s119q2i8z85-balanced-margin-preflight.yml' /tmp/z85scope; then exit 1; fi
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1'
      - name: Verify state-group normalization and early EOS gradient
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z85_balanced_margin
          python -m research.calibri_nra3.s119q2i8z85_balanced_margin
