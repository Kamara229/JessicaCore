name: CALIBRI v152 FP32 teacher oracle isolate 30 compressed transformer blocks
on:
  pull_request:
    paths:
      - 'research/calibri/v152/**'
      - 'research/calibri/test_v152_singlelayer_oracle.py'
      - '.github/workflows/calibri-pro-max-v152.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rank_original_architecture_bottlenecks:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/paid/CALIBRI_v147_paid_6bit_tied_plus_int8_logit_prior.cb147
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned CPU teacher and packed model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v147-native-6bit-paid-plus-vocab-int8-prior
          path: inputs/paid
          run-id: 41905813697
          github-token: ${{ github.token }}
      - name: Require exactly 30 FP32 oracle block controls and restoration
        run: python -m unittest test_v152_singlelayer_oracle -v
      - name: FP32 teacher one-block causal localization on eight preexisting prompts
        run: python -m v152.run "$SOURCE" results/v152
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v152-original-30-block-FP32-unpaid-oracle-diagnostic
          path: results/v152/
          if-no-files-found: warn
          retention-days: 30
