name: NRA3 S29 genuine archived S22d/S26 canonical paid FP16 provenance
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s28-seed-fp16-determinism-probe-20261118
permissions:
  contents: read
  actions: read
jobs:
  actual_43m_gt_model_canonical_identity_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original true43M+GT S22d/S26 physical trained archive SHA and S28 deterministic paid FP16 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44191302703 44192186916 44196720655 44200775382; do
            test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$run" --jq .conclusion)" = success
          done
          echo S29_SEALED_PARENT_AND_REAL_TRAIN_ONLY_PAID_ARCHIVES
      - name: Install immutable pinned CPU tensor libraries and physically paid safetensors
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Canonical SHA source-only tests (not proof of real original43M)
        run: |
          python -m compileall -q research/nra3_s20
          python -m unittest -v research.nra3_s20.test_s29_archived_canonical_fp16_contract
      - name: Load immutable physically paid genuine original43M+GT S22d archive (never optimizer)
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22d-REAL43M-GT-256TRAIN-40fold-12381FP16-5heads-noEVAL
          run-id: 44192186916
          github-token: ${{ github.token }}
          path: inputs/nra3_s22d
      - name: Load immutable physically paid genuine original43M+GT S26 archive (never optimizer)
        uses: actions/download-artifact@v4
        with:
          name: nra3-s26-REAL43M-GT-TRAIN256-40fold-12384FP16-event-inversion-ablation-noEVAL
          run-id: 44196720655
          github-token: ${{ github.token }}
          path: inputs/nra3_s26
      - name: Verify original full model artifact raw SHA, then canonical 12381/12384 paid FP16 numerical identity
        run: |
          python -m research.nra3_s20.s29_archived_original43m_canonical_fp16_identity \
            --s22d-model inputs/nra3_s22d/NRA3_S22D_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12381_FP16.n3s22d \
            --s26-model inputs/nra3_s26/NRA3_S26_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12384_FP16.n3s26 \
            --out results/nra3_s29
      - name: Strict physical original SHA, semantic fingerprint and decoder inactive audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("results/nra3_s29/NRA3_S29_ARCHIVED_S22D_S26_CANONICAL_PAID_FP16_PROVENANCE.json").read_text())
          assert m["stage"]=="NRA3_S29_ACTUAL_ARCHIVED_S22D_S26_CANONICAL_FP16_IDENTITY_AUDIT"
          assert m["S28_genuine_original43M_GT_determinism_proof_run"]==44200775382
          assert m["historical_40fold_weights_not_saved_and_not_claimed_reproducible"]
          assert m["no_training_or_independent_EVAL"]
          assert m["LIVE_Render_Supabase_Jessica_APK_original_Calibri_untouched"]
          assert m["output_gate"]==0 and not m["candidate_accepted"] and not m["activation_allowed"]
          for name,expected,params in (
              ("S22d","bd56293aa6ada2411152f0ac528633315731c39de6e74a759704577defbadcbb",12381),
              ("S26","4819c8b0dfc402bddf036f16e04f85486c51a9a6600af63374cf40a1f6c00951",12384),
          ):
              z=m["sources"][name]
              assert z["source_original_raw_physical_SHA256"]==expected
              assert z["full_paid_FP16_parameter_count"]==params
              assert z["same_model_numeric_canonical_digest_invariant_across_reserialization"]
              assert z["physical_archive_bytes_NOT_REPLACED"]
              assert len(z["canonical_named_paid_FP16_numeric_SHA256"])==64
              assert len(z["head_paid_FP16_numeric_SHA256"])==64
              assert z["no_candidate_or_decoder_activation"]
          print("S29_PHYSICAL_SOURCE_SHA_AND_CANONICAL_NUMERIC_FP16_IDENTITY_VERIFIED",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s29-real-original43M-GT-archived-paid-canonical-fp16-hashes-noEVAL
          path: results/nra3_s29/
          if-no-files-found: error
          retention-days: 30
