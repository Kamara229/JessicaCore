name: Calibri S119q2i8l early23 BPE source135M KL postrun paired native guard
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8k-secondthird-teacherKL-bounded-newTRAIN-20261122
permissions:
  contents: read
  actions: read
jobs:
  paired-sample-outcome-report-hard-gates:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8l-early23-own-native-paired-audit-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact research SHA read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit contract tests, no model downloads or pretrained weights
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8l_early23_paired_audit
      - name: Fetch verified successful exact S119q2i8k real43M CE versus early23 KL paired DEV report
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2i8k-original43m-next21-TRAIN-early23-135mKL-14newDEV-gate0
          run-id: 45054353996
          path: inputs/s119q2i8k
          github-token: ${{ github.token }}
      - name: Audit real matched 27 Adam updates and 14 fresh OWN-greedy native paired samples
        run: |
          set -euo pipefail
          test -f inputs/s119q2i8k/S119Q2I8K_REAL43M_EARLY23BPE_TEACHERKL_VS_CEONLY_REPORT.json
          python -m research.calibri_nra3.s119q2i8l_paired_native_postrun_audit \
            --input inputs/s119q2i8k/S119Q2I8K_REAL43M_EARLY23BPE_TEACHERKL_VS_CEONLY_REPORT.json \
            --output results/S119Q2I8L_EARLY23_PHYSICAL_NATIVE_PAIRED_REPORT_G0.json
      - name: Save strictly no-weight physical paired output outcome
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q2i8l-physical-43m-early23KL-native-greedy-paired-14DEV-gate0
          path: results/S119Q2I8L_EARLY23_PHYSICAL_NATIVE_PAIRED_REPORT_G0.json
          retention-days: 30
          if-no-files-found: error
      - name: Hard fail if modifications outside two report scripts and this workflow
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/diff_files
          if grep -Ev '^(research/calibri_nra3/s119q2i8l_paired_native_postrun_audit.py|research/calibri_nra3/test_s119q2i8l_early23_paired_audit.py|\.github/workflows/calibri-nra3-s119q2i8l-early23-paired-native-audit.yml)$' /tmp/diff_files; then
            echo "Non-research file changed" >&2
            exit 1
          fi
