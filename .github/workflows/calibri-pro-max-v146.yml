name: CALIBRI v146 frozen SciQ BoolQ validation forced-choice QA
on:
  pull_request:
    paths:
      - 'research/calibri/v146/**'
      - 'research/calibri/test_v146_qa_choice.py'
      - '.github/workflows/calibri-pro-max-v146.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unseen_validation_qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PAID: inputs/paid/CALIBRI_v140_paid_tied_embedding_6bit.cb140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research-only model and dataset dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v140-native-paid-tied-6bit-full-model
          path: inputs/paid
          run-id: 41898410897
          github-token: ${{ github.token }}
      - name: Check fixed choice labels, negative QA and no TEST leakage with synthetic examples
        run: python -m unittest test_v146_qa_choice -v
      - name: Compare frozen FP32/CB59/full CB140/half-head SciQ BoolQ VALID scores
        run: python -m v146.run "$PAID" results/v146
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v146-sciq-boolq-unseen-validation-choice-QA
          path: results/v146/
          if-no-files-found: warn
          retention-days: 30
