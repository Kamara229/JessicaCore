name: CALIBRI v0.25 - pretrained MoE deterministic replay audit
on:
  pull_request:
    paths:
      - 'research/calibri/moe_replay_v25.py'
      - '.github/workflows/calibri-moe-replay-v25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducibility-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install exact pinned pretrained/data/accelerate environment
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Real pretrained Switch checkpoint loading + original/quantized/restore replay
        run: python research/calibri/moe_replay_v25.py --output results/calibri_v25_moe_replay.json --tokens 128 --encoder-len 64 --decoder-len 32 --repeats 3
      - name: Save reproducibility hashes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v25-moe-reproducibility
          path: results/calibri_v25_moe_replay.json
          if-no-files-found: ignore
          retention-days: 14
