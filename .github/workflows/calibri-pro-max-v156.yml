name: CALIBRI v156 third untouched crossdomain challenge to v_proj paid source
on:
  pull_request:
    paths:
      - 'research/calibri/v156/**'
      - 'research/calibri/test_v156_third_source_vproj.py'
      - '.github/workflows/calibri-pro-max-v156.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  corroborate_surprising_vproj_operator:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/paid/CALIBRI_v153_original_layer_paid_onebit.cb153
      EVIDENCE: inputs/v155/v155_single_operator_crossdomain_validation.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original SmolLM2 CPU model and untouched TRAIN sources
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v153-physical-sensitive-block-onebit-native-original
          path: inputs/paid
          run-id: 41911781429
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v155-paid-original-operator-untouched-two-domains
          path: inputs/v155
          run-id: 41913322415
          github-token: ${{ github.token }}
      - name: Ensure v155 truth anchored before third untouched VALID source
        run: python -m unittest test_v156_third_source_vproj -v
      - name: Test frozen v_proj and o_proj paid modules on THIRD never-used WikiText and News source
        run: python -m v156.run "$SOURCE" "$EVIDENCE" results/v156
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v156-third-holdout-physical-vproj-diagnostic
          path: results/v156/
          if-no-files-found: warn
          retention-days: 30
