name: CALIBRI v95 actual-answer-guided zero-extra-byte source quality repair

on:
  pull_request:
    paths:
      - 'research/calibri/v95/**'
      - 'research/calibri/calibri_quality_repair_v95.py'
      - 'research/calibri/test_v95_quality_repair.py'
      - 'research/calibri/SESSION_95_SAME_BYTE_BEHAVIOR_GUIDED_REPAIR.md'
      - '.github/workflows/calibri-v95-quality-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  same_byte_original_train_fitted_then_disjoint_train_valid:
    runs-on: ubuntu-22.04
    timeout-minutes: 115
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original public trained weights research CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify original real packed source invariants and quality only ranking
        run: |
          python -m compileall -q research/calibri/v95 research/calibri/calibri_quality_repair_v95.py research/calibri/test_v95_quality_repair.py
          python research/calibri/test_v95_quality_repair.py -v
      - name: Load immutable original pretrained packed source and prior physical candidate
        run: |
          mkdir -p input/v92 results/v95
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          gh run download 41729012091 --repo "$GITHUB_REPOSITORY" --name calibri-v92-research-automatic-TRAIN-only-full-block-rewrite --dir input/v92
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s input/v92/v92_rewritten_single_block_RESEARCH_ONLY.cb59
          test -s input/v92/v92_research_quality_doctor_report.json
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Generate 3 same-byte native full-block operators FIT by ground-truth answers then independent VALID
        run: |
          python research/calibri/calibri_quality_repair_v95.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --v92 input/v92/v92_rewritten_single_block_RESEARCH_ONLY.cb59 --v92-report input/v92/v92_research_quality_doctor_report.json --locked-baseline research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --output results/v95
          test -s results/v95/v95_same_byte_behavior_first_trial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v95-same-byte-native-operator-quality-first-TRAIN-VALID
          path: |
            results/v95/v95_same_byte_behavior_first_trial.json
            results/v95/v95_selected_RESEARCH_ONLY.cb59
          retention-days: 7
          if-no-files-found: ignore
