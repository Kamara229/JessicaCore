name: NRA2 S3BQ THIRD untouched128 real original CPU S3BA vs new JOINT S3BN one-time no retune
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-nra2-s3bp-third128-true43m-cpu-only-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: nra2-s3bq-once-only-third128-original43m-zero-gate
  cancel-in-progress: false
jobs:
  s3bq_one_time_new_s3bo128_source_target_and_reach:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3bq-once-only-third128-s3ba-vs-s3bn-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact research-only CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5' 'transformers==4.46.3' 'tokenizers==0.20.3' 'huggingface-hub>=0.26,<1' 'jinja2==3.1.6'
      - name: Fail closed unless THIRD S3BO SHA, NEW S3BN frozen TRAIN and S3BP genuine original CPU are successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for r in 43646187689 43645412996 43647105183 43590032315 43446925758 43644153544 43640363396; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$r" --jq .conclusion)" = success
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43646187689" --jq .head_branch)" = research/calibri2-nra2-s3bo-third-untouched128-prereg-20261115
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43645412996" --jq .head_branch)" = research/calibri2-nra2-s3bn-trainonly-joint-role2048-20261115
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43647105183" --jq .head_branch)" = research/calibri2-nra2-s3bp-third128-true43m-cpu-only-20261115
          python - <<'PY'
          import torch,platform
          assert platform.machine()=="x86_64" and not torch.cuda.is_available()
          print("S3BQ_TRUE_ORIGINAL43M_CPU_THIRD128_ONCE_ONLY_NO_TRAIN")
          PY
      - name: Lock THIRD S3BO sealed independent128 protocol before any scoring
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bo-third-independent-eval128-prereg-only-no-cpu
          run-id: '43646187689'
          github-token: ${{ github.token }}
          path: inputs/s3bo
      - name: Lock THIRD original true CPU S3BP independent128 tokens original616 J7
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bp-third-blind128-original43M-tokens320-J7-no-score
          run-id: '43647105183'
          github-token: ${{ github.token }}
          path: inputs/s3bp
      - name: Lock original S3BA fixed baseline physical FP16
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3ba-role1536-replay1024-structural512-dev128-fp16-zero-gate
          run-id: '43590032315'
          github-token: ${{ github.token }}
          path: inputs/s3ba
      - name: Lock NEW S3BN joint semantic pair FP16 from ONLY original TRAIN2048
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3bn-joint-semantic-pair-train2048-fp16-zero-gate
          run-id: '43645412996'
          github-token: ${{ github.token }}
          path: inputs/s3bn
      - name: Lock original stand-alone NRA2 2241 parameters
        uses: actions/download-artifact@v4
        with:
          name: nra2-standalone-relational-cpu-research-only
          run-id: '43446925758'
          github-token: ${{ github.token }}
          path: inputs/nra2
      - name: Validate one-time research code and independent fixed exact McNemar math without blind scoring
        run: |
          python -m compileall -q research/nra2_bridge/stage3bl_once_only_new128_s3ba_vs_s3bn.py
          python -m unittest -v research.nra2_bridge.test_stage3bh_mcnemar
      - name: S3BQ ONCE ONLY evaluate frozen S3BA against safe S3BN on exactly 128 fresh CPU+gold graph questions
        run: |
          python -m research.nra2_bridge.stage3bl_once_only_new128_s3ba_vs_s3bn \
            inputs/s3bp inputs/s3bo inputs/s3ba inputs/s3bn inputs/nra2 \
            results/nra2_stage3bl_one_time_new128
      - name: Verify independent new 128 report no model promotion or test tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/nra2_stage3bl_one_time_new128/NRA2_S3BQ_ONCE_ONLY_THIRD128_S3BA_VS_S3BN_NO_RETUNE.json").read_text())
          assert r["stage"]=="NRA2_S3BQ_ONCE_ONLY_THIRD_S3BO128_S3BA_VS_JOINT_S3BN"
          assert r["S3BP_run"]==43647105183 and r["S3BO_prereg_successful_run"]==43646187689
          assert r["S3BO_prereg_commitment_sha256"]=="01858b405fbb034055574fd27feb93d19a34833da342a664ca5daed2b3ad091b"
          assert r["S3BA_fp16_sha256"]=="4fedf391ee02b1d1c45c82c3690d212ba9a43e9d0da32446f5d32ac6c379bb09"
          assert r["S3BN_fp16_sha256"]=="ea8a81665370cba22c4e8bc75fbe82314089244d4b32278ee62c2c30d88ae811"
          assert r["one_time_independent_EVAL128"]==128
          assert r["original_616_S194_J7_preserved_in_S3BP"]
          assert r["prior_S3AQ_old_independent_EVAL128_consumed"]
          assert r["metrics"]["all"]["n"]==128
          assert r["metrics"]["source_first"]["n"]==64 and r["metrics"]["destination_first"]["n"]==64
          assert len(r["question_level"])==128
          assert r["no_training_or_calibration_or_threshold_tuning"]
          assert r["independent_EVAL_is_now_consumed"] and r["no_winner_accepted_based_on_this_EVAL"]
          assert not r["candidate_accepted"] and r["output_gate"]==0.
          assert not r["full_EOS_tested"] and not r["physical_all_in_bpp_tested"] and not r["paired_CPU_speed_tested"]
          print("S3BQ_THIRD128_ONE_TIME_JOINT_PAIR_MODEL_COMPARE_ZERO_GATE",r["metrics"]["all"])
          PY
      - name: Archive one-time independent new128 role+reachability scores, forbid reuse for future training
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nra2-stage3bl-once-only-new-s3bo128-s3ba-vs-s3bn-no-retune
          path: results/nra2_stage3bl_one_time_new128/
          retention-days: 90
          if-no-files-found: error
