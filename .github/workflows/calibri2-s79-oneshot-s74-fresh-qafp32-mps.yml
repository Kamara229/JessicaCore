name: CALIBRI S79 single-use independent unseen QA frozen S74 vs S71 and FP32 on REAL GPU
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-s78-mps-full36m-hidden-rank16-replay-20261109
permissions:
  contents: read
  actions: read
jobs:
  s79_FIRST_AND_ONLY_new_GPU_QA_frozen_S74_not_training:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s79-once-blind-s74-gpu-generalization-20261109'
    runs-on: macos-15
    timeout-minutes: 100
    env:
      PYTHONPATH: research:research/calibri
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '790079'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Compile and ban imported inspected QA data
        run: |
          python -m compileall -q research/calibri2/s79
          if grep -E '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72)' research/calibri2/s79/*.py; then exit 1; fi
      - name: Install frozen CPU and MPS model stack on Apple ARM64
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify Apple MPS GPU actual hardware and no CPU fallback
        run: |
          python - <<'PY'
          import platform,torch,json
          if platform.machine()!='arm64' or not torch.backends.mps.is_available():
              raise SystemExit('S79 real MPS hardware required')
          z=torch.randn((128,128),device='mps',requires_grad=True)
          (z@z.T).square().mean().backward();torch.mps.synchronize()
          if z.grad is None or z.grad.device.type!='mps':
              raise SystemExit('not actual MPS GPU')
          print(json.dumps({'event':'S79_REAL_APPLE_GPU_DEVICE_PRECHECK','gpu':'mps'}))
          PY
      - name: Download sealed original physically compressed 36M source
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Download unchanged fully paid source compressed envelope
        uses: actions/download-artifact@v4
        with:
          name: calibri-s61-real-physical-entropy-and-cold-cpu
          path: inputs/s61
          run-id: 42528473858
          github-token: ${{ github.token }}
      - name: Download original frozen S71 controller for paired reference
        uses: actions/download-artifact@v4
        with:
          name: calibri-s71-conditional-neural-tunnel-train-only-outcomes
          path: inputs/s71
          run-id: 42536011124
          github-token: ${{ github.token }}
      - name: Download frozen S74 GPU-trained controller and actual bpp manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri-s74-real-MPS-GPU-gradients-and-CPU-full-skill-TRAIN-guards
          path: inputs/s74
          run-id: 42562744529
          github-token: ${{ github.token }}
      - name: FIRST AND ONLY brand-new 96 QA and free responses on immutable candidates
        run: |
          python research/calibri2/s79/one_shot_new_blind_s74_gpu_semantic_qa.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s71/S71_CONTEXT_NEURAL_PAID_CANDIDATE_ONLY.safetensors \
            inputs/s74/S74_REAL_GPU_MPS_TRAIN_ONLY_PAID_FIRST_NEURAL.safetensors \
            inputs/s74/S74_REAL_GPU_ACTUAL_ALL_BYTES_PAID_MANIFEST.json \
            inputs/s61/S61_SOURCE_EXACT_ZLIB_CB59.s61 \
            results/s79
      - name: Seal permanently embargoed original QA instrument and real model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s79-ONE-TIME-NEW-96-QA-FROZEN-S74-vs-S71-original-FP32-sealed
          path: results/s79/
          if-no-files-found: warn
          retention-days: 90
