name: CALIBRI v104 source-paid original 8-bank tied-head native CPU

on:
  pull_request:
    paths:
      - 'research/calibri/v104/**'
      - 'research/calibri/calibri_banked_tied_head_v104.py'
      - 'research/calibri/test_v104_bank_physical_native.py'
      - 'research/calibri/SESSION_104_BANKED_TIED_HEAD_NATIVE.md'
      - '.github/workflows/calibri-v104-source-paid-eight-bank-native.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original_trained_head_new_source_paid_eight_bank_native_C:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original pretrained public CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify actual full byte accounting, native C bank parity and original tied codebook
        run: |
          python -m compileall -q research/calibri/v104 research/calibri/calibri_banked_tied_head_v104.py research/calibri/test_v104_bank_physical_native.py
          python research/calibri/test_v104_bank_physical_native.py -v
      - name: Retrieve original immutable historical CB59 source SHA
        run: |
          mkdir -p input results/v104
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Build physically paid full original banked source and benchmark true C CPU inference
        run: |
          python research/calibri/calibri_banked_tied_head_v104.py --source input/CALIBRI_v59_full_direct_sub070.cb59 --locked research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v104
          test -s results/v104/CALIBRI_v104_eight_bank_native_complete_source.cb104
          test -s results/v104/v104_actual_original_head_bank_source_real_CPU_and_semantic_tests.json
          test ! -e results/v104/temporary_embedded_original_layout_for_CB59_initialization.cb59
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v104-source-paid-eight-bank-native-physical-and-quality
          path: |
            results/v104/CALIBRI_v104_eight_bank_native_complete_source.cb104
            results/v104/v104_actual_original_head_bank_source_real_CPU_and_semantic_tests.json
          retention-days: 7
          if-no-files-found: ignore
