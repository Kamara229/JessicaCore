name: CALIBRI S93 actual-MPS projected core+tunnel repair, 456 CPU union
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-s92-gradient-protected-skill-repair-20261109
permissions:
  contents: read
  actions: read
jobs:
  s92_syntax_and_safety:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s93-repair-first-union-replay-mps-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile research source, embargo QA and LIVE
        run: |
          python3 -m compileall -q research/calibri2/s93/
          if grep -E '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72|s79|s85)' research/calibri2/s93/*.py; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research/calibri2/s93/train_repair_first_s93.py').read_text()
          assert 'project_primary_gradient' in src
          assert 'torch.backends.mps.is_available()' in src
          assert 'S91_physical_CB61' in src
          assert 'mini_union_guard' in src
          assert 'candidate_accepted' in src
          print('S93_RESEARCH_SOURCE_SANITY_PASS',flush=True)
          PY
  s92_projected_core_and_tunnel_MPS:
    needs: s92_syntax_and_safety
    if: needs.s92_syntax_and_safety.result == 'success'
    runs-on: macos-15
    timeout-minutes: 95
    env:
      PYTHONPATH: research:research/calibri
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '930093'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install pinned actual MPS research stack
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Prove Apple GPU and run protected-gradient numerical sanity
        run: |
          python -m calibri2.s92.test_gradient_safety
          python - <<'PY'
          import platform,torch
          assert platform.machine()=='arm64' and torch.backends.mps.is_available()
          p=torch.randn((32,32),device='mps',requires_grad=True)
          (p@p.T).square().mean().backward()
          assert p.grad is not None and p.grad.device.type=='mps'
          print('S93_REAL_APPLE_MPS_GRADIENT_PROVEN',flush=True)
          PY
      - name: Frozen S91 physically serialized prototype
        uses: actions/download-artifact@v4
        with:
          name: calibri-s91-unaccepted-MPS-joint-quality-TRAIN-prototypes
          path: inputs/s91
          run-id: 42674413574
          github-token: ${{ github.token }}
      - name: Immutable S91 all-456 negative audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s91-full-456-strict-EOS-quality-no-forgetting-and-CPU
          path: inputs/s91_full
          run-id: 42674413574
          github-token: ${{ github.token }}
      - name: Frozen original S87 physical CB61
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-unaccepted-joint-core-internal-tunnel-feasibility
          path: inputs/s87
          run-id: 42657528666
          github-token: ${{ github.token }}
      - name: Frozen S87 456 full/EOS TRAIN audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-456-native-source-PyTorch-CPU-TRAIN-protected-audit
          path: inputs/s87_guard
          run-id: 42659248083
          github-token: ${{ github.token }}
      - name: Frozen original S82 controller
        uses: actions/download-artifact@v4
        with:
          name: calibri-s82-real-GPU-contextual-token-pointer-TRAIN-only-protected
          path: inputs/s82
          run-id: 42569548659
          github-token: ${{ github.token }}
      - name: Projected GPU core+internal tunnel training from actual S91 weights
        run: |
          python research/calibri2/s93/train_repair_first_s93.py \
            inputs/s87/S87_UNACCEPTED_NEW_SOURCE_CB61.s61 \
            inputs/s91/S91_UNACCEPTED_SELECTED_CB61.s61 \
            inputs/s91/S91_UNACCEPTED_SELECTED_JOINT.safetensors \
            inputs/s91/S91_UNACCEPTED_JOINT_PAID_MANIFEST.json \
            inputs/s91_full/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s87_guard/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s82/S82_REAL_GPU_GENERAL_TOKEN_POINTER_PAID_TRAIN_CANDIDATE.safetensors \
            results/s92
      - name: Save physically repacked candidates even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          path: results/s92/
          retention-days: 90
          if-no-files-found: warn

  s92_independent_strict_all456_CPU_union_guard:
    needs: s92_projected_core_and_tunnel_MPS
    if: needs.s92_projected_core_and_tunnel_MPS.result == 'success'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install pinned physical CPU inference stack
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Download same-run real-MPS physical S93 prototype
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          path: inputs/s92
      - name: Frozen S45 original CB59
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Frozen S82 controller
        uses: actions/download-artifact@v4
        with:
          name: calibri-s82-real-GPU-contextual-token-pointer-TRAIN-only-protected
          path: inputs/s82
          run-id: 42569548659
          github-token: ${{ github.token }}
      - name: Frozen S87 456 full/EOS TRAIN audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-456-native-source-PyTorch-CPU-TRAIN-protected-audit
          path: inputs/s87_guard
          run-id: 42659248083
          github-token: ${{ github.token }}
      - name: Frozen S91 456 full/EOS negative audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s91-full-456-strict-EOS-quality-no-forgetting-and-CPU
          path: inputs/s91_full
          run-id: 42674413574
          github-token: ${{ github.token }}
      - name: Rebuild physical S93 and strictly preserve S87+S91 union across 456 TRAIN
        run: |
          python research/calibri2/s93/guard_union_s93_cpu.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s82/S82_REAL_GPU_GENERAL_TOKEN_POINTER_PAID_TRAIN_CANDIDATE.safetensors \
            inputs/s92/S93_UNACCEPTED_SELECTED_CB61.s61 \
            inputs/s92/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            inputs/s92/S93_UNACCEPTED_MANIFEST.json \
            results/s92_full456 \
            inputs/s87_guard/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s91_full/S87_ALL_456_TRAIN_GUARD_REPORT.json
      - name: Archive strict 456 per-identity results even if rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s92-full-456-strict-union-no-forgetting-and-CPU
          path: results/s92_full456/
          retention-days: 90
          if-no-files-found: warn
