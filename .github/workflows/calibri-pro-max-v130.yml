name: CALIBRI v130 research-only paired information probe
on:
  pull_request:
    paths:
      - 'research/calibri/v130/**'
      - 'research/calibri/test_v130_pairs.py'
      - '.github/workflows/calibri-pro-max-v130.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-info:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
      GREEN: inputs/green/GreenTunnel_shared_10MB_6gates.safetensors
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v122-frozen-10mb-shared-gate-policy-real-135m
          path: inputs/green
          run-id: 41828640085
          github-token: ${{ github.token }}
      - name: Unit-check swap controls and activation maths
        run: python -m unittest test_v130_pairs -v
      - name: Compare real frozen 135M FP32, CB59, v119 and paired Green controls
        run: python -m v130.run "$HOST" "$GREEN" results/v130
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v130-paired-information-diagnostic
          path: results/v130/
          if-no-files-found: warn
          retention-days: 30
