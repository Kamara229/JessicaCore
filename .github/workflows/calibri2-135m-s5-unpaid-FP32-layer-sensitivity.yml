name: CALIBRI trained135M S5 original FP32 decoder layer causal sensitivity
'on':
  push:
    branches:
      - 'research/calibri2-135m-s5-layer-recovery-sensitivity-20261117'
    paths:
      - 'research/calibri2/independent_135m/s5/**'
      - '.github/workflows/calibri2-135m-s5-unpaid-FP32-layer-sensitivity.yml'
  workflow_dispatch:
concurrency:
  group: calibri2-original135M-S5-layer-causality
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  original_FP32_vs_compressed_CB59_unpaid_layer_necessity:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '13551117'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact original FP32 and reconstructed CB59 CPU stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Syntax and original full-211 codebook lossless contracts
        run: |
          python -m compileall -q research/calibri2/independent_135m/s5
          python -m unittest test_v197_green_tunnel_generic_parity test_v185_discrete_index -v
      - name: Obtain original S0 complete pretrained 135M physical CB59
        uses: actions/download-artifact@v4
        with:
          name: calibri2-original-pretrained-135M-full-architecture-NO-NRA-vs-FP32
          run-id: 43946485860
          path: inputs/S0
          github-token: ${{ github.token }}
      - name: Measure FP32-trained original critical first/last attention/MLP layers causally, never deploy hybrid
        run: |
          python research/calibri2/independent_135m/s5/layerwise_fp32_causality.py \
            inputs/S0/CALIBRI2_135M_SOURCE_CB59.cb59 \
            results/calibri2/135M_S5/unpaid_causal
      - name: Store full honest FP32-vs-CB59 causal results without any FP32 weight archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-original135M-S5-trainedFP32-30layer-unpaid-hybrid-diagnostic
          path: results/calibri2/135M_S5/
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
