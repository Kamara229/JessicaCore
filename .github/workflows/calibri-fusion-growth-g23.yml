name: Calibri Fusion Growth G23 original versus scaled
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g22-early-late-synthesis-20261127]
permissions:
  contents: read
  actions: read
jobs:
  g23:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g23-original-vs-scaled-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only abcc30a2b2bf4f5da81f855599585eae1d315a05 HEAD >/tmp/g23scope
          test "$(wc -l </tmp/g23scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g23_original_vs_scaled.py' -e '.github/workflows/calibri-fusion-growth-g23.yml' /tmp/g23scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g05-134m-G0
          run-id: 45823877120
          path: inputs/g05
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g18-early-context-G0
          run-id: 45891007694
          path: inputs/g18
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          run-id: 45668506574
          path: inputs/f01
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f10-own-error-joint-G0
          run-id: 45673224891
          path: inputs/f10
          github-token: ${{ github.token }}
      - name: Compare original-size and scaled native Russian generation
        run: python research/calibri2/fusion_growth/g23_original_vs_scaled.py --f01 inputs/f01 --f10 inputs/f10 --g05 inputs/g05 --g18 inputs/g18 --f08 inputs/f08 --out results/g23
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-fusion-growth-g23-original-vs-scaled-G0
          path: results/g23/
          retention-days: 30
          if-no-files-found: error
