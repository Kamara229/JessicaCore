name: CALIBRI S127 Q2 gate-only prefill and J7 rollback SYNTHETIC preflight
'on':
  push:
    branches:
      - research/calibri2-s127-q2-prefill-atomic-preflight-20261111
permissions:
  contents: read
concurrency:
  group: calibri-s127-gate-prefill-preflight
  cancel-in-progress: true
jobs:
  s127_synthetic_must_not_be_read_as_actual_S101:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '1270127'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU tensor dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5'
      - name: Compile and keep S118 and heldout data out of this lane
        run: |
          set -euo pipefail
          python -m compileall -q research/calibri2/s127
          if grep -RE '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72|s79|s85|s96|s100|s118)' research/calibri2/s127/*.py; then
            echo "Forbidden QA import"; exit 1
          fi
      - name: One synthetic S127 Q2 prefill-only gate and physical rollback test
        run: |
          python -m unittest -v calibri2.s127.test_q2_prefill_gate_control
      - name: Explicit not-a-model-acceptance footer
        run: |
          echo 'S127_SYNTHETIC_ONLY_NO_REAL_S101_456_128_GUARD_NO_MPS_TRAINING_NO_QA'
