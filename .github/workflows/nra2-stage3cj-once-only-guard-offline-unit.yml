name: NRA2 S3CJ offline-only one-time claim guard unit controls
'on':
  push:
    branches:
      - research/calibri2-nra2-s3cj-once-only-claim-dryrun-20261115
permissions:
  contents: read
concurrency:
  group: nra2-s3cj-offline-unit-only
  cancel-in-progress: false
jobs:
  no_evaluation_or_github_claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run five S3CJ offline mock-only negative controls
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v research.nra2_bridge.test_stage3cj_once_only_claim_guard
