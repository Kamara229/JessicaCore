name: CALIBRI v153 paid original FP32-sensitive transformer block 5plus1bit
on:
  pull_request:
    paths:
      - 'research/calibri/v153/**'
      - 'research/calibri/test_v153_original_packed_layer.py'
      - '.github/workflows/calibri-pro-max-v153.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore_original_sensitive_block_under_0p7:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      CB147: inputs/paid/CALIBRI_v147_paid_6bit_tied_plus_int8_logit_prior.cb147
      ORACLE: inputs/oracle/v152_30block_FP32_oracle_ranking.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original CPU model and TRAIN-only datasets
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v147-native-6bit-paid-plus-vocab-int8-prior
          path: inputs/paid
          run-id: 41905813697
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v152-original-30-block-FP32-unpaid-oracle-diagnostic
          path: inputs/oracle
          run-id: 41910659729
          github-token: ${{ github.token }}
      - name: Verify fixed 30-layer oracle ranking and source-only packed bitplane
        run: python -m unittest test_v153_original_packed_layer -v
      - name: Train source-only 1bit weight residual in layer ranked by v152 then verify NEW source VALID
        run: python -m v153.run "$CB147" "$ORACLE" results/v153
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v153-physical-sensitive-block-onebit-native-original
          path: results/v153/
          if-no-files-found: warn
          retention-days: 30
