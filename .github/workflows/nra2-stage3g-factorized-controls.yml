name: NRA2 S3G factorized split oracle-only (no model)
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra2-s3f-token-attention-shadow-20261114
permissions:
  contents: read
jobs:
  validate_stage3g_split_without_model:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3g-factorized-graph-controls-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable 64 TRAIN and four balanced 16 controls without Calibri
        run: |
          python -m unittest -v research.nra2_bridge.test_stage3g_factorized_graph_controls
      - name: Confirm controls remain research-only, no inference evidence
        run: |
          test -f research/nra2_bridge/STAGE3G.md
          echo "STAGE3G_SPLIT_REGISTERED_NOT_MODEL_SCORED"
