name: CALIBRI2 S0 four-pair TRAIN retention paid pilot
on:
  push:
    branches:
      - 'research/calibri2-s0-small-first-paid-architecture'
    paths:
      - 'research/calibri2/s0/four_pair_retention.py'
      - '.github/workflows/calibri2-s0-four-pair-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bounded_four_pair_train:
    runs-on: ubuntu-22.04
    timeout-minutes: 140
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies without pretrained weights
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Validate source syntax
        run: python -m compileall -q research/calibri2/s0/four_pair_retention.py
      - uses: actions/download-artifact@v4
        with:
          name: calibri2-s0-random-small-physically-paid-native-bootstrap
          path: inputs/s0
          run-id: 42366228524
          github-token: ${{ github.token }}
      - name: Four TRAIN-only opposing pairs 384 fixed steps
        run: python research/calibri2/s0/four_pair_retention.py inputs/s0/CALIBRI2_S0_RANDOM_INITIAL.cb59 results/calibri2/s0/four_pair
      - name: Preserve all answers and physically paid trained source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s0-four-TRAIN-pair-384step-paid
          path: results/calibri2/s0/four_pair/
          if-no-files-found: error
          retention-days: 45
          compression-level: 0
