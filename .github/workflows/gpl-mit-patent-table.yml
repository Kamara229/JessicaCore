name: GPL MIT Patent Table Contract
on:
  pull_request:
    paths:
      - "backend/core/composer/nativeGplMitPatentComparison.js"
      - "backend/core/composer/nativePatentComparisonBase.js"
      - "backend/scripts/regressionGplMitVerifiedTable.test.js"
      - ".github/workflows/gpl-mit-patent-table.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/composer/nativeGplMitPatentComparison.js"
      - "backend/core/composer/nativePatentComparisonBase.js"
      - "backend/scripts/regressionGplMitVerifiedTable.test.js"
      - ".github/workflows/gpl-mit-patent-table.yml"
permissions:
  contents: read
jobs:
  source-verified-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - run: node --test backend/scripts/regressionGplMitVerifiedTable.test.js backend/scripts/regressionGplMplPatentSources.test.js backend/scripts/regressionMitPatentSource.test.js backend/scripts/regressionMitBsd2VerifiedTable.test.js
