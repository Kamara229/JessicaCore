name: CALIBRI v48 - frozen training-only cross-domain INT6 acceptance gate
on:
  pull_request:
    paths:
      - 'research/calibri/crossdomain_gate_v48.py'
      - 'research/calibri/compare_crossdomain_v48.py'
      - 'research/calibri/SESSION_48.md'
      - '.github/workflows/calibri-crossdomain-gate-v48.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-trained-pythia-model-evaluation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned model and data dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify research syntax
        run: python -m py_compile research/calibri/crossdomain_gate_v48.py research/calibri/compare_crossdomain_v48.py
      - name: Freeze full physical INT6 source and two exact-size patch controls then run one-shot TRAIN domain gate
        run: python research/calibri/crossdomain_gate_v48.py --output results/calibri_v48.json
      - name: Preserve measurable physical files and quality/speed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v48-${{ matrix.os }}
          path: |
            results/calibri_v48.json
            results/CALIBRI_v48_pre_full_int6.cb46
            results/CALIBRI_v48_gradient_global.cr47
            results/CALIBRI_v48_sse_module_size_matched.cr47
          retention-days: 14
          if-no-files-found: ignore
  independent-physical-and-gate-verifier:
    needs: real-trained-pythia-model-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v48-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Compare source SHA, physical rate, frozen decision, full-model PPL and timings
        run: |
          python research/calibri/compare_crossdomain_v48.py \
            --a results/runs/calibri-v48-ubuntu-22.04/calibri_v48.json \
            --b results/runs/calibri-v48-ubuntu-24.04/calibri_v48.json \
            --output results/calibri_v48_crosshost.json
      - name: Preserve independent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v48-crosshost-verdict
          path: results/calibri_v48_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
