name: CALIBRI v134 frozen first-hidden error localization
on:
  pull_request:
    paths:
      - 'research/calibri/v134/**'
      - 'research/calibri/test_v134_trace.py'
      - '.github/workflows/calibri-pro-max-v134.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen_hidden_state_trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
      GREEN: inputs/green/GreenTunnel_shared_10MB_6gates.safetensors
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v122-frozen-10mb-shared-gate-policy-real-135m
          path: inputs/green
          run-id: 41828640085
          github-token: ${{ github.token }}
      - name: Verify frozen 30-layer geometry and forward-probe invariants
        run: python -m unittest test_v134_trace -v
      - name: Compare actual FP32 vs packed model hidden trajectories and final-logit KL
        run: python -m v134.run "$HOST" "$GREEN" results/v134
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v134-frozen-first-hidden-divergence
          path: results/v134/
          if-no-files-found: warn
          retention-days: 30
