name: CALIBRI v154 seven source operator ablations on frozen CB153 layer6
on:
  pull_request:
    paths:
      - 'research/calibri/v154/**'
      - 'research/calibri/test_v154_single_operator_ablation.py'
      - '.github/workflows/calibri-pro-max-v154.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  isolate_which_paid_layer6_ops_help:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/paid/CALIBRI_v153_original_layer_paid_onebit.cb153
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU teacher and native original-weight source dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v153-physical-sensitive-block-onebit-native-original
          path: inputs/paid
          run-id: 41911781429
          github-token: ${{ github.token }}
      - name: Check exactly 7 original source module controls and no QA/VALID use
        run: python -m unittest test_v154_single_operator_ablation -v
      - name: Evaluate native CB59, all seven, only-one and leave-one-out corrections on existing prompts
        run: python -m v154.run "$SOURCE" results/v154
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v154-frozen-CB153-native-seven-operator-ablation
          path: results/v154/
          if-no-files-found: warn
          retention-days: 30
