name: CALIBRI v90 TRAIN-only BoolQ and greedy regression audit

on:
  pull_request:
    paths:
      - 'research/calibri/v90/**'
      - 'research/calibri/calibri_diagnose_v90.py'
      - 'research/calibri/test_v90_train_valid_diagnosis.py'
      - '.github/workflows/calibri-v90-boolq-train-valid-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original_trained_boolq_train_valid_diagnostic_only:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original CPU pretrained research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Test paired diagnostics, TRAIN split isolation and Python syntax
        run: |
          python -m compileall -q research/calibri/v90 research/calibri/calibri_diagnose_v90.py research/calibri/test_v90_train_valid_diagnosis.py
          python -m unittest discover -s research/calibri -p test_v90_train_valid_diagnosis.py -v
      - name: Retrieve frozen original CB59 and identical original CB88 paid sources
        run: |
          mkdir -p input/v88 results/v90
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          gh run download 41586136382 --repo "$GITHUB_REPOSITORY" --name calibri-v88-genuine-trained-four-dimensional-physical-neuroweights --dir input/v88
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s input/v88/v88_gated_original_TRAIN_VALID_4D.cb88
      - name: Run original physical weights on disjoint BoolQ TRAIN and TRAIN_VALID only
        run: |
          python research/calibri/calibri_diagnose_v90.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --cb88 input/v88/v88_gated_original_TRAIN_VALID_4D.cb88 --output results/v90
          test -s results/v90/v90_TRAIN_VALID_BoolQ_greedy_paired_diagnosis.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v90-original-frozen-BoolQ-TRAIN-VALID-error-atlas
          path: results/v90/v90_TRAIN_VALID_BoolQ_greedy_paired_diagnosis.json
          retention-days: 7
          if-no-files-found: ignore
