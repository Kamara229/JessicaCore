name: Calibri S119q1 original43M-GT ONEPASS causal NRA3 NPA1 native ABI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119p-true-onpath-component-causal-ablation-20261122
permissions:
  contents: read
  actions: read
jobs:
  one-original-decoder-forward-per-neural-candidate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q1-onepass-earlycausal-native-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '119129'
    steps:
      - name: Checkout exact research PR only; never deploy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact original frozen CPU native S142 dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Immutable previous gates and new onepass negative controls
        run: |
          python -m unittest -v \
            research.calibri_nra3.test_s119a_hard_four_goals \
            research.calibri_nra3.test_s119m_real43m_gt_interlayer_onpath_joint \
            research.calibri_nra3.test_s119n_real43m_onpath_autoregressive_sixprompts \
            research.calibri_nra3.test_s119o_onpath_nochange_margin_audit \
            research.calibri_nra3.test_s119p_real43m_onpath_component_ablation \
            research.calibri_nra3.test_s119q1_real43m_onepass_causal_early
      - name: Original S93 compressed core and GreenTunnel unchanged
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          run-id: 42681768394
          path: inputs/s93
          github-token: ${{ github.token }}
      - name: Original S142 genuine 43M native FP16
        uses: actions/download-artifact@v4
        with:
          name: calibri-s142-one-j7-43m-dual-cone-456-128-no-QA
          run-id: 43078895081
          path: inputs/s142
          github-token: ${{ github.token }}
      - name: Original S119m learned old 53751 FP16 and all new neural components
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119m-original43m-GT-real-onpath-layer5-NRA3-NPA1-RS-TRAINonly-fullVocab-gate0
          run-id: 44949299494
          path: inputs/s119m
          github-token: ${{ github.token }}
      - name: Only six already used unlabeled S119n question first-token references
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119n-REAL43M-GT-onpath-trainedNRA3-NPA1-sixnewRussian-prompts-gate0-NOGOLD
          run-id: 44949896712
          path: inputs/s119n
          github-token: ${{ github.token }}
      - name: Never load sealed B GOLD or spent EVAL or DEV
        run: |
          set -euo pipefail
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors
          test -f inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors
          test -f inputs/s119m/S119M_REAL_ONPATH_CORE_NRA3_NPA1_TRAINONLY_FP16_UNACCEPTED.safetensors
          test -f inputs/s119m/S119M_REAL_ONPATH_NATIVE_FULL_VOCAB_ABLATION_AND_FROZEN_43M_REPORT.json
          test -f inputs/s119n/S119N_REAL43M_GT_NATIVE_ONPATH_GENERATED_SIX_SOURCE_PROMPTS.json
          if find inputs -type f | grep -Ei 'S116|S117|S118|GOLD_LABEL|_UD_GOLD|SynTagRusB|EVAL128|DEV'; then
            echo "Protected or spent QA material forbidden" && exit 1
          fi
      - name: Actually run 6 baseline + 6 true original-native ONEPASS + 6 onepass ZERO
        run: |
          python -m research.calibri_nra3.s119q1_real43m_onepass_causal_early \
            --s93 inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            --side inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            --s142 inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors \
            --parent inputs/s119m/S119M_REAL_ONPATH_CORE_NRA3_NPA1_TRAINONLY_FP16_UNACCEPTED.safetensors \
            --parent-report inputs/s119m/S119M_REAL_ONPATH_NATIVE_FULL_VOCAB_ABLATION_AND_FROZEN_43M_REPORT.json \
            --s119n-report inputs/s119n/S119N_REAL43M_GT_NATIVE_ONPATH_GENERATED_SIX_SOURCE_PROMPTS.json \
            --out results/s119q1_onepass_early
      - name: Research JSON diagnostic only, no model write or acceptance
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q1-onepass-earlycausal-native-original43m-gate0
          path: results/s119q1_onepass_early/
          retention-days: 30
          if-no-files-found: error
