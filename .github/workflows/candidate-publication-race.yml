name: Real PostgreSQL Candidate Skill Race

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/tests/real_candidate_publication_race_ci.test.mjs'
      - 'supabase/tests/real_competing_proposal_worker_ci.mjs'
      - 'supabase/tests/real_competing_proposals_race_ci.test.mjs'
      - 'supabase/tests/verify_concurrent_owner_receipt_ci.mjs'
      - 'supabase/tests/real_stale_candidate_owner_snapshot_ci.test.mjs'
      - 'supabase/tests/fixtures/candidateOwnerRealPgClient.mjs'
      - 'backend/core/learning/approval/approvalOwnerReceipt.js'
      - 'backend/core/learning/approval/approvalPublicationClaimReader.js'
      - 'supabase/tests/real_losing_failed_readback_outage_ci.test.mjs'
      - 'supabase/tests/real_candidate_owner_readback_outage_ci.test.mjs'
      - 'supabase/tests/real_skill_commit_ack_recovery_ci.test.mjs'
      - 'supabase/tests/real_skill_readback_outage_ci.test.mjs'
      - 'supabase/tests/real_proposal_restart_db_ci.mjs'
      - 'supabase/tests/real_proposal_restart_worker_ci.mjs'
      - 'supabase/tests/real_skill_candidate_gap_db_ci.mjs'
      - 'supabase/tests/real_skill_candidate_gap_worker_ci.mjs'
      - 'supabase/tests/real_parallel_proposal_recovery_ci.test.mjs'
      - 'supabase/tests/real_candidate_promotion_ack_race_ci.test.mjs'
      - 'supabase/tests/fixtures/candidateFinalPgClient.mjs'
      - 'supabase/tests/fixtures/proposalRestartPgStatusClient.mjs'
      - 'supabase/tests/fixtures/candidateRacePgClient.mjs'
      - 'supabase/tests/fixtures/candidate_race_ci_schema.sql'
      - 'supabase/migrations/20261027214000_atomic_candidate_skill_publication_claim.sql'
      - 'supabase/migrations/20261027210000_learning_candidate_revision_cas.sql'
      - '.github/workflows/candidate-publication-race.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/tests/real_candidate_publication_race_ci.test.mjs'
      - 'supabase/tests/real_competing_proposal_worker_ci.mjs'
      - 'supabase/tests/real_competing_proposals_race_ci.test.mjs'
      - 'supabase/tests/verify_concurrent_owner_receipt_ci.mjs'
      - 'supabase/tests/real_stale_candidate_owner_snapshot_ci.test.mjs'
      - 'supabase/tests/fixtures/candidateOwnerRealPgClient.mjs'
      - 'backend/core/learning/approval/approvalOwnerReceipt.js'
      - 'backend/core/learning/approval/approvalPublicationClaimReader.js'
      - 'supabase/tests/real_losing_failed_readback_outage_ci.test.mjs'
      - 'supabase/tests/real_candidate_owner_readback_outage_ci.test.mjs'
      - 'supabase/tests/real_skill_commit_ack_recovery_ci.test.mjs'
      - 'supabase/tests/real_skill_readback_outage_ci.test.mjs'
      - 'supabase/tests/real_proposal_restart_db_ci.mjs'
      - 'supabase/tests/real_proposal_restart_worker_ci.mjs'
      - 'supabase/tests/real_skill_candidate_gap_db_ci.mjs'
      - 'supabase/tests/real_skill_candidate_gap_worker_ci.mjs'
      - 'supabase/tests/real_parallel_proposal_recovery_ci.test.mjs'
      - 'supabase/tests/real_candidate_promotion_ack_race_ci.test.mjs'
      - 'supabase/tests/fixtures/candidateFinalPgClient.mjs'
      - 'supabase/tests/fixtures/proposalRestartPgStatusClient.mjs'
      - 'supabase/tests/fixtures/candidateRacePgClient.mjs'
      - 'supabase/tests/fixtures/candidate_race_ci_schema.sql'
      - 'supabase/migrations/20261027214000_atomic_candidate_skill_publication_claim.sql'
      - 'supabase/migrations/20261027210000_learning_candidate_revision_cas.sql'
      - '.github/workflows/candidate-publication-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-candidate-race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jessica_ci
          POSTGRES_PASSWORD: ci-only-temporary-password
          POSTGRES_DB: jessica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jessica_ci -d jessica_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: jessica_ci
      PGPASSWORD: ci-only-temporary-password
      PGDATABASE: jessica_ci
      JESSICA_ISOLATED_PG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Initialize isolated schema and production guard function
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/candidate_race_ci_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027210000_learning_candidate_revision_cas.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027214000_atomic_candidate_skill_publication_claim.sql
      - name: Install backend dependencies for real receipt recovery
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Assert Candidate row locking and legacy PROMOTED owner fence
        run: node supabase/tests/real_candidate_publication_race_ci.test.mjs
      - name: Recover real PostgreSQL commit after simulated ACK loss
        run: node supabase/tests/real_skill_commit_ack_recovery_ci.test.mjs
      - name: Preserve uncertainty while PostgreSQL receipt readback is unavailable
        run: node supabase/tests/real_skill_readback_outage_ci.test.mjs
      - name: Verify Proposal recovery across 8 worker process restarts
        run: |
          node supabase/tests/real_proposal_restart_db_ci.mjs seed
          node supabase/tests/real_proposal_restart_worker_ci.mjs lost-ack
          for attempt in $(seq 1 8); do
            node supabase/tests/real_proposal_restart_worker_ci.mjs down
          done
          node supabase/tests/real_proposal_restart_worker_ci.mjs restored
          node supabase/tests/real_proposal_restart_db_ci.mjs verify
      - name: Recover after Skill COMMIT before Candidate PROMOTED
        run: |
          node supabase/tests/real_skill_candidate_gap_db_ci.mjs seed
          for attempt in $(seq 1 6); do
            node supabase/tests/real_skill_candidate_gap_worker_ci.mjs offline
          done
          node supabase/tests/real_skill_candidate_gap_db_ci.mjs pending
          node supabase/tests/real_skill_candidate_gap_worker_ci.mjs recover
          node supabase/tests/real_skill_candidate_gap_worker_ci.mjs replay
          node supabase/tests/real_skill_candidate_gap_db_ci.mjs final
      - name: Race two real PostgreSQL Approval recovery workers
        run: node supabase/tests/real_parallel_proposal_recovery_ci.test.mjs
      - name: Race Candidate promotion with lost COMMIT ACK
        run: node supabase/tests/real_candidate_promotion_ack_race_ci.test.mjs
      - name: Verify concurrent owner receipts, corrupt readbacks and lost FAILED ACK
        run: node supabase/tests/real_competing_proposals_race_ci.test.mjs
      - name: Keep old PostgreSQL owner snapshot uncertain until fresh commit readback
        run: node supabase/tests/real_stale_candidate_owner_snapshot_ci.test.mjs
      - name: Defer FAILED status on lost ACK and unavailable readback across restarts
        run: node supabase/tests/real_losing_failed_readback_outage_ci.test.mjs
      - name: Defer loser FAILED until Candidate ownership readback is proven
        run: node supabase/tests/real_candidate_owner_readback_outage_ci.test.mjs
