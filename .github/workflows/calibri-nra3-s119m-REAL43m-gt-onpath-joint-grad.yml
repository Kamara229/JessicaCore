name: Calibri S119m REAL original S142 43M GT ON-PATH layer5 shared gradients
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119l-real43m-gt-autoregressive-shadow-smoke-20261121
permissions:
  contents: read
  actions: read
jobs:
  original-12layer-deep-onpath-neural-core-nra3-npa-joint-grad:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s119m-true-onpath-interlayer-nra3-npa1-training-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '119126'
    steps:
      - name: Checkout exact frozen research PR commit, never release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original CB59 S142 43M GT native CPU research dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Immutable four hard gates + one model + true onpath interlayer test suite
        run: |
          python -m unittest -v \
            research.calibri_nra3.test_s119a_hard_four_goals \
            research.calibri_nra3.test_s119f_unified_core_gt_reasoning_joint \
            research.calibri_nra3.test_s119g_unified_planning_internal_action_neural_area \
            research.calibri_nra3.test_s119i_real12_contextual_structured_operator_ablation \
            research.calibri_nra3.test_s119j_real_native_bpe_target_context_ablation \
            research.calibri_nra3.test_s119k_actual43m_full_native_lm_head_shadow \
            research.calibri_nra3.test_s119l_real_native_autoregressive_shadow_generation \
            research.calibri_nra3.test_s119m_real43m_gt_interlayer_onpath_joint
      - name: Original CB61 compressed full CPU decoder and S93 original GT
        uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          run-id: 42681768394
          path: inputs/s93
          github-token: ${{ github.token }}
      - name: Exact physical original trained S142 augmented 43M FP16
        uses: actions/download-artifact@v4
        with:
          name: calibri-s142-one-j7-43m-dual-cone-456-128-no-QA
          run-id: 43078895081
          path: inputs/s142
          github-token: ${{ github.token }}
      - name: Original CB59 GT ALL12 native TRAIN-A source only S114
        uses: actions/download-artifact@v4
        with:
          name: calibri-nra3-s114-true-original12-CB59GT-SynTagRusA-NC256-sourceonly-53751-zeroTrust-after616
          run-id: 44621504675
          path: inputs/s114
          github-token: ${{ github.token }}
      - name: Physically saved FULL inherited S119k real-native-head old 53751 NPA RS research
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119k-ACTUAL-original-S142-43m-gt-full-native-vocab-TRAINonly-core-NRA3-NPA-shadow-GATE0
          run-id: 44926835474
          path: inputs/s119k
          github-token: ${{ github.token }}
      - name: Fail closed deny independent GOLD/previous sealed QA and any missing physical artifact
        run: |
          set -euo pipefail
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61
          test -f inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors
          test -f inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors
          test -f inputs/s114/NRA3_S114_SYNTAGRUS_TRAIN256_ALL12_ORIGINAL_H320_NO_GOLD.safetensors
          test -f inputs/s114/NRA3_S114_REAL43MGT_SYNTAGRUS_TRAIN256_ALLVERBS_SOURCE_PROVENANCE.json
          test -f inputs/s119k/S119K_ORIGINAL43M_GT_TRUE_FULL_NATIVE_HEAD_UNIFIED_SHADOW.safetensors
          test -f inputs/s119k/S119K_TRUE_NATIVE_FULL_VOCAB_SOURCE_TRAIN_ONLY_REPORT.json
          if find inputs -type f | grep -Ei 'S116|S117|S118|GOLD_LABEL|_UD_GOLD|SynTagRusB|EVAL128'; then
            echo 'Sealed independent GOLD or spent EVAL data not admissible' && exit 1
          fi
      - name: Train SAME neural module ON REAL original layer5 -> layers6-11 and genuine full native vocab; matched local ablation
        run: |
          python -m research.calibri_nra3.s119m_real43m_gt_interlayer_onpath_joint \
            --s93 inputs/s93/S93_UNACCEPTED_SELECTED_CB61.s61 \
            --s93-side inputs/s93/S93_UNACCEPTED_SELECTED_JOINT.safetensors \
            --s142 inputs/s142/S142_ACTUAL_43M_ONE_J7_FP16.safetensors \
            --source inputs/s114/NRA3_S114_SYNTAGRUS_TRAIN256_ALL12_ORIGINAL_H320_NO_GOLD.safetensors \
            --source-report inputs/s114/NRA3_S114_REAL43MGT_SYNTAGRUS_TRAIN256_ALLVERBS_SOURCE_PROVENANCE.json \
            --parent inputs/s119k/S119K_ORIGINAL43M_GT_TRUE_FULL_NATIVE_HEAD_UNIFIED_SHADOW.safetensors \
            --parent-report inputs/s119k/S119K_TRUE_NATIVE_FULL_VOCAB_SOURCE_TRAIN_ONLY_REPORT.json \
            --out results/s119m_original43m_gt_true_onpath
      - name: Archive onpath full learned NN research only; gate0, no actual promotion
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s119m-original43m-GT-real-onpath-layer5-NRA3-NPA1-RS-TRAINonly-fullVocab-gate0
          path: results/s119m_original43m_gt_true_onpath/
          retention-days: 30
          if-no-files-found: error
