name: Calibri Fusion Growth F01 physical lossless core budget
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-s119q2i8z120-GPT-eos-dose-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f01:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f01-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scope check
        run: |
          git diff --name-only 1b2343994c9b2f618b64c684f142966010c38be3 HEAD > /tmp/f01scope
          test "$(wc -l </tmp/f01scope)" -eq 3
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f01_physical_budget.py' -e 'research/calibri2/fusion_growth/README.md' -e '.github/workflows/calibri-fusion-growth-f01.yml' /tmp/f01scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s92-unaccepted-real-MPS-protected-core-and-tunnel
          run-id: 42681768394
          path: inputs/s93
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s142-one-j7-43m-dual-cone-456-128-no-QA
          run-id: 43078895081
          path: inputs/s142
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2i8z73-GPT-head-revival-FP16-G0
          run-id: 45439790187
          path: inputs/z73
          github-token: ${{ github.token }}
      - name: Measure actual physical bytes and reopen losslessly restored core
        run: python research/calibri2/fusion_growth/f01_physical_budget.py --root inputs --out results/f01
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          path: results/f01/
          retention-days: 30
          if-no-files-found: error
