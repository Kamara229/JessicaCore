name: CALIBRI S57 frozen S54 vs S56 96 unseen first-token generalization QA
on:
  push:
    branches:
      - research/calibri2-s57-frozen-unseen-first-token-audit-20261108
    paths:
      - 'research/calibri2/s57/**'
      - '.github/workflows/calibri2-s57-frozen-novel-first-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  s57_frozen_read_only_new_96_test:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install immutable CPU inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile only read-only S57, no S53 S55 S29 files imported
        run: python -m compileall -q research/calibri2/s57
      - name: Download physically packed immutable S45 source
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Download accepted S54 frozen rank12 controller
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s54-paid-controller-if-accepted
          path: inputs/s54
          run-id: 42516715008
          github-token: ${{ github.token }}
      - name: Download accepted S56 frozen paid dual controller
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Download exact S56 all-inclusive manifest
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-first-token-paid-TRAIN-and-physical-report-JSON
          path: inputs/s56_report
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: One-time 96 completely new QA, zero optimization, compare S54 vs S56
        run: |
          python research/calibri2/s57/frozen_unseen_first_token_AUDIT.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s54/S54_ACTIVE_GREEN_TUNNEL_RANK12.safetensors \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s56_report/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL_MANIFEST.json \
            results/s57
      - name: Preserve read-only independent 96 complete QA answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s57-frozen-readonly-unseen96-first-token-QA
          path: results/s57/*.json
          if-no-files-found: warn
          retention-days: 90
