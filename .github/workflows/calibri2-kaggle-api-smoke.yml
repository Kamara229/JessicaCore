name: CALIBRI 2.0 Kaggle API connection smoke test
'on':
  pull_request:
    branches:
      - research/calibri2-s58-frozen-first-paired-noun-replay-20261108
    paths:
      - .github/workflows/calibri2-kaggle-api-smoke.yml

permissions:
  contents: read

jobs:
  verify_kaggle_secret_and_readonly_api:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-kaggle-api-smoke-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Kaggle CLI
        run: python -m pip install --quiet kaggle
      - name: Verify modern Kaggle token against authenticated GPU quota API
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, re
          token=os.getenv("KAGGLE_API_TOKEN", "")
          if not token:
              print("KAGGLE_SECRET_MISSING")
              sys.exit(2)
          print("KAGGLE_SECRET_AVAILABLE")
          print("KAGGLE_TOKEN_FORMAT=" + (
              "modern_KGAT" if token.startswith("KGAT_") else
              "json_object_instead_of_token" if token.lstrip().startswith("{") else
              "legacy_or_other" ))
          for cmd,label in [
              (["kaggle","quota"],"AUTHENTICATED_QUOTA"),
              (["kaggle","config","view"],"CONFIG_VIEW"),
          ]:
              try:
                  r=subprocess.run(cmd, text=True,capture_output=True,timeout=45,check=False)
                  print("KAGGLE_"+label+"_EXIT="+str(r.returncode))
                  if r.returncode == 0:
                      print("KAGGLE_"+label+"_OK")
                      if label == "AUTHENTICATED_QUOTA":
                          print("KAGGLE_AUTHENTICATED_QUOTA_OK")
                          sys.exit(0)
                  else:
                      s=(r.stdout+"\n"+r.stderr).lower()
                      for text in ("authentication required","invalid token","unauthorized","forbidden","not configured","quota","error:"):
                          print("KAGGLE_"+label+"_SIGNAL_"+text.upper().replace(" ","_")+"="+str(text in s))
                      codes=re.findall(r"(?<!\d)(?:400|401|403|404|422|429|500|503)(?!\d)",s)
                      print("KAGGLE_"+label+"_HTTP_CODES="+(",".join(sorted(set(codes))) if codes else "none"))
                      error_lines=[v.strip() for v in (r.stderr or "").splitlines() if v.strip()]
                      if error_lines:
                          tail=error_lines[-1].replace(token,"[REDACTED]")
                          tail=re.sub(r"(?i)(Bearer\\s+)[^\\s]+",r"\\1[REDACTED]",tail)
                          tail=re.sub(r"(?i)KGAT_[A-Za-z0-9_-]+","[REDACTED]",tail)
                          tail=re.sub(r"[A-Za-z0-9_+/=-]{70,}","[LONG_VALUE]",tail)
                          print("KAGGLE_"+label+"_ERROR_TAIL_SAFE="+tail[:180])
              except subprocess.TimeoutExpired:
                  print("KAGGLE_"+label+"_TIMEOUT")
          print("KAGGLE_AUTH_NOT_VERIFIED")
          sys.exit(4)
          PY
