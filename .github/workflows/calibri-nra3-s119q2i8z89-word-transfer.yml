name: Calibri Z89 word transfer DEV preregistration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z88-GPT-short-word-physical-20261124
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z89-GPT-word-transfer-prereg-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict additive scope
        run: |
          set -euo pipefail
          git diff --name-only 92a1e2bf559e6021989aa592c2eaced5685e79a8 HEAD >/tmp/z89scope
          test "$(wc -l </tmp/z89scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z89_word_transfer_prereg.py' -e 'research/calibri_nra3/test_s119q2i8z89_word_transfer_prereg.py' -e '.github/workflows/calibri-nra3-s119q2i8z89-word-transfer.yml' /tmp/z89scope; then exit 1; fi
      - name: Install tokenizer dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Verify source disjointness, fixed scoring and native budget
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z89_word_transfer_prereg
          python -m research.calibri_nra3.s119q2i8z89_word_transfer_prereg
