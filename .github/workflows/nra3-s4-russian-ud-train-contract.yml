name: NRA2 3.0 S4 Russian UD TRAIN and causal tokenizer alignment only
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-nra3-s3-codebook-qat-physical-trainonly-20261115
permissions:
  contents: read
concurrency:
  group: nra3-s4-ru-ud-train-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ru_grammar_semantic_train_contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s4-ru-ud-train-causal-alignment-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only Calibri CB59 contract dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'tokenizers==0.20.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Real Russian TRAIN UD labels, fail-closed tokenizer, causal syntax supervision and packed native CPU parity
        run: python -m unittest -v research.nra3_s4.test_russian_ud_train
      - name: Preserve prior grammar bridge and full-6M native packed source integrity
        run: python -m unittest -v research.nra2_bridge.test_stage3ck_russian_ud_role_bridge research.nra3_s2.test_native_cpu
      - name: Physically precommit only permitted Russian UD TRAIN text SHA, no EVAL or parser training
        run: python -m research.nra3_s4.emit_train_prereg --out results/nra3_s4/NRA3_S4_RU_UD_TRAIN12_PREREG.json
      - name: Verify no accepted candidate or cross-eval claims
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("results/nra3_s4/NRA3_S4_RU_UD_TRAIN12_PREREG.json")
          m=json.loads(p.read_text())
          assert m["row_count"]==12 and len(m["ordered_prompt_sha256"])==12
          assert m["independent_EVAL_count"]==0 and m["QAT_training_performed"] is False
          assert m["spent_five_EVAL128_not_loaded"] is True
          assert m["reserved_sixth_S3CI_EVAL128_not_loaded"] is True
          assert m["actual_43M_Calibri_hidden320_captured"] is False
          assert m["output_gate"]==0 and m["candidate_accepted"] is False
          print("NRA3_S4_RUSSIAN_UD_TRAIN12_NO_EVAL_NO_MODEL_QAT_NO_PROMOTION",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NRA3_S4_RUSSIAN_UD_TRAIN12_PREREG_NO_EVAL_NO_MODEL
          path: results/nra3_s4
          if-no-files-found: error
          retention-days: 14
