name: CALIBRI v163 real source-paid block0 SciQ BoolQ and autoregressive generation
on:
  pull_request:
    paths:
      - 'research/calibri/v163/**'
      - 'research/calibri/test_v163_paid_block0_semantics.py'
      - '.github/workflows/calibri-pro-max-v163.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_paid_layer0_semantic_qa_and_native_greedy:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153
      REPORT: inputs/v161/v161_original_block0_source_operator_valid.json
      SEAL: inputs/v161/v161_source_only_layer0_frozen_before_VALID.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen original SmolLM2 CPU and validation-only dataset dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - name: Verify fixed fresh SciQ BoolQ question rows and all greedy source prompts
        run: python -m unittest test_v163_paid_block0_semantics -v
      - name: Compare actual FP32, native CB59 and paid CB161 on unseen QA and full 32token generation
        run: python -m v163.run "$SOURCE" "$REPORT" "$SEAL" results/v163
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v163-real-fully-paid-block0-semantics-and-greedy
          path: results/v163/
          if-no-files-found: warn
          retention-days: 30
