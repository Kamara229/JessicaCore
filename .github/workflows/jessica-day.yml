name: Jessica Daytime Self-Audit (API free)
run-name: Jessica Day #${{ inputs.issue }} / ${{ inputs.goal }}
on:
  workflow_dispatch:
    inputs:
      issue:
        required: false
        default: '0'
        type: string
        description: 0 for owner-run GitHub UI launch; otherwise trusted issue
      goal:
        required: true
        type: choice
        options: [auto, language, context, foundations]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: jessica-daytime-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DAY_ISSUE: ${{ inputs.issue }}
      DAY_GOAL: ${{ inputs.goal }}
    steps:
      - name: Checkout (no stored credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner-authorized daytime request
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/day/verify.mjs
      - name: Set up no-API Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax verification of foundations and chat
        run: |
          for f in backend/core/foundations/*.js backend/core/chat/*.js backend/core/language/*.js; do
            node --check "$f"
          done
      - name: Create one deterministic regression improvement
        run: node .github/day/prepare.mjs "$DAY_GOAL"
      - name: Verify no protected files were modified
        run: node .github/day/guard.mjs
      - name: Install test dependencies without lifecycle scripts
        run: npm install --prefix backend --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Run fixed base regressions and new daytime checks
        run: |
          node .github/codex/guard-tests.mjs
          for f in backend/scripts/regressionDay*.test.js; do
            if test -f "$f"; then node --test "$f"; fi
          done
      - name: Identify real improvement candidate
        id: improvement
        run: |
          candidate=$(git ls-files --others --exclude-standard -- backend/scripts/ | head -n 1)
          if [ -n "$candidate" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open reviewable PR for tested regression improvement
        if: steps.improvement.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -c "day/run-$GITHUB_RUN_ID"
          git add backend/scripts/regressionDay*.test.js
          git config user.name "Jessica Day Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Jessica API-free daytime regression improvement: $DAY_GOAL"
          gh auth setup-git
          git push -u origin HEAD
          pr_url=$(gh pr create --base main --head "day/run-$GITHUB_RUN_ID" --title "[Jessica Day] $DAY_GOAL regression improvement" --body "Generated by deterministic, API-free Jessica daytime checks. Tests passed. No automatic merge or deployment. Daytime GitHub Actions run $GITHUB_RUN_ID")
          echo "### Jessica Daytime: tests passed. Review PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DAY_ISSUE" != "0" ]; then
            gh issue comment "$DAY_ISSUE" --body "[Jessica] API-free checks passed. One verified regression improvement: $pr_url. No automatic merge/deploy."
          fi
      - name: Summarize no-change audit
        if: steps.improvement.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Jessica Daytime: checks passed; no unverified changes proposed." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DAY_ISSUE" != "0" ]; then
            gh issue comment "$DAY_ISSUE" --body "[Jessica] Daytime syntax and regressions passed. All known test recipes installed or already present. No model API used."
          fi
      - name: Finish trusted session
        if: always() && steps.verify.outcome == 'success' && inputs.issue != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY_RESULT: ${{ job.status }}
        run: |
          if [ "$DAY_RESULT" != "success" ]; then
            gh issue comment "$DAY_ISSUE" --body "[System] Daytime verification failed. No changes were merged/deployed. Inspect the Actions run to find the first failing step." || true
          fi
          gh issue close "$DAY_ISSUE" --reason completed || true
