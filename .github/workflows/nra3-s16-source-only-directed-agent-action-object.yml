name: NRA2 3.0 S16 source only directed predicate agent action object 72 TRAIN FP16 contract
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s15c-once-newru24-frozen-s14-true43m-eval-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s16-directed-role-graph-only-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  directed_verb_argument_72_original_TRAIN_only_no_eval:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s16-directed-agent-action-object-trainonly-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:research:research/calibri
      PYTHONHASHSEED: '316001'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve frozen post-S15c no-quality-gain report, S9 original 72 TRAIN only; no heldout access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43743397331 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43731968521 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43740415883 --jq .conclusion)" = success
          echo S16_SOURCE_ONLY_AFTER_S15C_EVAL24_CONSUMED_ORIGINAL_S9_72_TRAIN
      - name: Install original source-only Russian UD and tiny FP16 physical ABI test dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Source-only strict train edge labels and real paid 2309parameter causal predicate argument inference contracts
        run: |
          python -m compileall -q research/nra3_s16
          python -m unittest -v research.nra3_s16.test_directed_valence_source
      - name: Seal only preexisting 72 Russian TRAIN directed predicate agent patient recipient source gold SHA, no inference
        run: |
          python -m research.nra3_s16.emit_train72_source \
            --out results/nra3_s16/NRA3_S16_DIRECTED_PREDICATE_ARGUMENT_S9_TRAIN72_ONLY_MANIFEST.json
      - name: Explicit no EVAL, no Calibri43M, no model scoring, physical FP16 accounting and valence direction tests
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from research.nra3_s16.paid_directed_valence import (
              PaidDirectedValence,PARAMETERS,PHYSICAL_BYTES,ROLES)
          from research.nra3_s16.direct_train72_edges import (
              build_directed_train72,canonical_directed_train72,sealed_directed_train72,
              S16_TRAIN_SOURCE_SHA)
          root=Path("results/nra3_s16")
          r=json.loads((root/"NRA3_S16_DIRECTED_PREDICATE_ARGUMENT_S9_TRAIN72_ONLY_MANIFEST.json").read_text(encoding="utf-8"))
          gold=json.loads((root/"NRA3_S16_DIRECTED_AGENT_ACTION_OBJECT_TRAIN72_FULL_GOLD.json").read_text(encoding="utf-8"))
          assert r==sealed_directed_train72()
          assert len(gold)==72 and r["S16_source_rows"]==72
          sha=hashlib.sha256(canonical_directed_train72(build_directed_train72())).hexdigest()
          assert sha==r["S16_complete_predicate_to_argument_gold_source_sha256"]
          assert S16_TRAIN_SOURCE_SHA=="9843c35ee9aa75b8f5c9c963e441589dd2f0292e41ec7933971d5aa3dcd365d6"
          assert sha==S16_TRAIN_SOURCE_SHA
          assert sum(r["S16_gold_directed_role_counts"].values())==r["S16_gold_directed_links"]
          assert set(r["S16_gold_directed_role_counts"])==set(ROLES[1:])
          assert r["S16_source_lexical_families"]==12 and r["S16_source_constructions"]==6
          assert PARAMETERS==2309 and PHYSICAL_BYTES==4665
          p=PaidDirectedValence().physical_bytes()
          assert len(p)==4665 and PaidDirectedValence.from_physical(p).physical_bytes()==p
          assert r["S16_original_Calibri43M_GT_NRA_C_data_loaded"] is False
          assert r["S16_existing_train72_only"] and r["S16_future_argument_unavailable_until_current_word"]
          assert r["S16_used_consumed_S15c_EVAL24"] is False
          assert r["S16_used_consumed_S12c_EVAL16"] is False
          assert r["S16_used_old_five_EVAL128_or_reserved_sixth_S3CI"] is False
          assert r["S16_optimizer_steps"]==0
          assert r["candidate_accepted"] is False and r["output_gate"]==0 and r["activation_allowed"] is False
          assert not any(Path("inputs",p).exists() for p in ("nra3_s12c","nra3_s15c","nra3_s15b"))
          print("S16_SHA_PIN_PRETRAIN_EXISTING72_PREDICATE_ARG_DIRECTED_AGENT_PATIENT_RECIPIENT_SOURCE",sha,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s16-directed-agent-action-patient-original72TRAIN-sha-noeval-zero-gate
          path: results/nra3_s16/
          retention-days: 30
          if-no-files-found: error
