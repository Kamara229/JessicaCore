name: CALIBRI v230 first-wrong-token paid CB59 answer restoration
on:
  push:
    branches:
      - 'research/calibri-pro-max-v230-first-error-paid-gold-restoration'
    paths:
      - 'research/calibri/v230/**'
      - '.github/workflows/calibri-pro-max-v230.yml'
  pull_request:
    branches:
      - 'research/calibri-pro-max-v229-first-error-gold-margin-audit'
    types: [opened, synchronize, reopened]
    paths:
      - 'research/calibri/v230/**'
      - '.github/workflows/calibri-pro-max-v230.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore_full_answers_in_original_paid_codebooks:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original 135M CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Verify research code syntax
        run: |
          python -m compileall -q research/calibri/v230
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v228-TRAIN-paid-211-recovery-full-answer-gate
          path: inputs/v228
          run-id: 42336914724
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v229-sealed-source-48-TRAIN-first-error-margins
          path: inputs/v229
          run-id: 42338015526
          github-token: ${{ github.token }}
      - name: Train paid 211 dictionaries on original first wrong TRAIN tokens and gate complete answers
        run: |
          python research/calibri/v230/run.py inputs/v228/CALIBRI_v228_TRAIN_ACCEPTED_fullanswer_paid_211.cb59 inputs/v229/ACTUAL_v229_sealed_v220_v228_48_full_TRAIN_first_error_margins.json results/v230
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v230-first-wrong-paid-211-48-full-TRAIN-answer-gate
          path: results/v230/
          if-no-files-found: warn
          retention-days: 45
          compression-level: 0
