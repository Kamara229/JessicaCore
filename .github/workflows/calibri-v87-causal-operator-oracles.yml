name: CALIBRI v87 - original 135M TRAIN causal operator oracles

on:
  pull_request:
    paths:
      - 'research/calibri/v87/**'
      - 'research/calibri/causal_rewrite_v87.py'
      - 'research/calibri/test_v87_causal_oracles.py'
      - 'research/calibri/SESSION_87.md'
      - '.github/workflows/calibri-v87-causal-operator-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original_135m_train_only_causal_operator_diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned pretrained original CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Syntax and four original pure numeric / rollback regressions
        run: |
          python -m compileall -q research/calibri/v87 research/calibri/causal_rewrite_v87.py research/calibri/test_v87_causal_oracles.py
          python -m unittest discover -s research/calibri -p test_v87_causal_oracles.py -v
      - name: Retrieve exact immutable native CB59 and frozen adaptive CB85
        run: |
          mkdir -p input/v85 results/v87
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          gh run download 41578432949 --repo "$GITHUB_REPOSITORY" --name calibri-v85-full-native-conditional-source-physical-TRAIN-VALID --dir input/v85
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s input/v85/v85_RESEARCH_only_conditional_native_source.cb85
      - name: Real pretrained model original TRAIN full-model FP32 causal counterfactuals
        run: |
          python research/calibri/causal_rewrite_v87.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --adaptive input/v85/v85_RESEARCH_only_conditional_native_source.cb85 --output results/v87
          test -s results/v87/v87_original_TRAIN_FP32_oracle_diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v87-genuine-original-135m-TRAIN-only-causal-oracle-diagnostics
          path: results/v87/v87_original_TRAIN_FP32_oracle_diagnostics.json
          retention-days: 7
          if-no-files-found: ignore
