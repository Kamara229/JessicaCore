name: Calibri Z82 saved own-prefix first-error forensic audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z81-GPT-Z75-ownprefix-20261124
permissions:
  contents: read
  actions: read
jobs:
  forensic:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z82-GPT-ownprefix-first-error-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:research:research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict additive scope
        run: |
          set -euo pipefail
          git diff --name-only e3c4b56e896767de464b250aec3296dbd923a89a HEAD >/tmp/z82scope
          test "$(wc -l </tmp/z82scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z82_first_error.py' -e 'research/calibri_nra3/test_s119q2i8z82_first_error.py' -e '.github/workflows/calibri-nra3-s119q2i8z82-first-error.yml' /tmp/z82scope; then exit 1; fi
      - name: Install tokenizer imports
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2i8z76-GPT-ownprefix-TRAIN42-G0
          run-id: 45466960721
          path: inputs/z76
          github-token: ${{ github.token }}
      - name: Analyze saved responses only; no physical model
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z82_first_error
          python -m research.calibri_nra3.s119q2i8z82_first_error --report inputs/z76/S119Q2I8Z76_GPT_HEAD_OWNPREFIX_TRAIN42.json --out results/z82/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q2i8z82-GPT-first-error-G0
          path: results/z82/
          if-no-files-found: error
