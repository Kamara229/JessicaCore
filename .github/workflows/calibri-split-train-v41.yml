name: CALIBRI v0.41 - all12 real MLPs split TRAIN-A/B, one-shot gate, new SQuAD PPL
on:
  pull_request:
    paths:
      - 'research/calibri/split_train_gate_squad_v41.py'
      - 'research/calibri/compare_split_train_v41.py'
      - 'research/calibri/SESSION_41.md'
      - '.github/workflows/calibri-split-train-v41.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pretrained-MLP-split-train-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned pretrained Pythia WikiText SQuAD dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Fit 2048 TRAIN-A, once gate on disjoint 2048 TRAIN-B; first SQuAD PPL
        run: |
          python research/calibri/split_train_gate_squad_v41.py \
            --output results/calibri_v41_split_train_squad.json \
            --train-tokens 4096 --dev-tokens 1024 --new-tokens 2048 --context 128
      - name: Preserve all physical signed 3-4 bit 12-MLP CB36 bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v41-${{ matrix.os }}
          path: |
            results/calibri_v41_split_train_squad.json
            results/local_uncalibrated.bin
            results/local_trainA_calibrated.bin
            results/joint_trainA_calibrated_UNGATED.bin
            results/joint_trainA_calibrated_GATED.bin
            results/INT4_higher_rate_anchor.bin
          if-no-files-found: ignore
          retention-days: 14
  cross-cpu-check-unseen-test:
    needs: real-pretrained-MLP-split-train-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v41-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Validate physical CB36 per-module exact byte budget and split TRAIN gate
        run: |
          python research/calibri/compare_split_train_v41.py \
            --a results/runs/calibri-v41-ubuntu-22.04/calibri_v41_split_train_squad.json \
            --b results/runs/calibri-v41-ubuntu-24.04/calibri_v41_split_train_squad.json \
            --output results/calibri_v41_crosshost.json
      - name: Keep independent check and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v41-crosshost-verdict
          path: results/calibri_v41_crosshost.json
          if-no-files-found: ignore
          retention-days: 14
