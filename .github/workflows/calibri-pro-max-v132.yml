name: CALIBRI v132 frozen paid-body/head EOS interaction map
on:
  pull_request:
    paths:
      - 'research/calibri/v132/**'
      - 'research/calibri/test_v132_ablation.py'
      - '.github/workflows/calibri-pro-max-v132.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paid_body_ablations:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - name: Regression-check six fixed 5-layer bands and both-sided cases
        run: python -m unittest test_v132_ablation -v
      - name: Causal proximity map using frozen archive and native first-token EOS
        run: python -m v132.run "$HOST" results/v132
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v132-native-body-head-interaction
          path: results/v132/
          if-no-files-found: warn
          retention-days: 30
