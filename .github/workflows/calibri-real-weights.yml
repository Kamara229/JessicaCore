name: CALIBRI v0.7 - real open weights (isolated)
on:
  pull_request:
    paths:
      - 'research/calibri/**'
      - '.github/workflows/calibri-real-weights.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only research dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Deterministic codec tests
        run: python -m unittest discover -s research/calibri -p 'test_*.py' -v
      - name: Benchmark on public Pythia-14M safetensors
        run: python research/calibri/benchmark.py --output results/calibri_v07_pythia14m.json
      - name: Upload JSON research results (not model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v07-pythia14m-results
          path: results/*.json
          if-no-files-found: ignore
          retention-days: 14
