name: Calibri NRA3 S99 TRUE original12 Taiga TRAIN-b morphology pretrain and neural UD roles TRAIN-only
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s98-real12-TaigaB256-morphology-sourceonly-20261119
permissions:
  contents: read
  actions: read
concurrency:
  group: calibri-nra3-s99-REAL12-UD-B-morphTRAIN-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  train_ONLY_NEW_IN_CALIBRI_28887_morphology_then_roles_using_SHA_frozen_original12:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s99-morphology-pretrain-real12-UDtrainB-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONPATH: .:research
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '991119'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU-only new neural child training; never unfreeze original Calibri CB59+GT
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'safetensors==0.4.5' 'numpy==1.26.4'
      - name: Check S97 NEW licensed Taiga TRAIN-b, S98 original TRUE all12 protected616 and S99 zero-oracle nativeBPE ABI all previously SUCCESS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 44569179069 44572723983 44573106263; do
            test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/"${id}" --jq .conclusion)" = success
          done
          echo NRA3_S99_TRUE_ORIGINAL12_616_PROTECTED_SEPARATE_GOLD_AFTER_SOURCE_ONLY
      - name: Read S99 fixed 10 morphology +24 joint script/test and fail-closed original BPE target contract
        run: |
          set -euo pipefail
          python -m compileall -q research/calibri_nra3/s99_REAL12_Taiga_B_morph_pretrain_then_role_28887_ONLY.py research/calibri_nra3/s99_nativeBPE_UD_morphology_labels_AFTER_frozen_original.py research/calibri_nra3/s99_offline_morphology_native_BPE_TRAIN_loss.py
          python -m unittest -v research.calibri_nra3.test_s99_source_SHA_then_offline_native_BPE_morphology research.calibri_nra3.test_s99_FIXED_morph_pretrain_vs_role_only_original12
      - name: Download ONLY actual true original12 frozen Calibri+GT Taiga TRAIN-b native BPE source and untrained IN-model morphology FP16 child; no GOLD
        uses: actions/download-artifact@v4
        with:
          name: calibri-nra3-s98-true43MGT-TaigaTRAINb256-MORPH-sourceonly-all12-28887-neural-after616
          run-id: 44572723983
          github-token: ${{ github.token }}
          path: inputs/S98_TRUE_ORIGINAL_Calibri12_Taiga_B_goldblind
      - name: Verify true physical protected616 original Calibri 12-layer 30,358 BPE and untrained 28,887 child SHA BEFORE opening UD labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,torch
          from pathlib import Path
          from safetensors.torch import load_file
          d=Path('inputs/S98_TRUE_ORIGINAL_Calibri12_Taiga_B_goldblind')
          src=d/'NRA3_S98_TAIGA_TRAINB256_REAL12_ORIGINAL_H320_NO_UD_GOLD.safetensors'
          child=d/'NRA3_S98_IN_CALIBRI_UNTRAINED_MORPH_28887_FP16.safetensors'
          r=json.loads((d/'NRA3_S98_REAL43MGT_TAIGA_TRAINB256_ALL12_SOURCEONLY_PROVENANCE.json').read_text())
          assert r['stage']=='CALIBRI_NRA3_S98_REAL43MGT_ALL12_TAIGA_TRAINB256_MORPH_SOURCE_ONLY_AFTER616'
          assert r['S97_TAIGA_TRAIN_B_PINNED_SOURCE256_SHA256']=='437b6d62564e4cda6c58975910ccc98221c3e81938bda22429418f16700b1dad'
          assert r['ALL12_CPU_SAFETENSORS_SHA256']==hashlib.sha256(src.read_bytes()).hexdigest()
          assert r['ALL12_CPU_SAFETENSORS_SHA256']=='2076cbbfc7bd9786af801004ac61bfe541ef3e58ff0cbeab604856b784411637'
          assert r['IN_CALIBRI_28887_MORPH_FP16_WEIGHTS_SHA256']==hashlib.sha256(child.read_bytes()).hexdigest()
          assert r['IN_CALIBRI_28887_MORPH_FP16_WEIGHTS_SHA256']=='05b657b2f9e7bf4fc647e798bcbf7d2c01de3eeebd35d4fdd567b8d54306bb4d'
          assert r['n_pinned_source_only_rows']==256
          assert r['n_accepted_source_only_BPE_rows']==255 and r['n_excluded_due_to_input_BPE_preflight']==1
          assert r['n_genuine_original_native_BPE_tokens']==30358
          assert r['old_616_J7_physically_replayed_BEFORE_NRA3_hooks']
          assert r['all_original_43M_GT_CB59_params_sha_pre_and_post_identical']
          assert r['original_S5_H8_port_exactly_matches_all12_H8_for_all_accepted']
          assert r['NRA3_morph_neural_28887_weights_REGISTERED_INSIDE_actual_Calibri_model']
          assert r['eight_original_NRA2_neural_miniareas_still_embedded']
          assert r['source_only_no_Taiga_TRAIN_B_UD_morph_or_role_GOLD_loaded_during_CPU']
          assert r['old_S79_S86_and_S96_internal_dev_NEVER_reused']
          assert r['new_NRA3_train_steps']==0 and r['output_gate']==0
          assert not r['candidate_accepted'] and not r['activation_allowed']
          t=load_file(str(src));w=load_file(str(child))
          h=t['original_Calibri43M_GT_ALL12_native_H320_FP16_READONLY']
          assert h.shape[0:2]==(255,12) and h.shape[-1]==320 and h.dtype==torch.float16
          assert int(t['native_BPE_source_valid_mask'].sum())==30358
          assert sum(z.numel() for z in w.values())==28887
          assert all(k.startswith('model.nra3_neural_weights.') for k in w)
          print('S99_PINNED_SOURCE_FIRST_255_REAL12_30358_BPE_SHA_28887_IN_CALIBRI_616_PROTECTED_NO_GOLD')
          PY
      - name: Download separately SHA-precommitted licensed S97 Taiga TRAIN-b UD morph and dependency gold ONLY AFTER immutable true S98 source verification
        uses: actions/download-artifact@v4
        with:
          name: calibri-nra3-s97-REAL-UD-Taiga-TRAINb256-new-MORPH-source-and-separate-GOLD-CC-BY-SA-RESEARCH-only
          run-id: 44569179069
          github-token: ${{ github.token }}
          path: inputs/S97_separate_offline_Taiga_B_only_AFTER_source_sha
      - name: Train 28,887 NEW in-Calibri neural weights, fixed 10 epochs UPOS Case Number Voice THEN 24 joint morphology+role, untouched old CB59/GT
        run: |
          set -euo pipefail
          python -m research.calibri_nra3.s99_REAL12_Taiga_B_morph_pretrain_then_role_28887_ONLY \
            --s98-source inputs/S98_TRUE_ORIGINAL_Calibri12_Taiga_B_goldblind/NRA3_S98_TAIGA_TRAINB256_REAL12_ORIGINAL_H320_NO_UD_GOLD.safetensors \
            --s98-report inputs/S98_TRUE_ORIGINAL_Calibri12_Taiga_B_goldblind/NRA3_S98_REAL43MGT_TAIGA_TRAINB256_ALL12_SOURCEONLY_PROVENANCE.json \
            --s98-child inputs/S98_TRUE_ORIGINAL_Calibri12_Taiga_B_goldblind/NRA3_S98_IN_CALIBRI_UNTRAINED_MORPH_28887_FP16.safetensors \
            --s97-dir inputs/S97_separate_offline_Taiga_B_only_AFTER_source_sha \
            --out results/S99_REAL12_Taiga_B_in_calibri_MORPH_then_ROLES_28887_shadow
      - name: Audit trained FP16 child 28,887 and full unbiased TRAIN vs disjoint internal Taiga-B diagnostic including regressions NO acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,math
          from pathlib import Path
          from safetensors.torch import load_file
          d=Path('results/S99_REAL12_Taiga_B_in_calibri_MORPH_then_ROLES_28887_shadow')
          w=d/'NRA3_S99_TAIGA_B_IN_CALIBRI_TRAINED_MORPH_RELATION_28887_FP16.safetensors'
          p=json.loads((d/'NRA3_S99_REAL12_MORPH_PRETRAIN_AND_GRAMMATICAL_INTERNAL_DIAGNOSTICS.json').read_text())
          assert p['stage']=='CALIBRI_NRA3_S99_NEW_TAIGA_TRAIN_B_REAL12_MORPH_PRETRAIN_THEN_UD_ROLE_28887_FP16'
          assert p['S98_original_true12_source_SHA']=='2076cbbfc7bd9786af801004ac61bfe541ef3e58ff0cbeab604856b784411637'
          assert p['S98_original_untrained_morph_28887_child_SHA']=='05b657b2f9e7bf4fc647e798bcbf7d2c01de3eeebd35d4fdd567b8d54306bb4d'
          assert p['S99_new_trained_morph_28887_child_SHA']==hashlib.sha256(w.read_bytes()).hexdigest()
          assert p['new_neural_in_Calibri_trainable_parameters']==28887
          assert p['new_nominal_FP16_weight_bytes']==57774
          assert sum(z.numel() for z in load_file(str(w)).values())==28887
          assert p['new_in_calibri_neural_UPOS_Case_Number_Voice_heads']
          assert p['eight_old_NRA2_neural_mini_areas_preserved']
          assert p['learned_router_all_original12_Calibri_layers']
          assert p['only_NEW_child_neural_weights_trained_BASE_Calibri_GT_frozen']
          assert p['original_Calibri_616_J7_frozen_precheck']
          assert p['gold_loaded_ONLY_after_S98_true_original12_physical_SHA_verified']
          assert p['license_CC_BY_SA_attribution_review_no_commercial_use']
          assert p['S96_old_same_Taiga_train_a_internal_dev_SPENT_not_reused']
          assert p['S79_S86_old_firstreads_SPENT_not_reused']
          assert p['Taiga_original_upstream_dev_test_NEVER_loaded']
          assert p['fixed_stage_schedule_no_hparam_or_checkpoint_tuning']
          assert p['metrics_NOT_independent_factuality_or_user_event_QA_test']
          assert p['protected_active_candidate_616_NOT_validated']
          assert p['all_in_bpp_cpu_online_causal_NOT_certified']
          assert p['train_config_FIXED']['morphology_epochs']==10
          assert p['train_config_FIXED']['morph_and_role_joint_epochs']==24
          assert p['output_gate']==0 and not p['candidate_accepted'] and not p['activation_allowed']
          assert p['source_S99_alignment_coverage']['n_native_BPE_mapping_eligible']>=192
          for label in ('S98_random_untrained_same_Taiga_B_INTERNAL_DIAG',
                        'S99_trained_same_Taiga_B_INTERNAL_DIAG',
                        'S99_trained_Taiga_B_TRAIN_ONLY'):
              x=p[label]
              for item in x['per_original_BPE_UD_morph_tag_accuracy'].values():
                if item['support']:
                  assert 0<=item['accuracy']<=1 and math.isfinite(item['accuracy'])
          print('S99_REAL12_NEURAL_MORPH_SOURCE_RUSSIAN_UD_TAIGA_B_TRAIN_ONLY',
                'initial_internal=',p['S98_random_untrained_same_Taiga_B_INTERNAL_DIAG'],
                'trained_internal=',p['S99_trained_same_Taiga_B_INTERNAL_DIAG'],
                'TRAIN=',p['S99_trained_Taiga_B_TRAIN_ONLY'],
                'ZERO_GATE_UNACCEPTED',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-nra3-s99-TRUE-CB59-GT-12layer-TaigaB-morph-28887-FP16-inmodel-TRAINshadow-noProd
          path: results/S99_REAL12_Taiga_B_in_calibri_MORPH_then_ROLES_28887_shadow/
          retention-days: 30
          if-no-files-found: error
