name: CALIBRI v217 exact original-weight codebook refit <=0.668 bpp
on:
  push:
    branches:
      - 'research/calibri-pro-max-v217-exact-source-codebook-refit'
    paths:
      - 'research/calibri/v217/**'
      - '.github/workflows/calibri-pro-max-v217.yml'
  pull_request:
    paths:
      - 'research/calibri/v217/**'
      - '.github/workflows/calibri-pro-max-v217.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_FP32_source_weight_refit_with_existing_5bit_indices:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned 135M FP32 and actual CB59 native CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Validate v217 source-only weighted-codebook fit
        run: |
          python -m compileall -q research/calibri/v217
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v206-original-135m-first-divergence-48step-native-QA
          path: inputs/v206
          run-id: 42255701945
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v193-actual-original-135M-vs-360M-frozen-grader-new-96QA
          path: inputs/v193
          run-id: 42095901870
          github-token: ${{ github.token }}
      - name: Recover codebooks from every original weight group without new bits; SHA-seal then score native QA and CPU
        run: |
          python research/calibri/v217/run.py inputs/v206/CALIBRI_v206_guarded_48step_135M.cb59 inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153 inputs/v193/v193_original_FP32_135M_vs_360M_new_96QA_complete.json results/v217
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v217-original-FP32-all-assigned-codebook-refit-native-QA
          path: results/v217/
          if-no-files-found: warn
          retention-days: 45
          compression-level: 0
