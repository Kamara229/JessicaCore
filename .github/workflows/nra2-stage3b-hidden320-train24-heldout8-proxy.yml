name: NRA2 S3B real hidden320 proxy adapter 24 train 8 heldout frozen graph NRA
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra2-s3-real-hidden-bridge-data-20261113
permissions:
  contents: read
  actions: read
concurrency:
  group: nra2-s3b-hidden320-graph-proxy-only
  cancel-in-progress: false
jobs:
  independent_s3b_train24_heldout8:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s3b-frozen-relational-adapter-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal deterministic CPU adapter dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'safetensors==0.4.5'
      - name: S3B independent 24/8, zero gate and frozen pretrained NRA unit tests
        run: |
          python -m unittest -v research.nra2_bridge.test_stage3b_relational_adapter
      - name: Download immutable real CPU S3A FP16 TRAIN inputs and 584 parity audit
        uses: actions/download-artifact@v4
        with:
          name: nra2-stage3a-real43M-32train-320d-fp16-616-j7
          path: inputs/nra2_stage3a
          run-id: '43480311111'
          github-token: ${{ github.token }}
      - name: Download independently trained physical pretrained graph NRA
        uses: actions/download-artifact@v4
        with:
          name: nra2-standalone-relational-cpu-research-only
          path: inputs/nra2
          run-id: '43446925758'
          github-token: ${{ github.token }}
      - name: Train only 320D-to-graph proxy, 24 TRAIN, evaluate untouched 8 once
        run: |
          python -m research.nra2_bridge.stage3b_relational_adapter \
            inputs/nra2_stage3a inputs/nra2 results/nra2_stage3b
      - name: Audit physical FP16 sidecar and no acceptance or Calibri changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/nra2_stage3b/NRA2_S3B_24TRAIN_8HELDOUT_PROXY_AUDIT.json')
          r=json.loads(p.read_text())
          assert r['train24_count']==24 and r['heldout8_count']==8
          assert r['newly_trained_adapter'] and r['sidecar_fp16_reload_verified']
          assert r['train_loss_after']<r['train_loss_before']
          assert r['pretrained_nra_frozen_unchanged'] and r['underlying_calibri_43M_frozen_and_unloaded']
          assert r['original_S3A_584_unchanged_evidence_pinned']
          assert r['output_gate']==0.0 and not r['candidate_model_accepted']
          assert not r['semantic_relational_graph_alignment_confirmed']
          assert not r['original_584_replayed_in_S3B'] and not r['S3B_real_CPU_new32_or_candidate_bpp_tested']
          assert len(r['train24_hashes'])==24 and len(r['heldout8_hashes'])==8
          assert not set(r['train24_hashes'])&set(r['heldout8_hashes'])
          assert 0<=r['heldout_direct_edge_accuracy']<=8
          print('S3B_RESEARCH_ONLY_24_8_FROZEN_GRAPH_ZERO_GATE_PROXY_PASS')
          PY
      - name: Preserve physical S3B research-only proxy evidence
        uses: actions/upload-artifact@v4
        with:
          name: nra2-stage3b-hidden320-graph-proxy-24train-8heldout-zero-gate-fp16
          path: results/nra2_stage3b/
          retention-days: 90
          if-no-files-found: error
