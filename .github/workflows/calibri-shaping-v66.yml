name: CALIBRI v66 - bit-neutral functional index noise shaping on actual 135M

on:
  pull_request:
    paths:
      - 'research/calibri/noise_shaping_v66.py'
      - 'research/calibri/SESSION_66.md'
      - '.github/workflows/calibri-shaping-v66.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-trained-signal-guided-index-shaping-and-full-source-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original CPU torch and WikiText source
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Validate forward/reverse code reassignment and exact K32 packed length on synthetic samples
        run: |
          python -m py_compile research/calibri/noise_shaping_v66.py
          python research/calibri/noise_shaping_v66.py --smoke
      - name: Get the pinned REAL trained 135M physical CB59 archive
        run: |
          gh run download 41507201766 \
            --repo "$GITHUB_REPOSITORY" \
            --name calibri-v59-ubuntu-22.04 \
            --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
      - name: On real teacher TRAIN signals, modify exactly 64 source rows per four layers WITHOUT extra bits
        run: |
          python research/calibri/noise_shaping_v66.py \
            --source input/CALIBRI_v59_full_direct_sub070.cb59 \
            --output results/calibri_v66_noise_shaping.json \
            --candidate results/CALIBRI_v66_full_bit_neutral.cb59
      - name: Preserve physically complete checksum-validated same-rate pretrained source and honest heldout metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v66-true-full-135m-bit-neutral-shaping
          path: |
            results/calibri_v66_noise_shaping.json
            results/CALIBRI_v66_full_bit_neutral.cb59
          retention-days: 7
          if-no-files-found: ignore
