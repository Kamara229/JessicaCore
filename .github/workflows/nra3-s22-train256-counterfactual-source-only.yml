name: NRA3 S22 256 NEW synthetic counterfactual TRAIN-only event graphs
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s21-s20d-heldout-coverage-audit-20261118
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s22-TRAIN256-only
  cancel-in-progress: true
jobs:
  source_only_counterfactual_train256:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: .:research:research/calibri
      PYTHONHASHSEED: '320256'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require completed S21 actual S20d diagnostic; do not touch original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44187234478 --jq .conclusion)" = success
          echo NRA3_S21_ACTUAL_S20D_SUPPORT_AUDIT_CONFIRMED
      - name: Run S22 256 TRAIN graph source and counterfactual coverage unit tests
        run: |
          python -m compileall -q research/nra3_s20
          python -m unittest -v research.nra3_s20.test_s20_train96_source_contract research.nra3_s20.test_s22_counterfactual_train256_contract
      - name: Emit explicit source SHA, contracts, and original graph gold (NEVER model inputs)
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          from research.nra3_s20.s22_new256_counterfactual_train_graph_source import (
              manifest,build_s22_train256,FROZEN_S22_TRAIN256_SHA256)
          report=manifest()
          rows=build_s22_train256()
          assert report["stage"]=="NRA3_S22_NEW256_SYNTHETIC_COUNTERFACTUAL_TRAIN_ONLY"
          assert report["rows_synthetic_TRAIN_ONLY"]==256
          assert report["positive_event_relations"]=={
              "COORDINATION":48,"CONDITION_RESULT":48,
              "TEMPORAL_SEQUENCE":48,"CONTRAST":48}
          assert report["role_rejection_gold_links"]==32
          assert report["grouped_TRAIN_only_folds"]==40
          assert report["new_true43m_GT_CPU_not_yet_captured"]
          assert report["no_model_forward_no_training_no_independent_EVAL"]
          assert report["original_616_J7_not_replayed_in_this_stage"]
          assert report["output_gate"]==0
          assert not report["candidate_accepted"] and not report["activation_allowed"]
          if FROZEN_S22_TRAIN256_SHA256:
              assert report["source_sha256"]==FROZEN_S22_TRAIN256_SHA256
          destination=Path("results/nra3_s22")
          destination.mkdir(parents=True,exist_ok=False)
          (destination/"S22_SOURCE_ONLY_TRAIN256_MANIFEST.json").write_text(
              json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+"\n",
              encoding="utf-8")
          (destination/"S22_SYNTHETIC_TRAIN256_GOLD_NEVER_INPUTS.json").write_text(
              json.dumps([asdict(x) for x in rows],ensure_ascii=False,
                         sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("NRA3_S22_NEW256_TRAIN_GOLD_SHA",report["source_sha256"],flush=True)
          print("NRA3_S22_40_FOLDS_ALL_CLASSES_PRESENT",True,flush=True)
          print("NRA3_S22_SOURCE_PINNED",report["sha_pinned_and_required_before_new_CPU_capture"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s22-256new-counterfactual-train-only-40fold-source-noCPU-noEVAL
          path: results/nra3_s22/
          if-no-files-found: error
          retention-days: 30
