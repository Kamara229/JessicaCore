name: CALIBRI v0.17 - geometry topology and mixed precision controls
on:
  pull_request:
    paths:
      - 'research/calibri/geometric_v17.py'
      - '.github/workflows/calibri-geometric-v17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only-topology-search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned model/numerical dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Verify TT x INT4/INT5 physical container and direct operator
        run: python research/calibri/geometric_v17.py --smoke
      - name: Real trained-model geometry/mixed-precision experiment
        run: python research/calibri/geometric_v17.py --output results/calibri_v17_topology.json --dev-tokens 1024 --test-tokens 1024
      - name: Preserve metrics JSON, not model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v17-topology-results
          path: results/calibri_v17_topology.json
          if-no-files-found: ignore
          retention-days: 14
