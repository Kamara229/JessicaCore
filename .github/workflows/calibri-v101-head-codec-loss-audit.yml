name: CALIBRI v101 original head bitstream decode parity and FP32 loss audit

on:
  pull_request:
    paths:
      - 'research/calibri/v101/**'
      - 'research/calibri/calibri_head_codec_audit_v101.py'
      - 'research/calibri/test_v101_codec_guard.py'
      - 'research/calibri/SESSION_101_HEAD_CODEC_FAULT_ISOLATION.md'
      - '.github/workflows/calibri-v101-head-codec-loss-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original_CB59_head_codebook_exact_bitstream_C_Python_parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public pretrained CPU-only research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Compile source and test immutable head row-codecs
        run: |
          python -m compileall -q research/calibri/v101 research/calibri/calibri_head_codec_audit_v101.py research/calibri/test_v101_codec_guard.py
          python research/calibri/test_v101_codec_guard.py -v
      - name: Retrieve original locked whole CB59 source and provenance
        run: |
          mkdir -p input results/v101
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Audit full original real head 5bit roundtrip and native C decoder parity
        run: |
          python research/calibri/calibri_head_codec_audit_v101.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --locked research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v101
          test -s results/v101/v101_head_codec_exact_roundtrip_vs_pretrained_loss.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v101-frozen-original-head-codec-vs-pretrained-loss
          path: results/v101/v101_head_codec_exact_roundtrip_vs_pretrained_loss.json
          retention-days: 7
          if-no-files-found: ignore
