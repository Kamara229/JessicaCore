name: Calibri Z48 read-only Z47 SPENT28 BPE2 diversity and early-EOS forensic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z47-physical-fresh28-BPE2-native-20261124
permissions:
  contents: read
  actions: read
jobs:
  z48-immutable-z47-report-only-no-new-model:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z48-readonly-spent28-BPE2-diversity-failure-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-only old Z47 report audit code, no neural runtime dependencies
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z48_readonly_spent28_forensic
      - name: Download ONLY completed successful Z47 true43M SPENT internal DEV28 report
        uses: actions/download-artifact@v4
        with:
          name: calibri-s119q2i8z47-physical-original43m-new28-DEV-BPE2-human-vs-wrong-first3-gate0
          run-id: 45372181111
          path: inputs/z47
          github-token: ${{ github.token }}
      - name: Recompute non-promotable BPE2 native mode-collapse, per-prompt wins and EOS counts
        env:
          PYTHONPATH: .
        run: |
          python -m research.calibri_nra3.s119q2i8z48_readonly_z47_spent28_diversity_forensic \
            --report inputs/z47/S119Q2I8Z47_REAL43M_FRESH28_DEV_BPE2_FIRST3_NATIVE_HUMAN_VS_WRONG_G0.json \
            --out results/S119Q2I8Z48_Z47_SPENT28_READONLY_CAUSAL_BPE2_DIVERSITY_EOS_G0.json
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-s119q2i8z48-readonly-z47-SPENTDEV28-native-BPE2-diversity-EOS-forensics
          path: results/S119Q2I8Z48_Z47_SPENT28_READONLY_CAUSAL_BPE2_DIVERSITY_EOS_G0.json
          retention-days: 30
          if-no-files-found: error
      - name: Strict three-file additive research-only Z48 scope
        run: |
          set -euo pipefail
          base=origin/research/calibri2-s119q2i8z47-physical-fresh28-BPE2-native-20261124
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git diff --name-only "${base}" HEAD >/tmp/z48scope
          if grep -Fvx \
            -e 'research/calibri_nra3/s119q2i8z48_readonly_z47_spent28_diversity_forensic.py' \
            -e 'research/calibri_nra3/test_s119q2i8z48_readonly_spent28_forensic.py' \
            -e '.github/workflows/calibri-nra3-s119q2i8z48-readonly-spent28.yml' /tmp/z48scope; then
            echo 'Forbidden original model/training/prod/DEV or infrastructure changes' >&2
            exit 1
          fi
          test "$(wc -l </tmp/z48scope)" -eq 3
