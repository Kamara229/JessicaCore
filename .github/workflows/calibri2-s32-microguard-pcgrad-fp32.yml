name: CALIBRI S32 matched 36M FP32 two-step protected TRAIN
on:
  push:
    branches: ['research/calibri2-s32-microguard-fp32-20261108']
    paths:
      - 'research/calibri2/s32/**'
      - '.github/workflows/calibri2-s32-microguard-pcgrad-fp32.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  S32_two_step_pcgrad_old_skill_training:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '3030'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Validate isolated source and no QA leakage
        run: |
          python -m compileall -q research/calibri2/s32
          python -m unittest -v calibri2.s32.test_microguard_pcgrad_fp32
      - name: Restore immutable S26 compact 36M model, not heldout QA
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s26-36M-NOUN-TRANSFER-1280-GREEN-TUNNEL-PHYSICAL
          path: inputs/s26
          run-id: 42470473505
          github-token: ${{ github.token }}
      - name: S32 run real matched full-FP32 gradients and 2-step old-answer guards
        run: |
          python research/calibri2/s32/microguard_pcgrad_fp32.py \
            inputs/s26/CALIBRI2_S26_36M_NOUN_TRANSFER_1280_PAID.cb59 \
            results/s32
      - name: Preserve complete TRAIN outcomes and failed guards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s32-36M-FP32-MICROGUARD-REAL-TRAIN-ALL-OUTCOMES
          path: results/s32/
          retention-days: 90
