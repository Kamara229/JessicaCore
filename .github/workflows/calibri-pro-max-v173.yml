name: CALIBRI v173 native C execution vs UNPAID dense equivalent of identical compressed source
on:
  pull_request:
    paths:
      - 'research/calibri/v173/**'
      - 'research/calibri/test_v173_codec_full_forensic.py'
      - '.github/workflows/calibri-pro-max-v173.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_roundtrip_native_C_vs_dense_REFERENCE_AND_real_QA:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153
      REPORT: inputs/v161/v161_original_block0_source_operator_valid.json
      SEAL: inputs/v161/v161_source_only_layer0_frozen_before_VALID.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned actual SmolLM2 CPU model and codec audit dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - name: Verify original native C K32V8 matvec and embedding decode equal exact source matrix
        run: python -m unittest test_v173_codec_full_forensic -v
      - name: Run complete original FP32 and native CB59 against UNPAID dense-equivalent compressed source reference
        run: python -m v173.run "$SOURCE" "$REPORT" "$SEAL" results/v173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v173-full-packed-native-vs-identical-source-dense-debug
          path: results/v173/
          if-no-files-found: warn
          retention-days: 30
