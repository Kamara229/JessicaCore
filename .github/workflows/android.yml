name: Build Jessica Core APK

on:
  workflow_dispatch:

  push:
    branches:
      - main


permissions:
  contents: write

concurrency:
  group: jessica-android-release
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      JESSICA_APP_TOKEN: ${{ secrets.JESSICA_APP_TOKEN }}
      JESSICA_KEYSTORE_BASE64: ${{ secrets.JESSICA_KEYSTORE_BASE64 }}
      JESSICA_KEYSTORE_PASSWORD: ${{ secrets.JESSICA_KEYSTORE_PASSWORD }}
      JESSICA_KEY_PASSWORD: ${{ secrets.JESSICA_KEY_PASSWORD }}
      JESSICA_KEY_ALIAS: ${{ secrets.JESSICA_KEY_ALIAS }}
      JESSICA_VERSION_CODE: ${{ github.run_number }}
      JESSICA_VERSION_NAME: 0.1.${{ github.run_number }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Node.js for backend regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend regression dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund

      - name: Regression tests for verified Learning and release dates
        run: node --test backend/scripts/regressionLearningSafety.test.js backend/scripts/regressionDocumentCapture.test.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Check secrets
        run: |
          if [ -z "$JESSICA_APP_TOKEN" ]; then
            echo "JESSICA_APP_TOKEN is not configured"
            exit 1
          fi

          if [ -z "$JESSICA_KEYSTORE_BASE64" ]; then
            echo "JESSICA_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          if [ -z "$JESSICA_KEYSTORE_PASSWORD" ]; then
            echo "JESSICA_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi

          if [ -z "$JESSICA_KEY_PASSWORD" ]; then
            echo "JESSICA_KEY_PASSWORD is not configured"
            exit 1
          fi

          if [ -z "$JESSICA_KEY_ALIAS" ]; then
            echo "JESSICA_KEY_ALIAS is not configured"
            exit 1
          fi

          echo "All Jessica secrets are configured"


      - name: Restore signing keystore
        run: |
          echo "$JESSICA_KEYSTORE_BASE64" | base64 --decode > jessica-release.keystore


      - name: Verify signing keystore
        run: |
          keytool -list \
            -keystore jessica-release.keystore \
            -storepass "$JESSICA_KEYSTORE_PASSWORD" \
            -alias "$JESSICA_KEY_ALIAS"


      - name: Build signed release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/jessica-release.keystore" \
            -Pandroid.injected.signing.store.password="$JESSICA_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$JESSICA_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$JESSICA_KEY_PASSWORD"


      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk JessicaCore.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JessicaCore
          path: JessicaCore.apk

      - name: Generate SHA-256 checksum
        run: sha256sum JessicaCore.apk > JessicaCore.apk.sha256

      - name: Publish signed APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${JESSICA_VERSION_NAME}" \
            JessicaCore.apk JessicaCore.apk.sha256 \
            --title "Jessica Core v${JESSICA_VERSION_NAME}" \
            --notes "Signed Android update for Jessica Core. Install over the existing app to preserve its data." \
            --latest \
            --target "${GITHUB_SHA}"
