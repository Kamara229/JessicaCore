name: Calibri S119q2i8z31 prereg 84TRAIN 14NEWDEV bounded native contextual head trust region
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z30-head-bias-vs-context-spent14-causal-20261123
permissions:
  contents: read
jobs:
  prereg-new14-no-model-download:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z31-precommit-bound-head-trustregion-84train14dev-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU torch for native49152 shape contracts only no original weights
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight source-only 84 legal TRAIN 14 fresh DEV and actual bound native head differentiable KL
        run: |
          python -m py_compile \
            research/calibri_nra3/s119q2i8z31_84legaltrain_new14dev_bounded_context_source.py \
            research/calibri_nra3/s119q2i8z31_bounded_contextual_head_trust_contract.py \
            research/calibri_nra3/test_s119q2i8z31_native_trust_source_contract.py
          python -m unittest -v research.calibri_nra3.test_s119q2i8z31_native_trust_source_contract
      - name: Fail closed only brand NEW Z31 three files and workflow
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >/tmp/z31scope
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z31_84legaltrain_new14dev_bounded_context_source.py' -e 'research/calibri_nra3/s119q2i8z31_bounded_contextual_head_trust_contract.py' -e 'research/calibri_nra3/test_s119q2i8z31_native_trust_source_contract.py' -e '.github/workflows/calibri-nra3-s119q2i8z31-native-context-trust-prereg.yml' /tmp/z31scope; then
            echo 'No protected source, model, spent DEV, LIVE or previous research edits' >&2
            exit 1
          fi
          test $(wc -l < /tmp/z31scope) -eq 4
