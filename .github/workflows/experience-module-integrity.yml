name: Modular Skill Integrity
on:
  push:
    branches: [main]
    paths:
      - 'backend/experience/storage/skillModules/experienceModuleIntegrity.js'
      - 'backend/experience/storage/skillModules/experienceModulePacker.js'
      - 'backend/experience/storage/skillModules/experienceModuleHydrator.js'
      - 'backend/scripts/regressionModularExperienceStorage.test.js'
      - 'backend/scripts/regressionModularExperienceIntegrity.test.js'
      - 'backend/scripts/regressionModularExperienceReadback.test.js'
      - 'backend/scripts/regressionMixedActiveExperienceVersions.test.js'
      - 'backend/scripts/regressionSkillStorageExecutionGate.test.js'
      - 'backend/scripts/regressionSkillStorageTraceLearningGate.test.js'
      - 'backend/scripts/regressionModularVerifiedLearningTrace.test.js'
      - 'backend/scripts/regressionMultiSkillChildLearningIsolation.test.js'
      - 'backend/core/learning/multiSkill/multiSkillAnalyzer.js'
      - 'backend/core/learning/multiSkill/skillTraceView.js'
      - 'backend/core/learning/multiSkill/skillTraceResult.js'
      - 'backend/core/learning/multiSkill/skillTraceBuilder.js'
      - 'backend/scripts/fixtures/verifiedModularSkills.js'
      - 'backend/core/subtask/experienceStorageFailure.js'
      - 'backend/core/learning/experienceStorageIntegrityGate.js'
      - 'backend/core/learning/learningFacade.js'
      - 'backend/core/learning/trigger/triggerEligibility.js'
      - 'backend/core/subtask/mergeResolvedSubtaskExperience.js'
      - 'backend/core/subtask/executeSubtask.js'
      - 'backend/experience/experienceCore.js'
      - 'backend/experience/storage/supabaseExperienceStore.js'
      - 'backend/experience/storage/skillModules/experienceActiveCandidates.js'
      - 'backend/scripts/fixtures/v2ReadbackSupabaseSnapshot.js'
      - '.github/workflows/experience-module-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  modular-skill-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Run module packing, hydration and real DB readback regressions
        id: modular_tests
        run: node --test backend/scripts/regressionModularExperienceStorage.test.js backend/scripts/regressionModularExperienceIntegrity.test.js backend/scripts/regressionModularExperienceReadback.test.js backend/scripts/regressionMixedActiveExperienceVersions.test.js backend/scripts/regressionSkillStorageExecutionGate.test.js backend/scripts/regressionSkillStorageTraceLearningGate.test.js backend/scripts/regressionModularVerifiedLearningTrace.test.js backend/scripts/regressionMultiSkillChildLearningIsolation.test.js
      - name: Publish modular Skill hydration result for GitHub connector
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.modular_tests.outcome }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          description="Modular Skill hydration unverified"
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="Modular Skill readback and integrity passed"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$state" \
            -f context="jessica/module-hydration-readback" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
