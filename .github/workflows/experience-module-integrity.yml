  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  modular-skill-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Run module packing, hydration and real DB readback regressions
        id: modular_tests
        run: node --test backend/scripts/regressionModularExperienceStorage.test.js backend/scripts/regressionModularExperienceIntegrity.test.js backend/scripts/regressionModularExperienceReadback.test.js backend/scripts/regressionMixedActiveExperienceVersions.test.js backend/scripts/regressionSkillStorageExecutionGate.test.js backend/scripts/regressionSkillStorageTraceLearningGate.test.js backend/scripts/regressionModularVerifiedLearningTrace.test.js backend/scripts/regressionMultiSkillChildLearningIsolation.test.js backend/scripts/regressionMultiSkillLearningReplayIdempotency.test.js backend/scripts/regressionWorkerProposalReplayIdempotency.test.js backend/scripts/regressionConcurrentWorkerAtomicQueueClaim.test.js backend/scripts/regressionStaleLearningQueueRecovery.test.js backend/scripts/regressionCandidateObservationJournal.test.js backend/scripts/regressionCandidateBeforeProposalCrashResume.test.js backend/scripts/regressionProposalSaveRetryLimit.test.js backend/scripts/regressionLearningQueueOwnerFencing.test.js backend/scripts/regressionCandidateOwnerTokenFence.test.js backend/scripts/regressionPatternDiscoveryLeaseExpiry.test.js backend/scripts/regressionPatternDiscoveryHeartbeat.test.js backend/scripts/regressionPatternAIAbortPropagation.test.js backend/scripts/regressionPatternWorkerProviderAbort.test.js backend/scripts/regressionPatternDiscoveryPreflight.test.js backend/scripts/regressionLearningWorkerClaimBudget.test.js backend/scripts/regressionProposalRecoveryResult.test.js backend/scripts/regressionProposalRecoverySkillPublication.test.js backend/scripts/regressionProposalTerminalStatusCAS.test.js backend/scripts/regressionCandidatePromotionApprovalRecovery.test.js backend/scripts/regressionExperienceSaveAckLoss.test.js backend/scripts/regressionCandidateFinalStatusIdempotency.test.js backend/scripts/regressionCandidateActiveSnapshot.test.js backend/scripts/regressionCandidateConsolidation.test.js backend/scripts/regressionCandidateFinalizationRace.test.js
      - name: Publish modular Skill hydration result for GitHub connector
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.modular_tests.outcome }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          description="Modular Skill hydration unverified"
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="Modular Skill readback and integrity passed"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$state" \
            -f context="jessica/module-hydration-readback" \
            -f description="$description" \
            -f target_url="$TARGET_URL"
