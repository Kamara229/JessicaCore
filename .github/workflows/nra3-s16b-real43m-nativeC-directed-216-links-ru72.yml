name: NRA2 3.0 S16b real43M+GT native-C 72 old TRAIN directed agent-action-object physical FP16
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s16-directed-agent-action-object-trainonly-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s16b-real43m-216-directed-physical-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  original43M_GT_nativeC_S11_39_frozen_train_ONLY_new_2309_fp16_links:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s16b-real43m-train72-directed-links-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONHASHSEED: '316002'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact 72 original S10 real CPU TRAIN, 43 physical CB59 and S11 and S16 full directed gold SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43732621116 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43732621116 --jq .head_sha)" = b5044c36d070d197f7141ecd44a0b833e22491b2
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43731085988 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43734571081 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43734571081 --jq .head_sha)" = 8d7cbf7fd8ed2acc5d903117a8b943d15d98d791
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43744621643 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43744621643 --jq .head_sha)" = a1457c8240a53e8119aa94b74065ddf0e829141d
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43743397331 --jq .conclusion)" = success
          echo S16B_GENUINE_43M_S10_TRAIN72_ONLY_AND_216_SHA_LOCKED_DIRECTED_GOLD_NO_EVAL
      - name: Original pinned CPU native CB59 and physical FP16 research dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'tokenizers==0.20.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Test exact original native S16 full matrix vs pair scorer, all 2309 physical gradients, causal mask, TRAIN-only role metrics
        run: |
          python -m compileall -q research/nra3_s16
          python -m unittest -v research.nra3_s16.test_directed_valence_source research.nra3_s16.test_real43m_train72_directed_pairs
      - name: Validate old S9 Russian72 exact source and S11 frozen CPU 3way regression gates before training
        run: |
          python -m unittest -v research.nra3_s9.test_new_ru_train72 research.nra3_s11.test_paid_router
      - name: Download original S10 genuine frozen43M+GT post-layer8 72 TRAIN FP16 feature and true wordpiece token IDs
        uses: actions/download-artifact@v4
        with:
          name: nra3-s10-genuine43M-CPU-layer8-newRU72-trainonly-616J7-zero-gate
          run-id: 43732621116
          github-token: ${{ github.token }}
          path: inputs/nra3_s10
      - name: Download original physically packed full 43 CB59 matrix C source, NEVER change these weights
        uses: actions/download-artifact@v4
        with:
          name: nra3-s8-adaptive-calibrated-3way-physical-CB59-S61-realRU12-trainonly
          run-id: 43731085988
          github-token: ${{ github.token }}
          path: inputs/nra3_s8
      - name: Download immutable trained 39 FP16 S11 3-hypothesis route, never train original selector
        uses: actions/download-artifact@v4
        with:
          name: nra3-s11-real43M-ru72-39param-FP16-paid-router-native-C-trainonly
          run-id: 43734571081
          github-token: ${{ github.token }}
          path: inputs/nra3_s11
      - name: Physically verify actual original Calibri43M CPU source SHA, 216 directed gold TRAIN and no consumed EVAL
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from direct_codebook_v59 import CB59
          from research.nra3_s11.real_ru72_source import checked_real_train72
          from research.nra3_s11.paid_router import PaidThreeWayRouter
          from research.nra3_s16.direct_train72_edges import sealed_directed_train72,S16_TRAIN_SOURCE_SHA
          from research.nra3_s16.paid_directed_valence import PaidDirectedValence,PARAMETERS,PHYSICAL_BYTES
          root=Path("inputs")
          train,report=checked_real_train72(
              root/"nra3_s10/NRA3_S10_REAL_43M_LAYER8_RU_TRAIN72_HIDDEN320_FP16.safetensors",
              root/"nra3_s10/NRA3_S10_REAL_CPU_43M_LAYER8_TRAIN72_J7_REPORT.json")
          source=(root/"nra3_s8/NRA3_S8_CALIBRATED_PARALLEL_RELATION_RU_TRAIN12_PAID_CB59.cb59").read_bytes()
          old_router=(root/"nra3_s11/NRA3_S11_TINY_PAID_RUSSIAN_TRAIN72_CAUSAL_3WAY_SELECTOR_FP16.n3r11").read_bytes()
          assert len(train)==72
          assert report["all_616_native_CPU_generated_token_digests_unchanged"] is True
          assert report["original_456_full_EOS"]==456 and report["original_new128_full_EOS"]==128
          assert hashlib.sha256(source).hexdigest()=="d710aed710a44719b6003434a2dd83150861928ce167364cb92329beabf7be97"
          assert len(source)==653798 and len(CB59(source).handles)==43
          assert CB59(source).meta["original_unique_parameter_count"]==6106154
          assert hashlib.sha256(old_router).hexdigest()=="05ce14e20c9f4e7e09f85dbd9bd46f0dc0a700d72f1a96ffa921b2e822f235c3"
          assert len(old_router)==123
          assert PaidThreeWayRouter.from_physical(old_router).physical_bytes()==old_router
          m=sealed_directed_train72()
          assert S16_TRAIN_SOURCE_SHA=="9843c35ee9aa75b8f5c9c963e441589dd2f0292e41ec7933971d5aa3dcd365d6"
          assert m["S16_complete_predicate_to_argument_gold_source_sha256"]==S16_TRAIN_SOURCE_SHA
          assert m["S16_gold_directed_links"]==216 and m["S16_source_rows"]==72
          assert m["S16_gold_directed_role_counts"]=={"AGENT":60,"PATIENT":72,"RECIPIENT":72,"SOURCE":12}
          assert m["S16_gold_directed_orientation_counts"]=={"predicate_now":96,"argument_now":120}
          assert PARAMETERS==2309 and PHYSICAL_BYTES==4665
          assert len(PaidDirectedValence().physical_bytes())==4665
          assert not any((root/name).exists() for name in
                         ("nra3_s12","nra3_s12c","nra3_s15","nra3_s15b","nra3_s15c"))
          print("S16B_PHYSICAL_43M_NATIVE_C_ORIGINAL_216_PREDICATE_ARGUMENT_72_TRAIN_ONLY",flush=True)
          PY
      - name: Genuine original 43 compressed CB59 native CPU for all old72 + train ONLY new 2309 physical FP16 directional role links
        run: |
          python -m research.nra3_s16.real43m_train72_directed_valence \
            --s10-hidden inputs/nra3_s10/NRA3_S10_REAL_43M_LAYER8_RU_TRAIN72_HIDDEN320_FP16.safetensors \
            --s10-report inputs/nra3_s10/NRA3_S10_REAL_CPU_43M_LAYER8_TRAIN72_J7_REPORT.json \
            --s8-cb59 inputs/nra3_s8/NRA3_S8_CALIBRATED_PARALLEL_RELATION_RU_TRAIN12_PAID_CB59.cb59 \
            --s11-router inputs/nra3_s11/NRA3_S11_TINY_PAID_RUSSIAN_TRAIN72_CAUSAL_3WAY_SELECTOR_FP16.n3r11 \
            --out results/nra3_s16b
      - name: Validate physically PAID full FP16 source, true original CB59 native, exact role-and-direction TRAIN P R F1 and no acceptance
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from research.nra3_s16.paid_directed_valence import PaidDirectedValence,PARAMETERS,PHYSICAL_BYTES,ROLES
          p=Path("results/nra3_s16b/NRA3_S16B_TRUE43M_GOLD216_DIRECTED_VALENCE_FP16_TRAIN_ONLY_REPORT.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          q=Path("results/nra3_s16b")/r["S16b_NEW_2309_paid_FP16_filename"]
          physical=q.read_bytes()
          assert len(physical)==PHYSICAL_BYTES==4665
          assert hashlib.sha256(physical).hexdigest()==r["S16b_NEW_2309_paid_FP16_SHA"]
          assert PaidDirectedValence.from_physical(physical).physical_bytes()==physical
          assert r["S16b_NEW_2309_paid_FP16_params"]==PARAMETERS==2309
          assert r["S16b_original_43_CB59_native_C_matrices_unchanged"]
          assert r["S16b_original_Calibri43M_GT_and_S11_router_unchanged"]
          assert r["S16b_original_43_CB59_cpu_executed_on_all_72_real_hidden"]
          assert r["S16_original_directed_training_gold_complete_SHA"]=="9843c35ee9aa75b8f5c9c963e441589dd2f0292e41ec7933971d5aa3dcd365d6"
          assert r["S16b_training_examples_sentence_rows"]==72
          assert r["S16b_positive_directed_role_gold"]==216
          assert r["S16b_total_directed_wordpair_candidates"]>5*216
          assert r["S16b_all_pairs_were_scored_in_BOTH_directions"]
          assert sum(r["S16b_actual_direction_counts"].values())==r["S16b_total_directed_wordpair_candidates"]
          assert r["S16b_train_steps"]==200
          assert r["S16b_physical_step_schedule"]==[0,25,50,75,100,125,150,175,200]
          assert len(r["S16b_all_precommitted_FP16_checkpoints"])==9
          assert r["S16b_selected_because_of_TRAIN_only"]
          # Independent second CPU run must reproduce FIRST successful
          # original43M 72 TRAIN / 216 role-link physical FP16 byte-for-byte.
          # Pin from SUCCESS run #43758694264 BEFORE any subsequent fresh EVAL.
          first_run_sha="3fe4bbce718e53e4e812e94367ce25834f873cbed646479c59b1e3949d2ecf38"
          assert r["S16b_selected_TRAIN_only_FP16_step"]==200
          assert r["S16b_selected_TRAIN_only_FP16_SHA"]==first_run_sha
          assert hashlib.sha256(physical).hexdigest()==first_run_sha
          f=r["S16b_selected_TRAIN_only_metrics"]["all_two_direction_wordpair_exact_role"]
          assert f["exact_directed_role_true_positive"]==181
          assert f["gold_links"]==216 and f["predicted_positive"]==202
          assert f["false_positive"]==21 and f["false_negative"]==35
          assert abs(f["precision"]-0.8960396039603961)<1e-9
          assert abs(f["recall"]-0.8379629629629629)<1e-9
          assert abs(f["f1"]-0.8660287081339713)<1e-9
          assert r["S16b_total_directed_wordpair_candidates"]==1920
          assert r["S16b_actual_direction_counts"]=={
              "predicate_now":960,"argument_now":960}
          assert r["S16b_selected_TRAIN_only_metrics"]["per_role"]["SOURCE"]["gold"]==12
          assert 0<=f["f1"]<=1 and 0<=f["precision"]<=1 and 0<=f["recall"]<=1
          assert f["gold_links"]==216
          assert r["S16b_separate_future_NEW_independent_Russian_EVAL_performed"] is False
          assert r["S16b_previously_consumed_S15c_EVAL24_not_loaded"]
          assert r["S16b_previously_consumed_S12c_EVAL16_not_loaded"]
          assert r["S16b_old_five_EVAL128_and_reserved_sixth_S3CI_not_loaded"]
          assert r["S16b_active_candidate_616_J7_or_fullEOS_measured"] is False
          assert r["S16b_whole_original43M_GT_NRA_CPU_speed_ge90pct_measured"] is False
          assert r["S16b_whole_system_inclusive_bpp_le07_certified"] is False
          assert r["S16b_raw_NRA6M_plus_S11_plus_S16_direct_bpp"]>0.7
          assert r["S16b_research_quality_acceptance"] is False
          assert r["S16b_candidate_accepted"] is False
          assert r["S16b_output_gate"]==0 and r["S16b_activation_allowed"] is False
          print("S16B_REAL43M_NATIVE_C_TRAIN216_LINKS_PAID_FP16_HARD_F1_NO_EVAL_NO_PROMOTION",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s16b-original43M-CB59-S11-new2309FP16-216-directed-links-72TRAIN-only
          path: results/nra3_s16b/
          retention-days: 30
          if-no-files-found: error
