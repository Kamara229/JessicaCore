name: CALIBRI 2.0 S0 TRAIN actual small paid weights only, frozen teaching tasks
on:
  push:
    branches:
      - 'research/calibri2-s0-small-first-paid-architecture'
    paths:
      - 'research/calibri2/s0/train.py'
      - '.github/workflows/calibri2-s0-train.yml'
  pull_request:
    branches:
      - 'research/calibri2-v001-from-scratch-135m-paid-weights'
    types: [opened, synchronize, reopened]
    paths:
      - 'research/calibri2/s0/train.py'
      - '.github/workflows/calibri2-s0-train.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  training_existing_5bit_codes_and_paid_FP16_dictionaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 230
    env:
      PYTHONPATH: research/calibri:research
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies without original FP32 pretrained neural weights
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Validate S0 paid training code syntax
        run: python -m compileall -q research/calibri2/s0/train.py research/calibri2/s0/bootstrap.py
      - uses: actions/download-artifact@v4
        with:
          name: calibri2-s0-random-small-physically-paid-native-bootstrap
          path: inputs/s0
          run-id: 42366228524
          github-token: ${{ github.token }}
      - name: TRAIN-only actual 64-step full-model paid codebooks, real 5bit index proposals, 16 full-answer checks
        run: |
          python research/calibri2/s0/train.py inputs/s0/CALIBRI2_S0_RANDOM_INITIAL.cb59 results/calibri2/s0/train --steps 64
      - name: Upload actual physically trained CB59 and all frozen training diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s0-22M-64step-paid-TRAIN-source-and-real-answers
          path: results/calibri2/s0/train/
          retention-days: 45
          compression-level: 0
          if-no-files-found: warn
