name: CALIBRI v0.28 - deterministic flag on/off BF16 Switch comparison
on:
  pull_request:
    paths:
      - 'research/calibri/determinism_factor_v28.py'
      - 'research/calibri/compare_determinism_v28.py'
      - '.github/workflows/calibri-determinism-v28.yml'
      - 'research/calibri/SESSION_28.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-weights-one-factor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install exact pinned pretrained and corpus dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Isolate deterministic algorithms flag on/off/on with fixed BF16
        run: python research/calibri/determinism_factor_v28.py --output results/calibri_v28_determinism.json --tokens 128 --encoder-len 64 --decoder-len 32
      - name: Archive diagnostics, no pretrained weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v28-${{ matrix.os }}
          path: results/calibri_v28_determinism.json
          retention-days: 14
          if-no-files-found: ignore
  strict-crosshost-fidelity:
    needs: same-weights-one-factor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==1.26.4'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v28-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Quantify source-identical crosshost logits and expert router masks
        run: |
          python research/calibri/compare_determinism_v28.py \
            --first results/runs/calibri-v28-ubuntu-22.04/calibri_v28_determinism.json \
            --second results/runs/calibri-v28-ubuntu-24.04/calibri_v28_determinism.json \
            --output results/calibri_v28_crosshost.json
      - name: Keep positive or negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v28-crosshost-verdict
          path: results/calibri_v28_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
