name: CALIBRI v112 structural role-shared codebooks on tiny and Pythia 14M
on:
  pull_request:
    paths:
      - 'research/calibri/v112/**'
      - 'research/calibri/test_v112_structural.py'
      - '.github/workflows/calibri-v112-structural-tiny.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  small-model-pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research libraries
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.5.2 transformers==4.46.3 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Verify bitstream, checksum, direct blockwise inference and controls
        run: python -m unittest discover -s research/calibri -p test_v112_structural.py -v
      - name: Run predeclared synthetic and REAL open pretrained 14M pilot
        run: python -m v112.pipeline results/v112
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-v112-small-structural-role-evidence
          path: |
            results/v112/*.json
            results/v112/*.clb112
          if-no-files-found: error
          retention-days: 30
