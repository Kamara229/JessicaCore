name: Codex CALIBRI no-test relay regression
on:
  pull_request:
    paths:
      - 'backend/core/codex/relayCalibriNoTestNextStep.js'
      - 'backend/core/codex/relayInterpreter.js'
      - 'backend/core/codex/relayResearchExternalCiStatus.js'
      - 'backend/core/codex/relayCalibriS26S27Pending.js'
      - 'backend/core/codex/relayCalibriLaterResearchNoTest.js'
      - 'backend/scripts/regressionCodexS30Fp32LaterResearchNoTest.test.js'
      - 'backend/scripts/regressionCodexS26S27PendingNoTest.test.js'
      - 'backend/scripts/regressionCodexS26CiPassiveNoTest.test.js'
      - 'backend/scripts/regressionCodexCalibriNoTestNextStep.test.js'
      - '.github/workflows/codex-calibri-no-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies without lockfile or install scripts
        run: npm install --prefix backend --no-save --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Reproduce failing CALIBRI v133 relay; reject test execution
        run: |
          node --test backend/scripts/regressionCodexCalibriNoTestNextStep.test.js
          node --test backend/scripts/regressionCodexCalibriNoQuota.test.js
          node --test backend/scripts/regressionCodexS26CiPassiveNoTest.test.js
          node --test backend/scripts/regressionCodexS26S27PendingNoTest.test.js
          node --test backend/scripts/regressionCodexS30Fp32LaterResearchNoTest.test.js
