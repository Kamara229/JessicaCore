name: CALIBRI v0.33 - TT-free adaptive 3/4bit tiles physical bytes and real WikiText PPL
on:
  pull_request:
    paths:
      - 'research/calibri/direct_tiles_v33.py'
      - 'research/calibri/direct_tiles_experiment_v33.py'
      - 'research/calibri/direct_tiles_compare_v33.py'
      - 'research/calibri/SESSION_33.md'
      - '.github/workflows/calibri-direct-tiles-v33.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-Pythia-physical-tiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch 2.5.1 CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned public Pythia/WikiText and numeric packages
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Test direct bitstream/CRC/matched byte budget against random coefficient smoke
        run: python research/calibri/direct_tiles_v33.py
      - name: Evaluate real trained weights at equal INT4 bytes, true PPL and actual stream speed
        run: |
          python research/calibri/direct_tiles_experiment_v33.py \
            --output results/calibri_v33_real_Pythia.json \
            --train-tokens 256 --validation-tokens 1024 \
            --context 128 --microbatch 32
      - name: Archive real physical binary artifacts and JSON (no full pretrained weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v33-${{ matrix.os }}
          path: |
            results/calibri_v33_real_Pythia.json
            results/tiles_16x32_mixed3or4.bin
            results/tiles_8x64_mixed3or4.bin
          retention-days: 14
          if-no-files-found: ignore
  independent-source-and-metrics-check:
    needs: actual-Pythia-physical-tiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v33-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Compare source identifiers, physical SHA, fixed byte budget, WikiText PPL and stream latency
        run: |
          python research/calibri/direct_tiles_compare_v33.py \
            --first results/runs/calibri-v33-ubuntu-22.04/calibri_v33_real_Pythia.json \
            --second results/runs/calibri-v33-ubuntu-24.04/calibri_v33_real_Pythia.json \
            --output results/calibri_v33_crosshost.json
      - name: Preserve negative and positive study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v33-crosshost-verdict
          path: results/calibri_v33_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
