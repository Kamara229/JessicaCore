name: NRA3 S18c5 true43M GT native43 S11 NEW96 rawgrammar2597 12-fold TRAIN CV vs plain2309
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s18c4-paid-rawgrammar-rank8-new96-train-20261116
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s18c5-original43M-rawgrammar2597-12fold-new96
  cancel-in-progress: false
jobs:
  original43M_GT_nativeC_rawgrammar2597_new96_grouped12:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra3-s18c5-new96-rawgrammar-12fold-traincv-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONHASHSEED: '318018'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require immutable physical 43M CPU TRAIN96, old 43 CB59 and S11 original, no previously consumed EVAL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43910479658 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43910479658 --jq .head_sha)" = 8626bb64175ed38778709363cfd902d80a5df21e
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43912620815 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43915764115 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43914384102 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43914384102 --jq .head_sha)" = 4bfb5e82fc52b6690ddeea2da11f73c0e85631f2
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43916875445 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43916875445 --jq .head_sha)" = 8ab1a8f591aab6f5aa80e050e795fe97a847599e
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43915764115 --jq .head_sha)" = 076d10b8fd8271827c48a78d3000cb69c8916b85
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43912620815 --jq .head_sha)" = 3ffd1c1163a05933b0dd296acd8eec1a0b1bb17c
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43731085988 --jq .conclusion)" = success
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43734571081 --jq .conclusion)" = success
          echo ORIGINAL_REAL43M_GT_CPU_96_AND_ORIGINAL_NATIVE_CB59_S11_SHA_LOCKED
      - name: Install exact CPU native 43-C and rank8 paid FP16 dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'tokenizers==0.20.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Test original S16 direction+gradient and new96 source, POS/UD and fingerprint guard
        run: |
          python -m compileall -q research/nra3_s18 research/nra3_s16
          python -m unittest -v research.nra3_s16.test_directed_valence_source research.nra3_s16.test_real43m_train72_directed_pairs research.nra3_s18.test_ru96_train_source research.nra3_s18.test_locked_original43m_new96_alignment research.nra3_s18.test_s18c3_raw_russian_grammar_cues research.nra3_s18.test_s18c4_paid_rawgrammar_rank8
      - name: Download ONLY original CPU Calibri43M GT S18b real 96 TRAIN hidden320+tokenizer offsets
        uses: actions/download-artifact@v4
        with:
          name: nra3-s18b-TRUE43M-616J7-new96-TRAIN-postGT-layer8-goldfree-FP16
          run-id: 43910479658
          github-token: ${{ github.token }}
          path: inputs/nra3_s18b
      - name: Download original 43 matrix CB59 physically packed source, unchanged
        uses: actions/download-artifact@v4
        with:
          name: nra3-s8-adaptive-calibrated-3way-physical-CB59-S61-realRU12-trainonly
          run-id: 43731085988
          github-token: ${{ github.token }}
          path: inputs/nra3_s8
      - name: Download exactly original 39-FP16 S11 native 3way selector, unchanged
        uses: actions/download-artifact@v4
        with:
          name: nra3-s11-real43M-ru72-39param-FP16-paid-router-native-C-trainonly
          run-id: 43734571081
          github-token: ${{ github.token }}
          path: inputs/nra3_s11
      - name: Download original SHA-locked S18c2 12fold 2309 FP16 TRAIN-internal control report
        uses: actions/download-artifact@v4
        with:
          name: nra3-s18c2-TRUE43M-GT-native43-S11-TRAIN96-12fold-lexical-syntax-CV-only
          run-id: 43914384102
          github-token: ${{ github.token }}
          path: inputs/nra3_s18c2
      - name: Authenticate all true original hidden, 43 C, S11, source96, and no spent EVAL before optimizer
        run: |
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          from direct_codebook_v59 import CB59
          from research.nra3_s18.real43m_train96_physical_source import checked_real_train96,grouped_train96_split_contract
          from research.nra3_s11.paid_router import PaidThreeWayRouter
          from research.nra3_s16.paid_directed_valence import PARAMETERS,PHYSICAL_BYTES
          from research.nra3_s13.real43m_train72_readouts import S8B_43_CB59_SHA,S11_39_FP16_SHA
          root=Path("inputs")
          train,record=checked_real_train96(
              root/"nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors",
              root/"nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json")
          assert len(train)==96 and record["original_456_full_EOS"]==456 and record["original_new128_full_EOS"]==128
          original=(root/"nra3_s8/NRA3_S8_CALIBRATED_PARALLEL_RELATION_RU_TRAIN12_PAID_CB59.cb59").read_bytes()
          router=(root/"nra3_s11/NRA3_S11_TINY_PAID_RUSSIAN_TRAIN72_CAUSAL_3WAY_SELECTOR_FP16.n3r11").read_bytes()
          assert len(original)==653798 and hashlib.sha256(original).hexdigest()==S8B_43_CB59_SHA
          assert len(CB59(original).handles)==43 and CB59(original).meta["original_unique_parameter_count"]==6106154
          assert len(router)==123 and hashlib.sha256(router).hexdigest()==S11_39_FP16_SHA
          assert PaidThreeWayRouter.from_physical(router).physical_bytes()==router
          assert PARAMETERS==2309 and PHYSICAL_BYTES==4665
          assert len(grouped_train96_split_contract())==12
          source=Path("research/nra3_s18/s18c1_original43m_train96_nativeC_rank8.py").read_text()
          imported=[n.module or "" for n in ast.walk(ast.parse(source)) if isinstance(n,ast.ImportFrom)]
          assert not any("nra3_s17" in m or "nra3_s15" in m or "nra3_s12" in m for m in imported)
          assert not any((root/p).exists() for p in ("nra3_s17","nra3_s15","nra3_s15c","nra3_s12","nra3_s12c","s3ci","nra3_s10"))
          print("S18C1_ORIGINAL_TRUE43M_GT_NEW96_NO_ORACLE_GOLD_NATIVE43_CB59_S11_ALL_SHA_VERIFIED")
          PY
      - name: Real original43M GT native43 C and S11 for 96 TRAIN; 12 sealed folds 150 steps each rawgrammar2597FP16
        run: |
          python -m research.nra3_s18.s18c5_original43m_rawgrammar2597_grouped12_cv \
            --s18b-hidden inputs/nra3_s18b/NRA3_S18B_TRUE43M_GT_NEW_RU96_DIRECTED_HIDDEN320_FP16.safetensors \
            --s18b-report inputs/nra3_s18b/NRA3_S18B_TRUE43M_CPU_NEW96_TRAINONLY_J7_REPORT.json \
            --s8-cb59 inputs/nra3_s8/NRA3_S8_CALIBRATED_PARALLEL_RELATION_RU_TRAIN12_PAID_CB59.cb59 \
            --s11-router inputs/nra3_s11/NRA3_S11_TINY_PAID_RUSSIAN_TRAIN72_CAUSAL_3WAY_SELECTOR_FP16.n3r11 \
            --s18c2-baseline-report inputs/nra3_s18c2/NRA3_S18C2_NEW96_ORIGINAL43M_NATIVE43_CV12_F1_REPORT.json \
            --out results/nra3_s18c5
      - name: Confirm 12-fold genuine original43M physical FP16 ABI, isolated groups and truthful TRAIN-only comparison
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from research.nra3_s18.s18c4_paid_rawgrammar_rank8 import (
              PaidRawGrammarDirectedValence,PARAMETERS,PHYSICAL_BYTES,EXTRA_PARAMETERS)
          root=Path("results/nra3_s18c5")
          report=root/"NRA3_S18C5_ORIGINAL43M_RAWGRAMMAR2597_NEW96_CV12_F1_REPORT.json"
          r=json.loads(report.read_text(encoding="utf-8"))
          assert r["stage"]=="NRA3_S18C5_TRUE43M_GT_NATIVE43_S11_NEW96_RAWGRAMMAR2597_GROUPED12_TRAIN_INTERNAL_CV"
          assert r["S18b_original43M_gt_true_CPU_train96_run"]==43910479658
          assert r["S18c2_frozen_prior_plain_rank8_cv_run"]==43914384102
          assert r["S18c4_physical_train96_grammar_paid2597_run"]==43916875445
          assert r["original_616_J7_unchanged_only_for_frozen_parent"]
          assert r["original43M_GT_native43_CB59_S11_unchanged"]
          assert r["original43M_native_C_96_full_pairs_executed"]
          assert len(r["original_native_C_per_sentence_relation_SHA"])==96
          assert r["all_bidirectional_candidate_pairs_unfiltered"]==3288
          assert r["exact_300_directed_gold_roles_train96"]==300
          assert r["fixed_12_group_folds_from_S18c0"]
          assert r["lexical_heldout_folds"]==4 and r["syntax_heldout_folds"]==8
          assert r["each_fold_from_scratch_fixed_optimizer_steps"]==150
          assert r["optimizer_selected_checkpoint_using_heldout"] is False
          assert r["true_raw_text_18_indicator_words_only_no_oracle_UPOS_UD_lemma_gold_role"]
          assert r["new_model_2597_paid_FP16_physical_bytes_per_fold"]==PHYSICAL_BYTES==5286
          assert r["extra_paid_288_FP16_grammar_projection_params"]==EXTRA_PARAMETERS==288
          assert PARAMETERS==2597
          assert r["train_internal_holdouts_seen_during_prior_architecture_design"]
          assert r["this_grouped_cv_NOT_pristine_independent_EVAL"]
          assert r["no_old_S17c_S15c_S12c_consumed_EVALs_loaded"]
          assert r["new_candidate_active_616_J7_EOS_not_tested"]
          assert r["strict_online_causal_Russian_word_parser_unproven"]
          assert r["inclusive_bpp_le07_NOT_CERTIFIED"]
          assert r["whole_CPU_ge90pct_CB59_NOT_CERTIFIED"]
          assert r["candidate_accepted"] is False and r["activation_allowed"] is False
          assert r["output_gate"]==0 and r["LIVE_Jessica_Render_Supabase_APK_unchanged"]
          folds=r["individual_fold_results"]
          assert len(folds)==12 and len({f["fold_id"] for f in folds})==12
          assert [f["kind"] for f in folds]==["TRAIN_INTERNAL_LEXICAL"]*4+["TRAIN_INTERNAL_SYNTAX"]*8
          for f in folds:
              blob=(root/f["physical_fp16_filename"]).read_bytes()
              assert len(blob)==PHYSICAL_BYTES==f["physical_fp16_bytes"]
              assert hashlib.sha256(blob).hexdigest()==f["physical_fp16_sha256"]
              assert PaidRawGrammarDirectedValence.from_physical(blob).physical_bytes()==blob
              assert f["optimizer_steps_exact"]==150
              assert f["selected_checkpoint_using_heldout"] is False
              assert f["heldout_features_never_entered_optimizer"]
              assert f["no_gold_UPOS_UD_lemma_role_entered_raw_grammar_model_features"]
              assert f["all_negative_pairs_included"]
              assert 0<=f["final_holdout_TRAIN_internal_F1"]<=1
          for axis,n in (("TRAIN_INTERNAL_LEXICAL",4),("TRAIN_INTERNAL_SYNTAX",8)):
              z=r["micro_grouped_metrics"][axis]
              diff=r["comparison_to_S18c2_TRAIN_internal"][axis]
              assert z["folds"]==n and z["all_300_gold_roles_once_per_axis"]==300
              assert z["micro_TP"]+z["micro_FN"]==300
              assert abs(z["micro_F1"]-diff["new_S18c5_2597FP16_MICRO_F1"])<1e-12
              assert abs(diff["delta_MICRO_F1_new_minus_baseline"]-
                  (z["micro_F1"]-diff["older_S18c2_2309FP16_MICRO_F1"]))<1e-12
          assert sum(f["heldout_sentence_count"] for f in folds[:4])==96
          assert sum(f["heldout_sentence_count"] for f in folds[4:])==96
          assert sum(f["heldout_all_directed_candidate_pairs"] for f in folds[:4])==3288
          assert sum(f["heldout_all_directed_candidate_pairs"] for f in folds[4:])==3288
          for key in ("passive_agent_patient_inversion","recipient_subject_with_source"):
              assert key in r["heldout_passive_and_recipient_subject_comparison"]
          print("S18C5_TRUE43M_GT_NATIVE43_12FOLD_TRAIN_INTERNAL_NOT_INDEPENDENT_EVAL")
          print(json.dumps(r["comparison_to_S18c2_TRAIN_internal"],sort_keys=True))
          print(json.dumps(r["heldout_passive_and_recipient_subject_comparison"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s18c5-TRUE43M-native43-S11-new96-12fold-rawgrammar2597-vs-plain2309-TRAINonly
          path: results/nra3_s18c5/
          retention-days: 30
          if-no-files-found: error
