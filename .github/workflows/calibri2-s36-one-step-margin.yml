name: CALIBRI S36 one-step protected 1_left margin research
on:
  push:
    branches:
      - research/calibri2-s36-margin-preserving-update-20261108
    paths:
      - 'research/calibri2/s36/**'
      - '.github/workflows/calibri2-s36-one-step-margin.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  S36_reproduce_S33_then_check_margin_trust_and_repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '3030'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU libraries as S34 and S35
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Static compile of S36 diagnostic
        run: |
          python -m compileall -q research/calibri2/s36/
      - name: Restore immutable S26 physical CB59 seed only
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s26-36M-NOUN-TRANSFER-1280-GREEN-TUNNEL-PHYSICAL
          path: inputs/s26
          run-id: 42470473505
          github-token: ${{ github.token }}
      - name: Reproduce S33 and compare one-step protected alternatives
        run: |
          python research/calibri2/s36/margin_preserving_step.py \
            inputs/s26/CALIBRI2_S26_36M_NOUN_TRANSFER_1280_PAID.cb59 \
            results/s36
      - name: Retain S36 actual numerical results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s36-one-step-margin-preservation-TRAIN-report
          path: results/s36/*.json
          if-no-files-found: warn
          retention-days: 90
