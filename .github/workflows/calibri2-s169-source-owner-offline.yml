name: CALIBRI S169 source-anchored owner binding offline diagnostic
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-s168-novel-train-frames-generalization-20261112]
permissions:
  contents: read
  actions: read
concurrency:
  group: calibri2-s169-owner-offline
  cancel-in-progress: false
jobs:
  s169_source_only_probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s169-segment-owner-offline-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned S168 CPU J7 source completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/"${GITHUB_REPOSITORY}"/actions/runs/43289943629 --jq .conclusion)" = "success"
      - name: Download immutable S168 J7 diagnostics
        uses: actions/download-artifact@v4
        with:
          name: calibri-s168-novel-train-frames-J7
          run-id: 43289943629
          github-token: ${{ github.token }}
          path: inputs/s168
      - name: Source-only S169 64-case offline + fail-closed negative audit
        run: |
          python -m py_compile research/calibri2/s169/owner_segment_offline.py
          test -s inputs/s168/S168_NOVEL_TRAIN_FRAMES_64_GENERALIZATION.json
          python research/calibri2/s169/owner_segment_offline.py \
            inputs/s168/S168_NOVEL_TRAIN_FRAMES_64_GENERALIZATION.json \
            results/s169
      - name: Save S169 offline diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s169-source-owner-offline-only
          path: results/s169/
          retention-days: 90
          if-no-files-found: warn
