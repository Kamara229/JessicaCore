name: Calibri S119q2i8z28 prereg full-native first4+EOS head-only TRAIN84 new14 DEV
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z27-physical-original-vs-headgain-repeat-ablation-20261123
permissions:
  contents: read
jobs:
  source-only-84train-new14-multitoken-prereg:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z28-prereg-84train14dev-head-fullnative-multiposition-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU torch only, no original weights or model downloads
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Strict lock of 84 previously eligible human TRAIN plus 14 new DEV and native full49152 CE loss
        run: |
          python -m py_compile \
            research/calibri_nra3/s119q2i8z28_precommit_84train14fresh_native_head_multistep.py \
            research/calibri_nra3/s119q2i8z28_fullnative_trainonly_multitoken_head_loss.py \
            research/calibri_nra3/test_s119q2i8z28_precommitted_native_multipos_head.py
          python -m unittest -v research.calibri_nra3.test_s119q2i8z28_precommitted_native_multipos_head
      - name: Fail closed only four research-only prereg source/test/workflow
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >/tmp/z28scope
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z28_precommit_84train14fresh_native_head_multistep.py' -e 'research/calibri_nra3/s119q2i8z28_fullnative_trainonly_multitoken_head_loss.py' -e 'research/calibri_nra3/test_s119q2i8z28_precommitted_native_multipos_head.py' -e '.github/workflows/calibri-nra3-s119q2i8z28-native-multipos-prereg.yml' /tmp/z28scope; then
            echo 'Refuse protected model, old DEV, LIVE or prior experimental modifications' >&2
            exit 1
          fi
          test $(wc -l < /tmp/z28scope) -eq 4
