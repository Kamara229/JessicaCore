name: CALIBRI2 S10 read-only gradients 85 codebooks TRAIN-only
on:
  push:
    branches: ['research/calibri2-s10-train-gradient-interference-audit-20261108']
    paths:
      - 'research/calibri2/s10/**'
      - '.github/workflows/calibri2-s10-train-gradient.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  S10_measure_fixed_TRAIN_gradient_directions_before_after:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '2085'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research requirements
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Syntax check pure training-gradient read-only researcher
        run: python -m compileall -q research/calibri2/s10
      - name: Restore fixed verified 36M S7 original compressed checkpoint
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s7-36M-ffn1536-physical-and-regression-report
          path: inputs/s7
          run-id: 42383040833
          github-token: ${{ github.token }}
      - name: Restore final S8 36M compressed checkpoint with known 50 to 22 regression
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s8-36M-768-DIVERSE-PAID
          path: inputs/s8
          run-id: 42413614906
          github-token: ${{ github.token }}
      - name: One read-only fixed TRAIN-gradient conflict audit on S7 and S8 color/numeric/copy/text
        run: |
          python research/calibri2/s10/train_gradient_conflict.py inputs/s7/CALIBRI2_S7_320x12_FFN1536_PHYSICAL_GROWN.cb59 inputs/s8/CALIBRI2_S8_36M_BROAD_TRAIN_PAID.cb59 results/s10
      - name: Retain all signed inter-task gradient cosines, task losses, exact source SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s10-36M-TRAIN-only-gradient-conflict-readonly
          path: results/s10/
          retention-days: 45
