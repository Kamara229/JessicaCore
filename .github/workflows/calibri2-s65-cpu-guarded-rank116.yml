name: CALIBRI S65 CPU guarded new116-only rank128 Green Tunnel TRAIN
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-s64-paid-rank-expand-20261109
permissions:
  contents: read
  actions: read
jobs:
  s65_real_cpu_only_new_rank_training:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s65-train-new-rank116-only-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check research only
        run: |
          python -m compileall -q research/calibri2/s65
      - name: Install pinned CPU-only torch and training deps, no accelerator used
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Original physically accepted S45 host, immutable
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Original S56 dual paid rank12 + rank2 controller, immutable
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s56-paid-first-plus-later-dual-controller-if-accepted
          path: inputs/s56
          run-id: 42518099946
          github-token: ${{ github.token }}
      - name: Lossless S61 physically paid compressed CB59 source
        uses: actions/download-artifact@v4
        with:
          name: calibri-s61-real-physical-entropy-and-cold-cpu
          path: inputs/s61
          run-id: 42528473858
          github-token: ${{ github.token }}
      - name: Exact physically paid rank128 S64 initial controller
        uses: actions/download-artifact@v4
        with:
          name: calibri-s64-paid-rank128-green-tunnel-not-trained
          path: inputs/s64
          run-id: 42530687528
          github-token: ${{ github.token }}
      - name: Execute bounded S65 actual TRAIN-only 16-step old-skill protected CPU fitting
        run: |
          python research/calibri2/s65/train_only_new_rank116_and_guard_old.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s56/S56_DUAL_ACTIVE_PAID_GREEN_TUNNEL.safetensors \
            inputs/s64/S64_RANK128_GREEN_TUNNEL_INIT.safetensors \
            inputs/s61/S61_SOURCE_EXACT_ZLIB_CB59.s61 \
            inputs/s64/S64_PAID_MANIFEST.json \
            results/s65
      - name: Archive independent negative outcomes and CPU continuation state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-s65-guarded-rank116-TRAIN-real-probes-and-resume
          path: results/s65/
          if-no-files-found: warn
          retention-days: 90
