name: Calibri Fusion Growth F02 entropy core and exact tensor dedup
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f01-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f02:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f02-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict additive scope
        run: |
          git diff --name-only 3d7732f5d78b528e12d30004f85cd6cb1040c9dd HEAD >/tmp/f02scope
          test "$(wc -l </tmp/f02scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f02_entropy_core.py' -e '.github/workflows/calibri-fusion-growth-f02.yml' /tmp/f02scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f01-physical-budget-G0
          run-id: 45668506574
          path: inputs/f01
          github-token: ${{ github.token }}
      - name: Actual CB59 and four learned sidecar exact restoration
        run: python research/calibri2/fusion_growth/f02_entropy_core.py --root inputs/f01 --out results/f02
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f02-entropy-dedup-G0
          path: results/f02/
          retention-days: 30
          if-no-files-found: error
