name: NRA3 S40 TRAIN-only compositional predicate passive infinitive negation quotation graph vs S39
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s39-trainonly-negation-scope-adapter-20261118
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s40-trainonly-compositional-graph-18fold
  cancel-in-progress: true
jobs:
  s40_compositional_shadow_adapter_train80_grouped18_no_eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '391118'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify S37/S38 complete, S38 32 protected challenge unchanged and new S39 TRAIN source pinned separately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44212710547 44214503122 44215938499; do
            test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$run" --jq .conclusion)" = success
          done
          test "$(git hash-object research/nra3_s20/s38_novel_russian_structure_challenge_source.py)" = d1c5be4402fb456adab896a828e742f5f34c48dd
          test "$(git hash-object research/nra3_s20/s39_new80_trainonly_scope_graph_source.py)" = 0126bfc7e9dd53fe9f94debc187a7ca9b71da0ed
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/research/nra3_s20/s38_novel_russian_structure_challenge_source.py?ref=61ee235ea9e7ebfe4d19ba13be0dd0516afba231" --jq .sha)" = d1c5be4402fb456adab896a828e742f5f34c48dd
          echo S39_S38_RESERVED_AND_S39_NEW80_COMMIT_SHA_PINNED
      - name: Install pinned CPU PyTorch only; no Calibri43M original weights downloaded
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Download archived original S39 18fold physical development baseline without retraining it
        uses: actions/download-artifact@v4
        with:
          name: nra3-s40-compositional-scope-NRA2-shadow-NEW80-TRAIN-18fold-noEVAL
          run-id: 44215938499
          github-token: ${{ github.token }}
          path: inputs/s39
      - name: Assert same unchanged TRAIN80 source, new structural grammar, gold-blind model and 18 grouped folds
        run: |
          python -m compileall -q research/nra3_s20
          python -m unittest -v research.nra3_s20.test_s39_train80_shadow_grammar research.nra3_s20.test_s40_compositional_graph_trainonly
      - name: Physically optimize independent S40 compositional three-head grammar on S39 NEW80 strict grouped18 and compare S39 archived
        run: |
          python -m research.nra3_s20.s40_fit_train80_compositional_graph_18fold --baseline-s39-report inputs/s39/NRA3_S40_TRAIN80_COMPOSITIONAL_GRAPH_18FOLD_AGAINST_S39.json --out results/nra3_s40
      - name: Verify independently frozen S38, trained S39, no Calibri/NRA2/LIVE writes or independent EVAL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/nra3_s39/NRA3_S39_TRAIN80_RAW_RUSSIAN_GRAPH_SHADOW_18FOLD.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["stage"]=="NRA3_S40_COMPOSITIONAL_S39_TRAIN80_SYNTHETIC_18FOLD_NO_EVAL"
          assert x["original_archived_S39_completed_run"]==44215938499
          assert x["precommitted_grammar_prior_allowed"]==4.0
          assert x["precommitted_grammar_prior_blocked"]==-12.0
          assert x["explicit_graph_features_quote_clauses_predicate_passive_infinitive_nonlocal_scope"]
          assert x["all_18_folds_same_exposed_development_as_S39"]
          assert x["same_train80_optimizer_and_fixed_seeds_as_S39"]
          assert x["new_TRAIN80_source"]["TRAIN_rows"]==80
          assert x["new_TRAIN80_source"]["internal_folds"]==18
          assert len(x["new_TRAIN80_source"]["sha256"])==64
          assert x["original_256_TRAIN_disjoint"]
          assert x["untouched_S38_32_adversarial_reserved_for_later_control"]
          assert x["no_S38_text_or_label_loaded_in_training_loss_or_model_selection"]
          assert x["not_original43M_GT_inference_or_joint_trained_architecture"]
          assert x["paid_original_NRA2_Calibri43M_GT_616J7_untouched"]
          assert x["three_active_shadow_train_heads_predicate_quote_rejected"]
          assert x["trainable_adapter_parameters"]>0
          assert x["fixed_TRAIN_steps_per_fold"]==96
          assert x["fixed_optimizer_lr"]==.018
          assert x["fixed_prediction_threshold"]==.5
          assert len(x["all18_strict_synthetic_TRAIN_grouped_folds"])==18
          assert set(x["summary_internal_only_by_fold_axis"])=={"LEXICAL","CONSTRUCTION"}
          assert all(f["TRAIN_and_held_disjoint"]
              and "S39_original_completed_held_TRAIN_metrics" in f
              and len(f["S39_original_completed_physical_numeric_SHA"])==64
              and f["gold_never_used_in_neural_forward"]
              and f["event_source_quote_rejected_three_heads_learned"]
              and len(f["fresh_model_weights_sha256"])==64
              and f["output_gate"]==0
              for f in x["all18_strict_synthetic_TRAIN_grouped_folds"])
          assert not x["candidate_accepted"] and not x["activation_allowed"] and x["output_gate"]==0
          assert x["not_independent_EVAL32_EVAL128_or_616J7_tested"]
          assert x["LIVE_Render_Supabase_Jessica_APK_unchanged"]
          print("S40_REAL_COMPOSITIONAL_GRAPH_TRAIN_ONLY_18FOLD_INTERNAL",
                json.dumps(x["summary_internal_only_by_fold_axis"],sort_keys=True),flush=True)
          print("S40_NO_S38_REUSE_NO_43M_GT_NRA2_ACTIVATION",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s39-NEW80-TRAINonly-NRA2-shadow-russian-grammar-18fold-noEVAL
          path: results/nra3_s40/
          if-no-files-found: error
          retention-days: 30
