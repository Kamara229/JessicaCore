name: Calibri S119q2i8z21 prereg native BPE2-4 future state lowrank16 vs shuffled targets
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z20-physical-paired-consensus-forensics-20261123
permissions:
  contents: read
jobs:
  source-only-future-predictive-state-prereg-no-physical:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z21-prereg-future-state-matched-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone CPU-only Torch, NO pretrained model or weights
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Prereg 28 BRAND NEW TRAIN and 14 DEV plus 10240param predictive shadow and matched shuffled baseline
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z21_predictive_state_prereg
      - name: Fail closed 4 new isolated source-only research files
        run: |
          set -euo pipefail
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/z21_scope
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z21_fresh28train14dev_future_state_source.py' -e 'research/calibri_nra3/s119q2i8z21_future_state_lowrank16_matched_contract.py' -e 'research/calibri_nra3/test_s119q2i8z21_predictive_state_prereg.py' -e '.github/workflows/calibri-nra3-s119q2i8z21-future-state-prereg.yml' /tmp/z21_scope; then
            echo 'Protected model, LIVE or historical source changed' >&2
            exit 1
          fi
          test $(wc -l < /tmp/z21_scope) -eq 4
