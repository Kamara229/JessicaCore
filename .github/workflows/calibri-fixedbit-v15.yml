name: CALIBRI v0.15 - matched-byte 5bit and 6bit controls
on:
  pull_request:
    paths:
      - 'research/calibri/fixedbit_v15.py'
      - '.github/workflows/calibri-fixedbit-v15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physically-packed-quality-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Pinned model/data dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Physical packed length and CRC smoke tests
        run: python research/calibri/fixedbit_v15.py --smoke
      - name: Real Pythia development gate and independent test
        run: python research/calibri/fixedbit_v15.py --output results/calibri_v15_fixedbit.json
      - name: Preserve metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v15-matched-byte-controls
          path: results/calibri_v15_fixedbit.json
          if-no-files-found: ignore
          retention-days: 14
