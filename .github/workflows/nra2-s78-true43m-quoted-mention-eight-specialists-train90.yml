name: NRA2 S78 physical Calibri43M GT quote inclusive eight independent mini-area TRAIN90 grouped DIAG30
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra2-s77-mentionhood-before-factuality-sourceonly-audit-20261119
permissions:
  contents: read
  actions: read
concurrency:
  group: nra2-s78-8-specialist-microareas-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  real43m_gt_8_specialist_quoted_MENTION_TRAIN90:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-nra2-s78-quote-aware-specialist-miniareas-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONHASHSEED: '761119'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU tensor-only dependencies (NO Calibri original model reload)
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'safetensors==0.4.5'
      - name: Test 8 independent quote-aware expert heads, source/gold wall and S77 safe mentionhood contract
        run: |
          set -euo pipefail
          python -m compileall -q research/nra3_s20/s76_s74_newtrain120_event_relative_gold_TRAIN_LOSS_ONLY.py research/nra3_s20/s77_real43m_gt_mentionhood_vs_asserted_candidate_audit.py research/nra3_s20/s78_train_true43m_quote_mention_8_specialists.py
          python -m unittest -v research.nra3_s20.test_s72_nra2_situation_microareas research.nra3_s20.test_s74_newtrain120_compositional_contrastive_contracts research.nra3_s20.test_s76_newtrain120_event_router_source_gold_contracts research.nra3_s20.test_s77_mentionhood_sourceonly_quoted_event_mask research.nra3_s20.test_s78_true43m_quote_mention_specialists
      - name: Require immutable successful real43M CPU 616J7 original FIRST-read S75 and old S65 parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44196720655 44312765248 44357767214 44366319006 44371962358 44377346422 44389438490 44465058843 44466537576 44468308611 44469736256; do
            test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$run" --jq .conclusion)" = success
          done
          test "$(git hash-object research/nra3_s20/s74_newtrain120_source_ONLY.py)" = c39bd34cbc21319c4c3433c3927f01877af1c4ee
          echo S76_ORIGINAL43M_GT_S75_616J7_AND_S65_FROZEN_REAL_SOURCE_PROVENANCE
      - name: S75 real Calibri43M GT FIRST-read NEW120 9,235 native BPE postH8 source-only
        uses: actions/download-artifact@v4
        with:
          name: nra2-s75-real43M-GT-newtrain120-native-BPE-H8-after-616J7-noGOLD
          run-id: 44466537576
          github-token: ${{ github.token }}
          path: inputs/s75
      - name: Original S26 paid 12384, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s26-REAL43M-GT-TRAIN256-40fold-12384FP16-event-inversion-ablation-noEVAL
          run-id: 44196720655
          github-token: ${{ github.token }}
          path: inputs/s26
      - name: Original S57 paid 231, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s57-original43M-GT-96spent-only-eventfirst231-FP16-before-HELD24
          run-id: 44312765248
          github-token: ${{ github.token }}
          path: inputs/s57
      - name: Original S59 paid 2046, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s59-REAL43M-GT-OLD152-NATIVE320-PAID2046-FP16-frozen-before-HELD
          run-id: 44357767214
          github-token: ${{ github.token }}
          path: inputs/s59
      - name: Original S61 paid 2752, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s61-GENUINE43M-GT-SPENT216-PAIR-NULL-POLAR2752FP16-frozen
          run-id: 44366319006
          github-token: ${{ github.token }}
          path: inputs/s61
      - name: Original S62 paid 2166, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s62-real43M-GT-SPENT248-event-target2166-FP16-frozen
          run-id: 44371962358
          github-token: ${{ github.token }}
          path: inputs/s62
      - name: Original S63 paid 471, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s63-REAL43M-GT-SPENT280-QUOTE471-frozen-before-NEW32
          run-id: 44377346422
          github-token: ${{ github.token }}
          path: inputs/s63
      - name: Original S65 paid 259, completely frozen
        uses: actions/download-artifact@v4
        with:
          name: nra3-s65-REAL43M-GT-OLD344-FACTUALITY3WAY259-FP16-before-NEW32
          run-id: 44389438490
          github-token: ${{ github.token }}
          path: inputs/s65
      - name: Train ONLY NEW 7496 independent eight situation experts on 90 new TRAIN, score 30 grouped synthetic diagnostics ONCE
        run: |
          set -euo pipefail
          python -m research.nra3_s20.s78_train_true43m_quote_mention_8_specialists \
            --s75 inputs/s75/NRA2_S75_GENUINE43M_GT_NEWTRAIN120_WORD339_AND_UNSAFE.safetensors \
            --s75-report inputs/s75/NRA2_S75_GENUINE43M_GT_NEWTRAIN120_SOURCE_PROVENANCE.json \
            --s26 inputs/s26/NRA3_S26_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12384_FP16.n3s26 \
            --s57-paid inputs/s57/NRA3_S57_EVENTFIRST_SPENT96_ONLY_231FP16_UNACCEPTED.safetensors \
            --s59-paid inputs/s59/NRA3_S59_REAL43M_GT_OLD152_NATIVE320_SEMANTIC2046_FP16.safetensors \
            --s61-paid inputs/s61/NRA3_S61_REAL43M_GT_SPENT216_PAID2752_PAIR_NONE.safetensors \
            --s62-paid inputs/s62/NRA3_S62_REAL43M_GT_SPENT248_JOINT2166_FP16.safetensors \
            --s63-paid inputs/s63/NRA3_S63_REAL43M_GT_SPENT280_QUOTE_OUTER_BPE471_FP16.safetensors \
            --s65 inputs/s65/NRA3_S65_REAL43M_GT_SPENT344_REPORTED3WAY259_FP16.safetensors \
            --s65-manifest inputs/s65/NRA3_S65_REAL43M_GT_SPENT344_FACTUALITY259_MANIFEST.json \
            --out results/nra2_s78_real43m_GT_8_quoted_mention_specialists
      - name: Verify original true43M GT weights untouched, all 8 distinct physical specialists, NO independent evaluation/activation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          from safetensors.torch import load_file
          d=Path('results/nra2_s78_real43m_GT_8_quoted_mention_specialists')
          p=d/'NRA2_S78_TRUE43M_GT_MENTION8_SITUATION_SPECIALISTS_7496_FP16.safetensors'
          m=json.loads((d/'NRA2_S78_TRUE43M_GT_MENTION8_TRAIN90_DIAG30_SHADOW_MANIFEST.json').read_text())
          assert m['stage']=='NRA2_S78_ORIGINAL43M_GT_S77_QUOTE_INCLUSIVE_MENTION_8SPECIALIST_SHADOW'
          assert m['S74_newtrain_source_SHA256']=='5ff7f5681b0130d4c230fe5b3513038e4d6f3487a3b71964a7ad79e53f50b351'
          assert m['S75_source_original_native_H8_physical_SHA256']=='83c1da7b6e79afcfad339c498dcf0f4937411fbbfb081d500d5ca59ea4798900'
          assert m['real43M_original_S75_616J7_H8_readonly_120_native_BPE_replayed_before_this']
          assert m['S77_sourceonly_mentioned_vs_asserted_decoupled']
          assert m['S78_no_original43M_GT_S26_S57_S59_S61_S62_S63_S65_weight_change']
          assert m['n_train']==90 and m['n_grouped_diagnostic_not_independent']==30
          assert m['n_trainable_specialist_parameters']==7496
          assert sum(x.numel() for x in load_file(str(p)).values())==7496
          assert m['fp16_new_specialist_weights_SHA256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert m['eight_distinct_supervised_situation_microareas_NOT_same_head']
          assert m['constructed_labels_not_independently_human_reviewed']
          assert m['no_original_S65_recipients_or_factuality_CHANGED']
          assert m['no_old_S66_spent32_gold_or_sealed_EVAL32_EVAL128']
          assert m['no_new_candidate_J7_616_bpp_CPU_or_online_safety_certification']
          assert m['evaluation_teacher_anchored_not_end_to_end']
          assert m['output_gate']==0 and not m['candidate_accepted'] and not m['activation_allowed']
          scores=m['per_group_synthetic_TRAIN_diagnostics']
          assert scores['n_original_S65_factual_event_beam8_constructed_anchor_covered']==96
          assert scores['n_new_mention_beam8_constructed_anchor_covered']==120
          assert scores['source_only_mentions_event_candidates_not_asserted']
          assert scores['same_10_synthetic_templates_across_all_families']
          assert scores['gold_anchored_for_loss_and_diagnostic_not_event_discovery']
          assert scores['unanchored_event_candidate_FALSE_POSITIVES_NOT_MEASURED']
          assert scores['no_original_S65_logits_or_assertion_decoding_changed']
          for name,n in (('train90_ANCHORED',90),('diagnostic30_ANCHORED',30),
                         ('diagnostic_quoted6_ANCHORED',6),
                         ('diagnostic_notquoted24_ANCHORED',24)):
              s=scores[name]
              assert s['n_constructed_TRAIN_event_anchor_in_source_only_mention_beam']==n
              assert 0<=s['micro_f1']<=1
          print('S78_REAL43M_GT_TRAIN90_8_INDEPENDENT_SITUATION_MINIHEADS',
                scores['train90_ANCHORED']['micro_f1'],
                'OLD_SYNTHETIC_DIAG30',scores['diagnostic30_ANCHORED']['micro_f1'],
                'QUOTE6',scores['diagnostic_quoted6_ANCHORED']['micro_f1'],
                'GATE_OFF',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra2-s78-real43M-GT-S74-TRAIN90-8-independent-mention-specialists-shadow-noEVAL
          path: results/nra2_s78_real43m_GT_8_quoted_mention_specialists/
          retention-days: 30
          if-no-files-found: error
