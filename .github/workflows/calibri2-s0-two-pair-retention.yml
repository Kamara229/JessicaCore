name: CALIBRI2 S0 two-pair TRAIN retention paid A-B
on:
  push:
    branches:
      - 'research/calibri2-s0-small-first-paid-architecture'
    paths:
      - 'research/calibri2/s0/two_pair_retention.py'
      - '.github/workflows/calibri2-s0-two-pair-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train_one_opposing_pair_in_two_physical_paid_arms:
    runs-on: ubuntu-22.04
    timeout-minutes: 140
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU packages without original pretrained model
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Validate S0 TRAIN only microfit source
        run: python -m compileall -q research/calibri2/s0/two_pair_retention.py
      - uses: actions/download-artifact@v4
        with:
          name: calibri2-s0-random-small-physically-paid-native-bootstrap
          path: inputs/s0
          run-id: 42366228524
          github-token: ${{ github.token }}
      - name: Real 256-step two-pair TRAIN A-B retention with stored paid models only
        run: |
          python research/calibri2/s0/two_pair_retention.py inputs/s0/CALIBRI2_S0_RANDOM_INITIAL.cb59 results/calibri2/s0/two_pair
      - name: Upload real answers logits and complete physical trained sources
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s0-two-TRAIN-pair-256step-retention-paid-AB
          path: results/calibri2/s0/one_pair/
          if-no-files-found: warn
          retention-days: 45
          compression-level: 0
