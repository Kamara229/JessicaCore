name: Calibri Fusion Growth F08 legacy runtime budget inventory
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-f07-20261125]
permissions:
  contents: read
  actions: read
jobs:
  f08:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-f08-budget-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scope check
        run: |
          git diff --name-only 434a213e8fffe0786ee5e4c190f55d0721239367 HEAD >/tmp/f08scope
          test "$(wc -l </tmp/f08scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/f08_runtime_inventory.py' -e '.github/workflows/calibri-fusion-growth-f08.yml' /tmp/f08scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f03-rate-trained-core-G0
          run-id: 45669309826
          path: inputs/f03
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s94-unaccepted-lossless-three-profile-bank-456-TRAIN-feasibility
          run-id: 42697267843
          path: inputs/s94
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s95-unaccepted-prompt-only-router-456-strict-CPU
          run-id: 42698707784
          path: inputs/s95
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s98-unaccepted-MPS-neural-second-token-owner-copy-feasibility
          run-id: 42704076897
          path: inputs/s98
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-s160-real-parallel-slot-binding-s142-456-128
          run-id: 43263202587
          path: inputs/s160
          github-token: ${{ github.token }}
      - name: Measure missing legacy model files and actual tokenizer footprint
        run: python research/calibri2/fusion_growth/f08_runtime_inventory.py --root inputs --out results/f08
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          path: results/f08/
          retention-days: 30
          if-no-files-found: error
