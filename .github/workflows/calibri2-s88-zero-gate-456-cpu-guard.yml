name: CALIBRI S88 exact zero-gate fastpath 456 TRAIN and CPU 90-percent guard
'on':
  pull_request:
    types: [opened, synchronize]
    branches:
      - research/calibri2-s87-joint-core-green-tunnel-20261109
permissions:
  contents: read
  actions: read
jobs:
  s88_zero_gate_cpu_456:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s88-zero-gate-cpu-fastpath-20261109'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '870087'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Compile S88 and reject inspected QA imports
        run: |
          python -m compileall -q research/calibri2/s88/
          if grep -E '^(from|import) calibri2\.(s26|s29|s53|s55|s57|s68|s72|s79|s85)' research/calibri2/s88/*.py; then exit 1; fi
      - name: Install pinned CPU model stack
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Original sealed CB59 core
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Immutable original S82 controller
        uses: actions/download-artifact@v4
        with:
          name: calibri-s82-real-GPU-contextual-token-pointer-TRAIN-only-protected
          path: inputs/s82
          run-id: 42569548659
          github-token: ${{ github.token }}
      - name: Actual S87 MPS-trained compressed core and Green Tunnel
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-unaccepted-joint-core-internal-tunnel-feasibility
          path: inputs/s87
          run-id: 42657528666
          github-token: ${{ github.token }}
      - name: Frozen full 456-row S87 negative-control audit
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-456-native-source-PyTorch-CPU-TRAIN-protected-audit
          path: inputs/s87_prior_guard
          run-id: 42659248083
          github-token: ${{ github.token }}
      - name: Audit exact 456 TRAIN parity and S88 CPU fastpath
        run: |
          python research/calibri2/s88/guard_zero_gate_fastpath.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s82/S82_REAL_GPU_GENERAL_TOKEN_POINTER_PAID_TRAIN_CANDIDATE.safetensors \
            inputs/s87/S87_UNACCEPTED_NEW_SOURCE_CB61.s61 \
            inputs/s87/S87_UNACCEPTED_JOINT_PROTOTYPE.safetensors \
            inputs/s87/S87_UNACCEPTED_JOINT_PHYSICAL_PROTOTYPE_REPORT.json \
            results/s88_456 \
            inputs/s87_prior_guard/S87_ALL_456_TRAIN_GUARD_REPORT.json
      - name: Preserve all negative findings and comparison IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s88-zero-gate-456-exact-token-and-PyTorch-CPU-guard
          path: results/s88_456/
          retention-days: 90
          if-no-files-found: warn
