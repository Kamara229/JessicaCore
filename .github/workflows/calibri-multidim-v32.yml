name: CALIBRI v0.32 - multidimensional physical bytes, real PPL, prototype stream speed
on:
  pull_request:
    paths:
      - 'research/calibri/multidim_v32.py'
      - 'research/calibri/multidim_experiment_v32.py'
      - 'research/calibri/multidim_compare_v32.py'
      - 'research/calibri/SESSION_32.md'
      - '.github/workflows/calibri-multidim-v32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pretrained-physical-multidimensional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Torch CPU 2.5.1
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned public model/corpus and scipy SVD packages
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Physical CRC and actual byte-stream operator smoke
        run: python research/calibri/multidim_v32.py
      - name: Measure real pretrained Pythia weights against equal-byte INT4 baseline
        run: |
          python research/calibri/multidim_experiment_v32.py \
            --output results/calibri_v32_real_weights.json \
            --train-tokens 256 --validation-tokens 1024 \
            --context 128 --rank 4 --microbatch 32
      - name: Preserve real CRC-protected physical blob and JSON measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v32-${{ matrix.os }}
          path: |
            results/calibri_v32_real_weights.json
            results/calibri_v32_multidim_bytes.bin
          retention-days: 14
          if-no-files-found: ignore
  compare-real-weight-physical-metrics:
    needs: pretrained-physical-multidimensional
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v32-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Fail only on source/integrity mismatch; retain negative quality/speed measurements
        run: |
          python research/calibri/multidim_compare_v32.py \
            --first results/runs/calibri-v32-ubuntu-22.04/calibri_v32_real_weights.json \
            --second results/runs/calibri-v32-ubuntu-24.04/calibri_v32_real_weights.json \
            --output results/calibri_v32_crosshost.json
      - name: Archive experimental comparison even if quality is worse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v32-crosshost-verdict
          path: results/calibri_v32_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
