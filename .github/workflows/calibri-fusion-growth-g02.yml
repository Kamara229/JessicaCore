name: Calibri Fusion Growth G02 attention and feedforward growth with discrete learning
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g01-math-horizontal-fusion-20261126]
permissions:
  contents: read
  actions: read
jobs:
  g02:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g02-attention-discrete-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only 3165059c6af5c6a7faef17ac0ed8da96526f1f6c HEAD >/tmp/g02scope
          test "$(wc -l </tmp/g02scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g02_attention_discrete.py' -e '.github/workflows/calibri-fusion-growth-g02.yml' /tmp/g02scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g01-horizontal-fusion-G0
          run-id: 45753295117
          path: inputs/g01
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - name: Compare 54M and 74M growth then train independent new discrete indices
        run: python research/calibri2/fusion_growth/g02_attention_discrete.py --g01 inputs/g01 --f08 inputs/f08 --out results/g02
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-g02-attention-discrete-G0
          path: results/g02/
          retention-days: 30
          if-no-files-found: error
