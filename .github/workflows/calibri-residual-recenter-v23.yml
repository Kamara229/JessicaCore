name: CALIBRI v0.23 - physical INT5 residual re-centering
on:
  pull_request:
    paths:
      - 'research/calibri/residual_recenter_v23.py'
      - '.github/workflows/calibri-residual-recenter-v23.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recenter-physical-packed-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build packed INT5 C row reader for isolated research
        run: gcc -O3 -std=c11 -Wall -Wextra -Werror -shared -fPIC -o research/calibri/libpacked5_v23.so research/calibri/packed5_v19.c research/calibri/packed5_rowcache_v20.c
      - name: Install pinned CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned real-model dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - name: Compare immutable and re-centered packed residuals at equal bytes
        run: python research/calibri/residual_recenter_v23.py --library research/calibri/libpacked5_v23.so --output results/calibri_v23_recenter.json
      - name: Upload metrics only; exclude proprietary and model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v23-residual-recenter-results
          path: results/calibri_v23_recenter.json
          if-no-files-found: ignore
          retention-days: 14
