name: CALIBRI S186 history numeric plus S69 prompt-only tokenizer 456 counterfactual
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s185-source-only-first-eos-diagnostic-20261113
permissions:
  contents: read
  actions: read
jobs:
  s186_source456_frozen_real_j7_shadow_counterfactual:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s186-history-s69-source-shadow-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: research:research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: S186 exact S69 history source and 456 protected synthetic no gold contract
        run: |
          python -m compileall -q research/calibri2/s186
          python -m unittest -v calibri2.s186.test_history_s69_source_shadow
          echo S186_PREP_HISTORY_S69_SOURCE_ONLY_NO_GOLD_SELECTOR_NO_MODEL
      - name: Install pinned S179 Python decoder compatibility for ONLY frozen public tokenizer and TRAIN source prompt generator
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Download frozen S179 real original CPU J7 456 label-free traces
        uses: actions/download-artifact@v4
        with:
          name: calibri-s179-original456-real-second-token-eos-trace-only
          run-id: 43323981995
          path: inputs/s179
          github-token: ${{ github.token }}
      - name: Download frozen S87 original TRAIN 456 report for posthoc scoring only
        uses: actions/download-artifact@v4
        with:
          name: calibri-s87-456-native-source-PyTorch-CPU-TRAIN-protected-audit
          run-id: 42659248083
          path: inputs/s87
          github-token: ${{ github.token }}
      - name: Download successful S182 real CPU J7 456 plus new128 guard
        uses: actions/download-artifact@v4
        with:
          name: calibri-s182-real-456-128-shadow-no-forgetting-j7
          run-id: 43331434088
          path: inputs/s182
          github-token: ${{ github.token }}
      - name: S186 all456 tokenizer full source policy proposals then posthoc 428 to 454 to 456 gate
        run: |
          python research/calibri2/s186/frozen456_full_source_shadow_replay.py \
            inputs/s179/S179_ORIGINAL456_SOURCE_ONLY_TRACES.json \
            inputs/s87/S87_ALL_456_TRAIN_GUARD_REPORT.json \
            inputs/s182/S182_REAL_SOURCE_SHADOW_456_128_GUARD.json \
            results/s186/S186_FULL456_S69_HISTORY_TOKENIZED_SHADOW_NO_REAL_J7.json
      - name: Archive research-only S186 posthoc no real J7 / no model accepted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s186-S69-history-frozen456-no-new-J7
          path: results/s186/
          if-no-files-found: warn
          retention-days: 90
