name: CALIBRI 2.0 S3 22M diverse replay and fresh generalization
on:
  push:
    branches:
      - 'research/calibri2-s0-small-first-paid-architecture'
    paths:
      - 'research/calibri2/s3/diverse_task_replay.py'
      - 'research/calibri2/s3/fresh_heldout.py'
      - '.github/workflows/calibri2-s3-diverse-replay.yml'
  pull_request:
    branches:
      - 'research/calibri2-v001-from-scratch-135m-paid-weights'
    types: [opened, synchronize, reopened]
    paths:
      - 'research/calibri2/s3/diverse_task_replay.py'
      - 'research/calibri2/s3/fresh_heldout.py'
      - '.github/workflows/calibri2-s3-diverse-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paid_s3_22M_diverse_replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research requirements
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile S3 fixed curriculum and frozen heldout
        run: python -m compileall -q research/calibri2/s3
      - name: Download exact validated 22M S2 packed checkpoint from finished run 42371240089
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s2-22M-1920-train-step-4-8-24-pair-capacity-ladder
          path: inputs/s2
          run-id: 42371240089
          github-token: ${{ github.token }}
      - name: Evaluate fresh S3 192 unseen questions before weight changes
        run: |
          python research/calibri2/s3/fresh_heldout.py inputs/s2/CALIBRI2_S2_24pairs_48answers_22M_paid.cb59 results/calibri2/s3/before --label S2_22M_before_diverse_replay
      - name: Upload frozen new baseline answers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s3-before-192-fresh-24-open
          path: results/calibri2/s3/before/
          retention-days: 45
      - name: Train only 2560 precommitted paid CB59 steps with 24 historic and 64 new TRAIN pairs
        run: |
          python research/calibri2/s3/diverse_task_replay.py inputs/s2/CALIBRI2_S2_24pairs_48answers_22M_paid.cb59 results/calibri2/s3/train
      - name: Upload S3 physical checkpoint and full TRAIN curves
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s3-22M-2560-TRAIN-diverse-task-paid
          path: results/calibri2/s3/train/
          retention-days: 45
          compression-level: 0
      - name: Evaluate same frozen S3 192 unseen questions after training without selection
        run: |
          python research/calibri2/s3/fresh_heldout.py results/calibri2/s3/train/CALIBRI2_S3_22M_2560steps_paid.cb59 results/calibri2/s3/after --label S3_22M_after_diverse_replay
      - name: Upload S3 fresh generalization responses and short open speech
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s3-after-192-fresh-24-open
          path: results/calibri2/s3/after/
          retention-days: 45
      - name: Recheck S2 960 old QA for exploratory regression only NOT independent test
        run: |
          python research/calibri2/s2/benchmark_1024.py results/calibri2/s3/train/CALIBRI2_S3_22M_2560steps_paid.cb59 results/calibri2/s3/s2-reused --label S3_22M_exploratory_reused_S2_QA
      - name: Upload reused S2 QA diagnostic clearly flagged exploratory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri2-s3-REUSED-S2-960-exploratory
          path: results/calibri2/s3/s2-reused/
          retention-days: 45
