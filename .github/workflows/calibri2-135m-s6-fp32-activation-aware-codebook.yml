name: CALIBRI 135M S6 real pretrained FP32 activation-aware CB59 source
'on':
  push:
    branches:
      - 'research/calibri2-135m-s6-activation-calibrated-codebooks-20261117'
    paths:
      - 'research/calibri2/independent_135m/s6/**'
      - '.github/workflows/calibri2-135m-s6-fp32-activation-aware-codebook.yml'
  workflow_dispatch:
concurrency:
  group: independent-calibri135m-S6-activation-aware-codebooks
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  real_trained_FP32_activate_and_physically_refit_211:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '13561117'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real pretrained FP32 135M and direct CB59 CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Original full-211 source and newly authored S6 workflow static/codec contracts
        run: |
          python -m compileall -q research/calibri2/independent_135m/s6
          python -m unittest test_v197_green_tunnel_generic_parity test_v185_discrete_index -v
      - name: Get physically authenticated original FP32 trained 135M direct CB59 S0
        uses: actions/download-artifact@v4
        with:
          name: calibri2-original-pretrained-135M-full-architecture-NO-NRA-vs-FP32
          run-id: 43946485860
          path: inputs/original
          github-token: ${{ github.token }}
      - name: Execute real trained FP32 20 TRAIN calibration and 211 full source-matrix weighted quantization
        run: |
          python research/calibri2/independent_135m/s6/fit_calibrated_k32.py \
            inputs/original/CALIBRI2_135M_SOURCE_CB59.cb59 \
            results/calibri2/original135m/S6/
      - name: Upload actual physically paid original 135M archive, full layer errors and negative QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-original135M-S6-activation-weighted-physically-paid-CB59
          path: results/calibri2/original135m/S6/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
