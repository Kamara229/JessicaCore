name: CALIBRI v138 5bit native same-rate embedding/codebook repack and semantic probe
on:
  pull_request:
    paths:
      - 'research/calibri/v138/**'
      - 'research/calibri/test_v138_repack.py'
      - '.github/workflows/calibri-pro-max-v138.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native_repack:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - name: Unit-test bit-exact K32V8 physical repacker, aliases, source sizes and CRC/SHA
        run: python -m unittest test_v138_repack -v
      - name: Repack two original-source-only codebooks and compare genuine native CPU generations
        run: python -m v138.run "$HOST" results/v138
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v138-native-original-source-repacked-5bit
          path: results/v138/
          if-no-files-found: warn
          retention-days: 30
