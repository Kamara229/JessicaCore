name: CALIBRI v114 functional-first tiny shared structural model
on:
  pull_request:
    paths:
      - 'research/calibri/v114/**'
      - 'research/calibri/test_v114_behavior.py'
      - '.github/workflows/calibri-v114-behavior-first-tiny.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-small-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch and safetensors
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install safetensors==0.4.5
      - name: Validate compact operators and hold-out case split
        run: python -m unittest test_v114_behavior -v
      - name: Actually train three tiny models and test generated ANSWERS
        run: python -m v114.pipeline results/v114
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-v114-behavior-first-small-models
          path: |
            results/v114/v114_behavior.json
            results/v114/*.safetensors
          if-no-files-found: error
          retention-days: 30
