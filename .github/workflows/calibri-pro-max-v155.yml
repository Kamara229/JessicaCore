name: CALIBRI v155 original-source paid layer6 single-operator new VALID check
on:
  pull_request:
    paths:
      - 'research/calibri/v155/**'
      - 'research/calibri/test_v155_crossdomain_single_op.py'
      - '.github/workflows/calibri-pro-max-v155.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_new_holdout_single_operator:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/paid/CALIBRI_v153_original_layer_paid_onebit.cb153
      DIAGNOSTIC: inputs/diagnostic/v154_seven_source_ops_16arms_existing_questions.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU original model and original TRAIN-split dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v153-physical-sensitive-block-onebit-native-original
          path: inputs/paid
          run-id: 41911781429
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v154-frozen-CB153-native-seven-operator-ablation
          path: inputs/diagnostic
          run-id: 41912617369
          github-token: ${{ github.token }}
      - name: Synthetic tests ensure original source selection precedes untouched VALID
        run: python -m unittest test_v155_crossdomain_single_op -v
      - name: Select based on OLD diagnostic only and test completely new WikiText News domains
        run: python -m v155.run "$SOURCE" "$DIAGNOSTIC" results/v155
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v155-paid-original-operator-untouched-two-domains
          path: results/v155/
          if-no-files-found: warn
          retention-days: 30
