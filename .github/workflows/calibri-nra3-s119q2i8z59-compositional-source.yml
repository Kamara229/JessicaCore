name: Calibri Z59 GPT compositional paired curriculum source only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-s119q2i8z58-GPT-TRAIN42-learning-audit-20261124
permissions:
  contents: read
jobs:
  source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/calibri2-s119q2i8z59-GPT-compositional-curriculum-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict source-only diff
        run: |
          set -euo pipefail
          git diff --name-only origin/research/calibri2-s119q2i8z58-GPT-TRAIN42-learning-audit-20261124 HEAD >/tmp/z59scope
          test "$(wc -l </tmp/z59scope)" -eq 3
          if grep -Fvx -e 'research/calibri_nra3/s119q2i8z59_gpt_compositional_curriculum.py' -e 'research/calibri_nra3/test_s119q2i8z59_gpt_compositional_curriculum.py' -e '.github/workflows/calibri-nra3-s119q2i8z59-compositional-source.yml' /tmp/z59scope; then exit 1; fi
      - name: Install prior source import dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'transformers==4.46.3' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3'
      - name: Verify contrast pairs, arithmetic, TRAIN replay and disjoint source
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v research.calibri_nra3.test_s119q2i8z59_gpt_compositional_curriculum
          python - <<'PY'
          import json
          from research.calibri_nra3.s119q2i8z59_gpt_compositional_curriculum import verify
          print("Z59_GPT_CURRICULUM",json.dumps(verify(),sort_keys=True))
          PY
