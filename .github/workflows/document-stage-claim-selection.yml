name: Document Stage Claim Selection Regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/document-stage-claim-selection.yml'
      - 'backend/core/files/documentStageClaimSelection*.js'
      - 'backend/core/files/documentSectionIndex.js'
      - 'backend/core/files/documentOverflowReadBatches.js'
      - 'backend/core/files/documentOverflowPlanCache.js'
      - 'backend/core/files/documentOverflowBatchMaterialization.js'
      - 'backend/core/files/documentOverflowBatchBulkMaterialization.js'
      - 'backend/core/files/documentOverflowBatchVerification.js'
      - 'backend/core/files/documentStageClaimConflict*.js'
      - 'backend/core/files/documentStageClaimWindow*.js'
      - 'backend/core/files/documentStageClaimCrossPage*.js'
      - 'backend/core/files/documentOverflowAnalysisFacade.js'
      - 'backend/core/files/documentPagedAnalysis.js'
      - 'backend/core/files/documentPagedResumeCheckpoint.js'
      - 'backend/core/files/documentAnalysisFacade.js'
      - 'backend/core/files/documentQuotaCoverage.js'
      - 'backend/ai/providerAvailability.js'
      - 'backend/ai/retry/retryExecutor.js'
      - 'backend/ai/retry/retryAfter.js'
      - 'backend/ai/retry/retryClassifier.js'
      - 'backend/scripts/regressionDocumentStageClaimSelection*.test.js'
      - 'backend/scripts/regressionDocumentStageClaimConflict*.test.js'
      - 'backend/scripts/regressionDocumentStageClaimWindow*.test.js'
      - 'backend/scripts/regressionDocumentStageClaimCrossPage*.test.js'
      - 'backend/scripts/regressionDocumentStageClaimLongDocument.test.js'
      - 'backend/scripts/regressionDocumentStageClaimStress.test.js'
      - 'backend/scripts/regressionDocumentOverflowPlanCache.test.js'
      - 'backend/scripts/regressionDocumentOverflowBatchSession.test.js'
      - 'backend/scripts/regressionDocumentOverflowConcurrentStress.test.js'
      - 'backend/scripts/regressionDocumentOverflowTenConcurrent.test.js'
      - 'backend/scripts/regressionDocumentProviderCooldown.test.js'
      - 'backend/scripts/regressionDocumentPagedCooldownEndToEnd.test.js'
      - 'backend/scripts/regressionDocumentPagedResumeCheckpoint.test.js'
      - 'backend/scripts/regressionDocumentQuotaCoverage.test.js'
      - 'backend/scripts/fixtures/documentStageClaimStressLifecycle.js'
      - 'backend/scripts/fixtures/documentStageClaimConcurrencyWorker.js'
      - 'backend/scripts/fixtures/documentStageClaimStressCorpus.js'
      - 'backend/scripts/fixtures/documentStageClaimFixture.js'
      - 'backend/scripts/fixtures/documentStageClaimConflict*.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extractive-claim-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - run: node --test backend/scripts/regressionDocumentStageClaimSelection.test.js backend/scripts/regressionDocumentStageClaimSelectionMerge.test.js backend/scripts/regressionDocumentStageClaimSelectionGrouping.test.js backend/scripts/regressionDocumentStageClaimSelectionCoverageAudit.test.js backend/scripts/regressionDocumentStageClaimConflictCandidates.test.js backend/scripts/regressionDocumentStageClaimConflictContext.test.js backend/scripts/regressionDocumentStageClaimConflictTriage.test.js backend/scripts/regressionDocumentStageClaimConflictQuality.test.js backend/scripts/regressionDocumentStageClaimConflictExpanded.test.js backend/scripts/regressionDocumentStageClaimConflictParaphrases.test.js backend/scripts/regressionDocumentStageClaimConflictLexicon.test.js backend/scripts/regressionDocumentStageClaimWindowContinuity.test.js backend/scripts/regressionDocumentStageClaimCrossPageAudit.test.js backend/scripts/regressionDocumentStageClaimLongDocument.test.js
      - run: node --max-old-space-size=512 --test backend/scripts/regressionDocumentStageClaimStress.test.js
      - run: node --max-old-space-size=512 --test backend/scripts/regressionDocumentOverflowPlanCache.test.js
      - run: node --max-old-space-size=512 --test backend/scripts/regressionDocumentOverflowBatchSession.test.js
      - run: node --max-old-space-size=512 --test backend/scripts/regressionDocumentOverflowConcurrentStress.test.js
      - run: node --max-old-space-size=512 --test backend/scripts/regressionDocumentOverflowTenConcurrent.test.js
      - run: node --test backend/scripts/regressionDocumentProviderCooldown.test.js
      - run: node --test backend/scripts/regressionDocumentQuotaCoverage.test.js backend/scripts/regressionDocumentPagedCooldownEndToEnd.test.js
      - run: node --test backend/scripts/regressionDocumentPagedResumeCheckpoint.test.js
