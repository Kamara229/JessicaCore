name: CALIBRI S40 real CB59 S38 vs S39 noun token diagnosis
on:
  push:
    branches:
      - research/calibri2-s40-physical-noun-logits-diagnostic-20261108
    paths:
      - 'research/calibri2/s40/**'
      - '.github/workflows/calibri2-s40-physical-noun-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  S40_paid_S38_S39_64_TRAIN_noun_ranks:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '4040'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile S40 diagnostic
        run: |
          python -m compileall -q research/calibri2/s40/
      - name: Restore S38 real compact CB59 from research; never QA
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s38-actual-36M-CB59-if-accepted
          path: inputs/s38
          run-id: 42495934328
          github-token: ${{ github.token }}
      - name: Restore S39 real 5bit trained compact CB59 from research
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s39-new-real-5bit-CB59-if-accepted
          path: inputs/s39
          run-id: 42497173536
          github-token: ${{ github.token }}
      - name: Diagnose every same-color opposing-noun TRAIN pair before and after S39
        run: |
          python research/calibri2/s40/physical_noun_logits_S38_vs_S39.py \
            inputs/s38/CALIBRI2_S38_36M_PAID_TRAIN.cb59 \
            inputs/s39/CALIBRI2_S39_36M_INDEX_TRAIN_PAID.cb59 \
            results/s40
      - name: Save observed 64-pair TRAIN noun ranks, not QA or dense weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s40-real-physical-S38-S39-noun-ranks-TRAIN-only
          path: results/s40/*.json
          if-no-files-found: warn
          retention-days: 90
