name: CALIBRI v68 - real pretrained GQA V/O paired exact-gauge and same-rate packed source
on:
  pull_request:
    paths:
      - 'research/calibri/gqa_gauge_v68.py'
      - 'research/calibri/SESSION_68.md'
      - '.github/workflows/calibri-gqa-gauge-v68.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-source-gqa-paired-invariance-and-physical-archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use pinned original CPU environment and pretrained source
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Validate research script syntax
        run: python -m py_compile research/calibri/gqa_gauge_v68.py
      - name: Fetch pinned original entire real CB59 compressed source
        run: |
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
      - name: Test exact original GQA function and SAME-rate physical full archive
        run: |
          python research/calibri/gqa_gauge_v68.py --source input/CALIBRI_v59_full_direct_sub070.cb59 --output results/calibri_v68_real_gqa.json
      - name: Preserve honest outcome and real-model source hash (no checkpoint upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v68-real-gqa-audit
          path: results/calibri_v68_real_gqa.json
          retention-days: 7
          if-no-files-found: ignore
