name: CALIBRI v178 paid per-column source and native answer benchmark
on:
  pull_request:
    paths:
      - 'research/calibri/v178/**'
      - 'research/calibri/test_v178_source.py'
      - '.github/workflows/calibri-pro-max-v178.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paid_column_source_native_real_answers:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/v161/CALIBRI_v161_original_block0_paid_onebit.cb153
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned actual CPU model, science and native codec packages
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v161-original-block0-paid-onebit-under-0p7
          path: inputs/v161
          run-id: 41920207168
          github-token: ${{ github.token }}
      - name: Validate complete paid 5-bit-plus-column code and compiled CPU op
        run: python -m unittest test_v178_source -v
      - name: Save complete paid source, audit native numerics/speed and compare real FP32/CB59/CB178 answers
        run: python -m v178.run "$SOURCE" results/v178
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v178-paid-column-native-answers
          path: results/v178/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
