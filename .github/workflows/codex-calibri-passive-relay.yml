name: Codex passive CALIBRI relay provider-free regression
on:
  pull_request:
    paths:
      - 'backend/core/codex/relayCalibriPassiveHandoff.js'
      - 'backend/http/routes/codexRoute.js'
      - 'backend/scripts/regressionCodexCalibriPassiveRelay.test.js'
      - '.github/workflows/codex-calibri-passive-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive_no_test_relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies, no scripts or lock changes
        run: npm install --prefix backend --no-save --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify actual v180/v181 messages, route and no test execution
        run: |
          node --test backend/scripts/regressionCodexCalibriPassiveRelay.test.js
          node --test backend/scripts/regressionCodexCalibriNoTestNextStep.test.js
          node --test backend/scripts/regressionCodexRelay.test.js
