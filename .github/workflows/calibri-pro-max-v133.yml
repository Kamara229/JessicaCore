name: CALIBRI v133 frozen band0 full-generation diagnosis
on:
  pull_request:
    paths:
      - 'research/calibri/v133/**'
      - 'research/calibri/test_v133_generation.py'
      - '.github/workflows/calibri-pro-max-v133.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen_generation:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HOST: inputs/core/CALIBRI_v119_joint_native_135M.cb118
      GREEN: inputs/green/GreenTunnel_shared_10MB_6gates.safetensors
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: inputs/core
          run-id: 41822331451
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v122-frozen-10mb-shared-gate-policy-real-135m
          path: inputs/green
          run-id: 41828640085
          github-token: ${{ github.token }}
      - name: Validate no-oracle, paired corpus and immutable ablation
        run: python -m unittest test_v133_generation -v
      - name: Generate genuine full answers with frozen CB59 and v119 controls
        run: python -m v133.run "$HOST" "$GREEN" results/v133
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v133-locked-native-band0-generation
          path: results/v133/
          if-no-files-found: warn
          retention-days: 30
