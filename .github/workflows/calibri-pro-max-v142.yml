name: CALIBRI v142 true NLL and teacher KL on frozen WikiText/News VALID
on:
  pull_request:
    paths:
      - 'research/calibri/v142/**'
      - 'research/calibri/test_v142_validation.py'
      - '.github/workflows/calibri-pro-max-v142.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_corpus_valid:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PAID: inputs/paid/CALIBRI_v140_paid_tied_embedding_6bit.cb140
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v140-native-paid-tied-6bit-full-model
          path: inputs/paid
          run-id: 41898410897
          github-token: ${{ github.token }}
      - name: Unit test exact source next-token NLL, teacher KL and validation split
        run: python -m unittest test_v142_validation -v
      - name: Real WikiText and AG News source TRAIN-VALID next-token PPL, KL and packed CPU prefill
        run: python -m v142.run "$PAID" results/v142
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v142-two-domain-native-valid-NLL-KL
          path: results/v142/
          if-no-files-found: warn
          retention-days: 30
