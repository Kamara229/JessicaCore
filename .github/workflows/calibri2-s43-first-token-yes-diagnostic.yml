name: CALIBRI S43 real paid CB59 free first token Yes collapse
on:
  push:
    branches:
      - research/calibri2-s43-free-first-token-collapse-20261108
    paths:
      - 'research/calibri2/s43/**'
      - '.github/workflows/calibri2-s43-first-token-yes-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  S43_S39_vs_S41_real_first_greedy_token:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU model libraries
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Compile isolated read-only S43 diagnostic
        run: |
          python -m compileall -q research/calibri2/s43/
      - name: Download exact S39 physical CB59 (not QA)
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s39-new-real-5bit-CB59-if-accepted
          path: inputs/s39
          run-id: 42497173536
          github-token: ${{ github.token }}
      - name: Download exact S41 physical CB59 (not QA)
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s41-physical-36M-CB59-only-if-accepted
          path: inputs/s41
          run-id: 42498851459
          github-token: ${{ github.token }}
      - name: Inspect 64 TRAIN first-token Yes vs gold-color logits, physical S39 vs S41
        run: |
          python research/calibri2/s43/physical_first_token_yes_collapse.py \
            inputs/s39/CALIBRI2_S39_36M_INDEX_TRAIN_PAID.cb59 \
            inputs/s41/CALIBRI2_S41_36M_GLOBAL_NOUN_PAID.cb59 \
            results/s43
      - name: Preserve exact S43 read-only TRAIN results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri2-s43-real-first-token-yes-vs-color-TRAIN-only
          path: results/s43/*.json
          if-no-files-found: warn
          retention-days: 90
