name: CALIBRI v0.14 - development quality gate
on:
  pull_request:
    paths:
      - 'research/calibri/fusion_v14.py'
      - '.github/workflows/calibri-fusion-v14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-quality-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: research/calibri
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned analysis dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1'
      - run: python research/calibri/fusion_v13.py --selftest
      - run: python research/calibri/fusion_v14.py --smoke
      - name: Measure actual dev and test whole-model perplexity
        run: python research/calibri/fusion_v14.py --output results/calibri_v14_quality_gate.json --calibration-tokens 256 --dev-tokens 1024 --test-tokens 1024 --allowed-dev-ppl-increase 0.01
      - name: Upload metrics without weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v14-quality-gate-results
          path: results/calibri_v14_quality_gate.json
          if-no-files-found: ignore
          retention-days: 14
