name: CALIBRI v182 exact V1 versus FP32 first hidden layer divergence
on:
  pull_request:
    paths:
      - 'research/calibri/v182/**'
      - 'research/calibri/test_v182_divergence.py'
      - '.github/workflows/calibri-pro-max-v182.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full_actual_original_source_diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE: inputs/v181/CALIBRI_v181_ORACLE_V1.cb181
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original pretrained SmolLM2 on CPU
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - uses: actions/download-artifact@v4
        with:
          name: calibri-v181-physical-recovery-rate-oracles
          path: inputs/v181
          run-id: 42063234221
          github-token: ${{ github.token }}
      - name: Validate source-only diagnostic, 5-bit decode, first-divergence metrics
        run: python -m unittest test_v182_divergence -v
      - name: Compare real original FP32, FP16, exact V1 decoded and native across all 30 layers
        run: python -m v182.diagnose "$SOURCE" results/v182
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v182-original-v1-first-layer-diagnostic
          path: results/v182/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
