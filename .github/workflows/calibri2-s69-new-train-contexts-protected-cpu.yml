name: CALIBRI S69 frozen S67 old skills and NEW TRAIN contexts on CPU
'on':
  pull_request:
    types: [opened]
    branches:
      - research/calibri2-s68-fresh-blind-96-cpu-20261109
permissions:
  contents: read
  actions: read
jobs:
  s69_new_train_contexts_cpu_only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-s69-new-train-context-curriculum-20261109'
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    env:
      PYTHONPATH: research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No QA imports or training of source weights; static syntax check
        run: |
          python -m compileall -q research/calibri2/s69
          if grep -E '^from calibri2\.s68|^import calibri2\.s68|^from calibri2\.s29|^from calibri2\.s53|^from calibri2\.s55|^from calibri2\.s57' research/calibri2/s69/*.py; then exit 1; fi
      - name: Install pinned CPU-only training deps, no GPU
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Fetch immutable S45 36M physically compressed codebook
        uses: actions/download-artifact@v4
        with:
          name: calibri2-s45-real-physical-36M-CB59-if-accepted
          path: inputs/s45
          run-id: 42502640523
          github-token: ${{ github.token }}
      - name: Fetch physically paid S61 exact source bytes
        uses: actions/download-artifact@v4
        with:
          name: calibri-s61-real-physical-entropy-and-cold-cpu
          path: inputs/s61
          run-id: 42528473858
          github-token: ${{ github.token }}
      - name: Fetch sealed S67 rank128 Green Tunnel old-skill protected baseline
        uses: actions/download-artifact@v4
        with:
          name: calibri-s67-fully-paid-new-safe-half-delta-research-only
          path: inputs/s67
          run-id: 42532945010
          github-token: ${{ github.token }}
      - name: CPU TRAIN only, 12 restartable protected Green Tunnel steps
        run: |
          python research/calibri2/s69/train_new_contexts_without_old_skills_loss.py \
            inputs/s45/CALIBRI2_S45_FIRST_COLOR_GUARDED_NOUN_PAID.cb59 \
            inputs/s67/S67_HALF_DELTA_RANK128_CANDIDATE_ONLY.safetensors \
            inputs/s67/S67_FULLY_PAID_EXPLORATORY_MANIFEST.json \
            inputs/s61/S61_SOURCE_EXACT_ZLIB_CB59.s61 \
            results/s69
      - name: Keep actual full native TRAIN responses, negative outcomes and resumable state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-s69-fresh-TRAIN-contexts-rank128-old-skill-guard
          path: results/s69/
          if-no-files-found: warn
          retention-days: 90
