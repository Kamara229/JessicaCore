name: Calibri Fusion Growth G30 MPS native slot training preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g30-l6-parallel-20261127]
permissions:
  contents: read
  actions: read
jobs:
  g30-mps:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g30b-mps-20261127'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only a1dbd8d9023f2df829e0a60b0f92f45a950fb1d7 HEAD >/tmp/g30mpsscope
          test "$(wc -l </tmp/g30mpsscope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g30_mps_native_slot_preflight.py' -e '.github/workflows/calibri-fusion-growth-g30-mps.yml' /tmp/g30mpsscope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned ARM64 MPS dependencies
        run: |
          python -m pip install 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g05-134m-G0
          run-id: 45823877120
          path: inputs/g05
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g28-utf8
          run-id: 45937309879
          path: inputs/l6
          github-token: ${{ github.token }}
      - name: Native L6 slot GPU training
        run: python research/calibri2/fusion_growth/g30_mps_native_slot_preflight.py --g05 inputs/g05 --f08 inputs/f08 --parent inputs/l6 --out results/g30mps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-fusion-growth-g30-mps
          path: results/g30mps/
          retention-days: 30
          if-no-files-found: error
