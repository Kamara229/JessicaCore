name: CALIBRI v171 regression no 192x recompilations of original 0.6716bpp operators
on:
  pull_request:
    paths:
      - 'research/calibri/v169/run.py'
      - 'research/calibri/test_v171_persistent_paid_runtime.py'
      - '.github/workflows/calibri-pro-max-v171.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight_immutable_persistent_native_source_models:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and benchmark dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Prove matching 576 fixed prompts and zero native compile calls per question
        run: python -m unittest test_v171_persistent_paid_runtime -v
