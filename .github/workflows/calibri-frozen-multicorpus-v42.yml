name: CALIBRI v0.42 - frozen train A/B gate; three first-use public domains same-byte MLP PPL
on:
  pull_request:
    paths:
      - 'research/calibri/frozen_multicorpus_v42.py'
      - 'research/calibri/compare_frozen_multicorpus_v42.py'
      - 'research/calibri/SESSION_42.md'
      - '.github/workflows/calibri-frozen-multicorpus-v42.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pretrained-MLP-three-new-corpora:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned pretrained Pythia WikiText and three public corpora dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Frozen 2048 TRAIN-A / 2048 TRAIN-B, first-use BoolQ ARC-Easy Yelp PPL
        run: |
          python research/calibri/frozen_multicorpus_v42.py \
            --output results/calibri_v42_multidomain.json \
            --train-tokens 4096 --dev-tokens 1024 --new-tokens 2048 --context 128
      - name: Preserve all physical signed 3-4 bit 12-MLP CB36 bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v42-${{ matrix.os }}
          path: |
            results/calibri_v42_multidomain.json
            results/local_uncalibrated.bin
            results/local_trainA_calibrated.bin
            results/joint_trainA_calibrated_UNGATED.bin
            results/joint_trainA_calibrated_GATED.bin
            results/INT4_higher_rate_anchor.bin
          if-no-files-found: ignore
          retention-days: 14
  cross-cpu-review-immutable-corpora:
    needs: real-pretrained-MLP-three-new-corpora
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v42-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Validate true physical CB36 SHA, fixed AB gate and three separate heldout PPLs
        run: |
          python research/calibri/compare_frozen_multicorpus_v42.py \
            --a results/runs/calibri-v42-ubuntu-22.04/calibri_v42_multidomain.json \
            --b results/runs/calibri-v42-ubuntu-24.04/calibri_v42_multidomain.json \
            --output results/calibri_v42_crosshost.json
      - name: Keep independent check and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v42-crosshost-verdict
          path: results/calibri_v42_crosshost.json
          if-no-files-found: ignore
          retention-days: 14
