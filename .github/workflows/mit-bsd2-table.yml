name: MIT BSD 2-Clause Verified Table
on:
  pull_request:
    paths:
      - "backend/core/composer/nativeMitBsd2Comparison.js"
      - "backend/core/composer/nativePatentComparison.js"
      - "backend/scripts/regressionMitBsd2VerifiedTable.test.js"
      - ".github/workflows/mit-bsd2-table.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/composer/nativeMitBsd2Comparison.js"
      - "backend/core/composer/nativePatentComparison.js"
      - "backend/scripts/regressionMitBsd2VerifiedTable.test.js"
      - ".github/workflows/mit-bsd2-table.yml"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - run: node --test backend/scripts/regressionMitBsd2VerifiedTable.test.js backend/scripts/regressionMitBsdVerifiedTable.test.js backend/scripts/regressionBoundedPatentComparison.test.js
