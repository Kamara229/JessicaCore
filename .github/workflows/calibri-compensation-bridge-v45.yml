name: CALIBRI v45 - real pretrained pre/post compression compensation
on:
  pull_request:
    paths:
      - 'research/calibri/compensation_bridge_v45.py'
      - 'research/calibri/compare_compensation_v45.py'
      - 'research/calibri/SESSION_45.md'
      - '.github/workflows/calibri-compensation-bridge-v45.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pretrained-pythia-prepost-compensation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_DATASETS_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Install pinned model/dataset/numpy dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Sanity check reference syntax
        run: python -m py_compile research/calibri/compensation_bridge_v45.py research/calibri/compare_compensation_v45.py
      - name: Physically quantize and fit teacher residual on disjoint data; verify mmap bridge and real heldout PPL
        run: |
          python research/calibri/compensation_bridge_v45.py --output results/calibri_v45.json
      - name: Preserve all real source binaries, learned sidecars and negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v45-${{ matrix.os }}
          path: |
            results/calibri_v45.json
            results/CALIBRI_v45_ct33.bin
            results/CALIBRI_v45_int4.bin
            results/CALIBRI_v45_rank2.c45c
            results/CALIBRI_v45_affine.c45c
            results/CALIBRI_v45_hybrid.c45c
          retention-days: 14
          if-no-files-found: ignore
  independent-integrity-and-quality-verifier:
    needs: real-pretrained-pythia-prepost-compensation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: calibri-v45-ubuntu-*
          path: results/runs
          merge-multiple: false
      - name: Check two hosts on physical bytes, real pretrained source, mmap correctness and all PPL verdicts
        run: |
          python research/calibri/compare_compensation_v45.py \
            --a results/runs/calibri-v45-ubuntu-22.04/calibri_v45.json \
            --b results/runs/calibri-v45-ubuntu-24.04/calibri_v45.json \
            --output results/calibri_v45_crosshost.json
      - name: Preserve independent comparator and quality regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibri-v45-crosshost-verdict
          path: results/calibri_v45_crosshost.json
          retention-days: 14
          if-no-files-found: ignore
