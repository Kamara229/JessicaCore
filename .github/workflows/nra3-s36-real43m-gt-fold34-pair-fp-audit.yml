name: NRA3 S36 true43M+GT TRAIN fold34 directed source/recipient false-positive forensics
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/calibri2-nra3-s35-local-ne-dative-decode-scope-trainonly-20261118
permissions:
  contents: read
  actions: read
concurrency:
  group: nra3-s36-real43m-train-fold34-fp-pair-audit-noEval
  cancel-in-progress: true
jobs:
  actual_original43m_train_side_joint_role_rejected_margin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '320256'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require original frozen43M+GT 616 J7, sealed S22c raw/gold, original S26 and canonical S30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 44189114971 44189739539 44191302703 44192186916 44196720655 44200775382 44201326575 44202675198 44203704916 44204827220 44207183539 44208569216 44210352020; do
            test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$run" --jq .conclusion)" = success
          done
          echo S36_TRUE43M_GT_S35_SOURCE_FP16_PHYSICAL_PROVENANCE_LOCKED
      - name: Install CPU PyTorch and original paid FP16 physical libraries
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'safetensors==0.4.5'
      - name: Test TRAIN-only joint loss directions, hard negatives, no gold forward, no independent EVAL
        run: |
          python -m compileall -q research/nra3_s20
          python -m unittest -v research.nra3_s20.test_s31_joint_rejected_role_margin_contract research.nra3_s20.test_s32_precision_margin_trainonly research.nra3_s20.test_s33_headonly_preserve_relation_contract research.nra3_s20.test_s34_trainonly_teacher_margin_anticollapse research.nra3_s20.test_s35_local_neg_dative_trainonly research.nra3_s20.test_s36_pair_fp_audit_contract
      - name: Download only genuine S22c original43M GT raw338 features and separately SHA-sealed synthetic TRAIN256 gold
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22c-TRUE43M-GT-256-TRAIN-raw338-and-gold-separated-40fold
          run-id: 44191302703
          github-token: ${{ github.token }}
          path: inputs/s22c
      - name: Download SHA-pinned frozen original S19d 9332 FP16 grammar/context
        uses: actions/download-artifact@v4
        with:
          name: nra3-s19d-TRUE43M-GT-9332paidFP16-context-event-TRAIN96-internalCV-no-EVAL
          run-id: 44128707585
          github-token: ${{ github.token }}
          path: inputs/s19d
      - name: Download original real S22d 12381 FP16 archive solely for SHA integrity
        uses: actions/download-artifact@v4
        with:
          name: nra3-s22d-REAL43M-GT-256TRAIN-40fold-12381FP16-5heads-noEVAL
          run-id: 44192186916
          github-token: ${{ github.token }}
          path: inputs/s22d
      - name: Download original real S26 12384 FP16 archive and original completed 40fold metrics
        uses: actions/download-artifact@v4
        with:
          name: nra3-s26-REAL43M-GT-TRAIN256-40fold-12384FP16-event-inversion-ablation-noEVAL
          run-id: 44196720655
          github-token: ${{ github.token }}
          path: inputs/s26
      - name: Fetch completed original S35 label-blind TRAIN eightfold diagnostics (read only)
        uses: actions/download-artifact@v4
        with:
          name: nra3-s35-43M-GT-raw338-ne-dative-scope-8fold-TRAIN-only-noEVAL
          run-id: 44210352020
          github-token: ${{ github.token }}
          path: inputs/s35
      - name: Actually train sealed original43M+GT fold34, inspect individual source/target FP only AFTER model and decoder
        run: |
          python -m research.nra3_s20.s36_genuine43m_fold34_fp_pair_audit \
            --features inputs/s22c/S22C_REAL43M_GT_NEW256_RAWONLY_WORD338.safetensors \
            --gold inputs/s22c/S22C_256_SYNTHETIC_EVENT_GRAPH_TARGETS_TRAIN_ONLY.safetensors \
            --manifest inputs/s22c/S22C_REAL43M_GT_NEW256_RAWONLY_AND_TRAIN_GOLD_SEPARATE_REPORT.json \
            --s19d-parent inputs/s19d/NRA3_S19D_TRUE43M_GT_CONTEXT_SCOPE_GRAMMAR_AND_EVENT_TRAINONLY_FP16.n3s19d \
            --s22d-model inputs/s22d/NRA3_S22D_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12381_FP16.n3s22d \
            --s26-model inputs/s26/NRA3_S26_TRUE43M_GT_TRAIN256_GROUPED40_EVENT_GRAPH_12384_FP16.n3s26 \
            --baseline-s35-report inputs/s35/NRA3_S35_GENUINE43M_GT_TRAIN256_LOCAL_NEGATION_DECODE_ABLATION.json \
            --out results/nra3_s36
      - name: Validate 8 held TRAIN example FP pair taxonomy, original frozen FP16 and gold-blind raw scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("results/nra3_s36/NRA3_S36_TRUE43M_GT_TRAIN256_FOLD34_SURVIVING_FP_PAIRS.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          assert s["stage"]=="NRA3_S36_REAL43M_GT_TRAIN_ONLY_SEVEN_FP_DIRECTED_PAIR_AUDIT"
          assert s["source_original_s22c_real43M_GT_256SHA"]=="8963e2e8758b1c6a6fbd28eb597a77be1a454d732d0ecac93df6f5a753f6a361"
          assert s["s35_previous_run_id"]==44210352020 and s["prior_s35_completed_fold34_FP"]==7
          assert len(s["all_eight_TRAIN_held_rows_with_directed_pair_details"])==8
          assert s["original_s34_unscoped_rejected"]["held_REJECTED_positive_support"]==8
          assert s["S36_new_same_run_scoped_rejected"]["held_REJECTED_positive_support"]==8
          cc=s["rejected_pair_level_confusion_by_failure_type"]
          assert cc.get("TP",0)==s["S36_new_same_run_scoped_rejected"]["TP"]
          assert cc.get("FP",0)==s["S36_new_same_run_scoped_rejected"]["FP"]
          assert cc.get("FN",0)==s["S36_new_same_run_scoped_rejected"]["FN"]
          assert s["source_graph_labels_never_in_model_or_decoder_forward"]
          assert s["raw18_features_verified_against_exact_source_text"]
          assert s["original_event_role_coref_relation_numerically_unmodified"]
          assert s["paid_12384_FP16_numeric_model_unchanged"]
          assert s["no_held_label_or_text_fed_to_training"]
          assert s["no_new_model_candidate_or_decision_rule_selected"]
          assert s["no_independent_EVAL32_128_or_original_616J7_touched"]
          assert s["LIVE_Render_Supabase_Jessica_APK_Calibri_GT_NRA2_unchanged"]
          assert s["output_gate"]==0 and not s["candidate_accepted"] and not s["activation_allowed"]
          print("S36_TRUE43M_GT_DIRECTED_PAIR_FP_TAXONOMY_VERIFIED",json.dumps({
               "current_TP":cc.get("TP",0),"current_FP":cc.get("FP",0),
               "FP_non_event_src":cc.get("FP_wrong_non_event_source",0),
               "FP_event_src":cc.get("FP_wrong_event_source",0),
               "FP_wrong_target":cc.get("FP_wrong_target",0),
               "FP_wrong_both":cc.get("FP_wrong_both",0)},
               sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nra3-s36-REAL43M-GT-fold34-surviving-rejected-directed-FP-noEVAL
          path: results/nra3_s36/
          if-no-files-found: error
          retention-days: 30
