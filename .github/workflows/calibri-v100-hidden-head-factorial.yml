name: CALIBRI v100 original FP32 hidden/head 2x2 diagnostic only

on:
  pull_request:
    paths:
      - 'research/calibri/v100/**'
      - 'research/calibri/calibri_head_hidden_factorial_v100.py'
      - 'research/calibri/test_v100_factorial_guard.py'
      - 'research/calibri/SESSION_100_DOUBLE_FAULT_ORACLE.md'
      - '.github/workflows/calibri-v100-hidden-head-factorial.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  immutable_CB59_double_oracle_causal_factorial:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      PYTHONPATH: research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original pretrained CPU research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'sentencepiece==0.2.0' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - name: Check transient oracle restoration, compile all modular research files
        run: |
          python -m compileall -q research/calibri/v100 research/calibri/calibri_head_hidden_factorial_v100.py research/calibri/test_v100_factorial_guard.py
          python research/calibri/test_v100_factorial_guard.py -v
      - name: Retrieve immutable exact original CB59 archive not the official TEST
        run: |
          mkdir -p input results/v100
          gh run download 41507201766 --repo "$GITHUB_REPOSITORY" --name calibri-v59-ubuntu-22.04 --dir input
          test -s input/CALIBRI_v59_full_direct_sub070.cb59
          test -s research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json
      - name: Evaluate original hidden-state and output-head full precision oracle combination
        run: |
          python research/calibri/calibri_head_hidden_factorial_v100.py --original input/CALIBRI_v59_full_direct_sub070.cb59 --locked research/calibri/CALIBRI_FROZEN_BASELINE_2026-11-04.json --out results/v100
          test -s results/v100/v100_original_CB59_hidden_head_2x2_full_decoded_text.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-v100-frozen-native-2x2-fp32-hidden-head-diagnostic
          path: results/v100/v100_original_CB59_hidden_head_2x2_full_decoded_text.json
          retention-days: 7
          if-no-files-found: ignore
