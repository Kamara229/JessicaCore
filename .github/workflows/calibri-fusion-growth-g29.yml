name: Calibri Fusion Growth G29 L6 byte continuation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g28-l6-continuation-20261127]
permissions:
  contents: read
  actions: read
jobs:
  g29:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g29-l6-byte-continuation-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arm: [control, repair]
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only ea5416c3d2fac2986dac02ec785b877a92c0d6e1 HEAD >/tmp/g29scope
          test "$(wc -l </tmp/g29scope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g29_l6_byte_continuation.py' -e '.github/workflows/calibri-fusion-growth-g29.yml' /tmp/g29scope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g05-134m-G0
          run-id: 45823877120
          path: inputs/g05
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g28-utf8
          run-id: 45937309879
          path: inputs/l6
          github-token: ${{ github.token }}
      - name: Continue actual trained L6
        run: python research/calibri2/fusion_growth/g29_l6_byte_continuation.py --g05 inputs/g05 --f08 inputs/f08 --parent inputs/l6 --out results/g29 --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibri-fusion-growth-g29-${{ matrix.arm }}
          path: results/g29/
          retention-days: 30
          if-no-files-found: error
