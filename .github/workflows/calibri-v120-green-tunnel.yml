name: CALIBRI v120 standalone 10MB Green Tunnel neural critic + real 135M
on:
  pull_request:
    paths:
      - 'research/calibri/v120/**'
      - 'research/calibri/test_v120_green.py'
      - '.github/workflows/calibri-v120-green-tunnel.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  small-neural-critic-plus-frozen-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    env:
      PYTHONPATH: research/calibri
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU research environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy==1.26.4 scipy==1.14.1 transformers==4.46.3 datasets==2.21.0 pyarrow==17.0.0 pandas==2.2.3 python-dateutil==2.9.0.post0 safetensors==0.4.5 huggingface_hub==0.27.1 accelerate==1.1.1 protobuf==5.28.3
      - name: Verify model-agnostic byte input and real physically paid <=10MB neural weights
        run: python -m unittest test_v120_green -v
      - name: Retrieve exactly frozen real 135M previous complete CB59-native source
        uses: actions/download-artifact@v4
        with:
          name: calibri-v119-real-135m-joint-native-c-vjp
          path: results/v119-source
          run-id: 41822331451
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Train independent neural Green Tunnel and audit true source information headroom
        run: python -m v120.pipeline results/v119-source/CALIBRI_v119_joint_native_135M.cb118 results/v120
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-v120-10mb-green-tunnel-real-evidence
          path: |
            results/v120/v120_green_tunnel_real.json
            results/v120/GREEN_TUNNEL_critic.safetensors
          retention-days: 30
          if-no-files-found: error
