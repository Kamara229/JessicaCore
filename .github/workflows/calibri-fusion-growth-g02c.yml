name: Calibri Fusion Growth G02C scaled packed native CPU audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/calibri2-fusion-growth-g02-attention-discrete-20261126]
permissions:
  contents: read
  actions: read
jobs:
  g02c:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/calibri2-fusion-growth-g02c-packed-native-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONPATH: .:research:research/calibri
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Strict scope
        run: |
          git diff --name-only b92e79f3c5365ff288cbe496a0006d4bec66a373 HEAD >/tmp/g02cscope
          test "$(wc -l </tmp/g02cscope)" -eq 2
          ! grep -Fvx -e 'research/calibri2/fusion_growth/g02c_packed_native.py' -e '.github/workflows/calibri-fusion-growth-g02c.yml' /tmp/g02cscope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'scipy==1.14.1' 'transformers==4.46.3' 'datasets==2.21.0' 'pyarrow==17.0.0' 'pandas==2.2.3' 'python-dateutil==2.9.0.post0' 'safetensors==0.4.5' 'huggingface_hub==0.27.1' 'accelerate==1.1.1' 'protobuf==5.28.3'
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-g02-attention-discrete-G0
          run-id: 45762939523
          path: inputs/g02
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: calibri-fusion-growth-f08-runtime-budget-G0
          run-id: 45671309936
          path: inputs/f08
          github-token: ${{ github.token }}
      - name: Audit packed native readout on actual scaled models
        run: python research/calibri2/fusion_growth/g02c_packed_native.py --g02 inputs/g02 --f08 inputs/f08 --out results/g02c
      - uses: actions/upload-artifact@v4
        with:
          name: calibri-fusion-growth-g02c-packed-native-G0
          path: results/g02c/
          retention-days: 30
          if-no-files-found: error
